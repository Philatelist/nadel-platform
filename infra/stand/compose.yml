# Test stand: one server, demo data (profile dev), for showing the product to a cooperative board.
# NOT production: no backups, demo cooperative only. Never enter real members' data here.
# Lives in /opt/nadel on the server; infra/stand/deploy.sh copies everything it needs. See infra/stand/README.md.
name: nadel-stand

services:
  postgres:
    # On an ARM server (Hetzner CAX) set NADEL_POSTGIS_IMAGE=imresamu/postgis:17-3.5 in .env (see infra/README.md)
    image: ${NADEL_POSTGIS_IMAGE:-postgis/postgis:17-3.5}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      NADEL_OWNER_PASSWORD: ${NADEL_DB_OWNER_PASSWORD:?set in .env}
      NADEL_APP_PASSWORD: ${NADEL_DB_APP_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nadel']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ['start', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
      # Public URL behind Caddy; the admin console only through an SSH tunnel (Caddy blocks /auth/admin)
      KC_HOSTNAME: https://${NADEL_DOMAIN:?set in .env}/auth
      KC_HOSTNAME_ADMIN: http://localhost:8180/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
    ports:
      # Localhost only: ssh -L 8180:127.0.0.1:8180 <server>, then http://localhost:8180/auth/admin
      - '127.0.0.1:8180:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: eclipse-temurin:25-jre
    restart: unless-stopped
    user: '65534:65534'
    working_dir: /tmp
    command: ['java', '-jar', '/app/nadel-backend.jar']
    environment:
      # dev = demo cooperative and demo users. This is what makes it a test stand.
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -Xmx1g
      NADEL_DB_URL: jdbc:postgresql://postgres:5432/nadel
      NADEL_DB_APP_USER: nadel_app
      NADEL_DB_APP_PASSWORD: ${NADEL_DB_APP_PASSWORD:?set in .env}
      NADEL_DB_OWNER_USER: nadel_owner
      NADEL_DB_OWNER_PASSWORD: ${NADEL_DB_OWNER_PASSWORD:?set in .env}
      NADEL_OIDC_ISSUER: https://${NADEL_DOMAIN:?set in .env}/auth/realms/nadel
      NADEL_PD_MASTER_KEY: ${NADEL_PD_MASTER_KEY:?set in .env}
      # Keycloak Admin API (service account nadel-backend-admin); the secret is written to .env by stand-init.sh.
      # Not ':?' on purpose: compose parses every variable on the first `up -d postgres keycloak`, before stand-init.sh ran.
      NADEL_KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
      NADEL_KEYCLOAK_ADMIN_CLIENT_SECRET: ${NADEL_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      NADEL_WEB_URL: https://${NADEL_DOMAIN:?set in .env}
      # Real Telegram instead of the fake one of the dev profile
      NADEL_TELEGRAM_API_URL: https://api.telegram.org
      # The dev profile allows mail servers on private addresses (Mailpit); not on a public server
      NADEL_DELIVERY_SMTPPRIVATEHOSTS: 'false'
      # Web Push (VAPID) keys are generated into .env by stand-init.sh; not ':?' for the same reason as the Keycloak secret
      NADEL_WEBPUSH_PUBLIC_KEY: ${NADEL_WEBPUSH_PUBLIC_KEY:-}
      NADEL_WEBPUSH_PRIVATE_KEY: ${NADEL_WEBPUSH_PRIVATE_KEY:-}
      NADEL_WEBPUSH_SUBJECT: ${NADEL_WEBPUSH_SUBJECT:-mailto:admin@${NADEL_DOMAIN:?set in .env}}
    volumes:
      - ./app/nadel-backend.jar:/app/nadel-backend.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      caddy:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      NADEL_DOMAIN: ${NADEL_DOMAIN:?set in .env}
      NADEL_NOINDEX: ${NADEL_NOINDEX:-true}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # The backend reads the Keycloak issuer at https://<domain>/auth; resolve the domain to Caddy inside the network
        aliases:
          - ${NADEL_DOMAIN:?set in .env}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
