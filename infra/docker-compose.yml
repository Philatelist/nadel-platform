# Local development infrastructure. Dev passwords only.
# Run: docker compose -f infra/docker-compose.yml up -d
name: nadel

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nadel']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8180:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    # The image has no curl; probe the management port (9000) with bash /dev/tcp.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Object storage (invoices, meter photos) and a test mail server arrive in phase 4.
  # The S3-compatible storage choice gets its own ADR: MinIO stopped publishing
  # community images; candidates are Garage and SeaweedFS.

volumes:
  pgdata:
