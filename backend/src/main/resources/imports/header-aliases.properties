# Vocabulary of the Excel import: the words a person may type in an uploaded file, and the Ukrainian words the
# Ukrainian template shows. This is the ONE source of truth for both: the readers accept every word listed here and the
# template writer takes its Ukrainian sheet names, headers and value words from the FIRST word of each line (the
# canonical Ukrainian label). English canonical names (the column keys, the sheet names Plots, Members and Ownership)
# are always accepted and need not be listed.
#
# Matching:
#   - sheet names and column headers: case-insensitive; headers are compared after normalisation (lower case, only
#     letters and digits kept), so "Area, m2", "AREA_M2" and "area m2" are one and the same header;
#   - value words: case-insensitive, surrounding spaces dropped, runs of spaces collapsed.
# Languages may be mixed freely in one file (Ukrainian sheet names with English headers, and so on).
#
# One line per item, words separated by a vertical bar because headers such as "Площа, сот." contain commas:
#   <sheet>.<canonical column key> = label | alias | alias ...       columns of the sheets plots, members, ownership
#   sheet.<plots|members|ownership> = label | alias ...              sheet names
#   value.kind.<PLOT|COMMON> = label | alias ...                     plot kinds (English words are not listed:
#   they are passed on as typed and read by the plots and members modules)
#   value.channel.<EMAIL|TELEGRAM|VIBER|PAPER> = label | alias ...   delivery channels
#   value.yesno.<true|false> = label | alias ...                     yes and no (English words included)
#
# This file is UTF-8. Together with imports/template_uk.properties (the hint sentences and example values of the
# Ukrainian template) it is the only place in the repository, outside the UI catalogs, where non-English text is allowed
# (ADR 0012).

