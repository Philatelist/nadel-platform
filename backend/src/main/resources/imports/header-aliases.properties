# Column header aliases of the Excel import. Headers are compared after normalisation (lower case, only letters and
# digits kept), so "Area, m2", "AREA_M2" and "area m2" are one and the same header. The canonical English key of every
# column is always accepted and need not be listed.
#
# One line per column: <sheet>.<canonical key> = alias | alias | ...   (aliases are separated by a vertical bar because
# headers such as "Площа, сот." contain commas).
#
# This file is UTF-8 and holds the Ukrainian vocabulary that the feature requires (docs/features/008-excel-import.md,
# section 2). It is the one place in the repository where non-English text is allowed outside the UI catalogs
# (recorded in ADR 0012).

plots.number = Номер | Номер ділянки | Ділянка | № ділянки | Plot number
plots.street = Вулиця
plots.kind = Тип | Вид | Тип ділянки | Вид ділянки
plots.area_m2 = Площа, м² | Площа м² | Площа, м2 | Площа, кв. м | Area m2
plots.area_sotky = Площа, сот. | Площа сотки | Сотки | Area sotky
plots.cadastral_number = Кадастровий номер | Кадастровий № | Кадастр
plots.has_building = Є будівля | Будівля | Наявність будівлі | Забудована
plots.notes = Примітки | Примітка | Коментар | Нотатки

members.external_id = Ключ | Ключ учасника | Код | Код учасника | Ідентифікатор | ID | Member key | Member id
members.last_name = Прізвище | Last name | Surname
members.first_name = Ім'я | Імя | First name
members.middle_name = По батькові | Middle name | Patronymic
members.phones = Телефони | Телефон | Номери телефонів | Phones | Phone
members.email = Електронна пошта | Ел. пошта | Електронна адреса | Пошта | E-mail | Email
members.postal_address = Поштова адреса | Адреса | Address
members.delivery_channel = Канал | Канал доставки | Канал розсилки | Спосіб доставки | Delivery channel
members.telegram_username = Telegram | Телеграм | Нік у Telegram | Telegram username
members.viber_phone = Viber | Вайбер | Телефон Viber | Viber phone
