# English texts of the import template (imports/TemplateWriter). The English template shows the canonical column names
# and sheet names as headers, so only the hint sentences and the example values are here. Every column of every sheet
# needs <sheet>.<column>.hint and <sheet>.<column>.example (an example may be empty).

example.label = example:

plots.number.hint = Required. Plot number, unique in the cooperative
plots.number.example = 12a
plots.street.hint = Street name
plots.street.example = Garden street
plots.kind.hint = PLOT or COMMON (common land). Required for a new plot
plots.kind.example = PLOT
plots.area_m2.hint = Area in square metres. Fill exactly one of area_m2 and area_sotky
plots.area_m2.example = 600
plots.area_sotky.hint = Area in sotky (1 sotka = 100 m2). Fill exactly one of the two
plots.area_sotky.example =
plots.cadastral_number.hint = Optional. Format 1234567890:12:345:6789
plots.cadastral_number.example = 1234567890:12:345:6789
plots.has_building.hint = yes or no. Default no
plots.has_building.example = yes
plots.notes.hint = Free text
plots.notes.example = Corner plot

members.external_id.hint = Required. Any key unique within this file, used by the Ownership sheet
members.external_id.example = M-001
members.last_name.hint = Required
members.last_name.example = Shevchenko
members.first_name.hint = Required
members.first_name.example = Taras
members.middle_name.hint = Optional
members.middle_name.example = Hryhorovych
members.phones.hint = Comma-separated, international format
members.phones.example = +380501234567, +380671234567
members.email.hint = Optional. Used to match an existing member on re-import
members.email.example = taras@example.com
members.postal_address.hint = Optional
members.postal_address.example = 1 Garden street, Kyiv
members.delivery_channel.hint = EMAIL, TELEGRAM, VIBER or PAPER. The channel needs its contact
members.delivery_channel.example = EMAIL
members.telegram_username.hint = Needed for the TELEGRAM channel
members.telegram_username.example =
members.viber_phone.hint = Needed for the VIBER channel
members.viber_phone.example =

ownership.plot_number.hint = Required. Number of a plot from the Plots sheet or an existing plot
ownership.plot_number.example = 12a
ownership.member_external_id.hint = Required. external_id from the Members sheet
ownership.member_external_id.example = M-001
ownership.share.hint = Share of the plot, for example 1, 1/2 or 1/3. Shares of a plot add up to 1
ownership.share.example = 1
ownership.valid_from.hint = Owner since, DD.MM.YYYY. The same date for every owner of a plot
ownership.valid_from.example = 01.03.2020
