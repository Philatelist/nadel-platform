# Ukrainian texts of the import template (imports/TemplateWriter): the hint (instruction) sentences and the example
# values. The Ukrainian sheet names, headers and value words are NOT here: they come from the vocabulary of the reader,
# imports/header-aliases.properties (the first word of each line), and are inserted through placeholders:
#   {sheet.<plots|members|ownership|meters|opening>}   the sheet name
#   {col.<sheet>.<column>}                     the header of a column, for example {col.plots.area_m2}
#   {value.<kind|channel|yesno|resource>.<CANONICAL>}   a value word, for example {value.kind.PLOT}
# Every column of every sheet needs <sheet>.<column>.hint and <sheet>.<column>.example (an example may be empty).
# This file is UTF-8 and, with the vocabulary file, the only place outside the UI catalogs where non-English text is
# allowed (ADR 0012).

