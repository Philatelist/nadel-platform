# Default names of the four charge types every cooperative starts with (V10 seed_charge_types), English and Ukrainian.
# The Ukrainian names mirror chargeTypes.defaultNames in packages/shared/src/i18n/uk.ts: the client shows them while a
# type is not renamed, so the server must refuse a new name that equals one of them (see the tariffs README).
# UTF-8. An exception to the English-only rule, like the import vocabulary (ADR 0012).
MEMBERSHIP.en=Membership fee
MEMBERSHIP.uk=Членський внесок
ELECTRICITY.en=Electricity
ELECTRICITY.uk=Електроенергія
LAND_TAX.en=Land tax
LAND_TAX.uk=Земельний податок
WATER.en=Water
WATER.uk=Вода
