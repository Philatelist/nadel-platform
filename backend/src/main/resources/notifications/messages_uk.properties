# a day («05.10.2026»), {reason} the board's reason of a rejection as typed. A plot or meter button is pressed as text.
bot.noPlots=Зараз за вами не записано жодної ділянки. Якщо це помилка, зверніться до правління.
bot.pick.plot=Ділянка {plot}
bot.pick.again=Оберіть, будь ласка, кнопкою нижче.
bot.cancel=Скасувати
bot.debt.plot=Ділянка {plot}
bot.debt.type={type}: {amount}
bot.debt.total=Усього боргу: {amount}
bot.debt.none=Боргу немає
bot.debt.prepayment=Аванс: {amount}
bot.invoice.pickPlot=Рахунок за яку ділянку?
bot.invoice.preparing=Готую рахунок за ділянку {plot}…
bot.invoice.unavailable=Рахунок за ділянку {plot} зараз не вдається підготувати. Зверніться, будь ласка, до правління.
bot.readings.pickPlot=Показання якої ділянки?
bot.readings.pickMeter=Оберіть лічильник ділянки {plot}:
bot.readings.noMeters=На ділянці {plot} немає лічильників, показання яких можна передати.
bot.readings.enterValue=Введіть показання лічильника {meter} — лише число, наприклад 12345 або 12345,5.
bot.readings.notNumber=Це не схоже на показання. Введіть лише число, наприклад 12345 або 12345,5.
bot.readings.again=Введіть показання ще раз.
bot.readings.submitted=Показання {value} по лічильнику {meter} передано на перевірку
bot.readings.approved=Показання {value} по лічильнику {meter} прийнято
