# Texts the notifications module sends to people (notifications.internal.NotificationTexts). UTF-8. Letters and bot
# messages go to members and the board in Ukrainian, so this is the only bundle: an exception to the English-only rule
# for generated texts (ADR 0012), like the document and report bundles. Placeholders are {name}.

# The test letter of the delivery settings (feature 017 §2.1), sent to the signed-in member's own e-mail
testEmail.subject=Тестовий лист із поштової скриньки кооперативу
testEmail.body=Це тестовий лист кооперативу «{cooperative}».\n\nЯкщо ви його отримали, поштову скриньку налаштовано правильно: рахунки й повідомлення членам кооперативу надсилатимуться з неї.\n\nВідповідати на цей лист не потрібно.
