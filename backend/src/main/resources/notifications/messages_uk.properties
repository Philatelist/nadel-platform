# The default names of the seeded charge types (the same as chargeTypes.defaultNames.* of the web catalog and the
# document bundle); a renamed or custom type is shown by its own name.
chargeTypes.defaultNames.MEMBERSHIP=Членський внесок
chargeTypes.defaultNames.ELECTRICITY=Електроенергія
chargeTypes.defaultNames.LAND_TAX=Земельний податок
chargeTypes.defaultNames.WATER=Вода
chargeTypes.defaultNames.COMMON_CONSUMERS=Спільні споживачі

# An invoice sent to a member (feature 017 §2.4) by Telegram (the caption of the PDF) and by e-mail. {month} is the
# billing month («жовтень 2026»), {plot} the plot number, {amount} what is due («413,26 ₴»), {cooperative} the
# cooperative's name as registered, {link} the payment link of the invoice.
invoice.due=Рахунок за {month}, ділянка {plot}: до сплати {amount}
invoice.nothingDue=Рахунок за {month}, ділянка {plot}. Боргу немає, дякуємо!
invoice.pay=Оплатити
invoice.email.subject=Рахунок за {month}, ділянка {plot}
invoice.email.payLine=Оплатити в застосунку банку: {link}
invoice.email.attached=Рахунок у вкладенні (PDF).
invoice.email.signature=Правління {cooperative}

# A payment message (feature 017 §2.4) to every owner of the paid plot who gets messages by Telegram or e-mail, sent
# after a payment was saved or reversed. {amount} is the payment's amount («500,00 ₴»), {plot} the plot number, {day}
# the day the money was received («28.10.2026»), {balance} one of the payment.balance.* lines below with the plot's
# debt today («1 234,56 ₴») or, when nothing is owed, its prepayment. A cash payment carries its receipt as a PDF.
payment.received=Отримано {amount} по ділянці {plot} ({day}). {balance}
payment.reversed=Платіж від {day} на {amount} сторновано. {balance}
payment.balance.debt=Борг: {amount}
payment.balance.prepayment=Аванс: {amount}
payment.email.subject.received=Платіж по ділянці {plot} отримано
payment.email.subject.reversed=Платіж по ділянці {plot} сторновано
payment.email.attached=Квитанція у вкладенні (PDF).

# An announcement of the board (feature 017 §2.6). The text itself is the board's, sent as entered (a Telegram message
# without formatting; a letter in plain text and HTML, signed with invoice.email.signature). {cooperative} is the
# cooperative's name as registered.
announcement.email.subject=Оголошення правління {cooperative}
