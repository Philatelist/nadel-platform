# Texts the notifications module sends to people (notifications.internal.NotificationTexts). UTF-8. Letters and bot
# messages go to members and the board in Ukrainian, so this is the only bundle: an exception to the English-only rule
# for generated texts (ADR 0012), like the document and report bundles. Placeholders are {name}.

# The test letter of the delivery settings (feature 017 §2.1), sent to the signed-in member's own e-mail
testEmail.subject=Тестовий лист із поштової скриньки кооперативу
testEmail.body=Це тестовий лист кооперативу «{cooperative}».\n\nЯкщо ви його отримали, поштову скриньку налаштовано правильно: рахунки й повідомлення членам кооперативу надсилатимуться з неї.\n\nВідповідати на цей лист не потрібно.

# The cooperative's Telegram bot (feature 017 §2.2, §2.5). {name} is the member's first name, {plots} the plot numbers
# joined by ", ", {cooperative} the cooperative's name as registered (it brings its own quotes), {max} the longest
# message the bot reads.
bot.greeting.onePlot=Вітаємо, {name}! Тепер рахунки за ділянку {plots} приходитимуть сюди.
bot.greeting.plots=Вітаємо, {name}! Тепер рахунки за ділянки {plots} приходитимуть сюди.
bot.greeting.noPlots=Вітаємо, {name}! Тепер повідомлення кооперативу приходитимуть сюди.
bot.link.invalid=Посилання недійсне, отримайте нове в кабінеті або в правлінні
bot.move.question=Цей Telegram уже підключено до іншого члена кооперативу. Це ви, {name}?
bot.move.yes=Так, це я
bot.move.no=Ні
bot.move.cancelled=Гаразд, нічого не змінено.
bot.help=Це бот кооперативу {cooperative}. Кнопки внизу:\n«Борг» — ваш борг по ділянках;\n«Рахунок» — рахунок на сьогодні;\n«Показання» — передати показання лічильника;\n«Відключити» — більше не отримувати рахунки тут.
bot.invite=Це бот кооперативу {cooperative}. Щоб отримувати тут рахунки, підключіть Telegram: у кабінеті члена кооперативу відкрийте «Сповіщення» й натисніть «Підключити Telegram», або відскануйте QR-код «Отримувати рахунки в Telegram» на паперовому рахунку.
bot.unlinked=Telegram відключено: рахунки приходитимуть іншим способом. Щоб підключити знову, натисніть «Підключити Telegram» у кабінеті.
bot.comingSoon=Ця дія з'явиться незабаром.
bot.tooMany=Забагато повідомлень, спробуйте за хвилину
bot.tooLong=Повідомлення задовге: бот читає не більше {max} символів.
bot.menu.debt=Борг
bot.menu.invoice=Рахунок
bot.menu.readings=Показання
bot.menu.unlink=Відключити

# An invoice sent to a member (feature 017 §2.4) by Telegram (the caption of the PDF) and by e-mail. {month} is the
# billing month («жовтень 2026»), {plot} the plot number, {amount} what is due («413,26 ₴»), {cooperative} the
# cooperative's name as registered, {link} the payment link of the invoice.
invoice.due=Рахунок за {month}, ділянка {plot}: до сплати {amount}
invoice.nothingDue=Рахунок за {month}, ділянка {plot}. Боргу немає, дякуємо!
invoice.pay=Оплатити
invoice.email.subject=Рахунок за {month}, ділянка {plot}
invoice.email.payLine=Оплатити в застосунку банку: {link}
invoice.email.attached=Рахунок у вкладенні (PDF).
invoice.email.signature=Правління {cooperative}

# A payment message (feature 017 §2.4) to every owner of the paid plot who gets messages by Telegram or e-mail, sent
# after a payment was saved or reversed. {amount} is the payment's amount («500,00 ₴»), {plot} the plot number, {day}
# the day the money was received («28.10.2026»), {balance} one of the payment.balance.* lines below with the plot's
# debt today («1 234,56 ₴») or, when nothing is owed, its prepayment. A cash payment carries its receipt as a PDF.
payment.received=Отримано {amount} по ділянці {plot} ({day}). {balance}
payment.reversed=Платіж від {day} на {amount} сторновано. {balance}
payment.balance.debt=Борг: {amount}
payment.balance.prepayment=Аванс: {amount}
payment.email.subject.received=Платіж по ділянці {plot} отримано
payment.email.subject.reversed=Платіж по ділянці {plot} сторновано
payment.email.attached=Квитанція у вкладенні (PDF).
