spring:
  application:
    name: nadel
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    # The application runs as a role without BYPASSRLS
    url: ${NADEL_DB_URL:jdbc:postgresql://localhost:5432/nadel}
    username: ${NADEL_DB_APP_USER:nadel_app}
    password: ${NADEL_DB_APP_PASSWORD:nadel_app}
    hikari:
      data-source-properties:
        # The server's "Detail:" line of a constraint error holds the offending values (an e-mail address, a name)
        logServerErrorDetail: false
  flyway:
    # Migrations run as the schema owner
    user: ${NADEL_DB_OWNER_USER:nadel_owner}
    password: ${NADEL_DB_OWNER_PASSWORD:nadel_owner}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # The Excel import saves thousands of rows in one transaction: group the statements into batches
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NADEL_OIDC_ISSUER:http://localhost:8180/realms/nadel}
  modulith:
    events:
      # Outstanding publications (a listener failed or the application stopped) are resubmitted at startup
      republish-outstanding-events-on-restart: true
      # Completed publications are deleted: event payloads can contain personal data and the table has no RLS
      completion-mode: delete
  servlet:
    multipart:
      # Excel import: one workbook of at most 10 MB per request. The service checks the size again for clients that
      # bypass the container, and xlsx.WorkbookGuard limits what the archive unpacks to.
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    # The contract has no nullable properties: an unset optional property is absent, never null
    default-property-inclusion: non_null

server:
  tomcat:
    # An upload over the limit is read to the end (up to this size) so that the client receives the 413 answer
    # instead of a broken connection
    max-swallow-size: 20MB

logging:
  level:
    # Hibernate logs a failed JDBC batch with the values of the row ("Batch entry 3 insert into member (...) values
    # ('a.b@example.com', ...)"), which is personal data. The failure itself is still thrown and mapped.
    org.hibernate.orm.jdbc.error: "OFF"

nadel:
  privacy:
    # Personal data master key: 32 random bytes in base64 (openssl rand -base64 32), from the environment only. Every
    # profile except dev refuses to start without it; see backend/src/main/java/app/nadel/privacy/README.md
    master-key: ${NADEL_PD_MASTER_KEY:}
    # The master key before a rotation; set only until the start-up log reports 0 keys left on it
    previous-master-key: ${NADEL_PD_MASTER_KEY_PREVIOUS:}
  telegram:
    # The Telegram Bot API; the dev profile points at the fake server of infra/fake-telegram instead
    api-url: ${NADEL_TELEGRAM_API_URL:https://api.telegram.org}
    connect-timeout: 5s
    read-timeout: 15s
    # The cooperatives' bots (long polling, one instance per bot by a lease in bot_poll_state, ADR 0018)
    bot-enabled: true
    poll-timeout: 25s
    supervisor-interval: 20s
    lease: 60s
  delivery:
    # Connect, read and write timeout of a cooperative's mail server
    smtp-timeout: 10s
    # The sending worker (DeliveryDispatcher, DeliveryProperties): three attempts (now, +1 min, +5 min), one sender per
    # cooperative and channel by a lease, about a minute per run, and a sweep that wakes the lanes with due rows
    retry-delays: 1m,5m
    lane-lease: 60s
    run-limit: 60s
    busy-retry: 5s
    sweep-interval: 60s
    telegram-per-second: 20
    telegram-chat-gap: 1s

jobrunr:
  # Background jobs (feature 017, ADR 0007): JobRunr on the application's DataSource (nadel_app). Its tables come
  # only from Flyway V30 (JobRunr 9.0.1 schema, default prefix, schema public), so JobRunr never creates them.
  database:
    skip-create: true
  background-job-server:
    # Runs the delivery workers (DispatchDeliveries); the tests turn it off and run the dispatcher themselves
    enabled: true
  dashboard:
    enabled: false
  jobs:
    # Only a crashed run is retried by JobRunr; the delivery attempts are counted on the delivery rows
    default-number-of-retries: 2
  miscellaneous:
    # No usage data leaves the server
    allow-anonymous-data-usage: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    placeholders:
      # The demo ledger block of R__demo_data.sql runs only when this is "on" (integration tests turn it off)
      demoledger: "on"
nadel:
  privacy:
    # Without NADEL_PD_MASTER_KEY the local key is read from the first existing file (repository root or backend/);
    # when none exists and infra/ is in the working directory, a random key is written to infra/.env (mode 600)
    dev-key-file: infra/.env,../infra/.env
  telegram:
    # The fake Telegram Bot API of infra/docker-compose.yml (fake-telegram), so the demo bot never reaches Telegram
    api-url: ${NADEL_TELEGRAM_API_URL:http://localhost:8091}

---
# Production. The personal data master key has no fallback: start-up fails without NADEL_PD_MASTER_KEY or with a
# malformed one, and with PD_MASTER_KEY_MISMATCH when it is not the key the database was encrypted with.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    # The start-up key-check and master key rotation run as a Flyway callback, so Flyway must stay enabled
    enabled: true
