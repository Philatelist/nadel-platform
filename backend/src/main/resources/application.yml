spring:
  application:
    name: nadel
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    # The application runs as a role without BYPASSRLS
    url: ${NADEL_DB_URL:jdbc:postgresql://localhost:5432/nadel}
    username: ${NADEL_DB_APP_USER:nadel_app}
    password: ${NADEL_DB_APP_PASSWORD:nadel_app}
    hikari:
      data-source-properties:
        # The server's "Detail:" line of a constraint error holds the offending values (an e-mail address, a name)
        logServerErrorDetail: false
  flyway:
    # Migrations run as the schema owner
    user: ${NADEL_DB_OWNER_USER:nadel_owner}
    password: ${NADEL_DB_OWNER_PASSWORD:nadel_owner}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # The Excel import saves thousands of rows in one transaction: group the statements into batches
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NADEL_OIDC_ISSUER:http://localhost:8180/realms/nadel}
  modulith:
    events:
      # Outstanding publications (a listener failed or the application stopped) are resubmitted at startup
      republish-outstanding-events-on-restart: true
      # Completed publications are deleted: event payloads can contain personal data and the table has no RLS
      completion-mode: delete
  servlet:
    multipart:
      # Excel import: one workbook of at most 10 MB per request. The service checks the size again for clients that
      # bypass the container, and xlsx.WorkbookGuard limits what the archive unpacks to. An expense (feature 018)
      # takes up to five files of at most 5 MB each (checked per file by treasury AttachmentUploads) plus its JSON
      # part, hence the larger request.
      max-file-size: 10MB
      max-request-size: 27MB
  jackson:
    # The contract has no nullable properties: an unset optional property is absent, never null
    default-property-inclusion: non_null

server:
  # Behind Caddy (infra/stand) the client address comes from X-Forwarded-For, which Tomcat's RemoteIpValve honours only
  # from a proxy on a private or loopback address; request.getRemoteAddr() is then the client (the invitation rate limit)
  forward-headers-strategy: native
  tomcat:
    # An upload over the limit is read to the end (up to this size) so that the client receives the 413 answer
    # instead of a broken connection; at least the multipart request limit above
    max-swallow-size: 30MB

logging:
  level:
    # Hibernate logs a failed JDBC batch with the values of the row ("Batch entry 3 insert into member (...) values
    # ('a.b@example.com', ...)"), which is personal data. The failure itself is still thrown and mapped.
    org.hibernate.orm.jdbc.error: "OFF"

nadel:
  keycloak:
    # The Keycloak Admin API (feature 020): the backend makes and updates the sign-in accounts of invited members with
    # the service account of the confidential client nadel-backend-admin (realm-management manage-users, view-users and
    # query-users only), see identity/README.md
    admin:
      # Keycloak's base URL; on the stand http://keycloak:8080/auth inside its network (the proxy blocks /auth/admin)
      url: ${NADEL_KEYCLOAK_ADMIN_URL:http://localhost:8180}
      realm: ${NADEL_KEYCLOAK_REALM:nadel}
      client-id: ${NADEL_KEYCLOAK_ADMIN_CLIENT_ID:nadel-backend-admin}
      # From the environment only. Every profile except dev refuses to start without it; a blank value is missing (the
      # dev default below applies only when the variable is not set at all)
      client-secret: ${NADEL_KEYCLOAK_ADMIN_CLIENT_SECRET:}
      connect-timeout: 5s
      read-timeout: 10s
  identity:
    # How often a member's last sign-in (the member card, feature 020) is stored at most: once per interval
    last-sign-in-interval: 1h
  web:
    # Where the web application is: the base of the set-password link in an invitation letter ({url}/set-password)
    url: ${NADEL_WEB_URL:http://localhost:5173}
  invitations:
    # How long an invitation link works (feature 020: 72 hours, once)
    ttl: 72h
    # The public set-password endpoints (inspect, accept): at most max-requests per window from one client address and
    # for the e-mail of one invitation, counted per endpoint; over it 429 TOO_MANY_REQUESTS. Kept in memory of this
    # instance (at most max-keys counters, the least recently used go first), see ADR 0020
    rate-limit:
      max-requests: 5
      window: 15m
      max-keys: 10000
  privacy:
    # Personal data master key: 32 random bytes in base64 (openssl rand -base64 32), from the environment only. Every
    # profile except dev refuses to start without it; see backend/src/main/java/app/nadel/privacy/README.md
    master-key: ${NADEL_PD_MASTER_KEY:}
    # The master key before a rotation; set only until the start-up log reports 0 keys left on it
    previous-master-key: ${NADEL_PD_MASTER_KEY_PREVIOUS:}
  telegram:
    # The Telegram Bot API; the dev profile points at the fake server of infra/fake-telegram instead
    api-url: ${NADEL_TELEGRAM_API_URL:https://api.telegram.org}
    connect-timeout: 5s
    read-timeout: 15s
    # The cooperatives' bots (long polling, one instance per bot by a lease in bot_poll_state, ADR 0018)
    bot-enabled: true
    poll-timeout: 25s
    supervisor-interval: 20s
    lease: 60s
  delivery:
    # Connect, read and write timeout of a cooperative's mail server
    smtp-timeout: 10s
    # Whether a mailbox may use any mail server: off, a mailbox may use only the ports 25, 465 and 587 and a host with
    # public addresses (no loopback, private, link-local or metadata address), see SmtpHostPolicy. The dev profile
    # turns it on for Mailpit on localhost.
    smtp-private-hosts: false
    # The sending worker (DeliveryDispatcher, DeliveryProperties): three attempts (now, +1 min, +5 min), one sender per
    # cooperative and channel by a lease, about a minute per run, and a sweep that wakes the lanes with due rows
    retry-delays: 1m,5m
    lane-lease: 60s
    run-limit: 60s
    busy-retry: 5s
    sweep-interval: 60s
    telegram-per-second: 20
    telegram-chat-gap: 1s

jobrunr:
  # Background jobs (feature 017, ADR 0007): JobRunr on the application's DataSource (nadel_app). Its tables come
  # only from Flyway V30 (JobRunr 9.0.1 schema, default prefix, schema public), so JobRunr never creates them.
  database:
    skip-create: true
  background-job-server:
    # Runs the delivery workers (DispatchDeliveries); the tests turn it off and run the dispatcher themselves
    enabled: true
  dashboard:
    enabled: false
  jobs:
    # Only a crashed run is retried by JobRunr; the delivery attempts are counted on the delivery rows
    default-number-of-retries: 2
  miscellaneous:
    # No usage data leaves the server
    allow-anonymous-data-usage: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    placeholders:
      # The demo ledger block of R__demo_data.sql runs only when this is "on" (integration tests turn it off)
      demoledger: "on"
nadel:
  privacy:
    # Without NADEL_PD_MASTER_KEY the local key is read from the first existing file (repository root or backend/);
    # when none exists and infra/ is in the working directory, a random key is written to infra/.env (mode 600)
    dev-key-file: infra/.env,../infra/.env
  delivery:
    # Mailpit of infra/docker-compose.yml runs on localhost:1025
    smtp-private-hosts: true
  telegram:
    # The fake Telegram Bot API of infra/docker-compose.yml (fake-telegram), so the demo bot never reaches Telegram
    api-url: ${NADEL_TELEGRAM_API_URL:http://localhost:8091}
  keycloak:
    admin:
      # The dev secret of infra/keycloak/nadel-realm.json; only when NADEL_KEYCLOAK_ADMIN_CLIENT_SECRET is not set
      client-secret: ${NADEL_KEYCLOAK_ADMIN_CLIENT_SECRET:nadel-backend-admin-dev-secret}

---
# One-shot operations commands (feature 020): java -jar nadel-backend.jar --spring.profiles.include=command
# --nadel.command=first-chairman ... (infra/stand/first-chairman.sh). No web server and no HTTP security, no JobRunr
# job server, no bot polling or delivery sweep, no resubmission of the backend's outstanding events; the command's
# runner stops the application with its exit code when it is done (members/README.md).
spring:
  config:
    activate:
      on-profile: command
  main:
    web-application-type: none
  modulith:
    events:
      republish-outstanding-events-on-restart: false
nadel:
  telegram:
    bot-enabled: false
jobrunr:
  background-job-server:
    enabled: false

---
# Production. The personal data master key has no fallback: start-up fails without NADEL_PD_MASTER_KEY or with a
# malformed one, and with PD_MASTER_KEY_MISMATCH when it is not the key the database was encrypted with.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    # The start-up key-check and master key rotation run as a Flyway callback, so Flyway must stay enabled
    enabled: true
