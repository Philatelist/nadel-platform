name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, modules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (Testcontainers + PostGIS)
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  clients:
    name: Clients (contract, typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date with api/openapi.yaml
        run: |
          pnpm gen:api
          git diff --exit-code packages/api-client/src/generated
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm --filter web build
