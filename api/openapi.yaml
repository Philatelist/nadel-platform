        `connectPlotWater` would. `sourceId` is `cooperative` (the cooperative's water supply) or the id of an active
        common consumer meter; another meter is 409 `WATER_SOURCE_INVALID`, an unknown id 404 `NOT_FOUND`. Field codes
        of 400 `VALIDATION_FAILED`: `plotIds[i]` `UNKNOWN_PLOT` (no such plot in the cooperative), `DUPLICATE` (listed
        twice), `PLOT_ARCHIVED`, `PLOT_COMMON_LAND`; `plotIds` `REQUIRED` (empty) or `TOO_LONG` (over 5000); `from`
        `REQUIRED`. A plot that is connected now or on a day from `from` on is 409 `WATER_ALREADY_CONNECTED` with
        `errors[{field: plotIds[i]}]`. The answer is the source as `listWaterSources` shows it. Requires
        `METERS_MANAGE`; one audit entry per plot (`WATER_CONNECTED`, entity type `PLOT`).
