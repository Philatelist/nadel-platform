                $ref: '#/components/schemas/PlotWaterConnections'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots/{id}/water-connections/{connectionId}/end:
    post:
      tags: [water]
      operationId: endPlotWaterConnection
      summary: Disconnect a plot from water
      description: |
        Ends the connection on `until`, the last day the plot is connected (on or after the connection's `from`;
        otherwise 400 `VALIDATION_FAILED` with `until` `INVALID`). The connection stays in the history. A connection
        that has ended already is 409 `WATER_NOT_CONNECTED`. An unknown plot, or one of another cooperative, is 404
        `PLOT_NOT_FOUND`; a connection that is not one of the plot's is 404 `NOT_FOUND`. The answer is the plot's
        connections as `GET` shows them. Requires `METERS_MANAGE`; written to the audit log (`WATER_DISCONNECTED`,
        entity type `PLOT` about the plot).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaterConnectionEnd'
      responses:
        '200':
          description: The plot's connections with the ended one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotWaterConnections'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

