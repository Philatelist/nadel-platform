        '409':
          $ref: '#/components/responses/Conflict'

  /reports:
    get:
      tags: [reports]
      operationId: listReports
      summary: The reports the caller may run, with their filters
      description: |
        The built-in reports the caller may run, in the order of `ReportCode`, each with its filters: what the filter
        is (`key`, `type`), which query parameters of `getReport` and `downloadReport` it fills (`params`), whether
        it must be given, the values it starts with (`defaults`) and, for a period, whether it means billing months,
        service days, reading dates or the days payments were received (`basis`). A report that needs a permission the
        caller lacks is not listed: `debtors` also needs `MEMBERS_VIEW`, `payments` also needs `PAYMENTS_VIEW`. A cooperative that has booked nothing still gets every report it may run.

        The server returns codes only: the name and description of a report and the label of a filter come from the
        client's catalogs by the report code and the filter key, in the user's language. Defaults that depend on the
        day (today, the previous calendar month, the current year) are worked out in Europe/Kyiv when the list is
        read; the defaults of `debtors` (`minDebt`, `olderThanDays`) are the cooperative's current red amount and red
        days. Requires `REPORTS_VIEW`; the platform operator has no cooperative data: 403.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/{code}:
    get:
      tags: [reports]
      operationId: getReport
      summary: The on-screen preview of a report
      description: |
        Runs the report with the given filters and returns its preview: per sheet the columns, the first 200 rows, the
        totals over all rows and the number of rows. `downloadReport` with the same filters writes every row and the
        same totals: preview and file come from one query, so their numbers always agree.

        Filters are query parameters. A report reads only the parameters of its filters (see `listReports`) and
        ignores the others; a filter left out takes its default. `fromMonth` and `toMonth` are billing months
        (`YYYY-MM`, both included); `from` and `to` are calendar days in Europe/Kyiv, both included, meaning service
        days or reading dates as the filter's `basis` says; `chargeTypeIds`, `statuses`, `meterKinds` and
        `correctionKinds` left out mean all; `street` is compared with the plot's street as stored, ignoring case and
        surrounding spaces; `resource`, `waterSource` and `source` left out mean all. In `debtors`, `minDebt` and
        `olderThanDays` combine with OR, as in the red status. In `payments` the billing months choose the payments
        by the month they are booked in; when `from` and `to` are given (its optional filter `received`, basis
        `PAYMENT_DATES`), the days the payments were received choose them instead and the months are not used.

        A malformed parameter (a wrong format, a number out of range) is 400 `VALIDATION_FAILED`, an unknown enum
        value 400 `MALFORMED_REQUEST`. Filters that do not fit the report are 400 `REPORT_FILTER_INVALID` with
        `errors[{field, code}]`, where `field` is the parameter: `REQUIRED` (a required filter without a default is
        missing), `INVALID` (`toMonth` before `fromMonth`, `to` before `from`, a range of days longer than one year on
        `to`), `NOT_FOUND` (`chargeTypeIds[i]` is not a charge type of the cooperative). A sheet of more than 20 000 rows
        is 422 `REPORT_TOO_LARGE`: nothing is returned and nothing is written to the audit log.

        A cell holds a string formatted by its column type (see `ReportColumnType`): money with two decimals
        (`"1250.50"`), kWh and m³ with three (`"152.400"`), ISO dates, `YYYY-MM` months and codes. A value that is not
        known is absent with a `reason`, never `0`. Totals are the sums of the rows as listed, with no separate
        rounding. "Charged" is always the effective amount (charges plus their adjustments, reversals counting
        negative); columns that split it show regular charges, reversals and adjustments separately. "Paid" is what
        payments pay on the charges (net allocations) as of the report's day: an allocation counts from its value date,
        the later of the day the payment was received and the debt date of the charge; "debt" is charged minus paid;
        "prepayment" is what was received and is on no charge yet. Plots are listed in the natural order of their
        numbers, meters in the order of the meter tree, charge types in their configured order.

        Every run is written to the audit log (`REPORT_GENERATED`, entity type `REPORT`, `output` `PREVIEW`) with the
        filters as ids, codes and dates, the row count and whether the report holds personal data, never its contents.
        Requires `REPORTS_VIEW`; `debtors` also needs `MEMBERS_VIEW`, `payments` also needs `PAYMENTS_VIEW` (403
        `PERMISSION_DENIED` otherwise); the payer note column of `payments` is there only for a caller with
        `MEMBERS_VIEW`. An unknown code is 400 `MALFORMED_REQUEST`; a code of `ReportCode` this server does not produce
        yet is 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ReportCodePath'
        - $ref: '#/components/parameters/ReportFromMonth'
        - $ref: '#/components/parameters/ReportToMonth'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportAsOf'
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/ReportChargeTypeIds'
        - $ref: '#/components/parameters/ReportStreet'
        - $ref: '#/components/parameters/ReportStatuses'
        - $ref: '#/components/parameters/ReportMinDebt'
        - $ref: '#/components/parameters/ReportOlderThanDays'
        - $ref: '#/components/parameters/ReportResource'
        - $ref: '#/components/parameters/ReportMeterKinds'
        - $ref: '#/components/parameters/ReportWaterSource'
        - $ref: '#/components/parameters/ReportCorrectionKinds'
        - $ref: '#/components/parameters/ReportSource'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPreview'
        '400':
          $ref: '#/components/responses/ReportBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ReportTooLarge'

  /reports/{code}.xlsx:
    get:
      tags: [reports]
      operationId: downloadReport
      summary: Download a report as an Excel file
      description: |
        The report of `getReport` with the same filters as an `.xlsx` workbook with every row and the same totals. One
        sheet per sheet of the preview, each with a header block (the cooperative's name, the report's name, the
        filters, when it was made in Europe/Kyiv time and the display name of who made it), a frozen header row,
        numbers stored as numbers with a number format and dates as dates. A value that is not known is an empty cell
        with its reason, never `0`. Plot numbers, names and anything else people typed are written as stored.

        The texts of the file (sheet names, header block, column headers, codes) are in the language of the `lang`
        query parameter; without it the best match of `uk` and `en` in the `Accept-Language` header decides, and
        without a match `uk`, as for the import template. A `lang` other than `uk` and `en` is 400
        `VALIDATION_FAILED`.

        The file name is ASCII, in the `Content-Disposition` header: the report code and the period as ISO days,
        `<code>_<from>_<to>.xlsx`, for example `land-tax_2026-01-01_2026-12-31.xlsx`. A month range gives the first
        day of `fromMonth` and the last day of `toMonth`, a year its first and last day, an "as of" date that day
        twice.

        Errors, permissions and the audit entry are those of `getReport`, with `output` `XLSX`. This path is matched
        before `/reports/{code}`.
      parameters:
        - $ref: '#/components/parameters/ReportCodePath'
        - $ref: '#/components/parameters/ReportFromMonth'
        - $ref: '#/components/parameters/ReportToMonth'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportAsOf'
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/ReportChargeTypeIds'
        - $ref: '#/components/parameters/ReportStreet'
        - $ref: '#/components/parameters/ReportStatuses'
        - $ref: '#/components/parameters/ReportMinDebt'
        - $ref: '#/components/parameters/ReportOlderThanDays'
        - $ref: '#/components/parameters/ReportResource'
        - $ref: '#/components/parameters/ReportMeterKinds'
        - $ref: '#/components/parameters/ReportWaterSource'
        - $ref: '#/components/parameters/ReportCorrectionKinds'
        - $ref: '#/components/parameters/ReportSource'
        - name: lang
          in: query
          required: false
          description: >-
            Language of the file's texts, `uk` or `en`. Without it the `Accept-Language` header decides, then `uk`.
          schema:
            type: string
            enum: [uk, en]
            pattern: '^(uk|en)$'
      responses:
        '200':
          description: The report workbook, sent as an attachment
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ReportBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ReportTooLarge'

  /report-templates:
    get:
      tags: [report-templates]
      operationId: listReportTemplates
      summary: The tax report slot and the templates of the cooperative
      description: |
        The fixed tax report slot first, then every other template of the cooperative: active ones before archived
        ones, each group by name ignoring case. The slot is a fixed entry of the app, not a stored row: while no active
        template is in it, it is listed with `status` `NOT_ADDED`, its `slot`, `versionCount` 0 and no `id`, `name`,
        `description` or `latestVersion` (the client shows the slot's name from its catalogs). Once an active template
        is in the slot, that template is the first entry. An archived template of the slot is listed among the other
        templates with its `slot`, and the slot shows `NOT_ADDED` again until a template is uploaded into it.

        `latestVersion` is the version generation uses. The file contents are never part of the list.
        Requires `REPORTS_VIEW` or `REPORT_TEMPLATES_MANAGE`; the platform operator has no cooperative data: 403.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [report-templates]
      operationId: uploadReportTemplate
      summary: Upload a new template as its version 1
      description: |
        Stores a new active template of the cooperative with the uploaded workbook as its version 1, either a free
        template (no `slot`) or the template of the tax report slot (`slot` given). A template is data: placeholders
        `${...}` are filled and one row per sheet may repeat; no formula and no code of a template is ever run.
        Surrounding spaces of `name` and `description` are removed; an empty `description` is none.

        Refusals (nothing is stored):

        - 400 `VALIDATION_FAILED`: `name` missing, blank or over 200 characters, `description` over 500 characters,
          `file` missing (`errors[{field}]`); an unknown `slot` is 400 `MALFORMED_REQUEST`;
        - 422 `TEMPLATE_TOO_LARGE`: the file is over 2 MB (2 097 152 bytes), checked before the file is read; a
          request over the upload limit of 10 MB is 413 `FILE_TOO_LARGE`;
        - 400 `TEMPLATE_INVALID`: the file is not a usable template, with one `errors[{field: file, code}]` naming why:
          - `NOT_XLSX`: the name does not end in `.xlsx`, the content does not start with the zip signature, or the
            archive is not an Excel workbook (`.xlsm`, `.xls` and any other file are refused);
          - `MACROS`: a macro-enabled workbook content type or a `vbaProject.bin` part;
          - `ACTIVE_CONTENT`: ActiveX controls or embedded OLE objects;
          - `BROKEN_ZIP`: the archive or one of its parts is damaged or encrypted, or a part is not well-formed XML or
            declares a document type;
          - `UNPACKED_TOO_LARGE`: too many parts, too large when unpacked or compressed too highly (a compressed bomb),
            with the limits of the Excel import;
          - `TWO_ROW_SETS`: a sheet has more than one repeating row, or one row mixes placeholders of two row sets;
          - `ARRAY_ACROSS_ROW`: an array formula's range crosses the repeating row of its sheet (Excel refuses to
            insert rows there too);
        - 409 `TEMPLATE_NAME_TAKEN` (`errors[{field: name}]`): another active template of the cooperative has the name,
          ignoring case;
        - 409 `TEMPLATE_SLOT_TAKEN` (`errors[{field: slot}]`): an active template is in the slot already; upload a
          new version of it instead (an archived template frees its slot and its name).

        Links to other workbooks and data connections are removed from the stored file and listed in `warnings`
        (`EXTERNAL_LINKS_REMOVED`). `fileName` of the version is the base name of the uploaded file, sanitised;
        `sha256` and `sizeBytes` are those of the stored file. Written to the audit log as
        `REPORT_TEMPLATE_UPLOADED` (entity type `REPORT_TEMPLATE`, label the name, fields the version number and file
        name). Requires `REPORT_TEMPLATES_MANAGE`; the platform operator has no cooperative data: 403.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file:
                  type: string
                  format: binary
                  description: The workbook (`.xlsx`, at most 2 MB)
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Name of the template, unique among the active templates ignoring case
                description:
                  type: string
                  maxLength: 500
                slot:
                  $ref: '#/components/schemas/ReportTemplateSlot'
      responses:
        '201':
          description: The stored template with its version 1 and the warnings of the upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplateUploadResult'
        '400':
          $ref: '#/components/responses/ReportTemplateBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Another active template has the name (code `TEMPLATE_NAME_TAKEN`, with `errors[{field: name}]`) or the
            slot holds an active template (code `TEMPLATE_SLOT_TAKEN`, with `errors[{field: slot}]`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ReportTemplateTooLarge'

  /report-templates/catalog:
    get:
      tags: [report-templates]
      operationId: getReportTemplateCatalog
      summary: Every placeholder a template can use
      description: |
        The field catalog (feature 013 §4.2): every placeholder `${key}` the app fills, in a fixed order (the
        cooperative, the period, when and by whom, the totals, then the row sets `plots`, `months`, `meters`, `water`,
        `payments`), each with its value type, its row set (absent for a single value), a language-neutral example where
        one exists and the permission it needs: `REPORTS_VIEW`, or `PAYMENTS_VIEW` for the payment fields
        (`totals.paid.<type>`, `totals.prepayment` and the row set `payments`). The server returns codes, never text: the description of an entry is
        `reportTemplates.fields.<field>` in the client's catalogs.

        Three families depend on the cooperative's charge types and are listed once per charge type, archived ones
        included, in the configured order: `totals.charged.<type>`, `totals.paid.<type>` and `rows.plots.debt.<type>`,
        where `<type>` is the
        code of a seeded type (`MEMBERSHIP`, `ELECTRICITY`, `LAND_TAX`, `WATER`, `COMMON_CONSUMERS`) and the id of a
        custom type. Such an entry carries the family in `pattern`, the description code of the family in `field` and
        the type in `chargeTypeId` (the client names it). Names, phones and e-mails of people are never placeholders.

        Requires `REPORTS_VIEW` or `REPORT_TEMPLATES_MANAGE`; the platform operator has no cooperative data: 403.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportTemplateField'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /report-templates/{id}/versions:
    get:
      tags: [report-templates]
      operationId: listReportTemplateVersions
      summary: The versions of a template, newest first
      description: |
        Every version of the template, newest (highest `versionNo`) first, also of an archived template. The file
        contents are not part of the list; a version is downloaded with `downloadReportTemplateVersion`. An unknown
        id, and the id of another cooperative's template, is 404. Requires `REPORT_TEMPLATES_MANAGE`; the platform
        operator has no cooperative data: 403.
      parameters:
        - $ref: '#/components/parameters/ReportTemplateIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportTemplateVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [report-templates]
      operationId: uploadReportTemplateVersion
      summary: Upload a new version of a template
      description: |
        Stores the uploaded workbook as the next version of the template (its latest `versionNo` plus one); generation
        uses it from now on and the older versions stay downloadable. The file is checked as by
        `uploadReportTemplate` (400 `TEMPLATE_INVALID` with the same `errors[{field: file, code}]`, 422
        `TEMPLATE_TOO_LARGE`, 413 `FILE_TOO_LARGE`, 400 `VALIDATION_FAILED` without a file) and links to other
        workbooks are removed and listed in `warnings` the same way. An archived template takes no new version: 409
        `TEMPLATE_ARCHIVED`. Two uploads at the same moment get consecutive numbers. An unknown id, and the id of
        another cooperative's template, is 404. Nothing is stored when the upload is refused. Written to the audit log
        as `REPORT_TEMPLATE_UPLOADED` with the new version. Requires `REPORT_TEMPLATES_MANAGE`; the platform operator
        has no cooperative data: 403.
      parameters:
        - $ref: '#/components/parameters/ReportTemplateIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The workbook (`.xlsx`, at most 2 MB)
      responses:
        '201':
          description: The template with its new latest version and the warnings of the upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplateUploadResult'
        '400':
          $ref: '#/components/responses/ReportTemplateBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The template is archived and takes no new version (code `TEMPLATE_ARCHIVED`), or another file was stored
            for the template at the same moment despite the lock (code `TEMPLATE_VERSION_CONFLICT`; send the file
            again)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ReportTemplateTooLarge'

  /report-templates/{id}/archive:
    post:
      tags: [report-templates]
      operationId: archiveReportTemplate
      summary: Archive a template
      description: |
        Archives the template: it can no longer be generated from or take a new version, it stays in the list as
        `ARCHIVED` and its versions stay downloadable. Its name and its slot are free again for a new template.
        Archiving cannot be undone. Archiving an archived template changes nothing and answers 200 with the template
        as it is, without a new audit entry. An unknown id, and the id of another cooperative's template, is 404.
        Written to the audit log as `REPORT_TEMPLATE_ARCHIVED` (entity type `REPORT_TEMPLATE`, label the name, field
        the latest version number). Requires `REPORT_TEMPLATES_MANAGE`; the platform operator has no cooperative
        data: 403.
      parameters:
        - $ref: '#/components/parameters/ReportTemplateIdPath'
      responses:
        '200':
          description: The archived template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /report-templates/{id}/generate:
    post:
      tags: [report-templates]
      operationId: generateReportTemplate
      summary: Fill the latest version of a template for a period
      description: |
        Fills the latest version of an active template with the cooperative's data for the period and returns the
        workbook (feature 013 §4.3, ADR 0015). Nothing is stored. The template's styles, merged cells, column widths,
        print settings and formulas are kept; no formula is evaluated on the server (`fullCalcOnLoad`: Excel and
        LibreOffice calculate on opening).

        A placeholder alone in a cell becomes a typed value (a number, or a date as a date serial), so formulas still
        work on it; inside text it is written as text in Ukrainian number and date format. The row of a row set
        (`${rows.<set>.<field>}`) is copied once per row of the set, with the references below it moved. The period
        (`from` to `to`, both included, days in Europe/Kyiv) means for each value (see `getReportTemplateCatalog`):

        - `period.from`, `period.to` the days given, `period.year` the year of `to`;
        - `totals.landTax.*` and `rows.plots.landTax.*`: the land tax report for the year of `to`;
        - `totals.charged.<type>`: the effective amount (charges plus adjustments minus reversals, opening balances
          left out) of the type's charges whose first service day is from `from` to `to`, booked whenever;
        - `totals.paid.<type>`: what payments pay, as of `to`, on the charges counted by `totals.charged.<type>` (an
          allocation counts from the later of the day its payment was received and the debt date of its charge);
        - `totals.prepayment`: the money received that is on no charge, summed over every plot, as of `to`, or as of
          today when `to` is later (the day of the plot balances);
        - `totals.debt`, `totals.plots.*` and the row set `plots`: the plot balances of the active plots (common land
          left out) as of `to`, or as of today when `to` is later;
        - the row set `months`: per billing month from the month of `from` to the month of `to` that has charges, the
          cooperative's totals as on the charges by month report;
        - the row sets `meters` (the electricity tree's consumption) and `water` (the water report's plots): the
          service days from `from` to `to`;
        - the row set `payments`: the payments received from `from` to `to`, as on the payments report, without the
          payer and the payer note.

        Warnings, never errors, are listed in a sheet added at the end of the file when there is at least one
        ("Попередження" or "Warnings", made unique if the template has a sheet of that name) and in the response
        headers (`X-Report-Warnings` is `0` without warnings): a placeholder the app does not know is left in the cell as written
        (`UNKNOWN_PLACEHOLDER`); a known placeholder without a known value is written empty, never `0`
        (`VALUE_UNKNOWN`, with the reason); see `ReportTemplateWarningCode`.

        The texts of the file (the warnings sheet, codes such as statuses) are in `lang`; without it the best match of
        `uk` and `en` in `Accept-Language`, then `uk`. The file name is in `Content-Disposition`: the template's name
        and the period, `<name>_<from>_<to>.xlsx` (`filename*` in UTF-8 with an ASCII `filename` fallback). The
        document properties name the template (title) and its version.

        Errors: 400 `VALIDATION_FAILED` for a malformed body; 400 `REPORT_FILTER_INVALID` with
        `errors[{field: to, code: INVALID}]` when `to` is before `from` or the period is longer than one year (`to` on
        or after the same day a year after `from`); 404 for an unknown template or one of another cooperative; 409
        `TEMPLATE_ARCHIVED` for an archived template; 400 `TEMPLATE_INVALID` (with the reason, as at upload) when the
        stored file no longer passes the upload checks, which are run again before every fill; 422 `REPORT_TOO_LARGE`
        when a row set used by the template has more than 20 000 rows, the row sets together write more than 20 000
        rows, or the file would unpack to more than 256 MB. Every generated file is written to the audit log as `REPORT_GENERATED` (entity type
        `REPORT_TEMPLATE`, entity id the template, label its name) with the fields `template` (the id), `version`,
        `filters` (`from`, `to`), `rows` (the rows written for row sets), `personalData` (`false`) and `output`
        (`XLSX`), never the contents. Requires `REPORTS_VIEW`; a template that uses a payment field (`totals.paid.<type>`,
        `totals.prepayment` or the row set `payments`) also needs `PAYMENTS_VIEW` (403 `PERMISSION_DENIED`, nothing
        written to the audit log); the platform operator has no cooperative data: 403.
      parameters:
        - $ref: '#/components/parameters/ReportTemplateIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportTemplateGenerateRequest'
      responses:
        '200':
          description: The filled workbook, sent as an attachment
          headers:
            X-Report-Warnings:
              description: The number of warnings (all of them; the warnings sheet lists each)
              schema:
                type: integer
                format: int32
                minimum: 0
            X-Report-Warnings-Detail:
              description: >-
                The first warnings as a JSON array of `ReportTemplateWarning`, UTF-8, encoded as base64url without
                padding: at most 50, and fewer when the encoded value would reach 4 KB. Absent without warnings
              schema:
                type: string
                pattern: '^[A-Za-z0-9_-]*$'
            Content-Disposition:
              description: '`attachment` with the file name `<name>_<from>_<to>.xlsx`'
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ReportBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The template is archived and can no longer be generated from (code `TEMPLATE_ARCHIVED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ReportTooLarge'

  /report-templates/{id}/versions/{versionId}/file:
    get:
      tags: [report-templates]
      operationId: downloadReportTemplateVersion
      summary: Download the file of a template version
      description: |
        The stored workbook of the version as it is kept (links to other workbooks already removed), also of an
        archived template, sent as an attachment. The file name is the version's `fileName`, in the
        `Content-Disposition` header (`filename*` in UTF-8 with an ASCII `filename` fallback). An unknown template or
        version, a version of another template and anything of another cooperative is 404. Downloading is not written
        to the audit log. Requires `REPORT_TEMPLATES_MANAGE`; the platform operator has no cooperative data: 403.
      parameters:
        - $ref: '#/components/parameters/ReportTemplateIdPath'
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The template workbook, sent as an attachment
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: >-
        Malformed request or failed validation (code `VALIDATION_FAILED` or `MALFORMED_REQUEST`); the allocation lines
        of a payment together exceed the payment (code `ALLOCATION_EXCEEDS_PAYMENT`) or a line exceeds what is open on
        its charge (code `ALLOCATION_EXCEEDS_CHARGE`); the parts of a split payment do not add up to the payment (code
        `SPLIT_TOTAL_MISMATCH`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid token (code `UNAUTHENTICATED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The token is valid but not linked to a member (code `MEMBER_NOT_LINKED`) or the caller lacks the
        required permission (code `PERMISSION_DENIED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        The resource does not exist or is not visible to the caller (code `NOT_FOUND`; `PLOT_NOT_FOUND` from the
        plot-scoped meter operations `listPlotMeters` and `submitPlotReading` and the ledger operations
        `getPlotAccount` and `enterOpeningBalance` and the payment operations `enterPayment` and `allocatePrepayment`
        and the document operation `issuePlotInvoice` when the plot is unknown, of another cooperative or not the
        caller's)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The uploaded file is over the size limit of 10 MB (code `FILE_TOO_LARGE`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The request conflicts with the current state: the email is already used by another member of the
        cooperative (code `EMAIL_TAKEN`, with `errors[{field: email}]`), the action would leave the cooperative
        without an active chairman (code `LAST_CHAIRMAN`), the role name is already used (code `ROLE_NAME_TAKEN`),
        the role is still given to members (code `ROLE_IN_USE`), or a base role cannot be deleted or, for the Chairman
        role, have its permissions changed (code `BASE_ROLE_IMMUTABLE`), another active plot already has the number
        (code `PLOT_NUMBER_TAKEN`, with `errors[{field: number}]`), or another plot of the cooperative, archived ones
        included, already has the cadastral number (code `CADASTRAL_NUMBER_TAKEN`, with
        `errors[{field: cadastralNumber}]`), or an archived plot is deleted or given new owners (code `PLOT_ARCHIVED`), or a change of owner is refused:
        the shares do not add up to one whole (code `SHARES_NOT_ONE`, `errors[{field: owners}]`), the same member is
        listed twice (code `DUPLICATE_OWNER`, `errors[{field: owners[i].memberId}]` on the second row), the date is
        in the future or not later than a start or end date of the plot's owners (code `OWNERSHIP_DATE_INVALID`,
        `errors[{field: effectiveFrom}]`), the periods of a member would overlap (code `OWNERSHIP_OVERLAP`), a
        listed member is archived (code `MEMBER_ARCHIVED`, `errors[{field: owners[i].memberId}]`), or the plot is
        common land (code `PLOT_COMMON_LAND`), or a correction of an owner record is refused with the same
        codes (`SHARES_NOT_ONE` on `share` or, when a moved date causes it, on `validFrom` or `validTo`,
        `OWNERSHIP_OVERLAP` and `OWNERSHIP_DATE_INVALID` on `validFrom` or `validTo`, `MEMBER_ARCHIVED` on `memberId`), or the member currently owns a plot and is archived (code
        `MEMBER_OWNS_PLOT`), or a plot with a current owner is archived (code `PLOT_HAS_OWNERS`), or a plot with
        ownership history is deleted or turned into common land (code `PLOT_HAS_OWNERSHIP_HISTORY`, with
        `errors[{field: kind}]` for the update), or a charge type name is taken (code `CHARGE_TYPE_NAME_TAKEN`, with
        `errors[{field: name}]`), a charge type is archived and cannot be changed or archived again (code
        `CHARGE_TYPE_ARCHIVED`), or the submitted order of charge types is not the current list (code
        `CHARGE_TYPE_ORDER_STALE`), a tariff version with the same start date exists (code
        `TARIFF_VERSION_DATE_TAKEN`, with `errors[{field: validFrom}]`), a tariff version is corrected or deleted
        although a charge uses it (code `TARIFF_VERSION_IN_USE`), the only version of a tariff is deleted (code
        `TARIFF_LAST_VERSION`), or a tariff is added to, a version is added to, corrected or deleted, or the scope is
        changed of a tariff under an archived charge type (code `CHARGE_TYPE_ARCHIVED`), or a plot that has a meter is
        deleted or turned into common land, or a plot with an active meter is archived (code `PLOT_HAS_METER`, with
        `errors[{field: kind}]` for the update), or a plot with a lasting water connection is archived or turned into
        common land (code `PLOT_HAS_WATER_CONNECTION`, with `errors[{field: kind}]` for the update), or a meter is
        registered for a plot that already has an active meter
        of the resource (code `METER_ACTIVE_EXISTS`) or for common land (code `METER_COMMON_LAND`) or an archived plot
        (code `PLOT_ARCHIVED`), both with `errors[{field: plotId}]`, a meter with readings is deleted (code
        `METER_HAS_READINGS`), a removed meter is removed again or deleted (code `METER_REMOVED`), or a date or value
        of a reading (the initial or final reading of a meter) is refused: the date is in the future (code
        `READING_DATE_IN_FUTURE`), outside the working period of the meter (code `READING_DATE_OUTSIDE_METER`), or the
        value is lower than the previous reading or the date before a later one (code `READING_OUT_OF_ORDER`), each
        with `errors[{field}]` naming the date or value, or a reading that is not counted is corrected or deleted (code
        `READING_STATUS_INVALID`), or a reading is corrected or deleted although a charge uses the readings around it
        (code `READING_IN_USE`), or a meter with readings waiting for approval is removed or replaced (code
        `METER_HAS_PENDING_READINGS`), or a reading that is not pending is approved or rejected (code
        `READING_STATUS_INVALID`), or a change of the electricity tree breaks its rules (code `METER_TREE_INVALID`,
        with `errors[{field, code}]` naming the rule, see `setMeterParent`), or a meter that has meters under it in the
        tree is deleted, or removed while they still work under it (code `METER_HAS_CHILDREN`), or a plot that has
        charges is deleted (code `PLOT_HAS_CHARGES`), or a charge that was reversed before is reversed again (code
        `CHARGE_ALREADY_REVERSED`), a reversal is reversed (code `REVERSAL_NOT_REVERSIBLE`), an adjustment is reversed
        (code `ADJUSTMENT_NOT_REVERSIBLE`), or a charge booked in a
        closed billing month is reversed (code `CHARGE_IN_CLOSED_MONTH`), or a billing month is closed while an
        earlier month is open (code `PERIOD_CLOSE_ORDER`), a closed month is closed again (code `PERIOD_CLOSED`) or a
        month after the current one is closed (code `PERIOD_IN_FUTURE`), or the month run is asked for a closed month
        (code `PERIOD_CLOSED`) or a month after the current one (code `PERIOD_IN_FUTURE`), or a booking is sent with
        the digest of a preview that no longer matches what the run would create (code `PREVIEW_OUTDATED`), or a losses
        run is asked while the losses mode is not proportional (code `LOSSES_MODE_NOT_PROPORTIONAL`), a losses run is
        booked for a node that a booked run charged for a day of the range (code `LOSSES_RANGE_OVERLAP`), a run that was
        reversed is reversed again (code `RUN_ALREADY_REVERSED`) or a run whose charges are booked in a closed month is
        reversed (code `RUN_IN_CLOSED_MONTH`), or a common consumer run is booked without a per-kWh tariff of the
        common consumers charge type for the range (code `NO_COMMON_CONSUMERS_TARIFF`) or for a common consumer that a
        booked run charged for a day of the range (code `COMMON_CONSUMER_RANGE_OVERLAP`), or a plot
        is connected to water while it is connected on one of those days (code `WATER_ALREADY_CONNECTED`), a
        connection that has ended is ended again or a plot without a lasting connection to the source is disconnected
        from it (code `WATER_NOT_CONNECTED`), the water source is not an active common consumer meter (code
        `WATER_SOURCE_INVALID`), or a meter that plots are or were connected to as their water source is deleted (code
        `WATER_SOURCE_IN_USE`), or a manual recalculation spans more than 24 months (code
        `RECALCULATION_RANGE_TOO_LONG`) or finds nothing to change (code `NOTHING_TO_RECALCULATE`), or a payment is
        entered for common land (code `PLOT_COMMON_LAND`) or an archived plot (code `PLOT_ARCHIVED`), or a plot that
        has payments is deleted (code `PLOT_HAS_PAYMENTS`), or a payment that was reversed (or a reversal row) is
        reversed or reallocated (code `PAYMENT_ALREADY_REVERSED`), or a plot's prepayment is allocated while it has no
        prepayment or no open charge (code `NOTHING_TO_ALLOCATE`), or a receipt is asked for a bank payment (code
        `RECEIPT_NOT_AVAILABLE`), or an invoice is built while the cooperative's IBAN or ЄДРПОУ is not set (code
        `REQUISITES_MISSING`, with `missing` naming `IBAN` and/or `EDRPOU`), or an invoice is built for common land, an
        archived plot or a plot without a current owner (code `PLOT_NOT_INVOICEABLE`), or the invoices of a month
        after the current one are built (code `PERIOD_IN_FUTURE`), or a build of a month's invoices is started while
        another build of the same month runs (code `INVOICE_BUILD_RUNNING`), or a debt certificate is issued for common
        land (code `PLOT_COMMON_LAND`) or an archived plot (code `PLOT_ARCHIVED`), or a certificate that is already
        annulled is annulled again (code `CERTIFICATE_ALREADY_ANNULLED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvoiceBuildTooLarge:
      description: >-
        The month has more invoiceable plots than one build takes (code `INVOICE_BUILD_TOO_LARGE`, with `limit`, the
        most plots: 2,000); nothing is built
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ReportBadRequest:
      description: >-
        Malformed request or failed validation of a parameter (code `VALIDATION_FAILED` or `MALFORMED_REQUEST`), or
        filters that do not fit the report (code `REPORT_FILTER_INVALID`, with `errors[{field, code}]` naming the
        query parameter)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ReportTooLarge:
      description: >-
        The report would have more than 20 000 rows in a sheet (code `REPORT_TOO_LARGE`); the client asks the user to
        narrow the filters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ReportTemplateBadRequest:
      description: >-
        Malformed request or failed validation of a form field (code `VALIDATION_FAILED` or `MALFORMED_REQUEST`), or a
        file that is not a usable template (code `TEMPLATE_INVALID`, with one `errors[{field: file, code}]` whose code
        is `NOT_XLSX`, `MACROS`, `ACTIVE_CONTENT`, `BROKEN_ZIP`, `UNPACKED_TOO_LARGE`, `TWO_ROW_SETS` or
        `ARRAY_ACROSS_ROW`, see `uploadReportTemplate`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ReportTemplateTooLarge:
      description: The template file is over 2 MB (code `TEMPLATE_TOO_LARGE`); nothing is stored
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  parameters:
    ReportTemplateIdPath:
      name: id
      in: path
      required: true
      description: Id of a report template of the cooperative
      schema:
        type: string
        format: uuid
    ReportCodePath:
      name: code
      in: path
      required: true
      description: The report, one of `ReportCode`
      schema:
        $ref: '#/components/schemas/ReportCode'
    ReportFromMonth:
      name: fromMonth
      in: query
      required: false
      description: First billing month of the range, `YYYY-MM` (filter type `MONTH_RANGE`)
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    ReportToMonth:
      name: toMonth
      in: query
      required: false
      description: Last billing month of the range, `YYYY-MM`, not before `fromMonth` (filter type `MONTH_RANGE`)
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    ReportFrom:
      name: from
      in: query
      required: false
      description: First day of the range (filter type `DATE_RANGE`)
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      required: false
      description: Last day of the range, not before `from` (filter type `DATE_RANGE`)
      schema:
        type: string
        format: date
    ReportAsOf:
      name: asOf
      in: query
      required: false
      description: The day the report is made for (filter type `DATE`)
      schema:
        type: string
        format: date
    ReportYear:
      name: year
      in: query
      required: false
      description: A calendar year (filter type `YEAR`)
      schema:
        type: integer
        format: int32
        minimum: 2000
        maximum: 2100
    ReportChargeTypeIds:
      name: chargeTypeIds
      in: query
      required: false
      description: Charge types to include; left out means all (filter type `CHARGE_TYPES`)
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid
    ReportStreet:
      name: street
      in: query
      required: false
      description: >-
        Only plots on this street, compared with the street as stored, ignoring case and surrounding spaces (filter
        type `STREET`)
      schema:
        type: string
        maxLength: 100
    ReportStatuses:
      name: statuses
      in: query
      required: false
      description: Only plots of these status colours; left out means all (filter type `STATUS`)
      schema:
        type: array
        maxItems: 4
        items:
          $ref: '#/components/schemas/PlotStatus'
    ReportMinDebt:
      name: minDebt
      in: query
      required: false
      description: A debt above this amount, two decimals, for example `1500.00` (filter type `MONEY`)
      schema:
        type: string
        pattern: '^\d{1,12}\.\d{2}$'
    ReportOlderThanDays:
      name: olderThanDays
      in: query
      required: false
      description: A debt older than this number of days (filter type `INT`)
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 36500
    ReportResource:
      name: resource
      in: query
      required: false
      description: Only meters of this resource; left out means both (filter type `RESOURCE`)
      schema:
        $ref: '#/components/schemas/MeterResource'
    ReportMeterKinds:
      name: meterKinds
      in: query
      required: false
      description: Only meters of these kinds; left out means the filter's default (filter type `METER_KIND`)
      schema:
        type: array
        maxItems: 4
        items:
          $ref: '#/components/schemas/MeterKind'
    ReportWaterSource:
      name: waterSource
      in: query
      required: false
      description: >-
        Only plots connected to a source of this kind (`METER`: a well or another common consumer meter,
        `COOPERATIVE_SUPPLY`: the cooperative's water supply); left out means all (filter type `WATER_SOURCE`)
      schema:
        $ref: '#/components/schemas/WaterSourceKind'
    ReportCorrectionKinds:
      name: correctionKinds
      in: query
      required: false
      description: Only corrections of these kinds; left out means both (filter type `CORRECTION_KIND`)
      schema:
        type: array
        maxItems: 2
        items:
          $ref: '#/components/schemas/ReportCorrectionKind'
    ReportSource:
      name: source
      in: query
      required: false
      description: Only payments of this source (`CASH` or `BANK`); left out means both (filter type `SOURCE`)
      schema:
        $ref: '#/components/schemas/PaymentSource'

  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Amount in UAH as a string with two decimal places
      examples: ['1250.50']

    Permission:
      type: string
      description: Fixed list of permissions a role can contain (ADR 0009). Authorities are `PERM_<value>`.
      enum:
        - MEMBERS_VIEW
        - MEMBERS_EDIT
        - ROLES_MANAGE
        - AUDIT_VIEW
        - PLOTS_VIEW
        - PLOTS_EDIT
        - OWNERSHIP_EDIT
        - IMPORT_RUN
        - SETTINGS_MANAGE
        - TARIFFS_VIEW
        - TARIFFS_MANAGE
        - METERS_VIEW
        - METERS_MANAGE
        - READINGS_ENTER
        - READINGS_APPROVE
        - CHARGES_VIEW
        - CHARGES_RUN
        - CHARGES_REVERSE
        - PERIODS_CLOSE
        - RECALCULATION_RUN
        - REPORTS_VIEW
        - REPORT_TEMPLATES_MANAGE
        - PAYMENTS_VIEW
        - PAYMENTS_ENTER
        - PAYMENTS_REVERSE
        - INVOICES_ISSUE
        - CERTIFICATES_ISSUE

    PlotStatusVisibility:
      type: string
      description: >-
        Who sees the debt status (colour) of a plot. `OWN_ONLY`: a member sees the status of the plots they own only.
        `ALL_PLOTS`: a member sees the status of every plot, but never amounts, owners or personal data of other
        plots. People allowed to view plots always see every status.
      enum: [OWN_ONLY, ALL_PLOTS]

    LossesMode:
      type: string
      description: >-
        How losses in the electricity network are charged. `FIXED_PERCENT`: every electricity interval of a plot also
        charges `lossesPercent` of its kWh at the same rate parts. `PROPORTIONAL`: losses are charged by runs over a
        date range, shared among the plots under each node of the meter tree.
      enum: [FIXED_PERCENT, PROPORTIONAL]

    CommonConsumerSplit:
      type: string
      description: >-
        How the consumption of a common consumer is shared among plots. `CONNECTED_PLOTS`: equally among the plots
        connected to that water source, day by day. `EQUAL_PER_PLOT`: equally among all active plots.
        `SERVICE_USERS`: equally among the plots marked as using the consumer. `NOT_CHARGED`: covered by the
        membership fee, nothing is charged.
      enum: [CONNECTED_PLOTS, EQUAL_PER_PLOT, SERVICE_USERS, NOT_CHARGED]

    LossesPercent:
      type: string
      pattern: '^\d{1,3}(\.\d{1,2})?$'
      description: >-
        A percentage from 0 to 100 with at most two decimal places, as a string (not money). The server answers
        with exactly two decimals (`"5.00"`).
      examples: ['5.00']

    CooperativeSettings:
      type: object
      description: >-
        The settings of the cooperative. `redAmount` and `redDays` are the red threshold of the plot status: a plot
        is red when its debt is above `redAmount` or the oldest unpaid charge is older than `redDays` days, yellow with
        any other debt, green without a debt (docs/domain/money-rules.md, section 9).
      required:
        [
          memberPlotStatusVisibility,
          lossesMode,
          lossesPercent,
          commonConsumerDefaultSplit,
          redAmount,
          redDays,
          autoAllocatePrepayment,
        ]
      properties:
        memberPlotStatusVisibility:
          $ref: '#/components/schemas/PlotStatusVisibility'
        lossesMode:
          $ref: '#/components/schemas/LossesMode'
        lossesPercent:
          $ref: '#/components/schemas/LossesPercent'
        commonConsumerDefaultSplit:
          $ref: '#/components/schemas/CommonConsumerSplit'
        redAmount:
          $ref: '#/components/schemas/Money'
        redDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 36500
        autoAllocatePrepayment:
          type: boolean
          description: >-
            Allocate prepayment automatically (feature 015 §2.7): when on (the default), a plot's prepayment is
            placed on its open charges, oldest first, whenever charges are booked for the plot or money is taken back
            from its charges; when off, the prepayment waits until the treasurer allocates it by hand
        officialName:
          type: string
          maxLength: 300
          description: The full official name of the cooperative; absent when not set
        legalAddress:
          type: string
          maxLength: 500
          description: The legal address of the cooperative; absent when not set
        bankName:
          type: string
          maxLength: 200
          description: The name of the cooperative's bank; absent when not set
        iban:
          type: string
          pattern: '^UA[0-9]{27}$'
          description: The cooperative's IBAN, a valid Ukrainian IBAN without spaces; absent when not set
          examples: ['UA213223130000026007233566001']
        edrpou:
          type: string
          readOnly: true
          description: >-
            The ЄДРПОУ code of the cooperative, read-only: it is changed only by the platform operator. Absent when not
            set

    CooperativeSettingsUpdate:
      type: object
      description: >-
        A change of the settings: only the fields present are changed, the others keep their value. An empty object
        changes nothing.
      properties:
        memberPlotStatusVisibility:
          $ref: '#/components/schemas/PlotStatusVisibility'
        lossesMode:
          $ref: '#/components/schemas/LossesMode'
        lossesPercent:
          $ref: '#/components/schemas/LossesPercent'
        commonConsumerDefaultSplit:
          $ref: '#/components/schemas/CommonConsumerSplit'
        redAmount:
          $ref: '#/components/schemas/Money'
        redDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 36500
        autoAllocatePrepayment:
          type: boolean
          description: Allocate prepayment automatically; see `CooperativeSettings.autoAllocatePrepayment`
        officialName:
          type: string
          maxLength: 300
          description: The full official name; an empty string clears it
        legalAddress:
          type: string
          maxLength: 500
          description: The legal address; an empty string clears it
        bankName:
          type: string
          maxLength: 200
          description: The name of the bank; an empty string clears it
        iban:
          type: string
          maxLength: 64
          description: >-
            A Ukrainian IBAN; spaces and lower case are accepted and normalised (`ua21 3223 1300 ...` is saved as
            `UA213223...`). No pattern here on purpose: any value that is not a valid Ukrainian IBAN (wrong country,
            length, characters or mod-97 check) is the one answer 400 `IBAN_INVALID`. An empty string clears it.
          examples: ['UA21 3223 1300 0002 6007 2335 6600 1']

    BaseRole:
      type: string
      description: Code of a base role that every cooperative gets; custom roles have no code
      enum: [CHAIRMAN, TREASURER, MEMBER]

    RoleRef:
      type: object
      description: Reference to a role of the cooperative
      required: [id, name, nameCustomized]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseCode:
          $ref: '#/components/schemas/BaseRole'
        nameCustomized:
          type: boolean
          description: |
            True when `name` is the cooperative's own wording: always true for custom roles, true for a base role
            once it was renamed. When false (a base role with its standard name) clients show the standard name from
            their own catalog, in the user's language, chosen by `baseCode`.

    PermissionInfo:
      type: object
      description: A permission with its English name and one-line description; clients localise by `code`
      required: [code, name, description]
      properties:
        code:
          $ref: '#/components/schemas/Permission'
        name:
          type: string
        description:
          type: string

    RoleInput:
      type: object
      description: |
        Editable fields of a role (full replacement). Every role can be renamed, base roles included. The server
        refuses changes of the Chairman role's permissions (409 `BASE_ROLE_IMMUTABLE`); Treasurer and Member
        permissions are editable.
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Role name; surrounding whitespace is trimmed; unique within the cooperative, ignoring case
        useDefaultName:
          type: boolean
          default: false
          description: |
            Base roles only. When true the role gets its standard name back (`nameCustomized` becomes false) and the
            submitted `name` is ignored. On a custom role this is a validation error (400 `VALIDATION_FAILED`,
            field `useDefaultName`, code `INVALID`).
        useDefaultDescription:
          type: boolean
          default: false
          description: |
            Base roles only. When true the role gets its standard description back (`descriptionCustomized` becomes
            false) and the submitted `description` is ignored. On a custom role this is a validation error (400
            `VALIDATION_FAILED`, field `useDefaultDescription`, code `INVALID`).
        description:
          type: string
          maxLength: 500
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'

    RoleDetails:
      type: object
      description: A role with its permissions and the number of active members who hold it
      required: [id, name, nameCustomized, descriptionCustomized, permissions, memberCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameCustomized:
          type: boolean
          description: |
            True when `name` is the cooperative's own wording: always true for custom roles, true for a base role
            once it was renamed. When false (a base role with its standard name) clients show the standard name from
            their own catalog, in the user's language, chosen by `baseCode`.
        description:
          type: string
        descriptionCustomized:
          type: boolean
          description: |
            True when `description` is the cooperative's own wording: always true for custom roles, true for a base
            role once its description was changed (including cleared). When false (a base role with its standard
            description) clients show the standard description from their own catalog, in the user's language,
            chosen by `baseCode`.
        baseCode:
          $ref: '#/components/schemas/BaseRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        memberCount:
          type: integer
          format: int32
          description: Number of active (not archived) members who hold the role

    MemberRolesInput:
      type: object
      description: The complete new set of roles of a member
      required: [roleIds]
      properties:
        roleIds:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            type: string
            format: uuid

    DeliveryChannel:
      type: string
      description: How a member prefers to receive invoices
      enum: [EMAIL, TELEGRAM, VIBER, PAPER]

    Member:
      type: object
      description: |
        A person of the cooperative. `notes` is present only when the caller has the `MEMBERS_VIEW` permission.
      required: [id, lastName, firstName, phones, deliveryChannel, roles, archived]
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        phones:
          type: array
          items:
            type: string
          description: Phone numbers in E.164 format
        email:
          type: string
        postalAddress:
          type: string
        deliveryChannel:
          $ref: '#/components/schemas/DeliveryChannel'
        telegramUsername:
          type: string
        viberPhone:
          type: string
        notes:
          type: string
          description: Internal notes; only for callers with `MEMBERS_VIEW`, the key is absent otherwise
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time

    MemberInput:
      type: object
      description: |
        Editable fields of a member. Names are required; everything else is optional.
        Phone numbers may be written in local form (for example `067 123 45 67`); the server validates and
        normalises them to E.164 (error code `PHONE_INVALID`). A caller without the `MEMBERS_VIEW` permission
        cannot change `notes`: the field is ignored.
      required: [lastName, firstName]
      properties:
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        phones:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
          description: Phone numbers; the format is checked by the server, not by the schema
        email:
          type: string
          format: email
          maxLength: 254
        postalAddress:
          type: string
          maxLength: 500
        deliveryChannel:
          allOf:
            - $ref: '#/components/schemas/DeliveryChannel'
          default: PAPER
          description: >-
            Preferred invoice channel, `PAPER` when omitted. `EMAIL` requires `email`, `TELEGRAM` requires
            `telegramUsername`, `VIBER` requires `viberPhone` (otherwise `CHANNEL_CONTACT_MISSING`).
        telegramUsername:
          type: string
          maxLength: 64
        viberPhone:
          type: string
          maxLength: 32
        notes:
          type: string
          maxLength: 2000
          description: Internal notes; ignored when the caller lacks `MEMBERS_VIEW`

    MemberSummary:
      type: object
      description: A member as shown in the list; contains no postal address, messenger contacts or notes
      required: [id, lastName, firstName, phones, deliveryChannel, roles, archived]
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        phones:
          type: array
          items:
            type: string
          description: Phone numbers in E.164 format
        email:
          type: string
        deliveryChannel:
          $ref: '#/components/schemas/DeliveryChannel'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        archived:
          type: boolean

    MemberPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    AuditAction:
      type: string
      description: What was done
      enum:
        - MEMBER_CREATED
        - MEMBER_UPDATED
        - MEMBER_ARCHIVED
        - MEMBER_RESTORED
        - MEMBER_ROLES_CHANGED
        - ROLE_CREATED
        - ROLE_UPDATED
        - ROLE_DELETED
        - PLOT_CREATED
        - PLOT_UPDATED
        - PLOT_ARCHIVED
        - PLOT_RESTORED
        - PLOT_DELETED
        - SETTINGS_UPDATED
        - OWNERSHIP_CHANGED
        - OWNERSHIP_CORRECTED
        - IMPORT_COMMITTED
        - CHARGE_TYPE_CREATED
        - CHARGE_TYPE_UPDATED
        - CHARGE_TYPE_REORDERED
        - CHARGE_TYPE_ARCHIVED
        - TARIFF_CREATED
        - TARIFF_VERSION_ADDED
        - TARIFF_VERSION_UPDATED
        - TARIFF_VERSION_DELETED
        - TARIFF_SCOPE_CHANGED
        - TARIFF_EXCLUSION_ADDED
        - TARIFF_EXCLUSION_REMOVED
        - METER_REGISTERED
        - METER_UPDATED
        - METER_REMOVED
        - METER_DELETED
        - METER_REPLACED
        - METER_PARENT_CHANGED
        - READING_ENTERED
        - READING_REPLACED
        - READING_CORRECTED
        - READING_DELETED
        - READING_SUBMITTED
        - READING_APPROVED
        - READING_REJECTED
        - CHARGE_REVERSED
        - OPENING_BALANCE_ENTERED
        - BILLING_MONTH_CLOSED
        - BILLING_MONTH_RUN
        - NOT_CHARGED_RETRIED
        - WATER_CONNECTED
        - WATER_DISCONNECTED
        - LOSSES_RUN_BOOKED
        - LOSSES_RUN_REVERSED
        - COMMON_CONSUMER_RUN_BOOKED
        - COMMON_CONSUMER_RUN_REVERSED
        - COMMON_CONSUMER_BILLING_CHANGED
        - RECALCULATION_BOOKED
        - PAYMENT_RECORDED
        - PAYMENT_REVERSED
        - PAYMENT_REALLOCATED
        - PREPAYMENT_ALLOCATED
        - REPORT_GENERATED
        - REPORT_TEMPLATE_UPLOADED
        - REPORT_TEMPLATE_ARCHIVED
        - INVOICE_REISSUED
        - INVOICES_ISSUED
        - CERTIFICATE_ISSUED
        - CERTIFICATE_ANNULLED

    AuditEntityType:
      type: string
      description: >-
        Kind of the entity an audit entry is about. A `CHARGE` entry (a reversal, an opening balance, a retried
        "not charged" item) is about the plot whose account changed: its `entityId` is the plot id and its label the
        plot number. A `BILLING_MONTH` entry (a closing, a month run) is about a billing month: its label is the month
        as `YYYY-MM`; so is `INVOICES_ISSUED` (a build of the month's invoices), whose `entityId` is the same for every
        build of the month (the name-based UUID of `invoices:YYYY-MM`) and whose fields (new values only) are `month`
        (`YYYY-MM`), `built`, `newVersions`, `unchanged` and `skipped` (integers). A `LOSSES_RUN` entry (a losses run booked or reversed) is about the run: its label is the range
        as `from/to` (ISO dates); so is a `COMMON_CONSUMER_RUN` entry (a common consumer run booked or reversed). A
        `NOT_CHARGED_RETRIED` entry of a losses node or common consumer item is a `METER` entry about the node or
        consumer meter, and so is `COMMON_CONSUMER_BILLING_CHANGED` (about the consumer meter, label its name). A
        `RECALCULATION` entry (`RECALCULATION_BOOKED`) is about a booked recalculation: its label is its months as
        `from/to` (`YYYY-MM`). A `PAYMENT` entry (`PAYMENT_RECORDED`, `PAYMENT_REVERSED`, `PAYMENT_REALLOCATED`,
        `PREPAYMENT_ALLOCATED`) is about the plot whose payment it is: its `entityId` is the plot id and its label the
        plot number. `PAYMENT_RECORDED` has `amount`, `source`, `receivedOn`, `billingMonth`, `receiptNumber` (cash) or
        `bankReference` (bank, when given) and the payer note `payerNote` (personal data, sealed); `PAYMENT_REVERSED`
        has `amount` (the reversal, negative), `receiptNumber` (cash), `billingMonth` and `reason`;
        `PAYMENT_REALLOCATED` has `amount`, `receivedOn`, `receiptNumber` (cash) and `lines` (old and new value, each
        line as `<charge type code or name> <YYYY-MM> <amount>`, joined by `; `); `PREPAYMENT_ALLOCATED` has `lines`
        and `total`. A `REPORT` entry (`REPORT_GENERATED`) is about one run of a report: its entity id is
        the same for every run of the report (the name-based UUID of `report:<code>`, so the log can be filtered by
        report), its label the report code (for example `charges-by-month`), and its fields are `report` (the code),
        `output` (`PREVIEW` or `XLSX`), `filters` (a JSON array of `{param, value}` as the query string carries them:
        ids, codes, dates and the street as typed), `rows` (the rows of every sheet) and `personalData`, never its
        contents. A `REPORT_TEMPLATE` entry (`REPORT_TEMPLATE_UPLOADED`, `REPORT_TEMPLATE_ARCHIVED`, and
        `REPORT_GENERATED` for a file generated from the template) is about a report template: its entity id is the
        template, its label the template's name and its fields name the version; a generated file adds `template`,
        `filters` (`from`, `to`), `rows`, `personalData` and `output` (`XLSX`), never the contents. An `INVOICE`
        entry (`INVOICE_REISSUED`, an invoice issued on request) is about the plot whose invoice it is: its `entityId`
        is the plot id and its label the plot number; its fields (new values only) are `number` (`YYYY-MM/plot`),
        `month` (`YYYY-MM`), `version` and `due` (two decimals). A `CERTIFICATE` entry (`CERTIFICATE_ISSUED`,
        `CERTIFICATE_ANNULLED`) is about a debt certificate: its `entityId` is the certificate and its label the
        certificate number (`Д-2026-1`); `CERTIFICATE_ISSUED` has `plot` (the plot number), `number`, `asOf` (ISO date)
        and `totalDebt` (two decimals), `CERTIFICATE_ANNULLED` has `number` and `reason` (user content). Never the
        names on the certificate (they stay sealed in it).
      enum:
        [
          MEMBER,
          ROLE,
          PLOT,
          SETTINGS,
          OWNERSHIP,
          IMPORT,
          CHARGE_TYPE,
          TARIFF,
          METER,
          METER_READING,
          CHARGE,
          BILLING_MONTH,
          LOSSES_RUN,
          COMMON_CONSUMER_RUN,
          RECALCULATION,
          PAYMENT,
          REPORT,
          REPORT_TEMPLATE,
          INVOICE,
          CERTIFICATE,
        ]

    AuditFieldChange:
      type: object
      description: >-
        One changed field. A missing `oldValue` means the field was empty (or the entity was just created).
        Values are codes and parameters, not display text: enum codes, ISO dates (`2026-01-01`), plain decimal
        numbers, `true`/`false`, `base:<CODE>` tokens for a standard role or charge type name (also in the `roles`
        list joined by ", "), and for `owners` a JSON array of `{"member": "Last First", "share": "1/2"}` (a
        correction adds `from` and `to`, ISO dates, `to` absent while the record is open). Meter readings are plain
        decimals with three decimals (`8205.000`). Money amounts are plain decimals with two decimals (`-25.00`), a
        billing month is `YYYY-MM`. Values written before this format are plain text and are shown as stored.
        Personal values (a member's phones, e-mail, postal address, Telegram username, Viber phone and notes) are
        stored encrypted and returned only to a reader who may also view members; for anyone else `hidden` is true
        and both values are absent.
      required: [field]
      properties:
        field:
          type: string
        oldValue:
          type: string
        newValue:
          type: string
        hidden:
          type: boolean
          default: false
          description: >-
            True means the field holds personal data and the reader may not view members (or the stored value could
            not be read): `oldValue` and `newValue` are then absent.

    AuditEntry:
      type: object
      required: [id, occurredAt, action, entityType, entityId, changes]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorMemberId:
          type: string
          format: uuid
          description: The member who made the change; absent when the change was made by a system process
        actorName:
          type: string
          description: >-
            Current name of the acting member, resolved by the server; absent when the entry has no acting
            member or that member no longer exists
        action:
          $ref: '#/components/schemas/AuditAction'
        entityType:
          $ref: '#/components/schemas/AuditEntityType'
        entityId:
          type: string
          format: uuid
        entityLabel:
          type: string
          description: >-
            Name of the entity at the time of the change, as a code or user content, never a display phrase:
            the member name, plot number, tariff name, meter name (or a plot meter's serial number) or import file
            name as typed; for a role or a charge type
            the token `base:<CODE>` (for example `base:TREASURER`, `base:MEMBERSHIP`) while it keeps its standard
            name, otherwise its stored name; `settings` for the cooperative settings. The client shows the
            catalog text for a token in the user's language and any other value as is.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/AuditFieldChange'

    AuditPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    TenantSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Me:
      type: object
      required: [userId, email, fullName, platformOperator, roles, permissions, ownedPlots]
      properties:
        userId:
          type: string
          description: Keycloak user id (sub)
        email:
          type: string
        fullName:
          type: string
        memberId:
          type: string
          format: uuid
          description: The member this user is linked to; absent for the platform operator
        platformOperator:
          type: boolean
          description: True for the platform operator, who has no roles, permissions or cooperative data
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Union of the permissions of all the member's roles
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        ownedPlots:
          type: array
          description: |
            The plots the member owns now, in natural order of the plot number; empty for a member who owns nothing
            and for the platform operator.
          items:
            $ref: '#/components/schemas/OwnedPlot'

    OwnedPlot:
      type: object
      description: A plot the signed-in member owns now, with their share.
      required: [plotId, number, share]
      properties:
        plotId:
          type: string
          format: uuid
        number:
          type: string
        street:
          type: string
        share:
          $ref: '#/components/schemas/OwnershipShare'

    PlotKind:
      type: string
      enum: [PLOT, COMMON]
      description: PLOT is a land plot, COMMON is common land (roads, shared areas)

    PlotStatus:
      type: string
      enum: [RED, YELLOW, GREEN, GREY]
      description: Map color, see docs/domain/money-rules.md, section 9

    PlotSummary:
      type: object
      description: |
        A plot or common land in the list. `areaM2`, `cadastralNumber` and `hasBuilding` are present only for callers
        who may see the details of the plot (`PLOTS_VIEW`, or the caller currently owns the plot); `street` is absent
        when the plot has none. `status` is absent when the caller may not see it: a member who does not own the plot
        while the cooperative setting `memberPlotStatusVisibility` is `OWN_ONLY` (people with `PLOTS_VIEW` and the
        plot's current owners always see it).
      required: [id, number, kind, archived]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        street:
          type: string
        kind:
          $ref: '#/components/schemas/PlotKind'
        status:
          $ref: '#/components/schemas/PlotStatus'
        archived:
          type: boolean
        areaM2:
          type: number
          description: Area in square metres, at most two decimal places
        cadastralNumber:
          type: string
        hasBuilding:
          type: boolean
        owners:
          type: array
          description: |
            The current owners (name and share), ordered by name. Present only for callers with `PLOTS_VIEW`, and
            absent for common land and for a plot without owners.
          items:
            $ref: '#/components/schemas/PlotOwnerSummary'

    PlotOwnerSummary:
      type: object
      required: [memberId, name, share]
      properties:
        memberId:
          type: string
          format: uuid
        name:
          type: string
          description: Member name, "Last First" (no patronymic)
        share:
          $ref: '#/components/schemas/OwnershipShare'

    OwnershipShare:
      type: string
      pattern: '^[1-9][0-9]{0,3}/[1-9][0-9]{0,3}$'
      example: '1/2'
      description: |
        Share of a plot as a fraction "numerator/denominator" in lowest terms; the denominator is at most 1000 and
        the numerator is at most the denominator.

    Ownership:
      type: object
      description: One owner record of a plot, current (no `validTo`) or past.
      required: [id, memberId, memberName, memberArchived, share, validFrom]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        memberName:
          type: string
          description: Member name, "Last First" (no patronymic)
        memberArchived:
          type: boolean
        share:
          $ref: '#/components/schemas/OwnershipShare'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: Last day of ownership; absent for a current owner
        basis:
          type: string
          maxLength: 500
          description: Note on the basis of ownership (sale contract, inheritance, court decision)

    PlotOwnerships:
      type: object
      required: [plotId, current, history]
      properties:
        plotId:
          type: string
          format: uuid
        current:
          type: array
          description: Current owners, ordered by member name
          items:
            $ref: '#/components/schemas/Ownership'
        history:
          type: array
          description: Past owners, newest first (by start date)
          items:
            $ref: '#/components/schemas/Ownership'

    MemberOwnershipItem:
      type: object
      description: One ownership record of a member, with the plot it is about.
      required: [ownershipId, plotId, plotNumber, share, validFrom]
      properties:
        ownershipId:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
        street:
          type: string
        share:
          $ref: '#/components/schemas/OwnershipShare'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: Last day of ownership; absent for a plot the member owns now

    MemberOwnerships:
      type: object
      required: [current, past]
      properties:
        current:
          type: array
          description: Plots owned now, in natural order of the plot number
          items:
            $ref: '#/components/schemas/MemberOwnershipItem'
        past:
          type: array
          description: Plots owned in the past, the most recently ended first
          items:
            $ref: '#/components/schemas/MemberOwnershipItem'

    OwnershipChangeOwner:
      type: object
      description: One owner of a plot from the date of the change.
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid
          description: An active member of the cooperative
        share:
          type: string
          pattern: '^[1-9][0-9]{0,3}/[1-9][0-9]{0,3}$'
          default: '1/1'
          example: '1/2'
          description: |
            Share as a fraction "numerator/denominator" (the same form as `OwnershipShare`; written inline because the
            code generator does not quote a default next to a `$ref`). A missing share is "1/1". The denominator is at
            most 1000 and the numerator is at most the denominator, otherwise `SHARE_INVALID`; "2/4" is saved as "1/2".

    OwnershipChange:
      type: object
      description: A change of the owners of a plot, effective on a date.
      required: [effectiveFrom, owners]
      properties:
        effectiveFrom:
          type: string
          format: date
          description: |
            The day the new owners start; the previous owners end the day before. Not in the future, and later than
            every current owner's start date and every past owner's end date.
        owners:
          type: array
          minItems: 0
          maxItems: 20
          description: The owners from `effectiveFrom`, with shares adding up to one whole; empty means no owner.
          items:
            $ref: '#/components/schemas/OwnershipChangeOwner'
        basis:
          type: string
          maxLength: 500
          description: Note on the basis of the change (sale contract, inheritance, court decision)

    OwnershipCorrectionCoOwner:
      type: object
      description: The corrected share of another owner record of the same plot.
      required: [ownershipId, share]
      properties:
        ownershipId:
          type: string
          format: uuid
          description: A record of the same plot, other than the one being corrected
        share:
          type: string
          pattern: '^[1-9][0-9]{0,3}/[1-9][0-9]{0,3}$'
          example: '1/3'
          description: |
            Share as a fraction "numerator/denominator" (the same form as `OwnershipShare`, written inline like in
            `OwnershipChangeOwner`). The denominator is at most 1000 and the numerator is at most the denominator,
            otherwise `SHARE_INVALID`.

    OwnershipCorrection:
      type: object
      description: |
        A correction of one owner record: a full replacement of its fields, with a reason, and optionally the shares
        of other records of the same plot.
      required: [memberId, share, validFrom, reason]
      properties:
        memberId:
          type: string
          format: uuid
          description: The member of the record (an active member, or the record's own member)
        share:
          type: string
          pattern: '^[1-9][0-9]{0,3}/[1-9][0-9]{0,3}$'
          example: '2/3'
          description: |
            Share as a fraction "numerator/denominator" (the same form as `OwnershipShare`, written inline). The
            denominator is at most 1000 and the numerator is at most the denominator, otherwise `SHARE_INVALID`.
        validFrom:
          type: string
          format: date
          description: The first day of ownership; not in the future
        validTo:
          type: string
          format: date
          description: The last day of ownership; absent for a current owner. Not in the future, not before `validFrom`
        basis:
          type: string
          maxLength: 500
          description: Note on the basis of ownership; absent clears it
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the record is corrected; required, not blank
        coOwnerShares:
          type: array
          minItems: 0
          maxItems: 20
          description: Corrected shares of other records of the same plot, to correct them in the same step
          items:
            $ref: '#/components/schemas/OwnershipCorrectionCoOwner'

    PlotDetails:
      description: |
        The plot card: everything in `PlotSummary` plus `notes`, `archivedAt`, `createdAt` and `updatedAt`.
        `notes`, `createdAt` and `updatedAt` are board-only: present only for callers with `PLOTS_VIEW`, never for an
        owner of the plot; `archivedAt` is present for an archived plot.
      allOf:
        - $ref: '#/components/schemas/PlotSummary'
        - type: object
          properties:
            notes:
              type: string
            archivedAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PlotInput:
      type: object
      description: |
        Editable fields of a plot or common land (full replacement on update). The number is trimmed; blank optional
        text becomes empty. The area is never rounded: more than two decimal places is rejected (`AREA_INVALID`).
        The cadastral number format is checked by the server (`CADASTRAL_INVALID`), not by the schema.
      required: [number, kind, areaM2]
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 20
          description: Free text such as `12`, `12а` or `R-1`; unique among the active plots, ignoring case
        street:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/PlotKind'
        areaM2:
          type: number
          description: >-
            Area in square metres with at most two decimal places and at most eight integer digits; greater than
            zero for a plot, zero or more for common land
        cadastralNumber:
          type: string
          maxLength: 22
          description: Optional, of the form `1234567890:12:345:6789`; unique in the cooperative, archived plots included
        hasBuilding:
          type: boolean
          default: false
          description: Whether a building stands on the plot; reference information only
        notes:
          type: string
          maxLength: 2000

    PlotPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlotSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    PolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          description: Polygon rings, points as [longitude, latitude] in WGS84
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
                format: double

    PlotProperties:
      type: object
      description: |
        `areaM2` and `debt` are present for callers with `PLOTS_VIEW` and for the current owners of the plot. `status`
        is absent when the caller may not see it, under the same rule as `PlotSummary.status`.
      required: [number, kind]
      properties:
        number:
          type: string
        street:
          type: string
        kind:
          $ref: '#/components/schemas/PlotKind'
        areaM2:
          type: number
          format: double
          description: Absent for callers who may not see the details of the plot, like `debt`
        status:
          $ref: '#/components/schemas/PlotStatus'
        debt:
          $ref: '#/components/schemas/Money'

    PlotFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
          format: uuid
        geometry:
          $ref: '#/components/schemas/PolygonGeometry'
        properties:
          $ref: '#/components/schemas/PlotProperties'

    PlotFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/PlotFeature'

    ImportPreview:
      type: object
      description: >-
        What an uploaded file would do. Nothing is saved by the preview itself. The preview can be committed until
        `expiresAt` when `committable` is true.
      required: [id, fileName, expiresAt, counts, problems, problemCount, committable]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          description: Base name of the uploaded file, sanitised
        expiresAt:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/ImportCounts'
        problems:
          type: array
          description: At most 1,000 problems, in sheet and row order; `problemCount` is the total
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ImportProblem'
        problemCount:
          type: integer
          minimum: 0
        committable:
          type: boolean
          description: True when there are no problems and at least one record would be created or updated

    ImportPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ImportSummary:
      type: object
      description: One uploaded file in the import history. The stored rows of the file are never part of it.
      required: [id, fileName, uploadedBy, uploadedAt, status, counts, problemCount]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          description: Base name of the uploaded file, sanitised
        uploadedBy:
          type: string
          description: >-
            Name of the member who uploaded the file: the current name when the member still exists, the name at
            the time of the upload otherwise
        uploadedAt:
          type: string
          format: date-time
        committedAt:
          type: string
          format: date-time
          description: When the import was saved; present only when `status` is `COMMITTED`
        status:
          $ref: '#/components/schemas/ImportRunStatus'
        counts:
          $ref: '#/components/schemas/ImportCounts'
        problemCount:
          type: integer
          minimum: 0
          description: Number of problems found in the file; 0 for a file without problems

    ImportRunStatus:
      type: string
      description: >-
        State of an uploaded file. `EXPIRED` is a `PREVIEW` that was not committed within 30 minutes (derived, not
        stored).
      enum: [PREVIEW, HAS_ERRORS, COMMITTED, STALE, EXPIRED]

    ImportResult:
      type: object
      description: What a committed import saved. The counts are those of the preview.
      required: [id, counts]
      properties:
        id:
          type: string
          format: uuid
        counts:
          $ref: '#/components/schemas/ImportCounts'

    ImportCounts:
      type: object
      description: >-
        Records per sheet. Rows with a problem are not counted. `waterConnections` counts the plots of the `water`
        column of the `Plots` sheet. An upload from before a sheet existed counts zero for it.
      required: [plots, members, ownerships, meters, waterConnections, openingBalances]
      properties:
        plots:
          $ref: '#/components/schemas/ImportEntityCounts'
        members:
          $ref: '#/components/schemas/ImportEntityCounts'
        ownerships:
          $ref: '#/components/schemas/ImportEntityCounts'
        meters:
          $ref: '#/components/schemas/ImportEntityCounts'
        waterConnections:
          $ref: '#/components/schemas/ImportEntityCounts'
        openingBalances:
          $ref: '#/components/schemas/ImportEntityCounts'

    ImportEntityCounts:
      type: object
      required: [created, updated, unchanged]
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0

    ImportProblem:
      type: object
      required: [sheet, row, code]
      properties:
        sheet:
          type: string
          enum: [FILE, PLOTS, MEMBERS, OWNERSHIP, METERS, OPENING_BALANCES]
        row:
          type: integer
          minimum: 0
          description: Excel row number; 0 when the problem is about the file or the whole sheet
        column:
          type: string
          description: Canonical column key, for example `area_m2`; absent when the problem is about the whole row
        code:
          type: string
          description: Stable machine-readable code, see `uploadImport`
        params:
          type: object
          description: Values for the message, for example the name of a missing column
          additionalProperties:
            type: string

    Problem:
      type: object
      description: >-
        RFC 9457 Problem Details, served as `application/problem+json`. Error responses also declare
        `application/json` so that a client sending `Accept: application/json` (the web client does) is never
        answered with 406; the body is the same. `detail` is English and never contains personal data.
      required: [title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: >-
            Stable machine-readable error code, for example `VALIDATION_FAILED`, `NOT_FOUND` or `PLOT_NOT_FOUND`.
            Any endpoint that reads stored personal data (member contacts) may answer 500 `PERSONAL_DATA_UNREADABLE`
            when a stored value cannot be decrypted; the body never carries a value.
        errors:
          type: array
          description: Field-level validation errors
          items:
            $ref: '#/components/schemas/ProblemFieldError'
        missing:
          type: [array, 'null']
          description: >-
            The requisites that are not set, for `REQUISITES_MISSING` (an invoice needs the IBAN and the ЄДРПОУ);
            absent on every other problem
          items:
            $ref: '#/components/schemas/RequisiteField'
        limit:
          type: [integer, 'null']
          format: int32
          description: >-
            The most plots one build of a month's invoices takes, for `INVOICE_BUILD_TOO_LARGE`; absent on every
            other problem

    InvoiceBuildRequest:
      type: object
      properties:
        includeNothingDue:
          type: boolean
          default: false
          description: >-
            Also build an invoice (without the QR block) for a plot without an invoice of the month that has nothing
            due; such plots are skipped otherwise
    InvoiceBuild:
      type: object
      description: >-
        The counts of a month build (`buildMonthInvoices`). Always `preview` and `invoiceable`; a preview adds
        `toBuild`, `nothingDue` and `existing`, a build adds `built`, `newVersions`, `unchanged` and `skipped`
      required: [preview, invoiceable]
      properties:
        preview:
          type: boolean
          description: Whether this is a preview (nothing written)
        invoiceable:
          type: integer
          format: int32
          minimum: 0
          description: The active plots that are not common land and have a current owner
        toBuild:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Preview: the plots that would be built or compared (`invoiceable` minus `nothingDue`, or `invoiceable`
            with `includeNothingDue`)
        nothingDue:
          type: integer
          format: int32
          minimum: 0
          description: Preview, the plots without an invoice of the month that have nothing due
        existing:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Preview, the plots that already have an invoice of the month: they get a new version only when their
            numbers changed
        built:
          type: integer
          format: int32
          minimum: 0
          description: Build, the plots that got their first invoice of the month (version 1)
        newVersions:
          type: integer
          format: int32
          minimum: 0
          description: Build, the plots whose invoice changed and got a new version
        unchanged:
          type: integer
          format: int32
          minimum: 0
          description: Build, the plots whose latest invoice is still right (nothing written)
        skipped:
          type: integer
          format: int32
          minimum: 0
          description: Build, the plots without an invoice of the month with nothing due (nothing written)
    InvoicePrintScope:
      type: string
      description: >-
        Which invoices of a month go into the print set: `PAPER` the plots with at least one current owner who chose
        paper delivery, `ALL` every latest invoice of the month
      enum: [PAPER, ALL]
      default: PAPER

    RequisiteField:
      type: string
      description: >-
        A requisite an invoice needs: `IBAN` the cooperative's account (Settings → Requisites), `EDRPOU` the
        cooperative's ЄДРПОУ code (set by the platform operator)
      enum: [IBAN, EDRPOU]

    InvoiceReadiness:
      type: object
      required: [missing]
      properties:
        missing:
          type: array
          description: The requisites that are not set yet, in this order; empty when invoices can be built
          items:
            $ref: '#/components/schemas/RequisiteField'

    IssueInvoiceRequest:
      type: object
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month, `YYYY-MM`; absent means the current month (today in Europe/Kyiv)

    InvoiceRow:
      type: object
      description: One issued invoice version
      required: [id, plotId, plotNumber, month, number, version, due, issuedAt, latest]
      properties:
        id:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: The plot number as printed on the invoice (user content)
        month:
          type: string
          description: The billing month, `YYYY-MM`
        number:
          type: string
          description: The invoice number `{YYYY-MM}/{plot number}`, the same for every version
        version:
          type: integer
          format: int32
          minimum: 1
        due:
          $ref: '#/components/schemas/Money'
        issuedAt:
          type: string
          format: date-time
        latest:
          type: boolean
          description: Whether this is the latest version of its plot and month

    InvoicePage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceRow'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    InvoiceLineKind:
      type: string
      description: >-
        The kind of a charge booked in the month: `REGULAR` an accrual, `REVERSAL` a cancellation, `OPENING` an
        opening balance, `ADJUSTMENT` a correction of a charge of a closed month
      enum: [REGULAR, REVERSAL, OPENING, ADJUSTMENT]

    InvoiceLineSource:
      type: string
      description: >-
        What produced the charge (for a reversal or an adjustment: the charge it corrects): `TARIFF` a tariff of the
        month run, `CONSUMPTION` a meter reading interval, `LOSSES` losses in the network, `COMMON_CONSUMER` a share of
        a common consumer, `OPENING` an opening balance
      enum: [TARIFF, CONSUMPTION, LOSSES, COMMON_CONSUMER, OPENING]

    InvoiceSnapshot:
      type: object
      description: >-
        An invoice version as stored when it was issued (schema 1). Every amount is a string with two decimals.
        Texts are what the PDF prints (Ukrainian document texts, names and user content as stored then).
      required:
        [
          id,
          schema,
          number,
          version,
          month,
          monthStatus,
          asOf,
          issuedAt,
          issuedOn,
          cooperative,
          plot,
          owners,
          chairmen,
          treasurers,
          types,
          lines,
          receivedAfter,
          totals,
        ]
      properties:
        id:
          type: string
          format: uuid
        schema:
          type: integer
          format: int32
          description: The version of the snapshot format (1)
        number:
          type: string
        version:
          type: integer
          format: int32
        month:
          type: string
          description: The billing month, `YYYY-MM`
        monthStatus:
          $ref: '#/components/schemas/BillingMonthStatus'
        asOf:
          type: string
          format: date-time
          description: The moment the figures were read; an open month's invoice states «станом на» this day
        issuedAt:
          type: string
          format: date-time
        issuedOn:
          type: string
          format: date
          description: The day of issue in Europe/Kyiv
        cooperative:
          $ref: '#/components/schemas/InvoiceCooperative'
        plot:
          $ref: '#/components/schemas/InvoicePlot'
        owners:
          type: array
          description: The current owners when the invoice was issued, the earliest owner first
          items:
            $ref: '#/components/schemas/InvoiceOwner'
        chairmen:
          type: array
          description: The names of the active chairmen when the invoice was issued (personal data)
          items:
            type: string
        treasurers:
          type: array
          description: The names of the active treasurers when the invoice was issued (personal data)
          items:
            type: string
        types:
          type: array
          description: One row per charge type in the cooperative's charge type order
          items:
            $ref: '#/components/schemas/InvoiceTypeRow'
        lines:
          type: array
          description: The charges booked in the month, in the charge type order, then by service period
          items:
            $ref: '#/components/schemas/InvoiceLine'
        receivedAfter:
          type: array
          description: The payments booked after the month and received before the issue
          items:
            $ref: '#/components/schemas/InvoiceLaterPayment'
        totals:
          $ref: '#/components/schemas/InvoiceTotals'
        qr:
          $ref: '#/components/schemas/InvoiceQr'

    InvoiceCooperative:
      type: object
      required: [officialName]
      properties:
        officialName:
          type: string
          description: The official name, or the cooperative's name when none was entered
        edrpou:
          type: string
        address:
          type: string
        bankName:
          type: string
        iban:
          type: string

    InvoicePlot:
      type: object
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        street:
          type: string

    InvoiceOwner:
      type: object
      required: [memberId, name, share]
      properties:
        memberId:
          type: string
          format: uuid
        name:
          type: string
          description: The full name when the invoice was issued (personal data)
        share:
          type: string
          description: The share as a fraction, `1/2`
          pattern: '^\d+/\d+$'

    InvoiceTypeRow:
      type: object
      required: [chargeTypeId, name, start, charged, paid, end]
      properties:
        chargeTypeId:
          type: string
          format: uuid
        code:
          type: string
          description: The code of a seeded charge type
        name:
          type: string
          description: The name printed on the invoice
        start:
          $ref: '#/components/schemas/Money'
        charged:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        end:
          $ref: '#/components/schemas/Money'

    InvoiceLine:
      type: object
      required: [chargeId, chargeTypeId, kind, source, amount, serviceFrom, serviceTo, parts, readings]
      properties:
        chargeId:
          type: string
          format: uuid
        chargeTypeId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/InvoiceLineKind'
        source:
          $ref: '#/components/schemas/InvoiceLineSource'
        amount:
          $ref: '#/components/schemas/Money'
        serviceFrom:
          type: string
          format: date
        serviceTo:
          type: string
          format: date
        corrects:
          type: string
          description: The billing month (`YYYY-MM`) of the charge a reversal or an adjustment corrects, when earlier
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ChargeCalculationPart'
        readings:
          type: array
          items:
            $ref: '#/components/schemas/ChargeCalculationReading'
        lossesPercent:
          type: string
        consumption:
          type: string
        consumerName:
          type: string

    InvoiceLaterPayment:
      type: object
      required: [paymentId, receivedOn, bookedIn, amount]
      properties:
        paymentId:
          type: string
          format: uuid
        receivedOn:
          type: string
          format: date
        bookedIn:
          type: string
          description: The billing month the payment is booked in, `YYYY-MM`
        amount:
          $ref: '#/components/schemas/Money'

    InvoiceTotals:
      type: object
      required: [endDebt, prepayment, receivedAfter, due]
      properties:
        endDebt:
          $ref: '#/components/schemas/Money'
        prepayment:
          $ref: '#/components/schemas/Money'
        receivedAfter:
          $ref: '#/components/schemas/Money'
        due:
          $ref: '#/components/schemas/Money'

    InvoiceQr:
      type: object
      description: The NBU payment QR code of the invoice; absent when nothing is due
      required: [link, purpose]
      properties:
        link:
          type: string
          description: '`https://qr.bank.gov.ua/` and the Base64URL payload (format 003)'
        purpose:
          type: string
          description: The purpose of payment the code carries

    ProblemFieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          description: >-
            Field error code: `REQUIRED` (missing or blank), `TOO_LONG` (over the maximum length or item count),
            `INVALID` (wrong format, for example an email), `PHONE_INVALID` (not a valid phone number),
            `CHANNEL_CONTACT_MISSING` (the chosen delivery channel has no contact to deliver to),
            `CADASTRAL_INVALID` (not of the form `NNNNNNNNNN:NN:NNN:NNNN`), `AREA_INVALID` (more than two decimal
            places, too large, or not greater than zero for a plot), `SHARE_INVALID` (not a fraction `n/d` with
            1 <= n <= d <= 1000), `MEMBER_NOT_FOUND` (no such member in the cooperative), `OWNERSHIP_NOT_FOUND` (no
            such owner record in the same plot, or the record being corrected), `RATE_INVALID` (a tariff rate that is
            not a non-negative number with at most 10 integer and 4 decimal digits), `FREQUENCY_BASIS_MISMATCH`
            (`ONE_OFF` without `FIXED_ONE_TIME`, or `FIXED_ONE_TIME` without `ONE_OFF`), `TARIFF_COMMON_LAND` (common
            land cannot be in the scope of a tariff), `PLOT_ARCHIVED` (an archived plot), `UNKNOWN_PLOT` (no such plot
            in the cooperative), `DUPLICATE` (the same plot listed twice), `METER_VALUE_INVALID` (a meter reading that
            is not a non-negative number with at most 11 integer and 3 decimal digits); with `METER_TREE_INVALID`:
            `TREE_WATER` (a water meter has no tree), `TREE_QUARTER_UNDER_QUARTER` (a quarter meter under another
            quarter meter), `TREE_PARENT_KIND` (the kinds do not allow this parent), `TREE_PARENT_INACTIVE` (the parent
            is removed or not yet installed on the date), `TREE_DATE_BEFORE_LATEST` (a date before the meter's latest
            change in the tree), `READING_DATE_OUTSIDE_METER` (a date before the meter's installation),
            `AMOUNT_NOT_POSITIVE` (an amount that is zero or negative), `DATE_IN_FUTURE` (a date after today in
            Europe/Kyiv), `NOT_FOUND` (no such charge type in the cooperative, or not a node of the meter tree in the
            range of a losses run), `PLOT_COMMON_LAND` (common land is
            never connected to water), `IBAN_INVALID` (not a valid Ukrainian IBAN; with the top-level code
            `IBAN_INVALID`); with `TEMPLATE_INVALID` on `file`: `NOT_XLSX`, `MACROS`, `ACTIVE_CONTENT`,
            `BROKEN_ZIP`, `UNPACKED_TOO_LARGE`, `TWO_ROW_SETS`, `ARRAY_ACROSS_ROW` (see `uploadReportTemplate`)
        message:
          type: string

    ChargeTypeCode:
      type: string
      description: Code of one of the five charge types every cooperative starts with; custom types have no code
      enum: [MEMBERSHIP, ELECTRICITY, LAND_TAX, WATER, COMMON_CONSUMERS]

    ChargeType:
      type: object
      description: What the cooperative charges for
      required: [id, name, nameCustomized, active, position]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/ChargeTypeCode'
        name:
          type: string
          description: >-
            The stored name. While `nameCustomized` is false it is the English default of a starting type and clients
            show their own localised default name instead
        nameCustomized:
          type: boolean
          description: True for custom types and for starting types that were renamed
        description:
          type: string
        active:
          type: boolean
          description: An inactive type stays in the list but its tariffs give no expected amount
        position:
          type: integer
          format: int32
          description: Place in the list; ties are ordered by id

    ChargeTypeCreate:
      type: object
      description: A new custom charge type
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters; surrounding whitespace is trimmed; unique among non-archived types, ignoring case
        description:
          type: string
          maxLength: 500

    ChargeTypeUpdate:
      type: object
      description: Editable fields of a charge type (full replacement)
      required: [name, active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters; surrounding whitespace is trimmed; unique among non-archived types, ignoring case
        description:
          type: string
          maxLength: 500
          description: Blank text clears the description
        active:
          type: boolean

    ChargeTypeOrder:
      type: object
      description: The full new order of the non-archived charge types
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 500
          description: Every non-archived charge type id exactly once, in the new order
          items:
            type: string
            format: uuid

    Rate:
      type: string
      pattern: '^\d{1,10}(\.\d{1,4})?$'
      description: >-
        A tariff rate as a string: not negative, at most 10 integer digits and at most 4 digits after the decimal
        point. It is never rounded; the server returns it with exactly four decimals (`"4.3200"`). Not a money amount:
        a rate times a quantity becomes money only in the calculation.
      examples: ['4.3200']

    Basis:
      type: string
      description: What the rate applies to
      enum: [PER_PLOT, PER_AREA_SOTKA, PER_KWH, PER_M3, FIXED_ONE_TIME]

    Frequency:
      type: string
      description: How often the rate is meant. `ONE_OFF` goes only with `FIXED_ONE_TIME`.
      enum: [MONTHLY, QUARTERLY, YEARLY, ONE_OFF]

    TariffScopeKind:
      type: string
      description: Which plots a tariff applies to
      enum: [ALL_PLOTS, SELECTED_PLOTS]

    TariffExclusionUpdate:
      type: object
      description: A plot excluded from a tariff of all plots, with the reason
      required: [plotId, reason]
      properties:
        plotId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the plot is exempt; 1 to 500 characters after trimming, never blank

    TariffScopeUpdate:
      type: object
      description: The complete scope of a tariff; it replaces the stored one
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/TariffScopeKind'
        plotIds:
          type: array
          maxItems: 5000
          description: The selected plots; only with `SELECTED_PLOTS`; no plot twice, no common land
          items:
            type: string
            format: uuid
        exclusions:
          type: array
          maxItems: 5000
          description: The excluded plots with reasons; only with `ALL_PLOTS`; no plot twice, no common land
          items:
            $ref: '#/components/schemas/TariffExclusionUpdate'

    TariffScopePlot:
      type: object
      description: A plot named by the scope of a tariff
      required: [plotId, number, archived]
      properties:
        plotId:
          type: string
          format: uuid
        number:
          type: string
          description: The plot number as the cooperative writes it
        archived:
          type: boolean
          description: True when the plot was archived after it was added; it is not counted

    TariffExclusion:
      type: object
      description: A plot excluded from a tariff of all plots, with the reason
      required: [plotId, number, archived, reason]
      properties:
        plotId:
          type: string
          format: uuid
        number:
          type: string
        archived:
          type: boolean
          description: True when the plot was archived after it was excluded; it is not counted
        reason:
          type: string

    TariffVersionCreate:
      type: object
      description: The terms of a version of a tariff, new or corrected (same rules for both)
      required: [validFrom, basis, frequency, rate]
      properties:
        validFrom:
          type: string
          format: date
          description: The date the version applies from; unique among the versions of the tariff
        basis:
          $ref: '#/components/schemas/Basis'
        frequency:
          $ref: '#/components/schemas/Frequency'
        rate:
          $ref: '#/components/schemas/Rate'
        dueDate:
          type: string
          format: date
          description: Required for `FIXED_ONE_TIME` (and only for it)
        note:
          type: string
          maxLength: 500
          description: Optional free text, for example the decision of the general meeting; blank text is not stored

    TariffVersion:
      type: object
      description: One version of a tariff
      required: [id, validFrom, basis, frequency, rate, pastDated]
      properties:
        id:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: The day before the next version starts; absent for the last version
        basis:
          $ref: '#/components/schemas/Basis'
        frequency:
          $ref: '#/components/schemas/Frequency'
        rate:
          $ref: '#/components/schemas/Rate'
        dueDate:
          type: string
          format: date
        note:
          type: string
        pastDated:
          type: boolean
          description: True when `validFrom` is before today (Europe/Kyiv); charges of past periods will be recalculated

    TariffCreate:
      type: object
      description: A new tariff with its first version
      required: [chargeTypeId, name, firstVersion]
      properties:
        chargeTypeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters; surrounding whitespace is trimmed
        firstVersion:
          $ref: '#/components/schemas/TariffVersionCreate'

    TariffConflictPlot:
      type: object
      description: A plot on which two tariffs conflict
      required: [plotId, number]
      properties:
        plotId:
          type: string
          format: uuid
        number:
          type: string
          description: User content, as the cooperative writes it

    TariffConflict:
      type: object
      description: >-
        Another tariff of the same charge type that applies to some of the same plots from today on: on those plots
        neither tariff is charged (the case goes to the "not charged" queue) until a scope is changed. A warning only;
        both tariffs stay valid.
      required: [otherTariffId, otherTariffName, plotCount, plots]
      properties:
        otherTariffId:
          type: string
          format: uuid
        otherTariffName:
          type: string
          description: User content
        plotCount:
          type: integer
          format: int64
          description: The number of plots both tariffs apply to
        plots:
          type: array
          maxItems: 10
          description: The first of those plots in the natural order of the numbers (at most 10)
          items:
            $ref: '#/components/schemas/TariffConflictPlot'

    TariffSummary:
      type: object
      description: A tariff in the list, with the version that is shown
      required: [id, name, chargeTypeId, scopeKind, version, conflicts]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        chargeTypeId:
          type: string
          format: uuid
        scopeKind:
          $ref: '#/components/schemas/TariffScopeKind'
        version:
          $ref: '#/components/schemas/TariffVersion'
        plotCount:
          type: integer
          format: int64
          description: >-
            Number of plots the tariff applies to; for a meter-based version (`PER_KWH`, `PER_M3`) only the plots
            with an active meter of the resource
        conflicts:
          type: array
          description: >-
            The other tariffs of the same charge type that apply to some of the same active plots, ordered by name;
            empty when there is no conflict or the charge type is inactive
          items:
            $ref: '#/components/schemas/TariffConflict'

    Tariff:
      type: object
      description: A tariff with its charge type, all versions and its scope
      required: [id, name, chargeType, scopeKind, versions, selectedPlots, exclusions, conflicts]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        chargeType:
          $ref: '#/components/schemas/ChargeType'
        scopeKind:
          $ref: '#/components/schemas/TariffScopeKind'
        versions:
          type: array
          description: Newest first (by `validFrom`)
          items:
            $ref: '#/components/schemas/TariffVersion'
        selectedPlots:
          type: array
          description: With `SELECTED_PLOTS`, the selected plots in natural order of the number (archived ones marked); empty otherwise
          items:
            $ref: '#/components/schemas/TariffScopePlot'
        exclusions:
          type: array
          description: With `ALL_PLOTS`, the excluded plots in natural order of the number (archived ones marked); empty otherwise
          items:
            $ref: '#/components/schemas/TariffExclusion'
        plotCount:
          type: integer
          format: int64
          description: >-
            Number of plots the tariff applies to, as in the list (exclusions subtracted, archived plots and common
            land never counted); when the shown version (the one valid today, else the earliest future one) is
            meter-based, only the plots with an active meter of its resource
        conflicts:
          type: array
          description: As in the list
          items:
            $ref: '#/components/schemas/TariffConflict'

    ExpectedChargeStatus:
      type: string
      description: >-
        `AMOUNT` the plot is charged `amount`; `BY_READINGS` the amount depends on meter readings and is not known here;
        `NO_METER` the tariff is charged by meter and the plot has no meter of that resource in the month, so nothing
        is charged and it is not in `total`; `EXCLUDED` the tariff does not apply to the plot (see `reason`)
      enum: [AMOUNT, BY_READINGS, NO_METER, EXCLUDED]

    PlotTariffItem:
      type: object
      description: One tariff that applies to a plot in a month, with the expected amount
      required:
        [
          tariffId,
          tariffName,
          chargeTypeId,
          chargeTypeName,
          chargeTypeNameCustomized,
          basis,
          frequency,
          rate,
          status,
        ]
      properties:
        tariffId:
          type: string
          format: uuid
        tariffName:
          type: string
        chargeTypeId:
          type: string
          format: uuid
        chargeTypeCode:
          $ref: '#/components/schemas/ChargeTypeCode'
        chargeTypeName:
          type: string
          description: The stored name; clients show their own default name while `chargeTypeNameCustomized` is false
        chargeTypeNameCustomized:
          type: boolean
        basis:
          $ref: '#/components/schemas/Basis'
        frequency:
          $ref: '#/components/schemas/Frequency'
        rate:
          $ref: '#/components/schemas/Rate'
        status:
          $ref: '#/components/schemas/ExpectedChargeStatus'
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          description: Why the plot is excluded; only with status `EXCLUDED`

    PlotTariffs:
      type: object
      description: The tariffs that apply to a plot in a month and the expected amounts
      required: [month, items, total]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The month the amounts are for, `YYYY-MM`
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlotTariffItem'
        total:
          $ref: '#/components/schemas/Money'

    MeterKind:
      type: string
      description: >-
        `PLOT` belongs to one plot; `SUBSTATION`, `QUARTER` (feeds a group of plots) and `COMMON_CONSUMER` (a well
        pump, street lighting) are named meters of the electricity tree
      enum: [PLOT, SUBSTATION, QUARTER, COMMON_CONSUMER]

    MeterResource:
      type: string
      description: What a meter measures, `ELECTRICITY` in kWh or `WATER` in cubic metres
      enum: [ELECTRICITY, WATER]

    MeterValue:
      type: string
      pattern: '^\d{1,11}(\.\d{1,3})?$'
      description: >-
        A meter reading as a string: not negative, at most 11 integer digits and at most 3 digits after the decimal
        point. It is never rounded; the server returns it with exactly three decimals (`"8205.000"`). Not money.
        Field code `METER_VALUE_INVALID` when it does not match.
      examples: ['8205.000']

    MeterPoint:
      type: object
      description: A value of a meter on a date
      required: [takenOn, value]
      properties:
        takenOn:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/MeterValue'

    MeterPlot:
      type: object
      description: The plot of a plot meter
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        street:
          type: string

    Meter:
      type: object
      description: A meter of the register
      required: [id, kind, resource, serial, installedOn, initialReading, active, deletable, lastReading]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MeterKind'
        resource:
          $ref: '#/components/schemas/MeterResource'
        serial:
          type: string
        name:
          type: string
          description: The name of a meter that is not a plot meter; absent for a plot meter
        plot:
          $ref: '#/components/schemas/MeterPlot'
        installedOn:
          type: string
          format: date
        initialReading:
          $ref: '#/components/schemas/MeterValue'
        removedOn:
          type: string
          format: date
          description: Present once the meter is removed, together with `finalReading`
        finalReading:
          $ref: '#/components/schemas/MeterValue'
        note:
          type: string
          description: The board's note; absent for a member who sees the meter of their own plot
        replacesMeterId:
          type: string
          format: uuid
          description: The meter this one replaced; the same id as `replaces.id`, kept for older clients
        replaces:
          $ref: '#/components/schemas/MeterPredecessor'
          description: >-
            The meter this one replaced, with the day it was removed and its final reading; absent for a meter that
            replaced nothing. For a counter that wrapped around its serial is this meter's own
        replacedBy:
          $ref: '#/components/schemas/MeterSuccessor'
          description: >-
            The meter that replaced this one; the day and the final reading of the replacement are this meter's own
            `removedOn` and `finalReading`. Absent for a meter that was not replaced (active, or removed without a
            replacement)
        active:
          type: boolean
          description: True until the meter is removed
        deletable:
          type: boolean
          description: True when the meter may be deleted (active and without readings); otherwise it is removed instead
        lastReading:
          $ref: '#/components/schemas/MeterPoint'
          description: >-
            The latest point of the meter: its final reading once removed, otherwise its latest counted reading, or
            the initial reading when there is none

    MeterPredecessor:
      type: object
      description: >-
        The meter a meter replaced: the previous meter of the same chain, of the same plot (or the same named meter).
        A replacement removes it on the day the new meter is installed, so it always has a removal day and a final
        reading
      required: [id, serial, removedOn, finalReading]
      properties:
        id:
          type: string
          format: uuid
        serial:
          type: string
        removedOn:
          type: string
          format: date
          description: The day the predecessor was removed, the installation day of the meter that replaced it
        finalReading:
          $ref: '#/components/schemas/MeterValue'
          description: The final reading of the predecessor

    MeterSuccessor:
      type: object
      description: The meter that replaced a meter, the next meter of the same chain, of the same plot
      required: [id, serial]
      properties:
        id:
          type: string
          format: uuid
        serial:
          type: string

    MeterCreate:
      type: object
      description: A new meter
      required: [kind, resource, serial, installedOn, initialReading]
      properties:
        kind:
          $ref: '#/components/schemas/MeterKind'
        resource:
          $ref: '#/components/schemas/MeterResource'
        plotId:
          type: string
          format: uuid
          description: Required for a plot meter, absent for any other kind
        serial:
          type: string
          minLength: 1
          maxLength: 50
          description: 1 to 50 characters; surrounding whitespace is trimmed
        name:
          type: string
          maxLength: 100
          description: Required for a meter that is not a plot meter (1 to 100 characters, trimmed); absent for a plot meter
        installedOn:
          type: string
          format: date
          description: The installation date, the date of the initial reading; not after today
        initialReading:
          $ref: '#/components/schemas/MeterValue'
        note:
          type: string
          maxLength: 500
          description: Optional; blank text is not stored

    MeterUpdate:
      type: object
      description: The descriptive fields of a meter
      required: [serial]
      properties:
        serial:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          maxLength: 100
        note:
          type: string
          maxLength: 500

    MeterRemoval:
      type: object
      description: The end of a meter's working period
      required: [removedOn, finalReading]
      properties:
        removedOn:
          type: string
          format: date
        finalReading:
          $ref: '#/components/schemas/MeterValue'

    ReadingStatus:
      type: string
      description: >-
        `APPROVED` counts for consumption; `PENDING` waits for approval (a member's submission); `REJECTED` was not
        approved (with a reason); `SUPERSEDED` was replaced by a later reading of the same date or by a correction
      enum: [APPROVED, PENDING, REJECTED, SUPERSEDED]

    ReadingSource:
      type: string
      description: Who brought the reading in, the board or the electrician (`ENTERED`), the Excel import or a member
      enum: [ENTERED, IMPORTED, MEMBER]

    ReadingWarning:
      type: string
      description: >-
        `UNUSUAL_CONSUMPTION`: the daily consumption of the interval the reading closes is more than 3 times the
        meter's usual daily consumption over the last 180 days. The reading is saved
      enum: [UNUSUAL_CONSUMPTION]

    ReadingInterval:
      type: object
      description: >-
        The consumption between two neighbouring counted points of a meter (initial reading, approved readings, final
        reading), calculated by the server
      required: [from, to, days, consumption]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
          format: int32
          description: The number of days from `from` to `to`
        consumption:
          $ref: '#/components/schemas/MeterValue'

    MeterReading:
      type: object
      description: A reading of a meter
      required: [id, meterId, takenOn, value, status, source, changeable]
      properties:
        id:
          type: string
          format: uuid
        meterId:
          type: string
          format: uuid
        takenOn:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/MeterValue'
        status:
          $ref: '#/components/schemas/ReadingStatus'
        source:
          $ref: '#/components/schemas/ReadingSource'
        supersededById:
          type: string
          format: uuid
          description: The reading that replaced this one; absent when it was deleted since
        rejectReason:
          type: string
          description: Why a `REJECTED` reading was not approved (user content)
        interval:
          $ref: '#/components/schemas/ReadingInterval'
          description: The interval this approved reading closes; absent for other statuses and on the installation date
        changeable:
          type: boolean
          description: >-
            True when the caller may correct or delete the reading now: it is approved, the caller has
            `READINGS_ENTER` and no charge uses it

    MeterReadingHistory:
      type: object
      description: The readings of one meter and its intervals
      required: [meterId, readings, intervals]
      properties:
        meterId:
          type: string
          format: uuid
        readings:
          type: array
          items:
            $ref: '#/components/schemas/MeterReading'
        intervals:
          type: array
          description: Newest first
          items:
            $ref: '#/components/schemas/ReadingInterval'

    ReadingEntry:
      type: object
      description: One reading to enter
      required: [meterId, value]
      properties:
        meterId:
          type: string
          format: uuid
        takenOn:
          type: string
          format: date
          description: The day the meter was read; absent means today in Europe/Kyiv
        value:
          $ref: '#/components/schemas/MeterValue'

    ReadingBatch:
      type: object
      description: Readings to enter, each saved on its own
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReadingEntry'

    ReadingRowOutcome:
      type: string
      enum: [SAVED, REJECTED]

    ReadingRowError:
      type: object
      description: Why a row was not saved, as a code with parameters (never display text)
      required: [code]
      properties:
        code:
          type: string
          description: >-
            `NOT_FOUND`, `VALIDATION_FAILED`, `READING_DATE_IN_FUTURE`, `READING_DATE_OUTSIDE_METER`,
            `READING_OUT_OF_ORDER` or `READING_IN_USE`
        field:
          type: string
          description: The field of the row the error is about (`meterId`, `takenOn` or `value`)
        params:
          type: object
          description: >-
            Values for the message: ISO dates (`today`, `installedOn`, `removedOn`, `previousTakenOn`, `nextTakenOn`)
            and meter values with three decimals (`previousValue`, `nextValue`)
          additionalProperties:
            type: string

    ReadingRowResult:
      type: object
      description: The result of one row of a batch
      required: [index, meterId, outcome, supersededReadingIds, warnings]
      properties:
        index:
          type: integer
          format: int32
          description: The position of the row in the request, from 0
        meterId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/ReadingRowOutcome'
        reading:
          $ref: '#/components/schemas/MeterReading'
          description: The saved reading with the interval it closes; present when `SAVED`
        supersededReadingIds:
          type: array
          items:
            type: string
            format: uuid
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ReadingWarning'
        error:
          $ref: '#/components/schemas/ReadingRowError'
          description: Present when `REJECTED`

    ReadingBatchResult:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReadingRowResult'

    ReadingCorrection:
      type: object
      description: The corrected date and value of a reading
      required: [takenOn, value]
      properties:
        takenOn:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/MeterValue'

    ReadingSaved:
      type: object
      description: A saved reading, the readings it replaced and its warnings
      required: [reading, supersededReadingIds, warnings]
      properties:
        reading:
          $ref: '#/components/schemas/MeterReading'
        supersededReadingIds:
          type: array
          items:
            type: string
            format: uuid
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ReadingWarning'

    ReadingSubmission:
      type: object
      description: A reading a member submits for a meter of their own plot
      required: [meterId, value]
      properties:
        meterId:
          type: string
          format: uuid
        takenOn:
          type: string
          format: date
          description: The day the meter was read; absent means today in Europe/Kyiv
        value:
          $ref: '#/components/schemas/MeterValue'

    ReadingRejection:
      type: object
      description: Why a submitted reading is not approved
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Shown to the member as typed (user content); surrounding whitespace is trimmed

    PendingReading:
      type: object
      description: A reading waiting for approval, with its meter
      required: [reading, meter, warnings]
      properties:
        reading:
          $ref: '#/components/schemas/MeterReading'
        meter:
          $ref: '#/components/schemas/Meter'
        interval:
          $ref: '#/components/schemas/ReadingInterval'
          description: >-
            The interval the reading would close once approved, from the counted point before it; absent when the
            reading does not fit between the counted readings (approval would be refused) or is on the installation
            date
        warnings:
          type: array
          description: The warnings the reading would carry once approved
          items:
            $ref: '#/components/schemas/ReadingWarning'

    MeterReplacement:
      type: object
      description: The replacement of a meter by a new one on one day
      required: [replacedOn, finalReading, serial, initialReading]
      properties:
        replacedOn:
          type: string
          format: date
          description: The day the old meter is removed and the new one installed; not after today
        finalReading:
          $ref: '#/components/schemas/MeterValue'
          description: The final reading of the old meter
        serial:
          type: string
          minLength: 1
          maxLength: 50
          description: The serial number of the new meter (the same one for a counter that wrapped around); trimmed
        initialReading:
          $ref: '#/components/schemas/MeterValue'
          description: The initial reading of the new meter (0 for a counter that wrapped around)

    MeterConsumption:
      type: object
      description: The consumption of a meter's chain over a date range, calculated by the server
      required: [meterId, from, to, meterIds, known, calculated]
      properties:
        meterId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        meterIds:
          type: array
          description: The meters whose consumption is added up, oldest installation first
          items:
            type: string
            format: uuid
        known:
          type: boolean
          description: False when a meter of the chain has no counted point after the end of its part of the range
        consumption:
          $ref: '#/components/schemas/MeterValue'
          description: Present when `known`; rounded once to three decimals when `calculated`
        calculated:
          type: boolean
          description: True when a value at an end of the range was calculated between two readings
        lastReadingOn:
          type: string
          format: date
          description: When not `known`, the day after which there is no reading; absent when there is none before either

    MeterParentChange:
      type: object
      description: A move of an electricity meter in the tree
      required: [effectiveFrom]
      properties:
        parentMeterId:
          type: string
          format: uuid
          description: The new parent; absent to take the meter out of the tree from `effectiveFrom`
        effectiveFrom:
          type: string
          format: date
          description: The first day under the new parent; not after today, not before the meter's latest change

    MeterParentPeriod:
      type: object
      description: A period in which a meter had one parent; both dates are days of the period
      required: [parentMeterId, validFrom]
      properties:
        parentMeterId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: The last day under this parent; absent while the period lasts

    MeterPlacement:
      type: object
      description: The parent periods of a meter in the electricity tree, oldest first
      required: [meterId, periods]
      properties:
        meterId:
          type: string
          format: uuid
        periods:
          type: array
          items:
            $ref: '#/components/schemas/MeterParentPeriod'

    MeterValueAtKind:
      type: string
      description: >-
        `REAL` a counted reading or the initial or final reading on that day; `CALCULATED` interpolated by days between
        the nearest counted points (shown as calculated); `UNKNOWN` no counted point after the day (or none before it)
      enum: [REAL, CALCULATED, UNKNOWN]

    MeterValueAt:
      type: object
      description: The value of a node's meter on a day, calculated by the server
      required: [kind, meterId]
      properties:
        kind:
          $ref: '#/components/schemas/MeterValueAtKind'
        meterId:
          type: string
          format: uuid
          description: The meter of the node's chain the value belongs to (the old one at the end of a slice that ends on a replacement day)
        value:
          $ref: '#/components/schemas/MeterValue'
          description: Present unless `UNKNOWN`; a `CALCULATED` value is rounded once to three decimals
        lastReadingOn:
          type: string
          format: date
          description: For `UNKNOWN`, the day after which there is no reading; absent when there is none before either

    MeterRangeConsumption:
      type: object
      description: The consumption over a part of a date range, calculated by the server
      required: [known, calculated]
      properties:
        known:
          type: boolean
          description: False when a value at an end is not known
        consumption:
          $ref: '#/components/schemas/MeterValue'
          description: Present when `known`; rounded once to three decimals when `calculated`
        calculated:
          type: boolean
          description: True when a value at an end was calculated between two readings
        lastReadingOn:
          type: string
          format: date
          description: When not `known`, the day after which there is no reading; absent when there is none before either

    MeterTreeSlice:
      type: object
      description: >-
        A part of the range that a node spent under one parent, from `from` to `to` (the consumption is the value on
        `to` minus the value on `from`)
      required: [from, to, start, end, consumption]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        start:
          $ref: '#/components/schemas/MeterValueAt'
        end:
          $ref: '#/components/schemas/MeterValueAt'
        consumption:
          $ref: '#/components/schemas/MeterRangeConsumption'

    MeterTreeMeter:
      type: object
      description: The meter a node of the tree shows
      required: [id, kind, serial, installedOn, active]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MeterKind'
        serial:
          type: string
        name:
          type: string
          description: The name of a meter that is not a plot meter
        plot:
          $ref: '#/components/schemas/MeterPlot'
        installedOn:
          type: string
          format: date
        removedOn:
          type: string
          format: date
        active:
          type: boolean

    MeterTreeNode:
      type: object
      description: A node of the electricity tree under one parent (or among the roots) in a date range
      required: [meter, meterIds, slices, total, children]
      properties:
        meter:
          $ref: '#/components/schemas/MeterTreeMeter'
        meterIds:
          type: array
          description: The meters of the node's chain of replacements, oldest installation first
          items:
            type: string
            format: uuid
        slices:
          type: array
          description: The parts of the range the node spent here, in date order
          items:
            $ref: '#/components/schemas/MeterTreeSlice'
        total:
          $ref: '#/components/schemas/MeterRangeConsumption'
        children:
          type: array
          items:
            $ref: '#/components/schemas/MeterTreeNode'

    MeterTree:
      type: object
      description: The electricity meter tree as it was over a date range
      required: [from, to, roots]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        roots:
          type: array
          items:
            $ref: '#/components/schemas/MeterTreeNode'

    ChargeKind:
      type: string
      description: >-
        `REGULAR` an accrual; `REVERSAL` cancels one charge with the opposite amount (see `reverses`, `reason`);
        `OPENING` an opening balance; `ADJUSTMENT` corrects a charge of a closed month in the earliest open month,
        positive or negative, with the original's service period and `accruedOn` (see `adjusts`, `reason`)
      enum: [REGULAR, REVERSAL, OPENING, ADJUSTMENT]

    ChargeSource:
      type: string
      description: >-
        What produced the charge: `TARIFF` the month run of a tariff, `CONSUMPTION` a meter reading, `LOSSES` losses
        in the network, `COMMON_CONSUMER` a common consumer run, `OPENING` an opening balance, `MANUAL_REVERSAL` a
        reversal made by hand, `RECALCULATION` an adjustment or a reversal booked by a recalculation
      enum: [TARIFF, CONSUMPTION, LOSSES, COMMON_CONSUMER, OPENING, MANUAL_REVERSAL, RECALCULATION]

    ChargeTypeRef:
      type: object
      description: The charge type of a charge
      required: [id, name, nameCustomized]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/ChargeTypeCode'
        name:
          type: string
          description: The stored name; clients show their own default name while `nameCustomized` is false
        nameCustomized:
          type: boolean

    CalculationUnit:
      type: string
      description: >-
        What the quantity of a calculation part counts: `PLOT` one plot, `SOTKA` sotkas (100 m2) of area, `KWH`
        kilowatt-hours, `M3` cubic metres
      enum: [PLOT, SOTKA, KWH, M3]

    ChargeCalculationPart:
      type: object
      description: >-
        One part of a calculation: a quantity priced at the rate of one tariff version for the days that version
        applied. Parts are added exactly and the sum is rounded once.
      required: [days, from, to]
      properties:
        tariffVersionId:
          type: string
          format: uuid
        basis:
          $ref: '#/components/schemas/Basis'
        frequency:
          $ref: '#/components/schemas/Frequency'
        quantity:
          type: string
          description: The quantity as a plain decimal string (for example kWh `93.300`, sotkas `6.00`); not money
        unit:
          $ref: '#/components/schemas/CalculationUnit'
        rate:
          $ref: '#/components/schemas/Rate'
        days:
          type: integer
          format: int32
          minimum: 0
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        calculated:
          type: boolean
          description: True when the quantity rests on a value calculated between readings ("розрахунковий")
        nodeMeterId:
          type: string
          format: uuid
          description: >-
            The node of the meter tree whose losses this part carries (a proportional losses charge has one part per
            node and tariff version)

    ChargeCalculationReading:
      type: object
      description: A meter value a charge was calculated from
      required: [meterId, takenOn, value]
      properties:
        meterId:
          type: string
          format: uuid
        takenOn:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/MeterValue'
        calculated:
          type: boolean
          description: True for a value calculated between readings ("розрахунковий")

    ChargeCalculation:
      type: object
      description: >-
        How a charge was calculated, as codes and numbers only (the client builds the text). An opening balance and a
        reversal have no parts and no readings.
      required: [amount, parts, readings]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ChargeCalculationPart'
        readings:
          type: array
          items:
            $ref: '#/components/schemas/ChargeCalculationReading'
        nodeMeterId:
          type: string
          format: uuid
          description: >-
            The node of the meter tree whose losses the charge carries, when it carries the losses of one node only
            (the parts name the node of each part)
        runId:
          type: string
          format: uuid
          description: The losses run or common consumer run that booked the charge
        consumerMeterId:
          type: string
          format: uuid
          description: The common consumer the charge is for (the first meter of its chain)
        consumerName:
          type: string
          description: The name of the common consumer when the run was booked (user content)
        split:
          $ref: '#/components/schemas/CommonConsumerSplit'
        lossesPercent:
          type: string
          pattern: '^\d{1,3}(\.\d{1,2})?$'
          description: >-
            The percentage (two decimals, `"5.00"`) of a fixed-percentage losses charge (source `LOSSES` of a meter
            interval); its parts carry the losses quantities
        consumption:
          type: string
          pattern: '^\d{1,11}(\.\d{1,3})?$'
          description: >-
            The consumption of the meter interval a fixed-percentage losses charge is taken of, rounded to three
            decimals for display (the amount was calculated from the exact quantity)

    Charge:
      type: object
      description: One row of the ledger of a plot. Never changed or deleted.
      required:
        [
          id,
          plotId,
          kind,
          source,
          chargeType,
          amount,
          billingMonth,
          billingMonthClosed,
          serviceFrom,
          serviceTo,
          accruedOn,
          reversible,
          calculation,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChargeKind'
        source:
          $ref: '#/components/schemas/ChargeSource'
        chargeType:
          $ref: '#/components/schemas/ChargeTypeRef'
        amount:
          $ref: '#/components/schemas/Money'
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the charge is booked in, `YYYY-MM`
        billingMonthClosed:
          type: boolean
          description: True when the billing month is closed (a correction is then an adjustment, not a reversal)
        serviceFrom:
          type: string
          format: date
          description: The first day the charge pays for
        serviceTo:
          type: string
          format: date
          description: The last day the charge pays for
        accruedOn:
          type: string
          format: date
          description: The day the debt counts from (its age)
        reason:
          type: string
          description: >-
            The reason of a reversal or an adjustment (always present), or the optional reason or document reference of
            an opening balance (user content)
        reverses:
          type: string
          format: uuid
          description: The charge a reversal cancels
        reversedBy:
          type: string
          format: uuid
          description: The reversal that cancelled this charge
        adjusts:
          $ref: '#/components/schemas/ChargeAdjustmentTarget'
        adjustedBy:
          type: array
          description: The adjustments of this charge, oldest first; absent when it has none
          items:
            type: string
            format: uuid
        recalculationId:
          type: string
          format: uuid
          description: >-
            The recalculation that booked the charge (an adjustment, or a reversal or charge of a recalculation); only
            for callers with `CHARGES_VIEW`
        reversible:
          type: boolean
          description: >-
            True when the caller may reverse the charge now: the caller has `CHARGES_REVERSE`, the charge is neither a
            reversal nor an adjustment, was not reversed and its billing month is open
        calculation:
          $ref: '#/components/schemas/ChargeCalculation'
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: >-
            The current name of the member who booked the charge; only for callers with `CHARGES_VIEW`, absent for
            charges booked by the system or by a member who no longer exists
        paid:
          $ref: '#/components/schemas/Money'
          description: >-
            On the plot account, for a regular charge or an opening balance: what payments pay on it now (allocations
            minus releases); absent for reversals, adjustments and outside the plot account
        open:
          $ref: '#/components/schemas/Money'
          description: >-
            On the plot account, for a regular charge or an opening balance: what is still owed on it, its amount plus
            its adjustments (`0.00` once reversed) minus `paid`; absent for reversals, adjustments and outside the plot
            account

    ChargeAdjustmentTarget:
      type: object
      description: The charge an adjustment corrects, with its billing month and service period
      required: [chargeId, billingMonth, serviceFrom, serviceTo]
      properties:
        chargeId:
          type: string
          format: uuid
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the adjusted charge is booked in, `YYYY-MM`
        serviceFrom:
          type: string
          format: date
        serviceTo:
          type: string
          format: date

    ChargeTypeDebt:
      type: object
      description: >-
        The debt of a plot for one charge type after payments: its charges, reversals and adjustments minus what
        payments pay on them
      required: [chargeTypeId, name, nameCustomized, debt]
      properties:
        chargeTypeId:
          type: string
          format: uuid
        chargeTypeCode:
          $ref: '#/components/schemas/ChargeTypeCode'
        name:
          type: string
          description: The stored name; clients show their own default name while `nameCustomized` is false
        nameCustomized:
          type: boolean
        debt:
          $ref: '#/components/schemas/Money'

    PlotAccount:
      type: object
      description: The account of a plot
      required:
        [plotId, debts, total, prepayment, prepaymentAllocatable, charges, payments, prepaymentAllocations]
      properties:
        plotId:
          type: string
          format: uuid
        debts:
          type: array
          description: The debt per charge type after payments
          items:
            $ref: '#/components/schemas/ChargeTypeDebt'
        total:
          $ref: '#/components/schemas/Money'
          description: The debt of the plot after payments, the sum of `debts`
        prepayment:
          $ref: '#/components/schemas/Money'
          description: >-
            The money paid for the plot that is on no charge: its payments (reversals negative) minus what they pay on
            charges; never below `0.00`
        prepaymentAllocatable:
          type: boolean
          description: >-
            True when the caller may allocate the plot's prepayment by hand now ("Allocate prepayment"):
            `PAYMENTS_ENTER`, automatic allocation off, `prepayment` above `0.00` and an open charge
        charges:
          type: array
          description: Newest first, limited by `from`, `to` and `kind`
          items:
            $ref: '#/components/schemas/Charge'
        payments:
          type: array
          description: >-
            The payments of the plot and their reversals, newest first, limited by `from`, `to` and `kind`; empty for a
            caller who neither has `PAYMENTS_VIEW` nor owns the plot now
          items:
            $ref: '#/components/schemas/AccountPayment'
        prepaymentAllocations:
          type: array
          description: >-
            The times the plot's prepayment was placed on its charges, newest first, limited by `from`, `to` and
            `kind`; empty for a caller who neither has `PAYMENTS_VIEW` nor owns the plot now
          items:
            $ref: '#/components/schemas/AccountPrepaymentAllocation'

    PlotAccountKind:
      type: string
      description: >-
        What the plot account lists: a charge kind (`REGULAR`, `REVERSAL`, `OPENING`, `ADJUSTMENT`) only the charges of
        that kind; `PAYMENTS` only the payments of the plot and their reversals
      enum: [REGULAR, REVERSAL, OPENING, ADJUSTMENT, PAYMENTS]

    PaymentKind:
      type: string
      description: >-
        `PAYMENT` money received for the plot; `PAYMENT_REVERSAL` cancels one payment with the opposite amount (see
        `reverses`, `reason`)
      enum: [PAYMENT, PAYMENT_REVERSAL]

    AccountPayment:
      type: object
      description: >-
        A payment of the plot or the reversal of one, as the plot account shows it. Never changed or deleted. A member
        sees the payments of the plots they own now, with the receipt or bank document number and what each payment
        paid, never the payer note or who entered it
      required:
        [id, kind, groupId, source, amount, receivedOn, billingMonth, reversed, allocations, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PaymentKind'
        groupId:
          type: string
          format: uuid
          description: The group of the payment (the parts of a payment split over several plots share it)
        source:
          $ref: '#/components/schemas/PaymentSource'
        amount:
          $ref: '#/components/schemas/Money'
          description: Above zero for a payment, below zero for a reversal
        receivedOn:
          type: string
          format: date
          description: The day the money was received; a reversal keeps the day of its payment
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the row is booked in, `YYYY-MM`
        receiptNumber:
          type: integer
          format: int64
          description: The receipt number of a cash payment; absent for a bank payment and for a reversal
        bankReference:
          type: string
          description: The bank document number of a bank payment, when given (user content)
        reversed:
          type: boolean
          description: True for a payment that a reversal cancels; false for a reversal row
        reversedBy:
          type: string
          format: uuid
          description: The reversal that cancelled this payment
        reverses:
          type: string
          format: uuid
          description: The payment a reversal cancels
        reason:
          type: string
          description: The reason of a reversal (user content)
        allocations:
          type: array
          description: >-
            What the payment paid: its allocations and releases, oldest first, each with its charge (also those placed
            later from the prepayment); empty for a reversal
          items:
            $ref: '#/components/schemas/PaymentAllocation'
        payerNote:
          type: string
          description: The payer note (personal data); only for callers with `PAYMENTS_VIEW` and `MEMBERS_VIEW`
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: >-
            The current name of the member who entered the row; only for callers with `CHARGES_VIEW`, absent when
            unknown

    AccountPrepaymentAllocation:
      type: object
      description: >-
        One placement of the plot's prepayment on its charges ("allocated from prepayment"): the allocation rows of
        origin `PREPAYMENT_AUTO` or `PREPAYMENT_MANUAL` written together. The same rows also appear among the
        allocations of the payments whose money they place
      required: [allocatedOn, createdAt, origin, system, amount, lines]
      properties:
        allocatedOn:
          type: string
          format: date
          description: The day the prepayment was placed, in Europe/Kyiv
        createdAt:
          type: string
          format: date-time
        origin:
          $ref: '#/components/schemas/AllocationOrigin'
        system:
          type: boolean
          description: True when the system placed it (automatic allocation), false when a member did
        amount:
          $ref: '#/components/schemas/Money'
          description: The sum of the lines
        lines:
          type: array
          description: The allocation rows, in the order of their charges (oldest first)
          items:
            $ref: '#/components/schemas/PaymentAllocation'

    IssueCertificateRequest:
      type: object
      properties:
        asOf:
          type: string
          format: date
          description: The day the debt is certified as of; absent means today in Europe/Kyiv; never after today

    CertificateStatus:
      type: string
      description: '`ISSUED` a valid certificate, `ANNULLED` one annulled with a reason'
      enum: [ISSUED, ANNULLED]

    CertificateRow:
      type: object
      description: One certificate of the register
      required: [id, number, plotId, plotNumber, asOf, totalDebt, issuedAt, status]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: '`Д-{YYYY}-{N}`, for example `Д-2026-1`'
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: The plot number as printed on the certificate (user content)
        asOf:
          type: string
          format: date
          description: The day the debt is certified as of
        totalDebt:
          $ref: '#/components/schemas/Money'
        issuedById:
          type: string
          format: uuid
          description: The member who issued it
        issuedByName:
          type: string
          description: The current name of the member who issued it ("Last First Middle"); absent when unknown
        issuedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/CertificateStatus'
        annulledAt:
          type: string
          format: date-time
          description: When it was annulled; only for `ANNULLED`
        annulledByName:
          type: string
          description: The current name of the member who annulled it; only for `ANNULLED`, absent when unknown
        annulReason:
          type: string
          description: Why it was annulled (user content); only for `ANNULLED`

    CertificatePage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CertificateRow'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    CertificateAnnulment:
      type: object
      description: Why a certificate is annulled
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: User content, stored as typed; surrounding whitespace is trimmed

    ChargeReversal:
      type: object
      description: Why a charge is reversed
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: User content, stored as typed; surrounding whitespace is trimmed

    OpeningBalanceInput:
      type: object
      description: An opening debt of a plot for one charge type as of a date
      required: [chargeTypeId, amount, date]
      properties:
        chargeTypeId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        date:
          type: string
          format: date
          description: The day the debt counts from; not after today
        reason:
          type: string
          maxLength: 500
          description: >-
            A reason or a document reference (user content), stored on the charge and written to the audit log;
            surrounding whitespace is trimmed, a blank reason means none

    BillingMonthStatus:
      type: string
      description: '`OPEN` accepts new charges; `CLOSED` never changes again'
      enum: [OPEN, CLOSED]

    ChargeTypeTotal:
      type: object
      description: The sum of the charges of one charge type booked in a billing month (reversals count negative)
      required: [chargeTypeId, name, nameCustomized, amount]
      properties:
        chargeTypeId:
          type: string
          format: uuid
        chargeTypeCode:
          $ref: '#/components/schemas/ChargeTypeCode'
        name:
          type: string
          description: The stored name; clients show their own default name while `nameCustomized` is false
        nameCustomized:
          type: boolean
        amount:
          $ref: '#/components/schemas/Money'

    BillingMonthSummary:
      type: object
      description: A billing month with the totals of the charges and the payments booked in it
      required: [month, status, runDone, totals, total, received]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The month, `YYYY-MM`
        status:
          $ref: '#/components/schemas/BillingMonthStatus'
        runDone:
          type: boolean
          description: True when the month run of recurring tariffs was booked for the month
        closedAt:
          type: string
          format: date-time
          description: When the month was closed; absent while it is open
        totals:
          type: array
          description: Per charge type that has a charge in the month, in the order of the charge types
          items:
            $ref: '#/components/schemas/ChargeTypeTotal'
        total:
          $ref: '#/components/schemas/Money'
        received:
          $ref: '#/components/schemas/Money'
          description: >-
            The sum of the payments booked in the month, reversals of payments negative (a payment received in a
            closed month counts in the open month it is booked in)

    StaleMeter:
      type: object
      description: >-
        An active plot meter without an approved reading (or its installation) for more than 60 days before the
        check date
      required: [meterId, plotId, plotNumber, resource, lastReadingOn]
      properties:
        meterId:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: User content, as the cooperative writes it
        resource:
          $ref: '#/components/schemas/MeterResource'
        lastReadingOn:
          type: string
          format: date
          description: The date of the last approved reading on or before the check date, or the installation date

    BillingMonthChecklist:
      type: object
      description: What the person closing the month sees first; nothing here blocks closing
      required: [runDone, notChargedCount, staleMeters]
      properties:
        runDone:
          type: boolean
        notChargedCount:
          type: integer
          format: int32
          minimum: 0
          description: The open "not charged" items of the month
        staleMeters:
          type: array
          description: In the natural order of the plot numbers, electricity before water
          items:
            $ref: '#/components/schemas/StaleMeter'

    BillingMonthDetails:
      type: object
      description: A billing month with its totals and the closing check list
      required: [month, status, runDone, totals, total, received, checklist]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The month, `YYYY-MM`
        status:
          $ref: '#/components/schemas/BillingMonthStatus'
        runDone:
          type: boolean
        closedAt:
          type: string
          format: date-time
        closedByName:
          type: string
          description: The current name of the member who closed the month; absent while open or when unknown
        totals:
          type: array
          items:
            $ref: '#/components/schemas/ChargeTypeTotal'
        total:
          $ref: '#/components/schemas/Money'
        received:
          $ref: '#/components/schemas/Money'
          description: The sum of the payments booked in the month, reversals of payments negative
        checklist:
          $ref: '#/components/schemas/BillingMonthChecklist'

    MonthRunRequest:
      type: object
      description: The booking of a month run; `digest` is the one of the preview the user confirmed
      properties:
        digest:
          type: string
          maxLength: 128
          description: >-
            The `digest` of the preview; when present and the run would now create something else, the booking is
            refused with 409 `PREVIEW_OUTDATED`

    NotChargedKind:
      type: string
      description: >-
        What could not be charged: `TARIFF_MONTH` the tariffs of a charge type for a plot and a billing month,
        `INTERVAL` a meter reading interval, `LOSSES_NODE` the losses of a node of the meter tree, `COMMON_CONSUMER` a
        common consumer
      enum: [TARIFF_MONTH, INTERVAL, LOSSES_NODE, COMMON_CONSUMER]

    NotChargedReason:
      type: string
      description: >-
        Why: `NO_TARIFF_FOR_ALL_DAYS` no tariff covers every day, `CONFLICTING_TARIFFS` two tariffs of the charge type
        apply on the same day, `OUTSIDE_SCOPE` the plot is outside the scope of every tariff, `EXCLUDED` the plot is
        excluded, `UNKNOWN_NODE_VALUE` / `UNKNOWN_CONSUMER_VALUE` a meter value of the range is unknown
      enum:
        - NO_TARIFF_FOR_ALL_DAYS
        - CONFLICTING_TARIFFS
        - OUTSIDE_SCOPE
        - EXCLUDED
        - UNKNOWN_NODE_VALUE
        - UNKNOWN_CONSUMER_VALUE

    NotChargedTariff:
      type: object
      description: A tariff an item is about (the link to fix it)
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: User content

    NotChargedItem:
      type: object
      description: >-
        Something the app could not charge, with the reason and what to fix. Codes and ids only; the client builds the
        text.
      required: [kind, reason, tariffs]
      properties:
        id:
          type: string
          format: uuid
          description: Absent in a preview for an item that does not exist yet
        kind:
          $ref: '#/components/schemas/NotChargedKind'
        reason:
          $ref: '#/components/schemas/NotChargedReason'
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: User content, as the cooperative writes it
        chargeType:
          $ref: '#/components/schemas/ChargeTypeRef'
        meterId:
          type: string
          format: uuid
          description: The meter to fix (an interval, a node, a common consumer)
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month of a `TARIFF_MONTH` item, `YYYY-MM`
        from:
          type: string
          format: date
          description: The first day of the days the item is about
        to:
          type: string
          format: date
          description: The last day of the days the item is about
        tariffs:
          type: array
          description: The tariffs involved, ordered by name (both tariffs for `CONFLICTING_TARIFFS`); may be empty
          items:
            $ref: '#/components/schemas/NotChargedTariff'
        createdAt:
          type: string
          format: date-time
          description: When the item was first opened; absent in a preview for a new item

    NotChargedRetryResult:
      type: object
      description: The outcome of a retry
      required: [resolved]
      properties:
        resolved:
          type: boolean
          description: True when the item is closed (charged now or before, or nothing left to charge)
        item:
          $ref: '#/components/schemas/NotChargedItem'

    MonthRunResult:
      type: object
      description: >-
        What a month run would create (preview) or created (booking): the new charges only, never those of an earlier
        run; the charges of the retried "not charged" items of other months included
      required: [month, preview, plots, totals, total, notCharged, created, digest]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The month, `YYYY-MM`
        preview:
          type: boolean
        plots:
          type: integer
          format: int32
          minimum: 0
          description: The number of plots that get at least one new charge
        totals:
          type: array
          description: The new charges per charge type, in the order of the charge types
          items:
            $ref: '#/components/schemas/ChargeTypeTotal'
        total:
          $ref: '#/components/schemas/Money'
        notCharged:
          type: array
          description: >-
            The items of the month the run cannot charge (opened by a booking, or kept open when they exist), in the
            natural order of the plot numbers, then by charge type
          items:
            $ref: '#/components/schemas/NotChargedItem'
        created:
          type: integer
          format: int32
          minimum: 0
          description: The number of charges written; 0 in a preview
        digest:
          type: string
          description: Identifies what the run would create; send it with the booking to make sure nothing changed

    WaterSourceKind:
      type: string
      description: >-
        `COOPERATIVE_SUPPLY`: the cooperative's water supply (no meter; clients show their own name for it).
        `METER`: a common consumer meter, for example a well pump, named by the cooperative.
      enum: [COOPERATIVE_SUPPLY, METER]

    WaterSourceRef:
      type: object
      description: The water source of a connection
      required: [id, kind]
      properties:
        id:
          type: string
          description: "`cooperative` for the cooperative's water supply, otherwise the id of the meter"
        kind:
          $ref: '#/components/schemas/WaterSourceKind'
        name:
          type: string
          description: The meter's name (user content); absent for the cooperative's water supply

    WaterConnection:
      type: object
      description: One connection of a plot to water
      required: [id, source, from]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/WaterSourceRef'
        from:
          type: string
          format: date
          description: The first connected day
        until:
          type: string
          format: date
          description: The last connected day; absent while the connection lasts

    PlotWaterConnections:
      type: object
      description: The water connections of a plot
      required: [plotId, connected, connections]
      properties:
        plotId:
          type: string
          format: uuid
        connected:
          type: boolean
          description: Whether the plot is connected today (Europe/Kyiv)
        current:
          $ref: '#/components/schemas/WaterConnection'
        connections:
          type: array
          description: Every connection the plot has had, newest first; `current` is one of them
          items:
            $ref: '#/components/schemas/WaterConnection'

    WaterConnectionCreate:
      type: object
      required: [from]
      properties:
        sourceMeterId:
          type: string
          format: uuid
          description: An active common consumer meter; absent for the cooperative's water supply
        from:
          type: string
          format: date
          description: The first connected day

    WaterConnectionEnd:
      type: object
      required: [until]
      properties:
        until:
          type: string
          format: date
          description: The last connected day, on or after the first one

    WaterSourcePlot:
      type: object
      description: A plot connected to a water source
      required: [plotId, plotNumber, connectionId, from]
      properties:
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: User content, as the cooperative writes it
        connectionId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        until:
          type: string
          format: date
          description: The last connected day when the connection ends today or later; absent while it lasts

    WaterSource:
      type: object
      description: A water source with the plots whose connection to it has not ended before today
      required: [id, kind, plots]
      properties:
        id:
          type: string
          description: "`cooperative` for the cooperative's water supply, otherwise the id of the meter"
        kind:
          $ref: '#/components/schemas/WaterSourceKind'
        name:
          type: string
          description: The meter's name (user content); absent for the cooperative's water supply
        plots:
          type: array
          description: In the natural order of the plot numbers
          items:
            $ref: '#/components/schemas/WaterSourcePlot'

    WaterSourceConnection:
      type: object
      required: [plotIds, from]
      properties:
        plotIds:
          type: array
          maxItems: 5000
          items:
            type: string
            format: uuid
        from:
          type: string
          format: date
          description: The first connected day of every plot

    WaterSourceDisconnection:
      type: object
      required: [plotIds, until]
      properties:
        plotIds:
          type: array
          maxItems: 5000
          items:
            type: string
            format: uuid
        until:
          type: string
          format: date
          description: The last connected day of every plot

    LossesRunRequest:
      type: object
      description: >-
        The range of a losses run (days, both included), the nodes to run (absent or empty: every node) and, for a
        booking, the `digest` of the preview the user confirmed
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        nodeIds:
          type: array
          maxItems: 500
          description: Meter ids of the nodes to run (any meter of a node's chain)
          items:
            type: string
            format: uuid
        digest:
          type: string
          maxLength: 128
          description: >-
            The `digest` of the preview; when present and the run would now book something else, the booking is
            refused with 409 `PREVIEW_OUTDATED`

    LossesNodeOutcome:
      type: string
      description: >-
        What a run does with a node: `CHARGED` its losses are shared among the plots under it (also when they are
        zero); `NEGATIVE` the children used more than the node shows, nothing is charged; `UNKNOWN` a value of the node
        or of a child is unknown, the node is skipped; `SKIPPED_ABOVE` a node below is unknown, the node is skipped too;
        `ALREADY_CHARGED` a booked run charged the node for a day of the range (preview only; a booking is refused)
      enum: [CHARGED, NEGATIVE, UNKNOWN, SKIPPED_ABOVE, ALREADY_CHARGED]

    LossesWarningCode:
      type: string
      description: >-
        The warning of a node: `NEGATIVE_LOSSES` (the numbers are the node's `consumption`, `children` and `losses`);
        `UNKNOWN_VALUE` (the value of `meterId` at the range end, or the day before the range start, is unknown;
        `lastReadingOn` is its last point before it); `SKIPPED_ABOVE` (`meterId` is the unknown node below);
        `ALREADY_CHARGED` (`runId`, `from`, `to`: the booked run that charged the node); `NO_PLOT_CONSUMPTION` (the
        losses are above zero but no plot under the node used anything, so nobody is charged)
      enum: [NEGATIVE_LOSSES, UNKNOWN_VALUE, SKIPPED_ABOVE, ALREADY_CHARGED, NO_PLOT_CONSUMPTION]

    LossesWarning:
      type: object
      description: Why a node is not charged, or charges nobody; codes, ids and dates only
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/LossesWarningCode'
        meterId:
          type: string
          format: uuid
        meterKind:
          $ref: '#/components/schemas/MeterKind'
        meterName:
          type: string
          description: The name of a named meter (user content)
        plotNumber:
          type: string
          description: The plot of a plot meter (user content)
        lastReadingOn:
          type: string
          format: date
        runId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    LossesRunPlot:
      type: object
      description: >-
        The share of one plot in the losses of one node: the kWh (rounded to three decimals for display; the amount is
        calculated from the exact quantity) and their price at the plot's tariff, rounded once. A plot whose share cannot
        be priced has no `amount` and, when the board can fix it, a `reason`
      required: [plotId, kwh]
      properties:
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: User content
        kwh:
          $ref: '#/components/schemas/MeterValue'
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          $ref: '#/components/schemas/NotChargedReason'

    LossesRunNode:
      type: object
      description: >-
        One node of a run. Quantities are kWh rounded to three decimals for display; `losses` may be negative;
        `pct` is the losses in percent of the node's consumption, two decimals (absent when the consumption is zero or
        unknown). `amount` is the sum of the plots' amounts.
      required: [meterId, kind, calculated, outcome, plots, amount]
      properties:
        meterId:
          type: string
          format: uuid
          description: The node (the first meter of its chain; a replacement keeps the node)
        kind:
          $ref: '#/components/schemas/MeterKind'
        name:
          type: string
          description: User content
        consumption:
          $ref: '#/components/schemas/MeterValue'
        children:
          $ref: '#/components/schemas/MeterValue'
        losses:
          type: string
          pattern: '^-?\d{1,11}\.\d{3}$'
        pct:
          type: string
          pattern: '^-?\d+\.\d{2}$'
        calculated:
          type: boolean
          description: True when a value the node's numbers rest on was calculated between readings ("розрахунковий")
        outcome:
          $ref: '#/components/schemas/LossesNodeOutcome'
        warning:
          $ref: '#/components/schemas/LossesWarning'
        plots:
          type: array
          description: The plots under the node with a share, in the natural order of the plot numbers
          items:
            $ref: '#/components/schemas/LossesRunPlot'
        amount:
          $ref: '#/components/schemas/Money'

    LossesRunCharge:
      type: object
      description: >-
        The losses charge of one plot: its kWh from every charged node, priced once and rounded once (`chargeId` and
        `reversed` once booked)
      required: [plotId, kwh, amount]
      properties:
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: User content
        kwh:
          $ref: '#/components/schemas/MeterValue'
        amount:
          $ref: '#/components/schemas/Money'
        chargeId:
          type: string
          format: uuid
        reversed:
          type: boolean

    LossesRunResult:
      type: object
      description: What a losses run would charge (preview) or charged (booking)
      required: [from, to, preview, nodes, charges, plots, total, created, digest]
      properties:
        runId:
          type: string
          format: uuid
          description: The booked run; absent in a preview
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        preview:
          type: boolean
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the charges are (or would be) booked in, `YYYY-MM`
        nodes:
          type: array
          description: The nodes, substations first, then by name
          items:
            $ref: '#/components/schemas/LossesRunNode'
        charges:
          type: array
          description: One charge per plot, in the natural order of the plot numbers
          items:
            $ref: '#/components/schemas/LossesRunCharge'
        plots:
          type: integer
          format: int32
          minimum: 0
          description: The number of plots charged
        total:
          $ref: '#/components/schemas/Money'
        created:
          type: integer
          format: int32
          minimum: 0
          description: The number of charges written; 0 in a preview
        digest:
          type: string
          description: Identifies what the run would book; send it with the booking to make sure nothing changed

    LossesRunStatus:
      type: string
      description: '`BOOKED` its charges stand; `REVERSED` every charge was reversed'
      enum: [BOOKED, REVERSED]

    LossesRunSummary:
      type: object
      description: One losses run in the history
      required:
        [id, from, to, status, billingMonth, createdAt, total, plots, chargedNodes, skippedNodes, reversible]
      properties:
        id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/LossesRunStatus'
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month its charges are booked in, `YYYY-MM`
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: The current name of the member who booked it; absent when unknown
        total:
          $ref: '#/components/schemas/Money'
        plots:
          type: integer
          format: int32
          minimum: 0
          description: The number of plots charged
        chargedNodes:
          type: integer
          format: int32
          minimum: 0
        skippedNodes:
          type: integer
          format: int32
          minimum: 0
          description: The nodes not charged (negative, unknown or skipped above)
        reversible:
          type: boolean
          description: >-
            True when the caller may reverse the run now: the caller has `CHARGES_REVERSE`, the run is booked and its
            billing month is open
        reversedAt:
          type: string
          format: date-time
        reversedByName:
          type: string
        reverseReason:
          type: string
          description: User content

    LossesRunDetails:
      type: object
      description: One losses run with its nodes and charges as booked
      required:
        [
          id,
          from,
          to,
          status,
          billingMonth,
          createdAt,
          total,
          plots,
          chargedNodes,
          skippedNodes,
          reversible,
          nodes,
          charges,
        ]
      properties:
        id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/LossesRunStatus'
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
        total:
          $ref: '#/components/schemas/Money'
        plots:
          type: integer
          format: int32
          minimum: 0
        chargedNodes:
          type: integer
          format: int32
          minimum: 0
        skippedNodes:
          type: integer
          format: int32
          minimum: 0
        reversible:
          type: boolean
        reversedAt:
          type: string
          format: date-time
        reversedByName:
          type: string
        reverseReason:
          type: string
          description: User content
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/LossesRunNode'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/LossesRunCharge'

    RunReversal:
      type: object
      description: Why a run is reversed
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: User content, stored as typed; surrounding whitespace is trimmed

    CommonConsumerRunRequest:
      type: object
      description: >-
        The range of a common consumer run (days, both included), the consumers to run (absent or empty: every
        consumer) and, for a booking, the `digest` of the preview the user confirmed
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        consumerIds:
          type: array
          maxItems: 500
          description: Meter ids of the consumers to run (any meter of a consumer's chain)
          items:
            type: string
            format: uuid
        digest:
          type: string
          maxLength: 128
          description: >-
            The `digest` of the preview; when present and the run would now book something else, the booking is
            refused with 409 `PREVIEW_OUTDATED`

    CommonConsumerOutcome:
      type: string
      description: >-
        What a run does with a common consumer: `CHARGED` its consumption is shared among its plots (also when it is
        zero); `NOT_CHARGED` its split is `NOT_CHARGED` (covered by the membership fee), nothing is charged;
        `NO_PLOTS` it used something but no plot shares it (nobody connected, no service users), nothing is charged;
        `UNKNOWN` its value at the range end (or the day before the start) is unknown, it is skipped;
        `ALREADY_CHARGED` a booked run charged it for a day of the range (preview only; a booking is refused)
      enum: [CHARGED, NOT_CHARGED, NO_PLOTS, UNKNOWN, ALREADY_CHARGED]

    CommonConsumerWarningCode:
      type: string
      description: >-
        The warning of a consumer: `UNKNOWN_VALUE` (the value of `meterId` at the range end, or the day before the
        range start, is unknown; `lastReadingOn` is its last point before it); `ALREADY_CHARGED` (`runId`, `from`,
        `to`: the booked run that charged it); `NO_PLOTS` (it used something but no plot shares it)
      enum: [UNKNOWN_VALUE, ALREADY_CHARGED, NO_PLOTS]

    CommonConsumerWarning:
      type: object
      description: Why a consumer is not charged; codes, ids and dates only
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/CommonConsumerWarningCode'
        meterId:
          type: string
          format: uuid
        lastReadingOn:
          type: string
          format: date
        runId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    CommonConsumerRunPlot:
      type: object
      description: >-
        The share of one plot in one consumer: its days in the split (connected days for `CONNECTED_PLOTS`, else the
        days of the range), the kWh (rounded to three decimals for display; the amount is calculated from the exact
        quantity) and their price at the plot's `COMMON_CONSUMERS` tariff, rounded once. A plot whose share cannot be
        priced has no `amount` and, when the board can fix it, a `reason`. `chargeId` and `reversed` once booked
      required: [plotId, days, kwh]
      properties:
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: User content
        days:
          type: integer
          format: int32
          minimum: 0
        kwh:
          $ref: '#/components/schemas/MeterValue'
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          $ref: '#/components/schemas/NotChargedReason'
        chargeId:
          type: string
          format: uuid
        reversed:
          type: boolean

    CommonConsumerRunLine:
      type: object
      description: >-
        One common consumer of a run. `consumption` is kWh rounded to three decimals for display (absent when
        unknown); `plotDays` is the sum of the plots' days; `amount` the sum of the plots' amounts
      required: [meterId, split, calculated, outcome, plotDays, plots, amount]
      properties:
        meterId:
          type: string
          format: uuid
          description: The consumer (the first meter of its chain; a replacement keeps the consumer)
        name:
          type: string
          description: User content
        split:
          $ref: '#/components/schemas/CommonConsumerSplit'
        consumption:
          $ref: '#/components/schemas/MeterValue'
        calculated:
          type: boolean
          description: True when a value the consumption rests on was calculated between readings ("розрахунковий")
        outcome:
          $ref: '#/components/schemas/CommonConsumerOutcome'
        warning:
          $ref: '#/components/schemas/CommonConsumerWarning'
        plotDays:
          type: integer
          format: int64
          minimum: 0
        plots:
          type: array
          description: The plots that share the consumer, in the natural order of the plot numbers
          items:
            $ref: '#/components/schemas/CommonConsumerRunPlot'
        amount:
          $ref: '#/components/schemas/Money'

    CommonConsumerRunResult:
      type: object
      description: What a common consumer run would charge (preview) or charged (booking)
      required: [from, to, preview, noTariff, consumers, plots, charges, total, created, digest]
      properties:
        runId:
          type: string
          format: uuid
          description: The booked run; absent in a preview
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        preview:
          type: boolean
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the charges are (or would be) booked in, `YYYY-MM`
        noTariff:
          type: boolean
          description: >-
            True when there is no `COMMON_CONSUMERS` tariff to price the run with ("Немає тарифу"): nothing is priced
            and a booking is refused with 409 `NO_COMMON_CONSUMERS_TARIFF`
        consumers:
          type: array
          description: The common consumers by name
          items:
            $ref: '#/components/schemas/CommonConsumerRunLine'
        plots:
          type: integer
          format: int32
          minimum: 0
          description: The number of plots charged
        charges:
          type: integer
          format: int32
          minimum: 0
          description: The number of charges (one per plot per consumer)
        total:
          $ref: '#/components/schemas/Money'
        created:
          type: integer
          format: int32
          minimum: 0
          description: The number of charges written; 0 in a preview
        digest:
          type: string
          description: Identifies what the run would book; send it with the booking to make sure nothing changed

    CommonConsumerRunStatus:
      type: string
      description: '`BOOKED` its charges stand; `REVERSED` every charge was reversed'
      enum: [BOOKED, REVERSED]

    CommonConsumerRunSummary:
      type: object
      description: One common consumer run in the history
      required:
        [
          id,
          from,
          to,
          status,
          billingMonth,
          createdAt,
          total,
          plots,
          charges,
          chargedConsumers,
          skippedConsumers,
          reversible,
        ]
      properties:
        id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CommonConsumerRunStatus'
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month its charges are booked in, `YYYY-MM`
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: The current name of the member who booked it; absent when unknown
        total:
          $ref: '#/components/schemas/Money'
        plots:
          type: integer
          format: int32
          minimum: 0
          description: The number of plots charged
        charges:
          type: integer
          format: int32
          minimum: 0
          description: The number of charges
        chargedConsumers:
          type: integer
          format: int32
          minimum: 0
        skippedConsumers:
          type: integer
          format: int32
          minimum: 0
          description: The consumers not charged (not charged by their split, without plots, or unknown)
        reversible:
          type: boolean
          description: >-
            True when the caller may reverse the run now: the caller has `CHARGES_REVERSE`, the run is booked and its
            billing month is open
        reversedAt:
          type: string
          format: date-time
        reversedByName:
          type: string
        reverseReason:
          type: string
          description: User content

    CommonConsumerRunDetails:
      type: object
      description: One common consumer run with its consumers as booked; each plot share carries its charge
      required:
        [
          id,
          from,
          to,
          status,
          billingMonth,
          createdAt,
          total,
          plots,
          charges,
          chargedConsumers,
          skippedConsumers,
          reversible,
          consumers,
        ]
      properties:
        id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CommonConsumerRunStatus'
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
        total:
          $ref: '#/components/schemas/Money'
        plots:
          type: integer
          format: int32
          minimum: 0
        charges:
          type: integer
          format: int32
          minimum: 0
        chargedConsumers:
          type: integer
          format: int32
          minimum: 0
        skippedConsumers:
          type: integer
          format: int32
          minimum: 0
        reversible:
          type: boolean
        reversedAt:
          type: string
          format: date-time
        reversedByName:
          type: string
        reverseReason:
          type: string
          description: User content
        consumers:
          type: array
          items:
            $ref: '#/components/schemas/CommonConsumerRunLine'

    CommonConsumerBilling:
      type: object
      description: >-
        How one common consumer (the whole chain of its meters through replacements) is shared among plots. `split`
        is the consumer's own split, absent while the cooperative's `commonConsumerDefaultSplit` applies;
        `effectiveSplit` is the split a run uses now
      required: [meterId, active, effectiveSplit, servicePlotIds]
      properties:
        meterId:
          type: string
          format: uuid
        name:
          type: string
          description: User content
        active:
          type: boolean
          description: False for a removed meter
        split:
          $ref: '#/components/schemas/CommonConsumerSplit'
        effectiveSplit:
          $ref: '#/components/schemas/CommonConsumerSplit'
        servicePlotIds:
          type: array
          description: The plots marked as using the consumer, in the natural order of the plot numbers
          items:
            type: string
            format: uuid

    CommonConsumerBillingUpdate:
      type: object
      description: >-
        The split of a common consumer (absent: the cooperative's default) and its service users (replaced as a whole;
        an empty list removes them all)
      required: [servicePlotIds]
      properties:
        split:
          $ref: '#/components/schemas/CommonConsumerSplit'
        servicePlotIds:
          type: array
          maxItems: 5000
          items:
            type: string
            format: uuid

    RecalculationCauseType:
      type: string
      description: >-
        What a recalculation is about: `MANUAL` chosen months, charge types and plots; `TARIFF_VERSION_ADD`,
        `TARIFF_VERSION_UPDATE`, `TARIFF_VERSION_DELETE` a version of a tariff added, corrected or deleted;
        `READING_ENTER`, `READING_CORRECT`, `READING_DELETE` a meter reading entered, corrected or deleted
      enum:
        - MANUAL
        - TARIFF_VERSION_ADD
        - TARIFF_VERSION_UPDATE
        - TARIFF_VERSION_DELETE
        - READING_ENTER
        - READING_CORRECT
        - READING_DELETE

    RecalculationCauseKind:
      type: string
      description: >-
        The kind of cause stored with a booked recalculation: `MANUAL`, `TARIFF_VERSION` (any `TARIFF_VERSION_*`
        type) or `READING` (any `READING_*` type)
      enum: [MANUAL, TARIFF_VERSION, READING]

    RecalculationManualScope:
      type: object
      description: >-
        The scope of a manual recalculation: the billing months `from` to `to` (both included, `YYYY-MM`, `to` not
        after the current month, at most 24 months), the charge types (absent or empty: every active type) and the
        plots (absent or empty: every chargeable plot)
      required: [from, to]
      properties:
        from:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        to:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        chargeTypeIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        plotIds:
          type: array
          maxItems: 5000
          items:
            type: string
            format: uuid

    RecalculationTariffVersionChange:
      type: object
      description: >-
        The change of a tariff version a recalculation books with it: the tariff, the version (for an update or a
        delete) and its new terms (for an add or an update)
      required: [tariffId]
      properties:
        tariffId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/TariffVersionCreate'

    RecalculationReadingChange:
      type: object
      description: >-
        The change of a meter reading a recalculation books with it: the meter (for a new reading), the reading (for
        a correction or a delete) and its date and value (for a new reading or a correction)
      properties:
        meterId:
          type: string
          format: uuid
        readingId:
          type: string
          format: uuid
        reading:
          $ref: '#/components/schemas/ReadingCorrection'

    RecalculationCause:
      type: object
      description: >-
        What to recalculate. `type` says which of the other fields applies: `manual` for `MANUAL`, `tariffVersion` for
        `TARIFF_VERSION_*`, `reading` for `READING_*`
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/RecalculationCauseType'
        manual:
          $ref: '#/components/schemas/RecalculationManualScope'
        tariffVersion:
          $ref: '#/components/schemas/RecalculationTariffVersionChange'
        reading:
          $ref: '#/components/schemas/RecalculationReadingChange'

    RecalculationRequest:
      type: object
      description: >-
        A recalculation to preview or book. `reason` is required to book (trimmed, at most 500 characters) and stored
        on every reversal and adjustment the recalculation books; `digest` is the digest of the preview the booking
        confirms
      required: [cause]
      properties:
        cause:
          $ref: '#/components/schemas/RecalculationCause'
        reason:
          type: string
          maxLength: 500
          description: User content
        digest:
          type: string
          maxLength: 128

    RecalculationScope:
      type: object
      description: >-
        The scope a recalculation used, as ids and codes: the months (`YYYY-MM`), the charge types and plots, and the
        tariff, version, meter or reading that caused it
      required: [months, chargeTypeIds, plotIds]
      properties:
        months:
          type: array
          items:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        chargeTypeIds:
          type: array
          items:
            type: string
            format: uuid
        plotIds:
          type: array
          items:
            type: string
            format: uuid
        tariffId:
          type: string
          format: uuid
        tariffVersionId:
          type: string
          format: uuid
        meterId:
          type: string
          format: uuid
        readingId:
          type: string
          format: uuid

    RecalculationAction:
      type: string
      description: >-
        What a line books: `REVERSE_AND_RECHARGE` the charge (open month) is reversed and charged again with the
        expected amount; `ADJUST` an adjustment of "expected - effective" in the earliest open month (closed month);
        `NEW` a new charge where none was booked; `REVERSE` the charge (open month) is reversed because it should no
        longer exist
      enum: [REVERSE_AND_RECHARGE, ADJUST, NEW, REVERSE]

    RecalculationChangeReason:
      type: string
      description: >-
        Why the amount of a line changed: `TARIFF_VERSION` the tariff version or its rate, `READING` a meter reading,
        `AREA` the plot area, `WATER_CONNECTION` the water connection days, `TARIFF_SCOPE` the plots of a tariff or its
        exclusions, `METER_TREE` the meter tree, `RUN` the numbers of a losses or common consumer run, `NOT_CHARGED`
        the expected charge cannot be calculated (it becomes a "not charged" item)
      enum: [TARIFF_VERSION, READING, AREA, WATER_CONNECTION, TARIFF_SCOPE, METER_TREE, RUN, NOT_CHARGED]

    RecalculationLine:
      type: object
      description: >-
        One charge of a recalculation: what was booked, what is expected, the difference and the charges the line
        created. `effective` is `booked` plus `adjustments`; `difference` is `expected` minus `effective`
      required:
        [
          plotId,
          plotNumber,
          chargeType,
          serviceFrom,
          serviceTo,
          booked,
          adjustments,
          effective,
          expected,
          difference,
          action,
          reasons,
          createdChargeIds,
        ]
      properties:
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: User content, as the cooperative writes it
        chargeType:
          $ref: '#/components/schemas/ChargeTypeRef'
        serviceFrom:
          type: string
          format: date
        serviceTo:
          type: string
          format: date
        originalChargeId:
          type: string
          format: uuid
          description: The booked charge the line corrects; absent for a new charge
        booked:
          $ref: '#/components/schemas/Money'
        adjustments:
          $ref: '#/components/schemas/Money'
        effective:
          $ref: '#/components/schemas/Money'
        expected:
          $ref: '#/components/schemas/Money'
        difference:
          $ref: '#/components/schemas/Money'
        action:
          $ref: '#/components/schemas/RecalculationAction'
        bookedIn:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the line's new charge, adjustment or reversal is (or would be) booked in
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/RecalculationChangeReason'
        notChargedReason:
          $ref: '#/components/schemas/NotChargedReason'
        runId:
          type: string
          format: uuid
          description: The losses or common consumer run of the original charge
        reversalChargeId:
          type: string
          format: uuid
        newChargeId:
          type: string
          format: uuid
        adjustmentChargeId:
          type: string
          format: uuid
        createdChargeIds:
          type: array
          description: The charges the line booked (reversal, new charge, adjustment, in that order); empty in a preview
          items:
            type: string
            format: uuid

    Recalculation:
      type: object
      description: >-
        A recalculation: a preview (nothing booked, `id` absent) or a booked one with its lines. `totals` are the
        differences per charge type, in the order of the charge types; `total` their sum; `plotCount` the number of
        plots with a line
      required:
        [preview, booked, changeApplied, cause, scope, lines, totals, total, plotCount, notCharged, digest]
      properties:
        id:
          type: string
          format: uuid
        preview:
          type: boolean
        booked:
          type: boolean
          description: True when the recalculation was booked (false in a preview and for an empty cause-driven plan)
        changeApplied:
          type: boolean
          description: True when the cause-driven change (a version or a reading) was saved
        cause:
          $ref: '#/components/schemas/RecalculationCauseKind'
        causeType:
          $ref: '#/components/schemas/RecalculationCauseType'
        scope:
          $ref: '#/components/schemas/RecalculationScope'
        reason:
          type: string
          description: User content; absent in a preview
        lines:
          type: array
          description: Grouped by plot (natural order of the numbers), then by service period, then by charge type
          items:
            $ref: '#/components/schemas/RecalculationLine'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/ChargeTypeTotal'
        total:
          $ref: '#/components/schemas/Money'
        plotCount:
          type: integer
          format: int32
          minimum: 0
        notCharged:
          type: array
          description: The "not charged" items the recalculation opens or keeps open; empty for a booked record
          items:
            $ref: '#/components/schemas/NotChargedItem'
        digest:
          type: string
          description: Identifies what the recalculation would book; send it with the booking
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: The current name of the member who booked it; absent when that member no longer exists

    RecalculationSummary:
      type: object
      description: A booked recalculation in the list
      required: [id, cause, reason, total, lineCount, plotCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        cause:
          $ref: '#/components/schemas/RecalculationCauseKind'
        causeType:
          $ref: '#/components/schemas/RecalculationCauseType'
        reason:
          type: string
          description: User content
        total:
          $ref: '#/components/schemas/Money'
        lineCount:
          type: integer
          format: int32
          minimum: 0
        plotCount:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: The current name of the member who booked it; absent when that member no longer exists

    RecalculationPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecalculationSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    PaymentSource:
      type: string
      description: >-
        Where the money of a payment came from: `CASH` taken at the cooperative's cash desk (the payment carries a
        receipt number), `BANK` a bank transfer entered by hand (no receipt number, an optional bank document number)
      enum: [CASH, BANK]

    AllocationOrigin:
      type: string
      description: >-
        Who placed an allocation: `ENTRY` when the payment was entered, `REALLOCATION` when the payment was reallocated,
        `PREPAYMENT_MANUAL` the plot's prepayment placed by hand, `PREPAYMENT_AUTO` placed by the system: the prepayment
        after new charges were booked, or the remainder of a payment placed at once when it was entered or reallocated
        (automatic allocation on)
      enum: [ENTRY, REALLOCATION, PREPAYMENT_MANUAL, PREPAYMENT_AUTO]

    AllocationReleaseCause:
      type: string
      description: >-
        Why a release took money back from a charge: `CHARGE_REVERSED` the charge was reversed, `CHARGE_ADJUSTED` an
        adjustment lowered it below what was placed on it, `PAYMENT_REVERSED` the payment was reversed, `REALLOCATED`
        the payment was reallocated
      enum: [CHARGE_REVERSED, CHARGE_ADJUSTED, PAYMENT_REVERSED, REALLOCATED]

    PaymentLineInput:
      type: object
      description: An amount of the payment placed on one open charge of the plot
      required: [chargeId, amount]
      properties:
        chargeId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'

    PaymentEntryRequest:
      type: object
      description: >-
        A payment for one plot (`plotId`, with optional `lines`) or one payment split over several plots of one payer
        (`split`); exactly one of `plotId` and `split` is given.
      required: [amount, receivedOn, source]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        receivedOn:
          type: string
          format: date
          description: The day the money arrived; not after today in Europe/Kyiv
        source:
          $ref: '#/components/schemas/PaymentSource'
        bankReference:
          type: string
          maxLength: 64
          description: >-
            The bank document number of a `BANK` payment (user content); surrounding whitespace is trimmed, blank means
            none
        payerMemberId:
          type: string
          format: uuid
          description: >-
            The member who paid; any member of the cooperative, optional. With `split` the payer is
            `split.payerMemberId`; this field is then absent or the same member
        payerNote:
          type: string
          maxLength: 200
          description: >-
            A note about the payer (for example the name of a relative who brought the money): personal data, stored
            encrypted; surrounding whitespace is trimmed, blank means none
        plotId:
          type: string
          format: uuid
          description: The plot the payment is for; required unless `split` is given
        lines:
          type: [array, 'null']
          maxItems: 1000
          description: >-
            The caller's allocation for `plotId`, each charge at most once; absent (or null) saves the proposal, an
            empty list places nothing. Not with `split` (each part has its own lines)
          items:
            $ref: '#/components/schemas/PaymentLineInput'
        split:
          $ref: '#/components/schemas/PaymentSplitInput'
        digest:
          type: string
          maxLength: 64
          description: The `digest` of the preview the caller saw; optional

    PaymentSplitInput:
      type: object
      description: >-
        One payment split over several current plots of one payer (feature 015 §2.6). Without `parts` the proposed
        split over every current plot of the payer is used
      required: [payerMemberId]
      properties:
        payerMemberId:
          type: string
          format: uuid
          description: The member who paid; the split is over the plots this member owns now
        parts:
          type: [array, 'null']
          maxItems: 500
          description: >-
            The caller's parts, each a current plot of the payer at most once; together they add up to `amount`.
            Absent (or null) uses the proposed split
          items:
            $ref: '#/components/schemas/PaymentSplitPartInput'

    PaymentSplitPartInput:
      type: object
      description: The part of a split payment for one plot
      required: [plotId]
      properties:
        plotId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
          description: >-
            The part, `0.00` or more (a part of `0.00` is not saved); absent takes the proposed part of the plot
        lines:
          type: [array, 'null']
          maxItems: 1000
          description: >-
            The caller's allocation of the part, as `lines` of a payment for one plot; absent (or null) uses the
            proposal of the part
          items:
            $ref: '#/components/schemas/PaymentLineInput'

    PaymentProposalLine:
      type: object
      description: An open charge of the plot with the amount the payment places on it
      required: [chargeId, kind, chargeType, billingMonth, serviceFrom, serviceTo, accruedOn, open, proposed]
      properties:
        chargeId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChargeKind'
        chargeType:
          $ref: '#/components/schemas/ChargeTypeRef'
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the charge is booked in, `YYYY-MM`
        serviceFrom:
          type: string
          format: date
        serviceTo:
          type: string
          format: date
        accruedOn:
          type: string
          format: date
          description: The day the debt counts from
        open:
          $ref: '#/components/schemas/Money'
        proposed:
          $ref: '#/components/schemas/Money'

    PaymentPartProposal:
      type: object
      description: >-
        What a payment places on the open charges of one plot: every open charge in the order of the proposal (oldest
        debt date first) with what the proposal or the caller's lines place on it, the lines a save writes (the
        automatic placement of the remainder included), the total placed and what is left as prepayment
      required: [plotId, plotNumber, amount, lines, resultLines, allocatedTotal, automaticTotal, prepayment]
      properties:
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
          description: The payment, its part of a split, or the prepayment being allocated
        lines:
          type: array
          description: >-
            Every open charge of the plot; `proposed` is what the proposal or the caller's lines place on it (in a
            preview with problems: the amounts requested, as sent)
          items:
            $ref: '#/components/schemas/PaymentProposalLine'
        resultLines:
          type: array
          description: >-
            The allocations a save writes: the proposal's or the caller's lines in their order (`automatic: false`),
            then the remainder placed automatically in the order of the proposal (`automatic: true`). Empty in a
            preview with problems
          items:
            $ref: '#/components/schemas/PaymentResultLine'
        allocatedTotal:
          $ref: '#/components/schemas/Money'
          description: >-
            The total placed, the automatic placement included; in a preview with problems the sum of the requested
            amounts above zero
        automaticTotal:
          $ref: '#/components/schemas/Money'
          description: What the automatic placement of the remainder places (`0.00` when nothing or switched off)
        prepayment:
          $ref: '#/components/schemas/Money'
          description: >-
            What the payment leaves unplaced (the amount minus `allocatedTotal`, never below `0.00`); `0.00` while the
            plot still has an open charge and automatic allocation is on
        debt:
          $ref: '#/components/schemas/Money'
          description: What the plot owes before the payment (the sum of `open` of its open charges)

    PaymentResultLine:
      type: object
      description: One allocation a save writes
      required: [chargeId, amount, automatic]
      properties:
        chargeId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        automatic:
          type: boolean
          description: >-
            True for the remainder placed by the system (origin `PREPAYMENT_AUTO`); false for the proposal's or the
            caller's line

    AllocationProblemCode:
      type: string
      description: >-
        What is wrong with the lines of a preview: `ALLOCATION_EXCEEDS_CHARGE` a line exceeds what is open on its
        charge, `ALLOCATION_EXCEEDS_PAYMENT` the lines together exceed the amount (no line), `AMOUNT_NOT_POSITIVE` a
        line not above zero, `NOT_FOUND` a line names no open charge of the plot, `DUPLICATE` a charge named on an
        earlier line again, `SPLIT_TOTAL_MISMATCH` the parts of a split do not add up to the amount (no plot, no line)
      enum:
        [
          ALLOCATION_EXCEEDS_CHARGE,
          ALLOCATION_EXCEEDS_PAYMENT,
          AMOUNT_NOT_POSITIVE,
          NOT_FOUND,
          DUPLICATE,
          SPLIT_TOTAL_MISMATCH,
        ]

    AllocationProblem:
      type: object
      description: >-
        A problem of the lines of a preview. A problem of one line names its plot, its index in the lines sent (of the
        part of the plot for a split) and the charge it names; `ALLOCATION_EXCEEDS_PAYMENT` names only the plot,
        `SPLIT_TOTAL_MISMATCH` nothing
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/AllocationProblemCode'
        plotId:
          type: string
          format: uuid
        line:
          type: integer
          format: int32
          description: The index of the line in the `lines` sent
        chargeId:
          type: string
          format: uuid
          description: The charge the line names

    PaymentSplitPlot:
      type: object
      description: A current plot of the payer of a split payment, with its debt and its proposed part
      required: [plotId, plotNumber, debt, proposedAmount]
      properties:
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
        debt:
          $ref: '#/components/schemas/Money'
          description: What the plot owes (the sum of what is open on its charges)
        proposedAmount:
          $ref: '#/components/schemas/Money'
          description: The part the proposed split gives the plot

    PaymentSplitPreview:
      type: object
      description: The payer of a split payment and every current plot of the payer, in natural plot order
      required: [payerMemberId, plots]
      properties:
        payerMemberId:
          type: string
          format: uuid
        plots:
          type: array
          items:
            $ref: '#/components/schemas/PaymentSplitPlot'

    SavedPayment:
      type: object
      description: A payment just saved
      required: [id, groupId, plotId, amount, source, receivedOn, billingMonth]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        source:
          $ref: '#/components/schemas/PaymentSource'
        receivedOn:
          type: string
          format: date
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the payment is booked in, `YYYY-MM`
        receiptNumber:
          type: integer
          format: int64
          description: The receipt number of a cash payment; absent for a bank payment

    PaymentEntryResult:
      type: object
      description: >-
        The proposal of a payment (preview) or the payments saved with it (save). `parts` has one part per plot: one
        for a payment of one plot, one per plot of the split (in natural plot order, parts of `0.00` included) for a
        split payment, which also has `split`. `payments` is empty for a preview; a save lists one payment per part
        above zero, all of one group. A preview whose lines have a problem has `valid: false`, the problems and no
        `digest`; a save is always valid.
      required: [preview, valid, amount, parts, problems, payments]
      properties:
        preview:
          type: boolean
        valid:
          type: boolean
          description: False when `problems` is not empty; only a valid preview can be saved
        problems:
          type: array
          items:
            $ref: '#/components/schemas/AllocationProblem'
        amount:
          $ref: '#/components/schemas/Money'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentPartProposal'
        split:
          $ref: '#/components/schemas/PaymentSplitPreview'
        digest:
          type: string
          description: >-
            Send it back with the save to refuse it when the open charges or the lines changed since; absent in a
            preview with problems
        payments:
          type: array
          items:
            $ref: '#/components/schemas/SavedPayment'

    PaymentPayer:
      type: object
      description: The member who paid
      required: [memberId, shortName]
      properties:
        memberId:
          type: string
          format: uuid
        shortName:
          type: string
          description: Last and first name (personal data)

    PaymentSummary:
      type: object
      description: One payment of the list
      required:
        [
          id,
          groupId,
          plotId,
          plotNumber,
          source,
          amount,
          receivedOn,
          billingMonth,
          allocated,
          prepayment,
          reversed,
        ]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        groupSize:
          type: integer
          format: int32
          description: >-
            The number of payments in the group (the parts of a split payment, reversed ones included); 1 for a
            payment of one plot
        receiptNumber:
          type: integer
          format: int64
        bankReference:
          type: string
        receivedOn:
          type: string
          format: date
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
        payer:
          $ref: '#/components/schemas/PaymentPayer'
        source:
          $ref: '#/components/schemas/PaymentSource'
        amount:
          $ref: '#/components/schemas/Money'
        allocated:
          $ref: '#/components/schemas/Money'
          description: What the payment pays on charges now (allocations minus releases)
        prepayment:
          $ref: '#/components/schemas/Money'
          description: What is left of the payment on no charge; `0.00` once reversed
        reversed:
          type: boolean

    PaymentPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    PaymentAllocation:
      type: object
      description: >-
        One allocation of the payment (positive `amount`, with its `origin`) or one release (negative `amount`, with
        its `releaseCause` and the allocation it takes back)
      required: [id, chargeId, chargeType, serviceFrom, serviceTo, accruedOn, amount, system, createdAt]
      properties:
        id:
          type: string
          format: uuid
        chargeId:
          type: string
          format: uuid
        chargeType:
          $ref: '#/components/schemas/ChargeTypeRef'
        serviceFrom:
          type: string
          format: date
        serviceTo:
          type: string
          format: date
        accruedOn:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        origin:
          $ref: '#/components/schemas/AllocationOrigin'
        releaseCause:
          $ref: '#/components/schemas/AllocationReleaseCause'
        releasesAllocationId:
          type: string
          format: uuid
        system:
          type: boolean
          description: True when the system wrote the row (an automatic allocation or release), not a member
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: >-
            The current name of the member who wrote the row; absent for a row of the system. Given on the payment
            card only

    PaymentGroupPart:
      type: object
      description: Another part of the same payment group (a payment split over several plots of one payer)
      required: [id, plotId, plotNumber, amount, reversed]
      properties:
        id:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        reversed:
          type: boolean

    PaymentReversalInfo:
      type: object
      description: The reversal of a payment
      required: [id, reason, billingMonth, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
          description: User content
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string

    PaymentDetails:
      type: object
      description: A payment with its allocations, its group and its reversal
      required:
        [
          id,
          groupId,
          plotId,
          plotNumber,
          source,
          amount,
          receivedOn,
          billingMonth,
          allocated,
          prepayment,
          reversed,
          currentAllocations,
          allocations,
          groupParts,
          createdAt,
          reversible,
          reallocatable,
          prepaymentAllocatable,
        ]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
        source:
          $ref: '#/components/schemas/PaymentSource'
        amount:
          $ref: '#/components/schemas/Money'
        receivedOn:
          type: string
          format: date
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        receiptNumber:
          type: integer
          format: int64
        bankReference:
          type: string
        payer:
          $ref: '#/components/schemas/PaymentPayer'
        payerNote:
          type: string
          description: The payer note (personal data); only for callers who may view members
        allocated:
          $ref: '#/components/schemas/Money'
        prepayment:
          $ref: '#/components/schemas/Money'
          description: What is left of the payment on no charge; `0.00` once reversed
        reversed:
          type: boolean
        reversedBy:
          $ref: '#/components/schemas/PaymentReversalInfo'
        currentAllocations:
          type: array
          description: >-
            Where the payment's money is now: per charge the net of its allocations and releases, only charges with
            more than `0.00`, in the order of the proposal (oldest debt date first); empty once reversed
          items:
            $ref: '#/components/schemas/PaymentChargeAmount'
        allocations:
          type: array
          description: The history of the allocation, every allocation and release, oldest first
          items:
            $ref: '#/components/schemas/PaymentAllocation'
        groupParts:
          type: array
          description: The other parts of the payment's group; empty for a payment of one plot
          items:
            $ref: '#/components/schemas/PaymentGroupPart'
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: The current name of the member who entered the payment; absent when unknown
        reversible:
          type: boolean
          description: True when the caller may reverse the payment now (`PAYMENTS_REVERSE`, the payment not reversed)
        reallocatable:
          type: boolean
          description: True when the caller may reallocate the payment now (`PAYMENTS_ENTER`, the payment not reversed)
        prepaymentAllocatable:
          type: boolean
          description: >-
            True when the caller may allocate the prepayment of the payment's plot by hand now: `PAYMENTS_ENTER`,
            automatic allocation off, the plot has a prepayment above `0.00` and an open charge

    PaymentChargeAmount:
      type: object
      description: What a payment pays on one charge now (its allocations to the charge minus their releases)
      required: [chargeId, kind, chargeType, billingMonth, serviceFrom, serviceTo, accruedOn, amount]
      properties:
        chargeId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChargeKind'
        chargeType:
          $ref: '#/components/schemas/ChargeTypeRef'
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the charge is booked in, `YYYY-MM`
        serviceFrom:
          type: string
          format: date
        serviceTo:
          type: string
          format: date
        accruedOn:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'

    PaymentReversal:
      type: object
      description: Why a payment is reversed
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: User content, stored as typed; surrounding whitespace is trimmed

    AllocationLinesRequest:
      type: object
      description: >-
        The caller's allocation for a reallocation of a payment or an allocation of a plot's prepayment, and the digest
        of the preview the caller saw
      properties:
        lines:
          type: [array, 'null']
          maxItems: 1000
          description: >-
            The caller's allocation, each open charge of the plot at most once; absent (or null) uses the proposal
          items:
            $ref: '#/components/schemas/PaymentLineInput'
        digest:
          type: string
          maxLength: 64
          description: The `digest` of the preview the caller saw; optional

    PaymentCurrentAllocation:
      type: object
      description: What one allocation of the payment places on its charge now (the allocation minus its releases)
      required:
        [allocationId, chargeId, kind, chargeType, billingMonth, serviceFrom, serviceTo, accruedOn, amount]
      properties:
        allocationId:
          type: string
          format: uuid
        chargeId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChargeKind'
        chargeType:
          $ref: '#/components/schemas/ChargeTypeRef'
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the charge is booked in, `YYYY-MM`
        serviceFrom:
          type: string
          format: date
        serviceTo:
          type: string
          format: date
        accruedOn:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'

    PaymentReallocationResult:
      type: object
      description: >-
        A reallocation of a payment: what the payment places on charges before it (`current`), the new allocation over
        the plot's open charges as if `current` were taken back (`proposal`, its `amount` the payment's amount) and the
        digest
      required: [preview, valid, problems, paymentId, current, proposal]
      properties:
        preview:
          type: boolean
        valid:
          type: boolean
          description: False when `problems` is not empty; only a valid preview can be saved
        problems:
          type: array
          items:
            $ref: '#/components/schemas/AllocationProblem'
        paymentId:
          type: string
          format: uuid
        current:
          type: array
          items:
            $ref: '#/components/schemas/PaymentCurrentAllocation'
        proposal:
          $ref: '#/components/schemas/PaymentPartProposal'
        digest:
          type: string
          description: >-
            Send it back with the save to refuse it when the payment, the open charges or the lines changed since;
            absent in a preview with problems

    PrepaymentAllocationResult:
      type: object
      description: >-
        An allocation of a plot's prepayment: the proposal over the plot's open charges (its `amount` the prepayment,
        its `prepayment` what stays) and the digest
      required: [preview, valid, problems, proposal]
      properties:
        preview:
          type: boolean
        valid:
          type: boolean
          description: False when `problems` is not empty; only a valid preview can be saved
        problems:
          type: array
          items:
            $ref: '#/components/schemas/AllocationProblem'
        proposal:
          $ref: '#/components/schemas/PaymentPartProposal'
        digest:
          type: string
          description: >-
            Send it back with the save to refuse it when the prepayment or the open charges changed since; absent in a
            preview with problems

    ReportCode:
      type: string
      description: >-
        A built-in report. `charges-by-month`: what was charged per billing month and charge type and what is paid on it,
        with a second sheet by service period. `plot-balances`: charged, paid, debt and prepayment of every active plot
        per charge type on a day, without names.
        `debtors`: the plots over the red amount or older than the red days, with the owners' names and contacts
        (also needs `MEMBERS_VIEW`). `electricity-tree`: electricity from the substation down to the plots, with a
        consumption sheet and a charged sheet. `water`: water use and water charges of the connected plots.
        `missing-readings`: active meters without an approved reading in a range. `land-tax`: the expected and the
        charged land tax per plot for a year. `corrections`: every reversal and adjustment booked in a range of
        billing months. `payments`: the payments of a range of billing months or of days, one row per payment, with
        totals per source (also needs `PAYMENTS_VIEW`; the payer note only with `MEMBERS_VIEW`).
      enum:
        - charges-by-month
        - plot-balances
        - debtors
        - electricity-tree
        - water
        - missing-readings
        - land-tax
        - corrections
        - payments

    ReportFilterType:
      type: string
      description: >-
        What a filter asks for and the query parameters it fills. `MONTH_RANGE`: billing months `fromMonth` and
        `toMonth`. `DATE_RANGE`: days `from` and `to`. `DATE`: one day `asOf`. `YEAR`: `year`. `MONEY`: an amount
        (`minDebt`). `INT`: a whole number (`olderThanDays`). `CHARGE_TYPES`: charge types `chargeTypeIds`, several.
        `STREET`: one street `street`. `STATUS`: status colours `statuses`, several. `RESOURCE`: `resource`.
        `METER_KIND`: meter kinds `meterKinds`, several. `WATER_SOURCE`: the kind of water source `waterSource`.
        `CORRECTION_KIND`: `correctionKinds`, several. `SOURCE`: the source of a payment `source`.
      enum:
        - MONTH_RANGE
        - DATE_RANGE
        - DATE
        - YEAR
        - MONEY
        - INT
        - CHARGE_TYPES
        - STREET
        - STATUS
        - RESOURCE
        - METER_KIND
        - WATER_SOURCE
        - CORRECTION_KIND
        - SOURCE

    ReportFilterParam:
      type: string
      description: A query parameter of `getReport` and `downloadReport` that a filter fills
      enum:
        - fromMonth
        - toMonth
        - from
        - to
        - asOf
        - year
        - chargeTypeIds
        - street
        - statuses
        - minDebt
        - olderThanDays
        - resource
        - meterKinds
        - waterSource
        - correctionKinds
        - source

    ReportPeriodBasis:
      type: string
      description: >-
        What the period of a report means; the filter label says so. `BILLING_MONTHS`: the billing months the entries
        were booked in. `SERVICE_DAYS`: the days a service was provided (the service period of a charge).
        `READING_DATES`: the dates of meter readings. `PAYMENT_DATES`: the days payments were received.
      enum: [BILLING_MONTHS, SERVICE_DAYS, READING_DATES, PAYMENT_DATES]

    ReportCorrectionKind:
      type: string
      description: A kind of correction in the ledger, `REVERSAL` or `ADJUSTMENT`
      enum: [REVERSAL, ADJUSTMENT]

    ReportFilterValue:
      type: object
      description: >-
        One value of a filter parameter as the query string carries it; a filter of several values (charge types,
        statuses, meter kinds, correction kinds) has one entry per value
      required: [param, value]
      properties:
        param:
          $ref: '#/components/schemas/ReportFilterParam'
        value:
          type: string
          maxLength: 100

    ReportFilter:
      type: object
      description: One filter of a report
      required: [key, type, params, required, defaults]
      properties:
        key:
          type: string
          pattern: '^[a-z][A-Za-z]*$'
          description: >-
            Names the filter in the client's catalogs: `period`, `received`, `asOf`, `year`, `chargeTypes`, `street`,
            `statuses`, `minDebt`, `olderThanDays`, `resource`, `meterKinds`, `waterSource`, `correctionKinds` or
            `source`
        type:
          $ref: '#/components/schemas/ReportFilterType'
        params:
          type: array
          description: The query parameters the filter fills, in order (`fromMonth`, `toMonth` for a month range)
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/ReportFilterParam'
        required:
          type: boolean
          description: True when the report cannot run without the filter; a required filter always has defaults
        defaults:
          type: array
          description: The values the filter starts with; empty when it starts empty (meaning all)
          items:
            $ref: '#/components/schemas/ReportFilterValue'
        basis:
          $ref: '#/components/schemas/ReportPeriodBasis'

    ReportInfo:
      type: object
      description: A report the caller may run
      required: [code, personalData, filters]
      properties:
        code:
          $ref: '#/components/schemas/ReportCode'
        personalData:
          type: boolean
          description: True when the report holds names of people (`debtors` with their contacts, `payments`)
        filters:
          type: array
          description: The filters in the order the form shows them; the period comes first
          items:
            $ref: '#/components/schemas/ReportFilter'

    ReportColumnType:
      type: string
      description: >-
        How the values of a column are written and shown. `TEXT`: as stored, for example a plot number or a name.
        `CODE`: an enum code the client shows from its catalog for the column key. `CHARGE_TYPE`: the id of one of the
        report's `chargeTypes`. `MONEY`: an amount with two decimals (`"1250.50"`). `QUANTITY`: kWh or m³ with three
        decimals (`"152.400"`). `PERCENT`: a percentage with two decimals (`"4.75"`). `INTEGER`: a whole number.
        `DATE`: an ISO day. `MONTH`: a month `YYYY-MM`. `BOOLEAN`: `true` or `false`. `DECIMAL`: an exact number that
        is not money, with at most four decimals, never rounded, for example a tariff rate (`"35.0000"`) or an area in
        m² (`"600.00"`) or in sotkas (`"6.1235"`); shown with its significant decimals, at least two.
      enum: [TEXT, CODE, CHARGE_TYPE, MONEY, QUANTITY, PERCENT, INTEGER, DATE, MONTH, BOOLEAN, DECIMAL]

    ReportColumn:
      type: object
      description: >-
        A column of a sheet. The client shows the header from its catalog by the report code, the sheet key and the
        column key; a column per charge type shows the charge type's name
      required: [key, type]
      properties:
        key:
          type: string
          pattern: '^[a-z][A-Za-z0-9]*(\.[A-Za-z0-9-]+)?$'
          description: >-
            Stable within the report, for example `month`, `effective` or, for a column per charge type,
            `<family>.<chargeTypeId>` with the family `charged`, `paid` or `debt` (the client heads it with the charge
            type's name and the family)
        type:
          $ref: '#/components/schemas/ReportColumnType'
        chargeTypeId:
          type: string
          format: uuid
          description: Set on a column per charge type; one of the report's `chargeTypes`

    ReportCellReason:
      type: string
      description: >-
        Why a cell has no value. `NO_READING`: there is no counted reading at or around the day, so the meter value is
        not known. `DERIVED_FROM_UNKNOWN`: the value is worked out from a value that is not known. `SEVERAL_RATES`: the
        days of the charge were priced at more than one rate, so there is no single price per unit (the amount is
        exact).
      enum: [NO_READING, DERIVED_FROM_UNKNOWN, SEVERAL_RATES]

    ReportCell:
      type: object
      description: >-
        One cell. `value` is absent when the cell is empty; an empty cell with a `reason` is a value that is not
        known, which is never shown as `0`
      properties:
        value:
          type: string
          description: The value formatted by the column type
        reason:
          $ref: '#/components/schemas/ReportCellReason'

    ReportRowKind:
      type: string
      description: '`DETAIL` a row of the report; `SUBTOTAL` the totals of the group above it, for example of a month'
      enum: [DETAIL, SUBTOTAL]

    ReportRow:
      type: object
      required: [kind, level, cells]
      properties:
        kind:
          $ref: '#/components/schemas/ReportRowKind'
        level:
          type: integer
          format: int32
          minimum: 0
          description: The depth in a tree report (0 for a root and in every report without a tree), shown as an indent
        cells:
          type: array
          description: One cell per column, in the order of the columns
          items:
            $ref: '#/components/schemas/ReportCell'

    ReportTotal:
      type: object
      description: A totals line over all rows of a sheet, not only the rows of the preview
      required: [key, cells]
      properties:
        key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]*$'
          description: >-
            Names the line in the client's catalogs: `all` for the whole report, a code for a part of it, for example
            the charge source `CONSUMPTION` or `LOSSES`
        cells:
          type: array
          description: One cell per column, in the order of the columns; columns without a total are empty
          items:
            $ref: '#/components/schemas/ReportCell'

    ReportSheet:
      type: object
      description: >-
        One sheet of a report; the file has one worksheet per sheet. `charges-by-month` has `byBillingMonth` and
        `byServicePeriod`, `electricity-tree` has `consumption` and `charged`, `water` has `main` (per plot and
        source) and `summary` (per source); a report with one sheet calls it `main`
      required: [key, columns, rows, totals, rowCount, truncated]
      properties:
        key:
          type: string
          pattern: '^[a-z][A-Za-z]*$'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ReportColumn'
        rows:
          type: array
          description: The first 200 rows
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReportRow'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/ReportTotal'
        rowCount:
          type: integer
          format: int32
          minimum: 0
          description: The number of rows of the sheet in all, at most 20 000; the file holds every one
        truncated:
          type: boolean
          description: True when `rowCount` is more than the rows of the preview

    ReportNoteCode:
      type: string
      description: >-
        A sentence of the report header. `SERVICE_PERIOD_SHEET`: the second sheet groups the charges by the month of
        the service, so an adjustment booked later shows under the month it is for. `PAST_DATE_STATUS`: for a past day
        the status is worked out as of that day with today's thresholds. `STATUS_ALL_CHARGE_TYPES`: with a charge type
        filter, today's status still counts every charge type. `OLDEST_UNPAID_IS_OLDEST_CHARGE`: the oldest unpaid
        charge is the oldest charge that still has a debt after what payments pay on it. `LOSSES_FIXED_PERCENT`: the cooperative charges losses
        now as a fixed percentage of each interval (param `percent`, two decimals); `LOSSES_PROPORTIONAL`: it charges
        losses now by proportional runs; with either, a charge or a run booked under another mode shows what it booked.
        `RECALCULATION_SUGGESTED`: some rows differ from the expected amount and a recalculation may be due (param
        `count`). `OPEN_NOT_CHARGED`: open "not charged" items exist for the listed meters (param `count`).
      enum:
        - SERVICE_PERIOD_SHEET
        - PAST_DATE_STATUS
        - STATUS_ALL_CHARGE_TYPES
        - OLDEST_UNPAID_IS_OLDEST_CHARGE
        - LOSSES_FIXED_PERCENT
        - LOSSES_PROPORTIONAL
        - RECALCULATION_SUGGESTED
        - OPEN_NOT_CHARGED

    ReportNote:
      type: object
      required: [code, params]
      properties:
        code:
          $ref: '#/components/schemas/ReportNoteCode'
        params:
          type: object
          description: Parameters of the sentence as codes, numbers and dates, never display text
          additionalProperties:
            type: string

    ReportPreview:
      type: object
      description: The on-screen preview of a report
      required: [code, generatedAt, filters, headerNotes, chargeTypes, sheets]
      properties:
        code:
          $ref: '#/components/schemas/ReportCode'
        generatedAt:
          type: string
          format: date-time
        filters:
          type: array
          description: The filter values the report used, defaults filled in
          items:
            $ref: '#/components/schemas/ReportFilterValue'
        headerNotes:
          type: array
          items:
            $ref: '#/components/schemas/ReportNote'
        chargeTypes:
          type: array
          description: >-
            The charge types the report refers to, in their configured order: a `CHARGE_TYPE` cell and a column with
            `chargeTypeId` name one of them by id
          items:
            $ref: '#/components/schemas/ChargeTypeRef'
        sheets:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/ReportSheet'

    ReportTemplateSlot:
      type: string
      description: >-
        A fixed place of the app that a template fills. The only one is the tax report slot, which every cooperative
        has; its official form is uploaded into it like any other template.
      enum: [TAX]

    ReportTemplateStatus:
      type: string
      description: >-
        `ACTIVE`: the template can be generated from and takes new versions. `ARCHIVED`: hidden from generation, its
        versions stay downloadable. `NOT_ADDED`: only the tax report slot while no active template is in it.
      enum: [ACTIVE, ARCHIVED, NOT_ADDED]

    ReportTemplate:
      type: object
      description: >-
        A template of the cooperative, or the empty tax report slot (`status` `NOT_ADDED`, which has neither `id`,
        `name`, `description` nor `latestVersion`, and `versionCount` 0)
      required: [status, versionCount]
      properties:
        id:
          type: string
          format: uuid
          description: Absent only for the empty tax report slot
        slot:
          $ref: '#/components/schemas/ReportTemplateSlot'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: As the chairman entered it; absent only for the empty tax report slot
        description:
          type: string
          maxLength: 500
          description: As the chairman entered it; absent when there is none
        status:
          $ref: '#/components/schemas/ReportTemplateStatus'
        latestVersion:
          $ref: '#/components/schemas/ReportTemplateVersion'
        versionCount:
          type: integer
          format: int32
          minimum: 0

    ReportTemplateVersion:
      type: object
      description: One uploaded file of a template; versions are never changed or deleted
      required: [id, versionNo, fileName, sizeBytes, sha256, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
          format: int32
          minimum: 1
          description: 1 for the first upload, then one more for each new file
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Base name of the uploaded file, sanitised
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 2097152
          description: Size of the stored file in bytes
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 digest of the stored file, lower-case hex
        uploadedAt:
          type: string
          format: date-time
        uploadedByName:
          type: string
          description: >-
            The current name of the member who uploaded the file; absent when the member no longer exists

    ReportTemplateWarningCode:
      type: string
      description: >-
        What the app changed in or could not fill from a template; a warning never stops an upload or a generation.
        `EXTERNAL_LINKS_REMOVED`: the file linked to other workbooks or had data connections; they were removed from the
        stored file (the only warning of an upload). The others come with a generated file:
        `UNKNOWN_PLACEHOLDER`: the app does not know the placeholder (not in the catalog, or a charge type the
        cooperative does not have); it was left in the cell as written. `VALUE_UNKNOWN`: the placeholder is known but
        its value is not (a meter value without a reading, a requisite that is not set); the cell was left empty,
        never `0`. `RICH_TEXT_FLATTENED`: a cell with a placeholder had text in several formats; it was written as
        plain text. `CHART_REFS_NOT_SHIFTED`: a chart refers to a sheet whose rows were repeated; its references were
        not moved
      enum:
        - EXTERNAL_LINKS_REMOVED
        - UNKNOWN_PLACEHOLDER
        - VALUE_UNKNOWN
        - RICH_TEXT_FLATTENED
        - CHART_REFS_NOT_SHIFTED

    ReportTemplateValueReason:
      type: string
      description: >-
        Why a known placeholder has no value (`VALUE_UNKNOWN`). `NO_READING`, `DERIVED_FROM_UNKNOWN` and
        `SEVERAL_RATES` as in `ReportCellReason` (a land tax rate of a plot that two rates charged in the year is
        `SEVERAL_RATES`). `NOT_SET`: a requisite of the cooperative (official name, legal address, bank, IBAN,
        ЄДРПОУ) is not entered
      enum: [NO_READING, DERIVED_FROM_UNKNOWN, SEVERAL_RATES, NOT_SET]

    ReportTemplateWarning:
      type: object
      description: >-
        One warning of a generated file, as the header `X-Report-Warnings-Detail` carries it. The sheet name and the
        placeholder are as written in the template
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/ReportTemplateWarningCode'
        sheet:
          type: string
          description: The sheet of the template; absent for a warning about the whole file
        cell:
          type: string
          description: The cell in A1 notation in the generated file (`B7`); absent for a warning about the whole file
        placeholder:
          type: string
          description: The placeholder key without `${` and `}`
        reason:
          $ref: '#/components/schemas/ReportTemplateValueReason'

    ReportTemplateFieldType:
      type: string
      description: >-
        The value of a placeholder. `TEXT`: text (codes such as a status are written in the file's language).
        `NUMBER`: an exact number that is not money, for example an area or a rate. `MONEY`: an amount with two
        decimals. `QUANTITY`: kWh or m³ with three decimals. `INT`: a whole number. `DATE`: a day. `MONTH`: a month
        (alone in a cell, the date of its first day). `DATE_TIME`: a day and time in Europe/Kyiv
      enum: [TEXT, NUMBER, MONEY, QUANTITY, INT, DATE, MONTH, DATE_TIME]

    ReportTemplateRowSet:
      type: string
      description: >-
        The rows a template row repeats over. `PLOTS`: the active plots with their balances and land tax. `MONTHS`:
        the billing months with charges. `METERS`: the nodes of the electricity meter tree. `WATER`: the plots
        connected to water, one row per plot and source. `PAYMENTS`: the payments received in the period, one row per
        payment, without the payer and the payer note (needs `PAYMENTS_VIEW`)
      enum: [PLOTS, MONTHS, METERS, WATER, PAYMENTS]

    ReportTemplateField:
      type: object
      description: One placeholder of the field catalog
      required: [key, field, type, permission]
      properties:
        key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.\-]*$'
          description: What to write in the template between `${` and `}`, for example `totals.debt`
        field:
          type: string
          description: >-
            The description code: the description is `reportTemplates.fields.<field>` in the client's catalogs. The
            key itself for a fixed placeholder; for a placeholder of a charge type family the family's code,
            `totals.charged.byChargeType`, `totals.paid.byChargeType` or `rows.plots.debt.byChargeType`, whose text
            names the type (`{chargeType}`)
        pattern:
          type: string
          description: >-
            Only for a charge type family: the family's keys, `totals.charged.<type>`, `totals.paid.<type>` or
            `rows.plots.debt.<type>` (`<type>` the code of a seeded type or the id of a custom type)
        chargeTypeId:
          type: string
          format: uuid
          description: Only for a charge type family, the charge type of this entry
        type:
          $ref: '#/components/schemas/ReportTemplateFieldType'
        rowSet:
          $ref: '#/components/schemas/ReportTemplateRowSet'
        example:
          type: string
          description: >-
            A language-neutral example of the value as the API writes values (`"1250.50"`, `"2026-01-31"`,
            `"152.400"`); absent for text that depends on the language or on what the cooperative entered
        permission:
          $ref: '#/components/schemas/Permission'

    ReportTemplateGenerateRequest:
      type: object
      description: The period to fill a template for, both days included, in Europe/Kyiv
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        lang:
          type: string
          enum: [uk, en]
          description: >-
            Language of the file's texts, `uk` or `en`. Without it the `Accept-Language` header decides, then `uk`

    ReportTemplateUploadResult:
      type: object
      description: >-
        A stored upload: the template with the new file as its `latestVersion`, and what was changed in the file
      required: [template, warnings]
      properties:
        template:
          $ref: '#/components/schemas/ReportTemplate'
        warnings:
          type: array
          description: What was changed in the stored file; an upload lists only `EXTERNAL_LINKS_REMOVED`
          items:
            $ref: '#/components/schemas/ReportTemplateWarningCode'
