          description: The annulled certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
