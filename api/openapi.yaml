  /plots/{id}/certificates:
    post:
      tags: [certificates]
      operationId: issuePlotCertificate
      summary: Issue a debt certificate of a plot as of a date
      description: |
        Issues the debt certificate of one plot (feature 016 §2.7) and stores it in the register. The figures are those
        of the plot balances report for the same day (`LedgerReadModel.debtsAsOf`, every charge type): the debt per
        charge type, the total debt and the prepayment. The certificate also keeps the cooperative's requisites, the
        plot, its area, its current owners with their shares, and the issuing user's name and role (the names are
        sealed). The number is `Д-{YYYY}-{N}`: `YYYY` the year of the issue in Europe/Kyiv, `N` the next number of the
        cooperative in that year, gap-free and never reused (taken in the issuing transaction, so a failed issue uses
        no number). An issued certificate never changes; a mistake is answered with a new certificate and the old one
        is annulled. Written to the audit log as `CERTIFICATE_ISSUED`.

        `asOf` defaults to today in Europe/Kyiv; a day after today is 400 `VALIDATION_FAILED` with
        `errors[{field: asOf, code: INVALID}]`. 404 `PLOT_NOT_FOUND` for an unknown plot or one of another
        cooperative; 409 `PLOT_COMMON_LAND` for common land and 409 `PLOT_ARCHIVED` for an archived plot (the plot
        balances report lists neither); 409 `REQUISITES_MISSING` with `missing` (`IBAN`, `EDRPOU`) as for invoices.
        A plot without a current owner gets a certificate without owners. Requires `CERTIFICATES_ISSUE`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCertificateRequest'
      responses:
        '201':
          description: The issued certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

