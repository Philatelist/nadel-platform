openapi: 3.1.0
info:
  title: Nadel API
  version: 0.1.0
  description: |
    API of the payment accounting platform for dacha cooperatives.
    Every endpoint requires a Keycloak bearer token. The cooperative is taken from the `tenant_id` claim
    in the token and is never passed in a request.
    Money amounts are strings with two decimal places, for example "1250.50".
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: me
    description: Current user
  - name: members
    description: Cooperative members (people), their contacts and roles
  - name: permissions
    description: The fixed list of permissions
  - name: roles
    description: Roles of the cooperative and their permissions
  - name: audit
    description: Audit log of administrative changes
  - name: plots
    description: Plots and map
  - name: ownerships
    description: Owners of plots, their shares and history
  - name: settings
    description: Cooperative settings
  - name: imports
    description: Excel import of plots, members and ownership
  - name: charge-types
    description: Charge types (what the cooperative charges for)
  - name: tariffs
    description: Tariffs with dated versions (how much the cooperative charges)
  - name: meters
    description: The register of electricity and water meters
  - name: readings
    description: Meter readings, the reading round and the consumption between readings
  - name: meter-tree
    description: The electricity meter tree, its dated history and the consumption per node over a date range
  - name: charges
    description: The ledger of a plot (its account), reversals of charges and opening balances
  - name: billing
    description: Billing months, their totals, the closing check list, the month run and closing
  - name: not-charged
    description: The "not charged" queue (what the app could not charge, with the reason) and its retry

paths:
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user, roles and cooperative
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: List members
      description: |
        Returns a page of members of the current cooperative. Requires the `MEMBERS_VIEW` permission.
        `q` is a case-insensitive substring match against the last, first and middle name and the email, or,
        when it looks like a phone number (only digits, spaces and + ( ) - ., with at least three digits), against the digits of the phone numbers. Archived members are excluded unless
        `includeArchived` is true. The result is sorted by last name, then first name.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [members]
      operationId: createMember
      summary: Create a member
      description: |
        Creates a member in the current cooperative. Requires the `MEMBERS_EDIT` permission.
        A caller without `MEMBERS_VIEW` cannot set `notes`; the field is ignored.
        A new member has no roles. The email must be unique within the cooperative (409 `EMAIL_TAKEN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created member
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /members/{id}:
    get:
      tags: [members]
      operationId: getMember
      summary: Member card
      description: |
        Returns one member of the current cooperative.
        A caller without the `MEMBERS_VIEW` permission can read only their own card; for any other id the
        answer is 404, exactly as for an id that does not exist. The `notes` field is present only when the
        caller has `MEMBERS_VIEW`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [members]
      operationId: updateMember
      summary: Update a member
      description: |
        Replaces all editable fields of the member (full replacement; fields absent from the body are cleared).
        Roles are not part of `MemberInput`; they change through the role assignment endpoint.
        Requires the `MEMBERS_EDIT` permission. A caller without `MEMBERS_VIEW` cannot change `notes`;
        the field is ignored and the stored value is kept.
        The email must be unique within the cooperative (409 `EMAIL_TAKEN`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /members/{id}/archive:
    post:
      tags: [members]
      operationId: archiveMember
      summary: Archive a member
      description: |
        Moves the member to the archive; the member keeps their history but is hidden from the default list and
        can no longer sign in. Archiving an already archived member is a no-op. Requires `MEMBERS_EDIT`.
        The last active chairman cannot be archived (409 `LAST_CHAIRMAN`), and neither can a member who currently
        owns a plot (409 `MEMBER_OWNS_PLOT`): change the owner of the plot first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /members/{id}/restore:
    post:
      tags: [members]
      operationId: restoreMember
      summary: Restore a member from the archive
      description: |
        Returns an archived member to the active list. Restoring an active member is a no-op.
        Requires `MEMBERS_EDIT`. The member's email must still be unique among members (409 `EMAIL_TAKEN`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /members/{id}/roles:
    put:
      tags: [members]
      operationId: setMemberRoles
      summary: Set the roles of a member
      description: |
        Replaces the whole set of roles of the member with `roleIds` (an empty list leaves the member with no
        roles). Every id must be a role of the current cooperative (otherwise 404). Requires `ROLES_MANAGE`.
        The change is written to the audit log. A change that would leave the cooperative without an active
        chairman is refused (409 `LAST_CHAIRMAN`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRolesInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /members/{id}/ownerships:
    get:
      tags: [ownerships]
      operationId: listMemberOwnerships
      summary: Plots of a member
      description: |
        Returns the plots the member owns now (`current`, ordered by plot number in natural order) and the plots they
        owned in the past (`past`, the most recently ended first). Allowed with `PLOTS_VIEW` or `MEMBERS_VIEW`, and
        for a member asking about themself; for anyone else, and for an id that does not exist or belongs to another
        cooperative, the answer is 404, so the existence of a member is not revealed. The platform operator gets 403.
        A member without plots gets two empty lists.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberOwnerships'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /permissions:
    get:
      tags: [permissions]
      operationId: listPermissions
      summary: List the permissions
      description: |
        Returns the fixed list of permissions a role can contain, each with an English name and description.
        The web client localises the text by `code`. Requires `ROLES_MANAGE`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List the roles of the cooperative
      description: |
        Returns every role of the current cooperative with its permissions and the number of active members who
        hold it. Base roles come first (Chairman, Treasurer, Member), then custom roles sorted by name.
        Requires `ROLES_MANAGE`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [roles]
      operationId: createRole
      summary: Create a custom role
      description: |
        Creates a custom role (no `baseCode`). The name must be unique within the cooperative, ignoring upper and
        lower case (409 `ROLE_NAME_TAKEN`). Requires `ROLES_MANAGE`. The change is written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /roles/{id}:
    put:
      tags: [roles]
      operationId: updateRole
      summary: Update a role
      description: |
        Replaces the name, description and permissions of the role. Requires `ROLES_MANAGE`; the change is
        written to the audit log. Every role, base roles included, can be renamed. The name must stay unique within
        the cooperative, ignoring upper and lower case (409 `ROLE_NAME_TAKEN`). With `useDefaultName: true` a base
        role gets its standard name back (the submitted `name` is ignored); that can also end in 409
        `ROLE_NAME_TAKEN` when another role already holds the standard name, and for a custom role it is a 400
        `VALIDATION_FAILED` on `useDefaultName`. With `useDefaultDescription: true` a base role gets its standard
        description back (the submitted `description` is ignored); for a custom role it is a 400 `VALIDATION_FAILED`
        on `useDefaultDescription`. Both restores can be combined in one request. The permissions of the Chairman
        role cannot be changed (409 `BASE_ROLE_IMMUTABLE`); the permissions of the Treasurer and Member roles can be
        edited. Renaming a role never changes what its holders may do.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [roles]
      operationId: deleteRole
      summary: Delete a custom role
      description: |
        Deletes a custom role. Requires `ROLES_MANAGE`; the deletion is written to the audit log. Base roles cannot
        be deleted (409 `BASE_ROLE_IMMUTABLE`). A role that is still given to a member cannot be deleted
        (409 `ROLE_IN_USE`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: List audit log entries
      description: |
        Returns a page of audit log entries of the current cooperative, newest first. Requires the `AUDIT_VIEW`
        permission (403 `PERMISSION_DENIED` otherwise). All filters are optional and combine with AND.
        `from` and `to` are calendar dates in the Europe/Kyiv time zone and both are inclusive: an entry is
        included when its local date is on or after `from` and on or before `to`. When both are given and
        `from` is after `to`, the answer is 400 `VALIDATION_FAILED`.
      parameters:
        - name: entityType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditEntityType'
        - name: entityId
          in: query
          required: false
          description: Only entries about this entity (a member or a role)
          schema:
            type: string
            format: uuid
        - name: actorMemberId
          in: query
          required: false
          description: Only entries made by this member
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: First day to include, in the Europe/Kyiv time zone
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last day to include, in the Europe/Kyiv time zone
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /plots:
    get:
      tags: [plots]
      operationId: listPlots
      summary: List plots
      description: |
        Returns a page of plots and common land of the current cooperative, sorted naturally by number
        (`2` before `10`, `12` before `12а`). Every member of the cooperative may call it; the platform operator
        has no cooperative data: 403.
        `q` is a case-insensitive substring match against the number and the street, and, for callers with
        `PLOTS_VIEW`, the cadastral number and the name (last, first or middle name) of a current owner of the plot.
        `status` is the displayed status (common land is always `GREY`).
        Archived plots are excluded unless `includeArchived` is true.
        A caller without `PLOTS_VIEW` sees only `id`, `number`, `kind`, `status`, `street` and `archived`: `areaM2`,
        `cadastralNumber`, `hasBuilding` and `owners` are absent, `q` does not match the cadastral number or
        owners' names, and `includeArchived` is ignored (archived plots are never listed).
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PlotKind'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PlotStatus'
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [plots]
      operationId: createPlot
      summary: Create a plot or common land
      description: |
        Creates a plot or common land in the current cooperative. Requires the `PLOTS_VIEW` and `PLOTS_EDIT` permissions
        (an editor must be able to see what they write). The new plot is active and has the status `GREY`.
        The number is trimmed and must be unique among the active plots of the cooperative, ignoring upper and lower
        case (409 `PLOT_NUMBER_TAKEN`, field `number`). The cadastral number, when given, must look like
        `1234567890:12:345:6789` (400 `CADASTRAL_INVALID`) and be unique in the cooperative, archived plots included
        (409 `CADASTRAL_NUMBER_TAKEN`, field `cadastralNumber`). The area of a plot must be greater than zero and
        that of common land may be zero, with at most two decimal places and at most eight integer digits
        (400 `AREA_INVALID`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlotInput'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created plot
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots/map:
    get:
      tags: [plots]
      operationId: getPlotMap
      summary: Cooperative plots as GeoJSON for the map
      description: |
        Returns all active plots and common land of the current cooperative with polygons and status. Archived plots
        are not included. The number, kind and status of every plot are visible to every member of the cooperative;
        `areaM2` and `debt` are present only for callers with `PLOTS_VIEW` (own plots join them later) and are omitted
        for everyone else. The platform operator has no cooperative data: 403.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotFeatureCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /plots/{id}:
    get:
      tags: [plots]
      operationId: getPlot
      summary: Plot card
      description: |
        Returns one plot or common land of the current cooperative. Every member of the cooperative may call it.
        A caller without `PLOTS_VIEW` gets only `id`, `number`, `kind`, `status`, `street` and `archived`, and the
        answer for an archived plot is 404. A plot of another cooperative is 404, exactly as for an id that does
        not exist.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [plots]
      operationId: updatePlot
      summary: Update a plot or common land
      description: |
        Replaces all editable fields of the plot (full replacement; optional fields absent from the body are
        cleared). Requires the `PLOTS_VIEW` and `PLOTS_EDIT` permissions, so that an editor never overwrites fields
        they cannot see. An archived plot can be edited too; its number is then not
        checked against the active plots, and restoring it checks the number again.
        The same rules apply as when creating: 409 `PLOT_NUMBER_TAKEN`, 409 `CADASTRAL_NUMBER_TAKEN`,
        400 `CADASTRAL_INVALID`, 400 `AREA_INVALID`. A plot that has ever had an owner cannot become common land
        (409 `PLOT_HAS_OWNERSHIP_HISTORY`, `errors[{field: kind}]`), and neither can a plot that has a meter, active
        or removed (409 `PLOT_HAS_METER`, `errors[{field: kind}]`). A change that alters nothing is accepted and not audited.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlotInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [plots]
      operationId: deletePlot
      summary: Delete a plot or common land
      description: |
        Removes a plot that was created by mistake, together with its status. Requires `PLOTS_VIEW` and `PLOTS_EDIT`. Only an active
        plot can be deleted; an archived plot is refused with 409 `PLOT_ARCHIVED` and must be restored first, and a plot
        that has ever had an owner is refused with 409 `PLOT_HAS_OWNERSHIP_HISTORY`, a plot that has a meter (active or
        removed) with 409 `PLOT_HAS_METER`, a plot that has charges (any kind) with 409 `PLOT_HAS_CHARGES`. The deletion
        is audited.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots/{id}/archive:
    post:
      tags: [plots]
      operationId: archivePlot
      summary: Archive a plot or common land
      description: |
        Moves the plot to the archive: it is hidden from the default list and its number becomes free for a new
        plot. Archiving an already archived plot is a no-op and is not audited. A plot that has a current owner cannot
        be archived (409 `PLOT_HAS_OWNERS`), nor can a plot with an active meter (409 `PLOT_HAS_METER`; remove the
        meter first). Requires `PLOTS_VIEW` and `PLOTS_EDIT`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots/{id}/restore:
    post:
      tags: [plots]
      operationId: restorePlot
      summary: Restore an archived plot or common land
      description: |
        Brings an archived plot back to the default list. The number is checked again: when another active plot has
        taken it meanwhile, the answer is 409 `PLOT_NUMBER_TAKEN`. Restoring an active plot is a no-op and is not
        audited. Requires `PLOTS_VIEW` and `PLOTS_EDIT`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots/{id}/ownerships:
    get:
      tags: [ownerships]
      operationId: listPlotOwnerships
      summary: Owners of a plot
      description: |
        Returns the current owners of the plot (the ones without an end date), ordered by member name, and its
        history of past owners, newest first (by start date). Allowed with `PLOTS_VIEW`, and for a member who owns
        the plot now (with the names, shares, dates and basis of its records); for anyone else, a former owner
        included, the answer is 404, exactly as for a plot that does not exist or belongs to another cooperative.
        The platform operator gets 403. Common land and a plot without owners return empty lists. The member name is
        "Last First" (no patronymic).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotOwnerships'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /plots/{id}/ownership-changes:
    post:
      tags: [ownerships]
      operationId: createOwnershipChange
      summary: Change the owners of a plot
      description: |
        Records a change of owner as one step: every current owner's period ends on the day before `effectiveFrom`
        and the listed owners start on `effectiveFrom`. An empty `owners` list ends ownership (the plot has no owner
        from that date). The shares of the new owners must add up to exactly one whole (`SHARES_NOT_ONE`). Shares are
        written as fractions and saved in lowest terms ("2/4" becomes "1/2"); a missing share is "1/1".

        `effectiveFrom` cannot be in the future (today is the Europe/Kyiv date) and must be later than the start date
        of every current owner and the end date of every past owner (`OWNERSHIP_DATE_INVALID`). A member may be listed
        once (`DUPLICATE_OWNER`, on the second row) and must be active (`MEMBER_ARCHIVED`). Common land has no owners
        (`PLOT_COMMON_LAND`) and an archived plot cannot change owners (`PLOT_ARCHIVED`). The plot status becomes
        GREEN when a plot gets its first owner and GREY when it loses its last one. The change is audited as one entry
        (`OWNERSHIP_CHANGED`) on the plot.

        Requires `PLOTS_VIEW` and `OWNERSHIP_EDIT`; the platform operator and everyone without them get 403. A plot that
        does not exist or belongs to another cooperative is 404. Invalid shares (`errors[{field: owners[i].share, code:
        SHARE_INVALID}]`) and members that do not exist in the cooperative (`errors[{field: owners[i].memberId, code:
        MEMBER_NOT_FOUND}]`) are 400 `VALIDATION_FAILED`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnershipChange'
      responses:
        '201':
          description: Created; the owners and the history of the plot after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotOwnerships'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ownerships/{id}/corrections:
    post:
      tags: [ownerships]
      operationId: createOwnershipCorrection
      summary: Correct an owner record
      description: |
        Fixes a mistake in one owner record (the target): the body is a full replacement of its member, share, dates
        and basis, and `reason` is required. `coOwnerShares` corrects the shares of other records of the same plot in
        the same step, so that "1/2 + 1/2" can become "2/3 + 1/3"; each id must belong to the same plot and differ
        from the target (otherwise 400, `errors[{field: coOwnerShares[i].ownershipId, code: OWNERSHIP_NOT_FOUND}]`).
        Records are never deleted; the old values stay in the audit log (`OWNERSHIP_CORRECTED`, one entry on the plot,
        with the owners before and after and the reason). A correction that changes nothing is accepted and not
        audited.

        The whole timeline of the plot after the correction must satisfy every rule: on every day with owners the
        shares add up to exactly one whole (`SHARES_NOT_ONE`, `errors[{field: share}]`; when moving the record's dates
        causes it, the error is on the date: a day the record newly covers while other owners cover it too is
        `OWNERSHIP_OVERLAP` on `validFrom` or `validTo`, a day the record no longer covers is `SHARES_NOT_ONE` on the
        moved date), the same member never owns the
        plot in overlapping periods (`OWNERSHIP_OVERLAP`, `errors[{field: validFrom}]` or `validTo`, whichever
        overlaps), no date is in the future and `validTo` is not before `validFrom` (`OWNERSHIP_DATE_INVALID`,
        `errors[{field: validFrom}]` or `validTo`). The member must be active (`MEMBER_ARCHIVED`,
        `errors[{field: memberId}]`) unless it is the record's own member, so a historical record of a member who was
        archived later can still be corrected; but such a record must keep an end date, so clearing `validTo` on a
        record of an archived member is refused (`MEMBER_ARCHIVED`, `errors[{field: validTo}]`). An archived plot cannot be corrected (`PLOT_ARCHIVED`). The plot
        status follows the current owners. Ending the only current owner's record makes the plot ownerless (GREY).

        Requires `PLOTS_VIEW` and `OWNERSHIP_EDIT`; the platform operator and everyone without them get 403. A record
        that does not exist or belongs to another cooperative is 404. A missing or blank `reason`
        (`errors[{field: reason, code: REQUIRED}]`), invalid shares (`errors[{field: share | coOwnerShares[i].share,
        code: SHARE_INVALID}]`) and an unknown member (`errors[{field: memberId, code: MEMBER_NOT_FOUND}]`) are 400
        `VALIDATION_FAILED`.
      parameters:
        - name: id
          in: path
          required: true
          description: The owner record to correct
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnershipCorrection'
      responses:
        '200':
          description: OK; the owners and the history of the plot after the correction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotOwnerships'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Cooperative settings
      description: |
        Returns the settings of the current cooperative. Every member of the cooperative may call it; the platform
        operator has no cooperative data: 403. A cooperative that never saved its settings has the defaults
        (`memberPlotStatusVisibility` `OWN_ONLY`, `lossesMode` `FIXED_PERCENT`, `lossesPercent` `0.00`,
        `commonConsumerDefaultSplit` `CONNECTED_PLOTS`, `redAmount` `1000.00`, `redDays` 90).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CooperativeSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [settings]
      operationId: updateSettings
      summary: Change cooperative settings
      description: |
        Changes the settings of the current cooperative. Requires the `SETTINGS_MANAGE` permission. Every field is
        optional: a field left out keeps its value, so each section of the settings page saves only its own fields.
        A change is written to the audit log (`SETTINGS_UPDATED`) with the old and the new value of every changed
        field; saving the current values changes nothing and writes no audit entry. 400 `VALIDATION_FAILED`:
        `redAmount` negative or with more than 12 integer digits (`INVALID`), `lossesPercent` above `100.00`
        (`INVALID`), `redDays` outside 0..36500, an unknown enum value or a malformed number. A change of the red
        threshold applies to every plot status shown from then on (the status is derived when it is read).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CooperativeSettingsUpdate'
      responses:
        '200':
          description: The saved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CooperativeSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /imports/template:
    get:
      tags: [imports]
      operationId: downloadImportTemplate
      summary: Download the import template
      description: |
        Returns the Excel template (`.xlsx`) with four sheets, one instruction row and one example row per sheet
        (both rows start with `#` and are ignored by the import). It comes in two languages. The Ukrainian template
        (`nadel-import-template-uk.xlsx`) has the sheets `Ділянки`, `Члени`, `Власність` and `Лічильники`, and
        everything a person reads is Ukrainian: headers, instructions, example row and value words (`ДІЛЯНКА`, `так`,
        `ЕЛЕКТРОЕНЕРГІЯ`). The English template (`nadel-import-template-en.xlsx`) has the sheets `Plots`, `Members`,
        `Ownership` and `Meters` with the canonical column names. The file name is always ASCII, in the `Content-Disposition` header.

        The language is the `lang` query parameter. Without it the best match of `uk` and `en` in the
        `Accept-Language` header is used (`uk-UA` is `uk`, `en-US` is `en`), and without a match (`de`, no header)
        the default `uk`. A `lang` other than `uk` and `en` is 400 `VALIDATION_FAILED`.

        An upload accepts both languages for sheet names, headers and value words, also mixed in one file.
        Requires the `IMPORT_RUN` permission; the platform operator has no cooperative data: 403.
      parameters:
        - name: lang
          in: query
          required: false
          description: >-
            Template language, `uk` or `en`. Without it the `Accept-Language` header decides, then `uk`.
          schema:
            type: string
            enum: [uk, en]
            pattern: '^(uk|en)$'
      responses:
        '200':
          description: The template workbook, sent as an attachment
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /imports:
    get:
      tags: [imports]
      operationId: listImports
      summary: List the import history
      description: |
        Returns a page of the uploads of the current cooperative, newest first (by upload time). Requires the
        `IMPORT_RUN` permission; the platform operator has no cooperative data: 403. Every upload is listed: a
        preview that was never committed, a file with problems, a stale one and a committed one. The stored rows of
        a preview (the plan, which holds personal data) are never returned.

        `status` is one of `PREVIEW` (checked without problems, can still be committed), `HAS_ERRORS` (checked with
        problems, cannot be committed), `COMMITTED`, `STALE` (the data of the cooperative changed after the preview
        and a commit was refused) and `EXPIRED`. `EXPIRED` is derived, not stored: it is a `PREVIEW` that was not
        committed within 30 minutes (compared with the current time in the Europe/Kyiv zone).
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [imports]
      operationId: uploadImport
      summary: Upload an import file and get its preview
      description: |
        Parses and checks an Excel workbook (`.xlsx`, at most 10 MB, at most 2,000 plots, 3,000 members, 6,000 ownership
        rows and 2,000 meter rows) and
        returns a preview. Nothing is saved except the record of the upload itself. The preview can be committed for
        30 minutes (`expiresAt`) when `committable` is true, that is when there are no problems and something would be
        created or updated. Requires the `IMPORT_RUN` permission; the platform operator has no cooperative data: 403.

        All four sheets are checked. The `Members`, `Ownership` and `Meters` sheets may be missing (a file may hold
        plots only, or plots and members); the `Plots` sheet is required.
        Rows whose first cell starts with `#` and empty rows are skipped. `problems` lists at most 1,000 problems
        (`problemCount` is the total) in sheet and row order. `row` is the Excel row number (1 is the header row);
        0 means the problem is about the file or the whole sheet. `column` is the canonical column key
        (Plots: `number`, `street`, `kind`, `area_m2`, `area_sotky`, `cadastral_number`, `has_building`, `notes`;
        Members: `external_id`, `last_name`, `first_name`, `middle_name`, `phones`, `email`, `postal_address`,
        `delivery_channel`, `telegram_username`, `viber_phone`;
        Ownership: `plot_number`, `member_external_id`, `share`, `valid_from`;
        Meters: `plot_number`, `resource`, `serial`, `installed_on`, `initial_reading`).
        `code` is one of:

        - file and sheet level: `SHEET_MISSING` (no sheet of that name), `HEADER_MISSING` (a required column is not in
          the header row; `column` names it);
        - cell level: `DATE_INVALID`, `NUMBER_INVALID`, `YES_NO_INVALID`, `AREA_BOTH_OR_NONE` (exactly one of
          `area_m2` and `area_sotky` must be filled for a new plot);
        - plot rules, as when a plot is entered by hand: `REQUIRED`, `TOO_LONG`, `INVALID`, `AREA_INVALID`,
          `CADASTRAL_INVALID`, `CADASTRAL_NUMBER_TAKEN`, `PLOT_HAS_OWNERSHIP_HISTORY`, `PLOT_HAS_METER` (`kind`: a
          plot that has a meter cannot become common land);
        - member rules, as when a member is entered by hand: `REQUIRED`, `TOO_LONG`, `INVALID` (an e-mail that is
          not an address, an unknown `delivery_channel`), `PHONE_INVALID` (`phones` or `viber_phone`),
          `CHANNEL_CONTACT_MISSING` (the contact the delivery channel needs is empty: `email`, `telegram_username` or
          `viber_phone`);
        - member matching: `MEMBER_KEY_MISSING` (`email`: the row has neither an e-mail nor a phone, so a later import
          could not recognise the member), `MEMBER_AMBIGUOUS` (`phones`: the last name, first name and first phone match
          two or more members), `EMAIL_TAKEN` (`email`: the e-mail belongs to a member other than the one the name and
          first phone identify);
        - `DUPLICATE_IN_FILE`: the plot number, or the member `external_id`, `email` or last name, first name and first
          phone (ignoring case), appears in an earlier row of the same sheet; also a row that matches the same existing
          member as an earlier row.

        Members are matched among the active members: by e-mail when the row has one, otherwise by last name, first
        name and first phone (phones are compared in international format). A blank cell leaves the existing value
        unchanged; a filled `phones` cell replaces the phones. At most 3,000 member rows.

        The `Ownership` sheet lists the current owners of plots: all four columns are required, one row per owner, all
        rows of one plot carry the same `valid_from` (owner since). `member_external_id` is the `external_id` of a row
        of the `Members` sheet (ignoring case); `plot_number` is a plot of the `Plots` sheet or an active plot of the
        cooperative; `share` is a fraction `n/d` (`1/2`, `2/3`; a bare `1` is the whole plot). Ownership codes:

        - `UNKNOWN_MEMBER_KEY` (`member_external_id`: no row of the `Members` sheet has this key). A key whose
          `Members` row has a problem is not reported again; fix the `Members` row first;
        - `UNKNOWN_PLOT` (`plot_number`: neither a plot of the `Plots` sheet nor an active plot);
        - `PLOT_COMMON_LAND` (`plot_number`: common land has no owners);
        - `REQUIRED` (`plot_number`, `member_external_id`, `share`, `valid_from`), `SHARE_INVALID` (`share`),
          `DATE_INVALID` (`valid_from` is not an Excel date or `DD.MM.YYYY`);
        - `OWNERSHIP_DATE_INVALID` (`valid_from`: after today in Europe/Kyiv, or not later than the end of a previous
          owner of the plot);
        - `OWNERSHIP_DATE_MISMATCH` (`valid_from`: differs from the date of the plot's first row);
        - `DUPLICATE_OWNER` (`member_external_id`: the same member twice on one plot, reported on the later row);
        - `SHARES_NOT_ONE` (`share`, first row of the plot: the shares do not add up to exactly 1);
        - `OWNERSHIP_CONFLICT` (`plot_number`, first row of the plot, `params.plot`: the plot already has other current
          owners than the file's; the import never changes existing ownership, use "Change owner").

        A plot without a current owner gets the file's owners (counted as created ownership rows). A plot whose current
        owners are exactly the file's members and shares, the dates ignored, is skipped (counted as unchanged). A plot
        whose own `Plots` row has a problem, and a plot with a row whose member has a problem, is not checked further.
        Ownership is never updated, so `ownerships.updated` is always 0. At most 6,000 ownership rows.

        The `Meters` sheet (Ukrainian name `Лічильники`) adds plot meters only; the tree of electricity meters is set
        up on its own screen. All five columns are required, one row per meter: `plot_number` (a plot of the `Plots`
        sheet or an active plot of the cooperative), `resource` (`ELECTRICITY` or `WATER`, in Ukrainian
        `ЕЛЕКТРОЕНЕРГІЯ` or `ВОДА`), `serial` (at most 50 characters), `installed_on` (an Excel date or `DD.MM.YYYY`)
        and `initial_reading` (the reading on the installation date: not negative, at most 11 integer digits and 3
        decimals). A row whose plot already has an active meter of the resource with the same serial number (ignoring
        case) is unchanged (`meters.unchanged`; its dates and reading are not compared), any other row creates an
        active meter (`meters.created`). Meters are never updated, so `meters.updated` is always 0. Meter codes:

        - `UNKNOWN_PLOT`, `PLOT_COMMON_LAND` (`plot_number`), as on the `Ownership` sheet; a plot whose own `Plots` row
          has a problem is not checked further;
        - `REQUIRED` (any column), `INVALID` (`resource`: not a resource word), `TOO_LONG` (`serial`),
          `DATE_INVALID` (`installed_on`), `NUMBER_INVALID` (`initial_reading`: not a number),
          `METER_VALUE_INVALID` (`initial_reading`: negative, more than 3 decimals or more than 11 integer digits);
        - `READING_DATE_IN_FUTURE` (`installed_on`: after today in Europe/Kyiv);
        - `DUPLICATE_IN_FILE` (`resource`: an earlier row names the same plot and resource);
        - `METER_ACTIVE_EXISTS` (`serial`, `params.plot`: the plot already has another active meter of that resource;
          the import never replaces a meter, replace it in the register).

        A file that cannot be read at all is refused with 400 `FILE_NOT_XLSX` (not an `.xlsx` workbook, corrupt,
        encrypted, or unpacking to an unreasonable size) or 400 `IMPORT_LIMIT_EXCEEDED` (too many rows); a file over
        the size limit with 413 `FILE_TOO_LARGE`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The workbook (`.xlsx`)
      responses:
        '201':
          description: The preview of the file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /imports/{id}/commit:
    post:
      tags: [imports]
      operationId: commitImport
      summary: Commit a previewed import
      description: |
        Saves everything the preview announced, in one transaction: either all of it or nothing. Requires the
        `IMPORT_RUN` permission; the platform operator has no cooperative data: 403. An unknown id, and the id of
        another cooperative's import, is 404.

        Before saving, the plan is computed again from the stored rows under locks on the plots, meters and members
        it touches and compared with the preview. Any difference (a plot with one of the file's numbers created
        meanwhile, an owner changed, a member archived, a meter registered or removed) refuses the commit with
        `IMPORT_STALE`, and so does a unique
        or overlap rule broken while saving by a record created meanwhile; nothing is saved and the file has to be
        uploaded again. Per-record audit entries are written as when the records are entered by hand, plus one
        `IMPORT_COMMITTED` entry (entity type `IMPORT`, entity id = import id, label = file name, one field per
        count, for example `plotsCreated`).

        Refusals (nothing is saved):

        - 409 `IMPORT_HAS_ERRORS`: the preview had problems;
        - 409 `IMPORT_NOTHING_TO_COMMIT`: the preview had no problems but nothing to create or update (everything is
          already as in the file);
        - 409 `IMPORT_STALE`: see above; the run is recorded as stale and cannot be committed any more;
        - 409 `IMPORT_ALREADY_COMMITTED`: the import was committed before; committing twice never saves twice;
        - 410 `IMPORT_EXPIRED`: more than 30 minutes passed since the preview; its stored rows are dropped.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The import was saved; the counts are those of the preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The import cannot be committed: it has problems (code `IMPORT_HAS_ERRORS`), has nothing to create or
            update (code `IMPORT_NOTHING_TO_COMMIT`), the data changed since the preview (code `IMPORT_STALE`), or it
            was committed already (code `IMPORT_ALREADY_COMMITTED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: The preview is older than 30 minutes (code `IMPORT_EXPIRED`); upload the file again
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /charge-types:
    get:
      tags: [charge-types]
      operationId: listChargeTypes
      summary: List the charge types of the cooperative
      description: |
        Returns the non-archived charge types of the current cooperative ordered by `position` (then by id). Every
        cooperative starts with four (see `ChargeTypeCode`): membership fee, electricity, land and water (inactive). A type that was
        never renamed has `nameCustomized: false` and its `name` is the English default; clients show their own
        localised default name for it. Requires `TARIFFS_VIEW`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChargeType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [charge-types]
      operationId: createChargeType
      summary: Add a charge type
      description: |
        Adds a custom charge type at the end of the list, active. The name is trimmed and must be unique among the
        non-archived charge types, ignoring letter case; it must also differ from the Ukrainian and English default
        names of the starting types that were not renamed (409 `CHARGE_TYPE_NAME_TAKEN`). Requires `TARIFFS_VIEW`
        and `TARIFFS_MANAGE`; the change is written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeTypeCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /charge-types/order:
    put:
      tags: [charge-types]
      operationId: reorderChargeTypes
      summary: Change the order of the charge types
      description: |
        Sets the order of the list. `ids` must be exactly the ids of the non-archived charge types of the
        cooperative, each once, in the new order; otherwise (the list changed since the client read it) the answer is
        409 `CHARGE_TYPE_ORDER_STALE` and nothing changes. Requires `TARIFFS_VIEW` and `TARIFFS_MANAGE`; one audit
        entry is written for every type whose position changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeTypeOrder'
      responses:
        '204':
          description: The new order is saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /charge-types/{id}:
    put:
      tags: [charge-types]
      operationId: updateChargeType
      summary: Change a charge type
      description: |
        Replaces the name, description and active mark. Renaming one of the four starting types marks it as
        customised (`nameCustomized: true`) for good. The name rules are those of creation (409
        `CHARGE_TYPE_NAME_TAKEN`). An archived type cannot be changed (409 `CHARGE_TYPE_ARCHIVED`). Saving the current
        values changes nothing and writes no audit entry. Requires `TARIFFS_VIEW` and `TARIFFS_MANAGE`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeTypeUpdate'
      responses:
        '200':
          description: The saved charge type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /charge-types/{id}/archive:
    post:
      tags: [charge-types]
      operationId: archiveChargeType
      summary: Archive a charge type
      description: |
        Archives the charge type: it disappears from the list, frees its name and can no longer get tariffs. A charge
        type is never deleted. Archiving an archived type is 409 `CHARGE_TYPE_ARCHIVED`. Requires `TARIFFS_VIEW` and
        `TARIFFS_MANAGE`; the change is written to the audit log.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Archived
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tariffs:
    get:
      tags: [tariffs]
      operationId: listTariffs
      summary: List the tariffs of the cooperative
      description: |
        Returns the tariffs of the non-archived charge types, ordered like the charge types (by position), then by name.
        Each tariff shows one version: the one valid today (Europe/Kyiv), otherwise the earliest future one.
        `plotCount` is the number of plots the tariff applies to: for `ALL_PLOTS` the active plots that are not
        common land minus the excluded active ones, for `SELECTED_PLOTS` the active selected plots that are not
        common land. When the shown version is meter-based (`PER_KWH` electricity, `PER_M3` water) only the plots
        among those that have an active meter of that resource are counted: such a tariff applies to the plots with a
        meter. Requires `TARIFFS_VIEW`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TariffSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [tariffs]
      operationId: createTariff
      summary: Create a tariff with its first version
      description: |
        Creates a tariff of a charge type together with its first version; the tariff applies to all plots until its
        scope is changed. The charge type must exist (404 otherwise) and not be archived (409
        `CHARGE_TYPE_ARCHIVED`). The version rules are those of `POST /tariffs/{id}/versions` (400
        `VALIDATION_FAILED`, with field names prefixed by `firstVersion.`). A version dated in the past is accepted.
        Requires `TARIFFS_VIEW` and `TARIFFS_MANAGE`; the change is written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tariffs/{id}:
    get:
      tags: [tariffs]
      operationId: getTariff
      summary: A tariff with its versions
      description: |
        Returns the tariff, its charge type (also an archived one) and every version, newest first. `validTo` of a
        version is the day before the next version starts; the last version has none. `pastDated` marks a version
        whose `validFrom` is before today (Europe/Kyiv). A tariff of another cooperative or an unknown id is 404.
        `selectedPlots` and `exclusions` hold the scope with plot numbers (and the reason of each exclusion) in natural
        order of the number; a plot archived after it was added is still listed, marked `archived`, and not counted
        in `plotCount`. For a meter-based shown version `plotCount` counts only the plots with an active meter of the
        resource, as in the list. Requires `TARIFFS_VIEW`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tariffs/{id}/versions:
    post:
      tags: [tariffs]
      operationId: addTariffVersion
      summary: Add a version to a tariff
      description: |
        Adds a version that applies from `validFrom`. A change of rate is a new version; a mistake in a version can be
        corrected or the version deleted until a charge uses it (`PUT` and `DELETE` of
        `/tariffs/{id}/versions/{versionId}`). Two versions of one tariff cannot start on the same date (409 `TARIFF_VERSION_DATE_TAKEN`,
        `errors[{field: validFrom}]`). The charge type must not be archived (409 `CHARGE_TYPE_ARCHIVED`). A date in the
        past is accepted (`pastDated: true` in the answer). Field codes of 400 `VALIDATION_FAILED`: `rate`
        `RATE_INVALID`; `frequency` `FREQUENCY_BASIS_MISMATCH` (`ONE_OFF` goes only with `FIXED_ONE_TIME` and
        `FIXED_ONE_TIME` only with `ONE_OFF`); `dueDate` `REQUIRED` (a one-time amount has a due date) or `INVALID`
        (a due date for a basis other than `FIXED_ONE_TIME`). The answer is the new version with `validTo` derived
        from the versions that follow it. Requires `TARIFFS_VIEW` and `TARIFFS_MANAGE`; the change is written to the
        audit log.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffVersionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tariffs/{id}/versions/{versionId}:
    put:
      tags: [tariffs]
      operationId: updateTariffVersion
      summary: Correct a version of a tariff
      description: |
        Replaces the terms of a version (the same fields and rules as `POST /tariffs/{id}/versions`; `validFrom` may
        change too). A version can be corrected until a charge uses it: then 409 `TARIFF_VERSION_IN_USE` (a later
        correction goes through recalculation, feature 012). The tariff and the version are 404 when unknown or of
        another cooperative, and also when the version belongs to another tariff. Two versions of one tariff cannot
        start on the same date (409 `TARIFF_VERSION_DATE_TAKEN`, `errors[{field: validFrom}]`). The charge type must
        not be archived (409 `CHARGE_TYPE_ARCHIVED`). Field codes of 400 `VALIDATION_FAILED` are those of the create
        operation (`rate` `RATE_INVALID`, `frequency` `FREQUENCY_BASIS_MISMATCH`, `dueDate` `REQUIRED` or `INVALID`).
        A date in the past is accepted (`pastDated: true` in the answer). The answer is the version with `validTo`
        derived from the versions that follow it; the end dates of the neighbours are derived on every read, so they
        follow the new date. A request that changes nothing is accepted and writes nothing. Requires `TARIFFS_VIEW`
        and `TARIFFS_MANAGE`; the change is written to the audit log (`TARIFF_VERSION_UPDATED`, old and new values of
        the changed fields).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffVersionCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [tariffs]
      operationId: deleteTariffVersion
      summary: Delete a version of a tariff
      description: |
        Deletes a version until a charge uses it (409 `TARIFF_VERSION_IN_USE` afterwards). The only version of a tariff
        cannot be deleted (409 `TARIFF_LAST_VERSION`): archive the charge type or keep the tariff instead. The end
        dates of the neighbours are derived on every read, so the version before the deleted one then lasts until the
        next one starts. The tariff and the version are 404 when unknown or of another cooperative, and also when the
        version belongs to another tariff. The charge type must not be archived (409 `CHARGE_TYPE_ARCHIVED`). Requires
        `TARIFFS_VIEW` and `TARIFFS_MANAGE`; the change is written to the audit log (`TARIFF_VERSION_DELETED`, the old
        values).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tariffs/{id}/scope:
    put:
      tags: [tariffs]
      operationId: updateTariffScope
      summary: Choose the plots a tariff applies to
      description: |
        Replaces the scope of the tariff in one transaction. `ALL_PLOTS` applies the tariff to every active plot that
        is not common land, minus the `exclusions` (each with a reason); `plotIds` must then be empty. `SELECTED_PLOTS`
        applies it to the plots in `plotIds`; `exclusions` must then be empty. Switching the kind removes the rows of
        the other kind. Saving the scope the tariff already has changes nothing and writes no audit entry.
        Field codes of 400 `VALIDATION_FAILED`: `plotIds` or `exclusions` `INVALID` (the list does not go with the
        kind); `plotIds[i]` or `exclusions[i].plotId` `TARIFF_COMMON_LAND` (common land has no tariffs),
        `PLOT_ARCHIVED` (an archived plot cannot be added; one already in the scope may stay), `UNKNOWN_PLOT` (no such
        plot in the cooperative) or `DUPLICATE` (the plot is listed twice); `exclusions[i].reason` `REQUIRED` (blank)
        or `TOO_LONG`. At most 5000 plots per list (`TOO_LONG`). The charge type must not be archived (409
        `CHARGE_TYPE_ARCHIVED`). The answer is the updated tariff. Requires `TARIFFS_VIEW` and `TARIFFS_MANAGE`; a
        change of kind or of the selected plots is written to the audit log as `TARIFF_SCOPE_CHANGED`, and each
        exclusion added or removed as `TARIFF_EXCLUSION_ADDED` or `TARIFF_EXCLUSION_REMOVED`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffScopeUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots/{id}/tariffs:
    get:
      tags: [tariffs]
      operationId: getPlotTariffs
      summary: Expected amounts of a plot for a month
      description: |
        Returns the tariffs that apply to the plot in the month and the amount the plot would be charged for each,
        calculated by the server (nothing is charged yet). `month` is `YYYY-MM` and defaults to the current month in
        Europe/Kyiv; anything else is 400 `VALIDATION_FAILED`. No permission annotation: a caller with `TARIFFS_VIEW`
        may ask for any plot of the cooperative, anyone else only for a plot they currently own. Any other plot, an
        unknown id and a plot of another cooperative are 404 `NOT_FOUND`; the platform operator has no cooperative data:
        403. Common land and archived plots answer 200 with no items and a total of `0.00`.
        Tariffs of archived or inactive charge types are left out, and so is a tariff none of whose versions overlaps
        the month. A tariff of all plots that excludes the plot is listed with status `EXCLUDED` and the reason, without
        an amount. A tariff with a per-kWh or per-m3 version in the month is `BY_READINGS` without an amount when
        the plot has a meter of that resource (electricity for per-kWh, water for per-m3) working on any day of the
        month, otherwise `NO_METER` without an amount (the tariff does not reach the plot). Every
        other tariff is `AMOUNT`, rounded once to kopecks (a one-time fee is 0.00 outside its due month). The rate,
        basis and frequency are those of the version valid on the last day of the month that the tariff covers (for a
        one-time fee, the version valid on its due date). Items are ordered by charge type position, then tariff name.
        `total` is the sum of the `AMOUNT` items. The co-ownership share does not change the amount.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: month
          in: query
          required: false
          description: The billing month, `YYYY-MM`; defaults to the current month (Europe/Kyiv)
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotTariffs'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meters:
    get:
      tags: [meters]
      operationId: listMeters
      summary: List the meters of the cooperative
      description: |
        The meter register. Plot meters come first, in street order (Ukrainian alphabet, plots without a street last)
        and then natural order of the plot number, electricity before water; then the other meters by name. Removed
        meters are left out unless `includeRemoved` is true. Filters combine with AND: `resource`, `kind`, `street`
        (the plot's street, ignoring case and surrounding spaces; only plot meters have one) and `noReadingSince`
        (active meters whose last reading, or the initial reading when there is none, is dated before that day;
        removed meters never match). Requires `METERS_VIEW`.
      parameters:
        - name: resource
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MeterResource'
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MeterKind'
        - name: street
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: noReadingSince
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: includeRemoved
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [meters]
      operationId: registerMeter
      summary: Register a meter
      description: |
        Registers a meter with its installation date and initial reading. A plot meter (`kind: PLOT`) needs `plotId`
        and has no name; every other kind needs a `name` and has no plot and measures electricity only. Field codes of
        400 `VALIDATION_FAILED`: `plotId` `REQUIRED`, `INVALID` (a plot for a meter that is not a plot meter) or
        `UNKNOWN_PLOT` (no such plot in the cooperative); `name` `REQUIRED` or `INVALID` (a name for a plot meter);
        `resource` `INVALID` (water for a meter that is not a plot meter); `serial` `REQUIRED` (blank) or `TOO_LONG`;
        `initialReading` `METER_VALUE_INVALID`. Conflicts (409): the plot already has an active meter of the resource
        (`METER_ACTIVE_EXISTS`); the plot is common land (`METER_COMMON_LAND`, `errors[{field: plotId}]`) or archived
        (`PLOT_ARCHIVED`, `errors[{field: plotId}]`); the installation date is after today in Europe/Kyiv
        (`READING_DATE_IN_FUTURE`, `errors[{field: installedOn}]`). Requires `METERS_VIEW` and `METERS_MANAGE`; written to
        the audit log (`METER_REGISTERED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterCreate'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /meters/{id}:
    get:
      tags: [meters]
      operationId: getMeter
      summary: A meter
      description: |
        The meter card. A meter of another cooperative or an unknown id is 404. Requires `METERS_VIEW`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [meters]
      operationId: updateMeter
      summary: Change the serial number, name or note of a meter
      description: |
        Replaces the serial number, the name and the note (an absent note or name is cleared). Kind, resource, plot,
        dates and readings never change here: a meter is removed or replaced instead. The name rules and field codes
        are those of registration (`name` `REQUIRED` for a meter that is not a plot meter, `INVALID` for a plot meter).
        A removed meter can still be corrected. A request that changes nothing is accepted and not audited. Requires
        `METERS_VIEW` and `METERS_MANAGE`; written to the audit log (`METER_UPDATED`, old and new values of the changed
        fields).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [meters]
      operationId: deleteMeter
      summary: Delete a meter entered by mistake
      description: |
        Deletes an active meter that has no readings (its initial reading does not count; see `deletable`). A meter
        with readings of any status is refused with 409 `METER_HAS_READINGS` (remove it instead), a removed meter with
        409 `METER_REMOVED`, a meter that is or was the parent of another meter in the electricity tree with 409
        `METER_HAS_CHILDREN` (its children's history refers to it). Requires `METERS_VIEW` and `METERS_MANAGE`;
        written to the audit log (`METER_DELETED`, the old values).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /meters/{id}/remove:
    post:
      tags: [meters]
      operationId: removeMeter
      summary: Remove a meter with its final reading
      description: |
        Ends the working period of the meter on `removedOn` with `finalReading`. The meter keeps its readings and
        history; a plot meter frees its plot for a new meter of the resource. Conflicts (409): the meter is already
        removed (`METER_REMOVED`); `removedOn` is after today in Europe/Kyiv (`READING_DATE_IN_FUTURE`) or before the
        installation (`READING_DATE_OUTSIDE_METER`), both with `errors[{field: removedOn}]`; a counted reading is dated
        after `removedOn` (`READING_OUT_OF_ORDER`, `errors[{field: removedOn}]`) or `finalReading` is lower than the
        last counted reading up to that day or the initial reading (`READING_OUT_OF_ORDER`,
        `errors[{field: finalReading}]`). 400 `VALIDATION_FAILED` with `finalReading` `METER_VALUE_INVALID` for a
        malformed value. A meter with readings waiting for approval is refused with 409 `METER_HAS_PENDING_READINGS`
        (approve or reject them first). A meter that still has working meters under it in the electricity tree after
        `removedOn` is refused with 409 `METER_HAS_CHILDREN` (move them to another parent first, or replace the meter:
        a replacement takes its children over). Requires `METERS_VIEW` and `METERS_MANAGE`; written to the audit log
        (`METER_REMOVED`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterRemoval'
      responses:
        '200':
          description: The removed meter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /meters/{id}/replace:
    post:
      tags: [meters]
      operationId: replaceMeter
      summary: Replace a meter by a new one
      description: |
        One action: the meter is removed on `replacedOn` with `finalReading` (the rules of `removeMeter`, with the
        date errors on `replacedOn`), and a new active meter of the same kind, resource, plot and name is installed on
        the same day with `serial` and `initialReading`; it carries `replacesMeterId` and the board's note of the old
        meter. A counter that wrapped around (99 999 to 00 012) is a replacement of the meter by itself: the same
        serial, the final reading before the wrap and initial reading 0. In the electricity tree the new meter takes
        the place of the old one from `replacedOn`: it gets the old meter's parent, and the meters under a meter that
        is not a plot meter move under the new one. Consumption over a range adds up the meters of the chain (see
        `getMeterConsumption`). Conflicts (409): the meter is already removed (`METER_REMOVED`); it has readings
        waiting for approval (`METER_HAS_PENDING_READINGS`; approve or reject them first); `replacedOn` is after
        today in Europe/Kyiv (`READING_DATE_IN_FUTURE`), before the installation (`READING_DATE_OUTSIDE_METER`) or
        before a counted reading (`READING_OUT_OF_ORDER`), all with `errors[{field: replacedOn}]`; `finalReading` is
        lower than the counted reading before it or the initial reading (`READING_OUT_OF_ORDER`,
        `errors[{field: finalReading}]`). 400 `VALIDATION_FAILED`: `serial` `REQUIRED` or `TOO_LONG`, `finalReading`
        or `initialReading` `METER_VALUE_INVALID`. Requires `METERS_VIEW` and `METERS_MANAGE`; written to the audit
        log as `METER_REPLACED` about the old meter (`removedOn`, `finalReading`, `replacementMeter` = the new serial)
        and `METER_REGISTERED` about the new one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterReplacement'
      responses:
        '201':
          description: The new meter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /meters/{id}/consumption:
    get:
      tags: [meters]
      operationId: getMeterConsumption
      summary: The consumption of a meter over a date range
      description: |
        The consumption from `from` to `to` (the value on `to` minus the value on `from`), added up over the chain of
        the meter: the meter, the meters it replaced and the meters that replaced it, each counted in the days it
        worked (a replacement, a counter that wrapped around). A value on a date without a reading is calculated in
        proportion to the days between the nearest counted points and the result is marked `calculated`; the
        consumption is then rounded once to three decimals. When a meter of the chain has no counted point after
        the range's end, the consumption is not known (`known: false`) and `lastReadingOn` says after which day
        there is no reading. Only counted (`APPROVED`) readings are used. 400 `VALIDATION_FAILED` with `to`
        `INVALID` when `to` is before `from`. Requires `METERS_VIEW`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterConsumption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meters/{id}/parent:
    put:
      tags: [meter-tree]
      operationId: setMeterParent
      summary: Put an electricity meter under another parent from a date
      description: |
        Puts the meter under `parentMeterId` in the electricity tree from `effectiveFrom`, or takes it out of the tree
        from that day when `parentMeterId` is absent. The history is kept: the period the meter had ends on the day
        before `effectiveFrom` and a new period starts on it, so a past date range shows the tree as it was. A change
        on the date of the meter's latest change corrects that change instead of adding one (a return to the parent of
        the period before joins the two periods again). The meters under the moved meter stay under it.

        Rules: a substation has no parent; a quarter meter is under a substation; a plot meter or a common consumer is
        under a substation or a quarter meter. So the tree has at most three levels and no cycle. Water meters have no
        tree. The parent is active and installed on or before `effectiveFrom`. Refused with 409
        `METER_TREE_INVALID` and one field error: on `parentMeterId` `TREE_WATER` (the meter measures water),
        `TREE_QUARTER_UNDER_QUARTER` (a quarter meter under another quarter meter), `TREE_PARENT_KIND` (any other
        parent that the kinds do not allow, the meter itself and any parent for a substation included) or
        `TREE_PARENT_INACTIVE` (the parent is removed or installed after `effectiveFrom`); on `effectiveFrom`
        `TREE_DATE_BEFORE_LATEST` (before the meter's latest change in the tree; such history is not rewritten) or
        `READING_DATE_OUTSIDE_METER` (before the meter's installation). Also 409 `READING_DATE_IN_FUTURE` with
        `errors[{field: effectiveFrom}]` for a date after today in Europe/Kyiv and 409 `METER_REMOVED` for a removed
        meter. An unknown parent or one of another cooperative is 404 `NOT_FOUND` with
        `errors[{field: parentMeterId}]`. A request that changes nothing is accepted and not audited. Requires
        `METERS_VIEW` and `METERS_MANAGE`; written to the audit log (`METER_PARENT_CHANGED` about the meter: `parent`
        old and new, the labels of the parents, and `effectiveFrom`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterParentChange'
      responses:
        '200':
          description: The parent periods of the meter after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterPlacement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /meter-tree:
    get:
      tags: [meter-tree]
      operationId: getMeterTree
      summary: The electricity meter tree over a date range with the consumption per node
      description: |
        The electricity meter tree as it was from `from` to `to`, with the consumption of every node, calculated by the
        server from counted (`APPROVED`) readings only.

        A node is a meter together with the meters it replaced and the meters that replaced it (`meterIds`, oldest
        installation first; `meter` is the one in place at the end of the range), so a replacement or a counter that
        wrapped around does not split a node. A node is listed under every parent it had in the range, each time with
        the slices of the range it spent under that parent: a plot meter moved from quarter A to quarter B on 15.10
        and shown for 01.10 to 31.10 is under A with the slice 01.10-15.10 and under B with the slice 15.10-31.10.
        Neighbouring slices share their boundary day and add up to the consumption over the whole range. The days a
        meter had no parent put it among the roots (substations, and meters outside the tree such as the plot meters
        of a cooperative without a tree). The children of a node are the meters under it during its own slices.
        Meters that did not work in the range are left out; water meters are never in the tree.

        Each slice has the value at its start and at its end: `REAL` (a counted reading, or the initial or final
        reading), `CALCULATED` (interpolated in proportion to the days between the nearest counted points, rounded
        once to three decimals) or `UNKNOWN` (with the day after which there is no reading), and the consumption of
        the slice: known, and `calculated` when an end was interpolated, or not known with `lastReadingOn`. `total`
        is the consumption of the node over its slices under that parent.

        Order: substations, quarter meters and common consumers, each by name (Ukrainian alphabet), then plot meters
        in street and number order. 400 `VALIDATION_FAILED` with `to` `INVALID` when `to` is before `from`. Requires
        `METERS_VIEW`.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterTree'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /plots/{id}/readings:
    post:
      tags: [readings]
      operationId: submitPlotReading
      summary: Submit a reading of an own meter
      description: |
        A member submits the reading of an active meter of a plot they currently own. It waits for approval (status
        `PENDING`, source `MEMBER`) and is never used for consumption until someone with `READINGS_APPROVE` approves
        it. A pending reading of the same meter and date is replaced: it stays in the history as `SUPERSEDED` and its
        id is in `supersededReadingIds`; the same value on the same date again changes nothing. A pending reading
        never replaces a counted one. `takenOn` absent means today in Europe/Kyiv. The reading is checked as one the
        board enters, against the counted readings: 409 `READING_DATE_IN_FUTURE` or `READING_DATE_OUTSIDE_METER`
        (`errors[{field: takenOn}]`), `READING_OUT_OF_ORDER` (`errors[{field: value}]`), `METER_REMOVED` for a removed
        meter of the plot. The warning `UNUSUAL_CONSUMPTION` follows the rule of `enterReadings`. No permission
        annotation: only a current owner of the plot may submit; any other plot, an unknown id and a plot of another
        cooperative are the same 404 `PLOT_NOT_FOUND`; a meter that is not a meter of the plot is 404 `NOT_FOUND`
        (`errors[{field: meterId, code: NOT_FOUND}]`); the platform operator has no cooperative data: 403. 400 `VALIDATION_FAILED` with `value`
        `METER_VALUE_INVALID` for a malformed value. Written to the audit log (`READING_SUBMITTED`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingSubmission'
      responses:
        '201':
          description: The submitted reading, waiting for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingSaved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots/{id}/meters:
    get:
      tags: [meters]
      operationId: listPlotMeters
      summary: The meters of a plot
      description: |
        Every meter the plot has had, active and removed: active meters first (electricity before water), then removed
        ones, newest installation first. No permission annotation: a caller with `METERS_VIEW` may ask for any plot of
        the cooperative, anyone else only for a plot they currently own, and then `note` (the board's note) is left
        out. Any other plot, an unknown id and a plot of another cooperative are the same 404 `PLOT_NOT_FOUND`; the
        platform operator has no cooperative data: 403. Common land has no meters (an empty list).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meters/{id}/readings:
    get:
      tags: [readings]
      operationId: listMeterReadings
      summary: The readings of a meter with their intervals
      description: |
        Every reading of the meter, newest date first (on one date the counted reading first, then pending, rejected
        and superseded ones), and the intervals between the counted points of the meter (initial reading, approved
        readings, final reading), newest first. Each approved reading carries the interval that ends on it; a reading
        on the installation date has none. Consumption is calculated by the server from exact values. No permission
        annotation: a caller with `METERS_VIEW` may ask for any meter of the cooperative, anyone else only for a meter
        of a plot they currently own. Any other meter, an unknown id and a meter of another cooperative are 404
        `NOT_FOUND`; the platform operator has no cooperative data: 403.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterReadingHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /readings/round:
    get:
      tags: [readings]
      operationId: getReadingRound
      summary: The meters of a reading round
      description: |
        The active meters to read on a round: plot meters in street order (Ukrainian alphabet, plots without a street
        last) and natural order of the plot number, electricity before water; then the other meters by name. A plot
        without an active meter is never listed. Filters combine with AND: `resource`, `street` (the plot's street,
        ignoring case and surrounding spaces; only plot meters have one) and `noReadingSince` (meters whose last
        counted reading, or the initial reading when there is none, is dated before that day). `lastReading` of each
        meter is the point to compare a new reading with. `note` is present only for a caller with `METERS_VIEW`.
        Requires `READINGS_ENTER`.
      parameters:
        - name: resource
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MeterResource'
        - name: street
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: noReadingSince
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /readings:
    get:
      tags: [readings]
      operationId: listReadings
      summary: The readings waiting for approval
      description: |
        The readings members submitted that wait for approval, oldest reading date first. Only `status=PENDING` is
        supported; any other status is 400 `VALIDATION_FAILED` with `status` `INVALID`. Each item has the meter and,
        when the reading fits between the counted readings, the interval it would close once approved and its
        warnings. `note` of the meter is present only for a caller with `METERS_VIEW`. Requires `READINGS_APPROVE`.
      parameters:
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ReadingStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingReading'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [readings]
      operationId: enterReadings
      summary: Enter readings, one or a whole round
      description: |
        Enters up to 100 readings. Each row is saved in its own transaction, so one refused row never undoes another;
        the answer is 200 with one result per row in request order (`SAVED` or `REJECTED` with `error`). A reading
        counts at once (status `APPROVED`, source `ENTERED`). `takenOn` absent means today in Europe/Kyiv. A counted
        reading of the same meter and date is replaced: it stays in the history as `SUPERSEDED` and its id is in
        `supersededReadingIds`; the same value on the same date again changes nothing. Row error codes: `NOT_FOUND`
        (`meterId`: no such meter in the cooperative), `READING_DATE_IN_FUTURE` (`takenOn`, params `today`),
        `READING_DATE_OUTSIDE_METER` (`takenOn`, params `installedOn` and, for a removed meter, `removedOn`),
        `READING_OUT_OF_ORDER` (`value`: lower than the previous counted point or higher than the next one; params
        `previousTakenOn` and `previousValue`, or `nextTakenOn` and `nextValue`), `READING_IN_USE` (a charge uses the
        readings around the date). A saved row may carry the warning `UNUSUAL_CONSUMPTION`: the daily consumption of
        the interval it closes is more than 3 times the daily average over the meter's counted intervals that ended in
        the 180 days before it (none without such an interval). 400 `VALIDATION_FAILED` for the whole request when a
        row is malformed (`rows[i].value` `METER_VALUE_INVALID`, `rows` `REQUIRED` or `TOO_LONG`). Requires
        `READINGS_ENTER`; each saved row is written to the audit log (`READING_ENTERED`, or `READING_REPLACED` when it
        replaced a reading of the same date).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingBatch'
      responses:
        '200':
          description: One result per row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /readings/{id}:
    put:
      tags: [readings]
      operationId: correctReading
      summary: Correct the value or date of a counted reading
      description: |
        Corrects a counted (`APPROVED`) reading: a new reading with the given date and value takes its place and the
        old one stays in the history as `SUPERSEDED`, as does a counted reading on the new date; their ids are in
        `supersededReadingIds`. A request that changes nothing is accepted and not audited. Conflicts (409): the
        reading is not counted (`READING_STATUS_INVALID`); the new date is after today (`READING_DATE_IN_FUTURE`) or
        outside the meter's working period (`READING_DATE_OUTSIDE_METER`), both with `errors[{field: takenOn}]`; the
        value does not fit between the neighbouring counted points (`READING_OUT_OF_ORDER`, `errors[{field: value}]`);
        a charge uses the readings around the old or the new date (`READING_IN_USE`). The warning
        `UNUSUAL_CONSUMPTION` follows the rule of `enterReadings`. Requires `READINGS_ENTER`; written to the audit log
        (`READING_CORRECTED`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingCorrection'
      responses:
        '200':
          description: The reading that took the place of the corrected one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingSaved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [readings]
      operationId: deleteReading
      summary: Delete a counted reading
      description: |
        Deletes a counted (`APPROVED`) reading; the intervals around it join. A reading it had replaced stays
        `SUPERSEDED`. Conflicts (409): the reading is not counted (`READING_STATUS_INVALID`) or a charge uses the
        readings around it (`READING_IN_USE`). Requires `READINGS_ENTER`; written to the audit log (`READING_DELETED`,
        the old date and value).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /readings/{id}/approve:
    post:
      tags: [readings]
      operationId: approveReading
      summary: Approve a reading a member submitted
      description: |
        A `PENDING` reading starts to count (`APPROVED`; its source stays `MEMBER`). It is checked again against the
        counted readings as they are now: 409 `READING_DATE_OUTSIDE_METER` (`errors[{field: takenOn}]`),
        `READING_OUT_OF_ORDER` (`errors[{field: value}]`) or `READING_IN_USE` (a charge uses the readings around the
        date). A counted reading of the same date is replaced: it stays in the history as `SUPERSEDED` and its id is in
        `supersededReadingIds`. A reading that is not pending is 409 `READING_STATUS_INVALID`. The answer carries the
        interval the reading now closes and the warning `UNUSUAL_CONSUMPTION` by the rule of `enterReadings`.
        Requires `READINGS_APPROVE`; written to the audit log (`READING_APPROVED`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The approved reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingSaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /readings/{id}/reject:
    post:
      tags: [readings]
      operationId: rejectReading
      summary: Reject a reading a member submitted
      description: |
        A `PENDING` reading is not approved (`REJECTED`) with a reason the member sees in the history of the meter
        (`rejectReason`). It never counts. A reading that is not pending is 409 `READING_STATUS_INVALID`. 400
        `VALIDATION_FAILED` with `reason` `REQUIRED` (absent or blank) or `TOO_LONG`. Requires `READINGS_APPROVE`;
        written to the audit log (`READING_REJECTED` with the reason).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingRejection'
      responses:
        '200':
          description: The rejected reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterReading'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots/{id}/account:
    get:
      tags: [charges]
      operationId: getPlotAccount
      summary: The account of a plot with its charges and the debt per charge type
      description: |
        The ledger of one plot. `debts` lists every charge type the plot has a charge of, in the order of the charge
        types, with the sum of its charges (a reversal counts negative); `total` is their sum. Until payments exist
        the debt is the sum of the charges. `charges` lists the charges newest first (by `accruedOn`, then by the
        time they were booked); `from` and `to` (both optional, inclusive) limit the list by `accruedOn`, never the
        debts. `from` after `to` is 400 `VALIDATION_FAILED` (`errors[{field: from, code: INVALID}]`). Every amount is
        calculated by the server. No permission annotation: a caller with `CHARGES_VIEW` may ask for any plot of the
        cooperative, anyone else only for a plot they currently own. Any other plot, an unknown id and a plot of
        another cooperative are the same 404 `PLOT_NOT_FOUND`; the platform operator has no cooperative data: 403.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: The first day of the list (by `accruedOn`), inclusive
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: The last day of the list (by `accruedOn`), inclusive
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /plots/{id}/opening-balances:
    post:
      tags: [charges]
      operationId: enterOpeningBalance
      summary: Enter an opening balance of a plot
      description: |
        Books the debt a plot had before the cooperative started with the platform: a charge of kind `OPENING` and
        source `OPENING` of the charge type, with `accruedOn` and the service period equal to `date`. It is booked in
        the billing month of `date` when that month is open, otherwise in the earliest open month after it (a month
        that does not exist yet is opened). 400 `VALIDATION_FAILED`: `amount` not greater than zero
        (`AMOUNT_NOT_POSITIVE`) or with more than 12 integer digits (`INVALID`), `date` after today in Europe/Kyiv
        (`DATE_IN_FUTURE`), a missing field (`REQUIRED`), `reason` over 500 characters (`TOO_LONG`). An unknown charge
        type is 404 `NOT_FOUND` (`errors[{field: chargeTypeId, code: NOT_FOUND}]`); an archived one is 409
        `CHARGE_TYPE_ARCHIVED` (`errors[{field: chargeTypeId}]`). An unknown plot, or one of another cooperative, is
        404 `PLOT_NOT_FOUND`; an archived plot is 409 `PLOT_ARCHIVED` and common land 409 `PLOT_COMMON_LAND`.
        The optional reason is stored on the charge (`reason`). Requires `CHARGES_RUN`; written to the audit log
        (`OPENING_BALANCE_ENTERED`, entity type `CHARGE` about the plot, with the reason).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningBalanceInput'
      responses:
        '201':
          description: The booked opening balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /charges/{id}/reverse:
    post:
      tags: [charges]
      operationId: reverseCharge
      summary: Reverse a charge
      description: |
        Cancels a charge by a new charge of kind `REVERSAL` and source `MANUAL_REVERSAL`: the same amount with the
        opposite sign, the same plot, charge type, service period and `accruedOn`, the reason, and `reverses` naming
        the original. It is booked in the billing month of the original, which must be open. Nothing is changed or
        deleted (the ledger is append-only). Conflicts (409): the charge is a reversal (`REVERSAL_NOT_REVERSIBLE`), it
        was reversed before (`CHARGE_ALREADY_REVERSED`), its billing month is closed (`CHARGE_IN_CLOSED_MONTH`; its
        correction is an adjustment). 400 `VALIDATION_FAILED` with `reason` `REQUIRED` (absent or blank) or
        `TOO_LONG`. An unknown charge, or one of another cooperative, is 404 `NOT_FOUND`. Requires `CHARGES_REVERSE`;
        written to the audit log (`CHARGE_REVERSED`, entity type `CHARGE` about the plot, with the reason).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeReversal'
      responses:
        '201':
          description: The reversal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /billing-months:
    get:
      tags: [billing]
      operationId: listBillingMonths
      summary: The billing months with their totals
      description: |
        Every billing month of the cooperative, newest first: from the month of its first billing month row (the
        first charge) to the current month in Europe/Kyiv, including months that have no row or no charge yet (they
        are listed `OPEN` with empty totals; a row is created when the month is closed or a charge is booked in it).
        `totals` holds the sum of the charges booked in the month per charge type (a reversal counts negative), in the
        order of the charge types; `total` is their sum. A cooperative without any month gets an empty list.
        Requires `CHARGES_VIEW`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillingMonthSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /billing-months/{month}:
    get:
      tags: [billing]
      operationId: getBillingMonth
      summary: One billing month with its totals and the closing check list
      description: |
        The month as in the list plus the check list shown before closing: whether the month run is done, the number
        of "not charged" items of the month and the plot meters without a reading for more than 60 days (active plot
        meters whose last approved reading, or installation, is more than 60 days before the month's last day or
        today, whichever is earlier). Nothing on the list blocks closing. A month that is not listed (before the
        first month, after the current one) is 404 `NOT_FOUND`. Requires `CHARGES_VIEW`.
      parameters:
        - name: month
          in: path
          required: true
          description: The billing month, `YYYY-MM`
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingMonthDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /billing-months/{month}/close:
    post:
      tags: [billing]
      operationId: closeBillingMonth
      summary: Close a billing month
      description: |
        Closes the month: nothing is booked in it any more, and a charge about its days is booked in the earliest open
        month after it. A closed month is never reopened. Conflicts (409): a month after the current one in
        Europe/Kyiv (`PERIOD_IN_FUTURE`), a closed month (`PERIOD_CLOSED`), an earlier month that is still open
        (`PERIOD_CLOSE_ORDER`; months close in order). A month before the first month of the cooperative (or any
        month while it has none) is 404 `NOT_FOUND`. A listed month without a row is created and closed. The check
        list does not block closing. Requires `PERIODS_CLOSE`; written to the audit log (`BILLING_MONTH_CLOSED`,
        entity type `BILLING_MONTH`, label `YYYY-MM`).
      parameters:
        - name: month
          in: path
          required: true
          description: The billing month, `YYYY-MM`
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: The closed month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingMonthDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /billing-months/{month}/run:
    post:
      tags: [billing]
      operationId: runBillingMonth
      summary: Preview or book the month run of recurring tariffs
      description: |
        Charges every active plot that is not common land every recurring or one-off tariff (`PER_PLOT`,
        `PER_AREA_SOTKA`, `FIXED_ONE_TIME`) of every active, non-archived charge type that applies to it in the month
        (scope, exclusions), with the amount of the tariff calculation (money rules section 4.1). Tariffs charged by
        meter readings (`PER_KWH`, `PER_M3`) are not part of the run. One charge per plot, tariff and month: a rerun
        creates only what is missing, never a duplicate, and never re-creates a reversed charge. An amount of `0.00`
        creates nothing. When two tariffs of the same charge type apply to a plot in the month neither is charged and
        a "not charged" item (`TARIFF_MONTH`, `CONFLICTING_TARIFFS`) names both; the run also resolves the open
        `TARIFF_MONTH` items of the month that it can now charge. With `preview=true` nothing is written: the answer
        shows what the run would create (`created` is 0) and a `digest` of it. With `preview=false` the run is booked:
        the charges are written in the month, the month is marked as run and the answer shows what was created;
        a `digest` from an earlier preview that no longer matches is refused with 409 `PREVIEW_OUTDATED` and nothing
        is written. Conflicts (409): a month after the current one in Europe/Kyiv (`PERIOD_IN_FUTURE`), a closed
        month (`PERIOD_CLOSED`). Requires `CHARGES_RUN`; a booking is written to the audit log
        (`BILLING_MONTH_RUN`, entity type `BILLING_MONTH`, label `YYYY-MM`, values `count` and `total`).
      parameters:
        - name: month
          in: path
          required: true
          description: The billing month, `YYYY-MM`
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: preview
          in: query
          required: true
          description: '`true` shows what the run would create without writing anything; `false` books it'
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthRunRequest'
      responses:
        '200':
          description: What the run would create (preview) or created (booking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /not-charged:
    get:
      tags: [not-charged]
      operationId: listNotCharged
      summary: The open "not charged" items
      description: |
        Everything the app could not charge and that is still open, each with its reason and what to fix: the plot,
        the charge type, the month (or the date range) and the tariffs involved (for `CONFLICTING_TARIFFS` both
        tariffs). Newest month first, then in the natural order of the plot numbers. An item disappears when a retry
        or a later run charges it or finds nothing left to charge. Requires `CHARGES_VIEW`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotChargedItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /not-charged/{id}/retry:
    post:
      tags: [not-charged]
      operationId: retryNotCharged
      summary: Retry one "not charged" item
      description: |
        Tries again to charge what the item is about (for `TARIFF_MONTH`: the tariffs of its charge type for its plot
        and month, as the month run does). When the charge is created, or exists already, or nothing is left to
        charge (the plot left the scope of the tariffs, the amount is `0.00`), the item is closed and `resolved` is
        true; otherwise it stays open with its (possibly updated) reason and tariffs and is returned as `item`. A
        charge for a month that was closed in the meantime is booked in the earliest open month after it. An item that
        is no longer open answers `resolved: true` and changes nothing. An unknown item, or one of another
        cooperative, is 404 `NOT_FOUND`. Requires `CHARGES_RUN`; written to the audit log (`NOT_CHARGED_RETRIED`,
        entity type `CHARGE` about the plot).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The outcome of the retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotChargedRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Malformed request or failed validation (code `VALIDATION_FAILED` or `MALFORMED_REQUEST`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid token (code `UNAUTHENTICATED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The token is valid but not linked to a member (code `MEMBER_NOT_LINKED`) or the caller lacks the
        required permission (code `PERMISSION_DENIED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        The resource does not exist or is not visible to the caller (code `NOT_FOUND`; `PLOT_NOT_FOUND` from the
        plot-scoped meter operations `listPlotMeters` and `submitPlotReading` and the ledger operations
        `getPlotAccount` and `enterOpeningBalance` when the plot is unknown, of another cooperative or not the
        caller's)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The uploaded file is over the size limit of 10 MB (code `FILE_TOO_LARGE`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The request conflicts with the current state: the email is already used by another member of the
        cooperative (code `EMAIL_TAKEN`, with `errors[{field: email}]`), the action would leave the cooperative
        without an active chairman (code `LAST_CHAIRMAN`), the role name is already used (code `ROLE_NAME_TAKEN`),
        the role is still given to members (code `ROLE_IN_USE`), or a base role cannot be deleted or, for the Chairman
        role, have its permissions changed (code `BASE_ROLE_IMMUTABLE`), another active plot already has the number
        (code `PLOT_NUMBER_TAKEN`, with `errors[{field: number}]`), or another plot of the cooperative, archived ones
        included, already has the cadastral number (code `CADASTRAL_NUMBER_TAKEN`, with
        `errors[{field: cadastralNumber}]`), or an archived plot is deleted or given new owners (code `PLOT_ARCHIVED`), or a change of owner is refused:
        the shares do not add up to one whole (code `SHARES_NOT_ONE`, `errors[{field: owners}]`), the same member is
        listed twice (code `DUPLICATE_OWNER`, `errors[{field: owners[i].memberId}]` on the second row), the date is
        in the future or not later than a start or end date of the plot's owners (code `OWNERSHIP_DATE_INVALID`,
        `errors[{field: effectiveFrom}]`), the periods of a member would overlap (code `OWNERSHIP_OVERLAP`), a
        listed member is archived (code `MEMBER_ARCHIVED`, `errors[{field: owners[i].memberId}]`), or the plot is
        common land (code `PLOT_COMMON_LAND`), or a correction of an owner record is refused with the same
        codes (`SHARES_NOT_ONE` on `share` or, when a moved date causes it, on `validFrom` or `validTo`,
        `OWNERSHIP_OVERLAP` and `OWNERSHIP_DATE_INVALID` on `validFrom` or `validTo`, `MEMBER_ARCHIVED` on `memberId`), or the member currently owns a plot and is archived (code
        `MEMBER_OWNS_PLOT`), or a plot with a current owner is archived (code `PLOT_HAS_OWNERS`), or a plot with
        ownership history is deleted or turned into common land (code `PLOT_HAS_OWNERSHIP_HISTORY`, with
        `errors[{field: kind}]` for the update), or a charge type name is taken (code `CHARGE_TYPE_NAME_TAKEN`, with
        `errors[{field: name}]`), a charge type is archived and cannot be changed or archived again (code
        `CHARGE_TYPE_ARCHIVED`), or the submitted order of charge types is not the current list (code
        `CHARGE_TYPE_ORDER_STALE`), a tariff version with the same start date exists (code
        `TARIFF_VERSION_DATE_TAKEN`, with `errors[{field: validFrom}]`), a tariff version is corrected or deleted
        although a charge uses it (code `TARIFF_VERSION_IN_USE`), the only version of a tariff is deleted (code
        `TARIFF_LAST_VERSION`), or a tariff is added to, a version is added to, corrected or deleted, or the scope is
        changed of a tariff under an archived charge type (code `CHARGE_TYPE_ARCHIVED`), or a plot that has a meter is
        deleted or turned into common land, or a plot with an active meter is archived (code `PLOT_HAS_METER`, with
        `errors[{field: kind}]` for the update), or a meter is registered for a plot that already has an active meter
        of the resource (code `METER_ACTIVE_EXISTS`) or for common land (code `METER_COMMON_LAND`) or an archived plot
        (code `PLOT_ARCHIVED`), both with `errors[{field: plotId}]`, a meter with readings is deleted (code
        `METER_HAS_READINGS`), a removed meter is removed again or deleted (code `METER_REMOVED`), or a date or value
        of a reading (the initial or final reading of a meter) is refused: the date is in the future (code
        `READING_DATE_IN_FUTURE`), outside the working period of the meter (code `READING_DATE_OUTSIDE_METER`), or the
        value is lower than the previous reading or the date before a later one (code `READING_OUT_OF_ORDER`), each
        with `errors[{field}]` naming the date or value, or a reading that is not counted is corrected or deleted (code
        `READING_STATUS_INVALID`), or a reading is corrected or deleted although a charge uses the readings around it
        (code `READING_IN_USE`), or a meter with readings waiting for approval is removed or replaced (code
        `METER_HAS_PENDING_READINGS`), or a reading that is not pending is approved or rejected (code
        `READING_STATUS_INVALID`), or a change of the electricity tree breaks its rules (code `METER_TREE_INVALID`,
        with `errors[{field, code}]` naming the rule, see `setMeterParent`), or a meter that has meters under it in the
        tree is deleted, or removed while they still work under it (code `METER_HAS_CHILDREN`), or a plot that has
        charges is deleted (code `PLOT_HAS_CHARGES`), or a charge that was reversed before is reversed again (code
        `CHARGE_ALREADY_REVERSED`), a reversal is reversed (code `REVERSAL_NOT_REVERSIBLE`), or a charge booked in a
        closed billing month is reversed (code `CHARGE_IN_CLOSED_MONTH`), or a billing month is closed while an
        earlier month is open (code `PERIOD_CLOSE_ORDER`), a closed month is closed again (code `PERIOD_CLOSED`) or a
        month after the current one is closed (code `PERIOD_IN_FUTURE`), or the month run is asked for a closed month
        (code `PERIOD_CLOSED`) or a month after the current one (code `PERIOD_IN_FUTURE`), or a booking is sent with
        the digest of a preview that no longer matches what the run would create (code `PREVIEW_OUTDATED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Amount in UAH as a string with two decimal places
      examples: ['1250.50']

    Permission:
      type: string
      description: Fixed list of permissions a role can contain (ADR 0009). Authorities are `PERM_<value>`.
      enum:
        - MEMBERS_VIEW
        - MEMBERS_EDIT
        - ROLES_MANAGE
        - AUDIT_VIEW
        - PLOTS_VIEW
        - PLOTS_EDIT
        - OWNERSHIP_EDIT
        - IMPORT_RUN
        - SETTINGS_MANAGE
        - TARIFFS_VIEW
        - TARIFFS_MANAGE
        - METERS_VIEW
        - METERS_MANAGE
        - READINGS_ENTER
        - READINGS_APPROVE
        - CHARGES_VIEW
        - CHARGES_RUN
        - CHARGES_REVERSE
        - PERIODS_CLOSE

    PlotStatusVisibility:
      type: string
      description: >-
        Who sees the debt status (colour) of a plot. `OWN_ONLY`: a member sees the status of the plots they own only.
        `ALL_PLOTS`: a member sees the status of every plot, but never amounts, owners or personal data of other
        plots. People allowed to view plots always see every status.
      enum: [OWN_ONLY, ALL_PLOTS]

    LossesMode:
      type: string
      description: >-
        How losses in the electricity network are charged. `FIXED_PERCENT`: every electricity interval of a plot also
        charges `lossesPercent` of its kWh at the same rate parts. `PROPORTIONAL`: losses are charged by runs over a
        date range, shared among the plots under each node of the meter tree.
      enum: [FIXED_PERCENT, PROPORTIONAL]

    CommonConsumerSplit:
      type: string
      description: >-
        How the consumption of a common consumer is shared among plots. `CONNECTED_PLOTS`: equally among the plots
        connected to that water source, day by day. `EQUAL_PER_PLOT`: equally among all active plots.
        `SERVICE_USERS`: equally among the plots marked as using the consumer. `NOT_CHARGED`: covered by the
        membership fee, nothing is charged.
      enum: [CONNECTED_PLOTS, EQUAL_PER_PLOT, SERVICE_USERS, NOT_CHARGED]

    LossesPercent:
      type: string
      pattern: '^\d{1,3}(\.\d{1,2})?$'
      description: >-
        A percentage from 0 to 100 with at most two decimal places, as a string (not money). The server answers
        with exactly two decimals (`"5.00"`).
      examples: ['5.00']

    CooperativeSettings:
      type: object
      description: >-
        The settings of the cooperative. `redAmount` and `redDays` are the red threshold of the plot status: a plot
        is red when its debt is above `redAmount` or the oldest unpaid charge is older than `redDays` days, yellow with
        any other debt, green without a debt (docs/domain/money-rules.md, section 9).
      required:
        [
          memberPlotStatusVisibility,
          lossesMode,
          lossesPercent,
          commonConsumerDefaultSplit,
          redAmount,
          redDays,
        ]
      properties:
        memberPlotStatusVisibility:
          $ref: '#/components/schemas/PlotStatusVisibility'
        lossesMode:
          $ref: '#/components/schemas/LossesMode'
        lossesPercent:
          $ref: '#/components/schemas/LossesPercent'
        commonConsumerDefaultSplit:
          $ref: '#/components/schemas/CommonConsumerSplit'
        redAmount:
          $ref: '#/components/schemas/Money'
        redDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 36500

    CooperativeSettingsUpdate:
      type: object
      description: >-
        A change of the settings: only the fields present are changed, the others keep their value. An empty object
        changes nothing.
      properties:
        memberPlotStatusVisibility:
          $ref: '#/components/schemas/PlotStatusVisibility'
        lossesMode:
          $ref: '#/components/schemas/LossesMode'
        lossesPercent:
          $ref: '#/components/schemas/LossesPercent'
        commonConsumerDefaultSplit:
          $ref: '#/components/schemas/CommonConsumerSplit'
        redAmount:
          $ref: '#/components/schemas/Money'
        redDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 36500

    BaseRole:
      type: string
      description: Code of a base role that every cooperative gets; custom roles have no code
      enum: [CHAIRMAN, TREASURER, MEMBER]

    RoleRef:
      type: object
      description: Reference to a role of the cooperative
      required: [id, name, nameCustomized]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseCode:
          $ref: '#/components/schemas/BaseRole'
        nameCustomized:
          type: boolean
          description: |
            True when `name` is the cooperative's own wording: always true for custom roles, true for a base role
            once it was renamed. When false (a base role with its standard name) clients show the standard name from
            their own catalog, in the user's language, chosen by `baseCode`.

    PermissionInfo:
      type: object
      description: A permission with its English name and one-line description; clients localise by `code`
      required: [code, name, description]
      properties:
        code:
          $ref: '#/components/schemas/Permission'
        name:
          type: string
        description:
          type: string

    RoleInput:
      type: object
      description: |
        Editable fields of a role (full replacement). Every role can be renamed, base roles included. The server
        refuses changes of the Chairman role's permissions (409 `BASE_ROLE_IMMUTABLE`); Treasurer and Member
        permissions are editable.
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Role name; surrounding whitespace is trimmed; unique within the cooperative, ignoring case
        useDefaultName:
          type: boolean
          default: false
          description: |
            Base roles only. When true the role gets its standard name back (`nameCustomized` becomes false) and the
            submitted `name` is ignored. On a custom role this is a validation error (400 `VALIDATION_FAILED`,
            field `useDefaultName`, code `INVALID`).
        useDefaultDescription:
          type: boolean
          default: false
          description: |
            Base roles only. When true the role gets its standard description back (`descriptionCustomized` becomes
            false) and the submitted `description` is ignored. On a custom role this is a validation error (400
            `VALIDATION_FAILED`, field `useDefaultDescription`, code `INVALID`).
        description:
          type: string
          maxLength: 500
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'

    RoleDetails:
      type: object
      description: A role with its permissions and the number of active members who hold it
      required: [id, name, nameCustomized, descriptionCustomized, permissions, memberCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameCustomized:
          type: boolean
          description: |
            True when `name` is the cooperative's own wording: always true for custom roles, true for a base role
            once it was renamed. When false (a base role with its standard name) clients show the standard name from
            their own catalog, in the user's language, chosen by `baseCode`.
        description:
          type: string
        descriptionCustomized:
          type: boolean
          description: |
            True when `description` is the cooperative's own wording: always true for custom roles, true for a base
            role once its description was changed (including cleared). When false (a base role with its standard
            description) clients show the standard description from their own catalog, in the user's language,
            chosen by `baseCode`.
        baseCode:
          $ref: '#/components/schemas/BaseRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        memberCount:
          type: integer
          format: int32
          description: Number of active (not archived) members who hold the role

    MemberRolesInput:
      type: object
      description: The complete new set of roles of a member
      required: [roleIds]
      properties:
        roleIds:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            type: string
            format: uuid

    DeliveryChannel:
      type: string
      description: How a member prefers to receive invoices
      enum: [EMAIL, TELEGRAM, VIBER, PAPER]

    Member:
      type: object
      description: |
        A person of the cooperative. `notes` is present only when the caller has the `MEMBERS_VIEW` permission.
      required: [id, lastName, firstName, phones, deliveryChannel, roles, archived]
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        phones:
          type: array
          items:
            type: string
          description: Phone numbers in E.164 format
        email:
          type: string
        postalAddress:
          type: string
        deliveryChannel:
          $ref: '#/components/schemas/DeliveryChannel'
        telegramUsername:
          type: string
        viberPhone:
          type: string
        notes:
          type: string
          description: Internal notes; only for callers with `MEMBERS_VIEW`, the key is absent otherwise
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time

    MemberInput:
      type: object
      description: |
        Editable fields of a member. Names are required; everything else is optional.
        Phone numbers may be written in local form (for example `067 123 45 67`); the server validates and
        normalises them to E.164 (error code `PHONE_INVALID`). A caller without the `MEMBERS_VIEW` permission
        cannot change `notes`: the field is ignored.
      required: [lastName, firstName]
      properties:
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        phones:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
          description: Phone numbers; the format is checked by the server, not by the schema
        email:
          type: string
          format: email
          maxLength: 254
        postalAddress:
          type: string
          maxLength: 500
        deliveryChannel:
          allOf:
            - $ref: '#/components/schemas/DeliveryChannel'
          default: PAPER
          description: >-
            Preferred invoice channel, `PAPER` when omitted. `EMAIL` requires `email`, `TELEGRAM` requires
            `telegramUsername`, `VIBER` requires `viberPhone` (otherwise `CHANNEL_CONTACT_MISSING`).
        telegramUsername:
          type: string
          maxLength: 64
        viberPhone:
          type: string
          maxLength: 32
        notes:
          type: string
          maxLength: 2000
          description: Internal notes; ignored when the caller lacks `MEMBERS_VIEW`

    MemberSummary:
      type: object
      description: A member as shown in the list; contains no postal address, messenger contacts or notes
      required: [id, lastName, firstName, phones, deliveryChannel, roles, archived]
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        phones:
          type: array
          items:
            type: string
          description: Phone numbers in E.164 format
        email:
          type: string
        deliveryChannel:
          $ref: '#/components/schemas/DeliveryChannel'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        archived:
          type: boolean

    MemberPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    AuditAction:
      type: string
      description: What was done
      enum:
        - MEMBER_CREATED
        - MEMBER_UPDATED
        - MEMBER_ARCHIVED
        - MEMBER_RESTORED
        - MEMBER_ROLES_CHANGED
        - ROLE_CREATED
        - ROLE_UPDATED
        - ROLE_DELETED
        - PLOT_CREATED
        - PLOT_UPDATED
        - PLOT_ARCHIVED
        - PLOT_RESTORED
        - PLOT_DELETED
        - SETTINGS_UPDATED
        - OWNERSHIP_CHANGED
        - OWNERSHIP_CORRECTED
        - IMPORT_COMMITTED
        - CHARGE_TYPE_CREATED
        - CHARGE_TYPE_UPDATED
        - CHARGE_TYPE_REORDERED
        - CHARGE_TYPE_ARCHIVED
        - TARIFF_CREATED
        - TARIFF_VERSION_ADDED
        - TARIFF_VERSION_UPDATED
        - TARIFF_VERSION_DELETED
        - TARIFF_SCOPE_CHANGED
        - TARIFF_EXCLUSION_ADDED
        - TARIFF_EXCLUSION_REMOVED
        - METER_REGISTERED
        - METER_UPDATED
        - METER_REMOVED
        - METER_DELETED
        - METER_REPLACED
        - METER_PARENT_CHANGED
        - READING_ENTERED
        - READING_REPLACED
        - READING_CORRECTED
        - READING_DELETED
        - READING_SUBMITTED
        - READING_APPROVED
        - READING_REJECTED
        - CHARGE_REVERSED
        - OPENING_BALANCE_ENTERED
        - BILLING_MONTH_CLOSED
        - BILLING_MONTH_RUN
        - NOT_CHARGED_RETRIED

    AuditEntityType:
      type: string
      description: >-
        Kind of the entity an audit entry is about. A `CHARGE` entry (a reversal, an opening balance, a retried
        "not charged" item) is about the plot whose account changed: its `entityId` is the plot id and its label the
        plot number. A `BILLING_MONTH` entry (a closing, a month run) is about a billing month: its label is the month
        as `YYYY-MM`.
      enum:
        [
          MEMBER,
          ROLE,
          PLOT,
          SETTINGS,
          OWNERSHIP,
          IMPORT,
          CHARGE_TYPE,
          TARIFF,
          METER,
          METER_READING,
          CHARGE,
          BILLING_MONTH,
        ]

    AuditFieldChange:
      type: object
      description: >-
        One changed field. A missing `oldValue` means the field was empty (or the entity was just created).
        Values are codes and parameters, not display text: enum codes, ISO dates (`2026-01-01`), plain decimal
        numbers, `true`/`false`, `base:<CODE>` tokens for a standard role or charge type name (also in the `roles`
        list joined by ", "), and for `owners` a JSON array of `{"member": "Last First", "share": "1/2"}` (a
        correction adds `from` and `to`, ISO dates, `to` absent while the record is open). Meter readings are plain
        decimals with three decimals (`8205.000`). Money amounts are plain decimals with two decimals (`-25.00`), a
        billing month is `YYYY-MM`. Values written before this format are plain text and are shown as stored.
      required: [field]
      properties:
        field:
          type: string
        oldValue:
          type: string
        newValue:
          type: string

    AuditEntry:
      type: object
      required: [id, occurredAt, action, entityType, entityId, changes]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorMemberId:
          type: string
          format: uuid
          description: The member who made the change; absent when the change was made by a system process
        actorName:
          type: string
          description: >-
            Current name of the acting member, resolved by the server; absent when the entry has no acting
            member or that member no longer exists
        action:
          $ref: '#/components/schemas/AuditAction'
        entityType:
          $ref: '#/components/schemas/AuditEntityType'
        entityId:
          type: string
          format: uuid
        entityLabel:
          type: string
          description: >-
            Name of the entity at the time of the change, as a code or user content, never a display phrase:
            the member name, plot number, tariff name, meter name (or a plot meter's serial number) or import file
            name as typed; for a role or a charge type
            the token `base:<CODE>` (for example `base:TREASURER`, `base:MEMBERSHIP`) while it keeps its standard
            name, otherwise its stored name; `settings` for the cooperative settings. The client shows the
            catalog text for a token in the user's language and any other value as is.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/AuditFieldChange'

    AuditPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    TenantSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Me:
      type: object
      required: [userId, email, fullName, platformOperator, roles, permissions, ownedPlots]
      properties:
        userId:
          type: string
          description: Keycloak user id (sub)
        email:
          type: string
        fullName:
          type: string
        memberId:
          type: string
          format: uuid
          description: The member this user is linked to; absent for the platform operator
        platformOperator:
          type: boolean
          description: True for the platform operator, who has no roles, permissions or cooperative data
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Union of the permissions of all the member's roles
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        ownedPlots:
          type: array
          description: |
            The plots the member owns now, in natural order of the plot number; empty for a member who owns nothing
            and for the platform operator.
          items:
            $ref: '#/components/schemas/OwnedPlot'

    OwnedPlot:
      type: object
      description: A plot the signed-in member owns now, with their share.
      required: [plotId, number, share]
      properties:
        plotId:
          type: string
          format: uuid
        number:
          type: string
        street:
          type: string
        share:
          $ref: '#/components/schemas/OwnershipShare'

    PlotKind:
      type: string
      enum: [PLOT, COMMON]
      description: PLOT is a land plot, COMMON is common land (roads, shared areas)

    PlotStatus:
      type: string
      enum: [RED, YELLOW, GREEN, GREY]
      description: Map color, see docs/domain/money-rules.md, section 9

    PlotSummary:
      type: object
      description: |
        A plot or common land in the list. `areaM2`, `cadastralNumber` and `hasBuilding` are present only for callers
        who may see the details of the plot (`PLOTS_VIEW`, or the caller currently owns the plot); `street` is absent
        when the plot has none. `status` is absent when the caller may not see it: a member who does not own the plot
        while the cooperative setting `memberPlotStatusVisibility` is `OWN_ONLY` (people with `PLOTS_VIEW` and the
        plot's current owners always see it).
      required: [id, number, kind, archived]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        street:
          type: string
        kind:
          $ref: '#/components/schemas/PlotKind'
        status:
          $ref: '#/components/schemas/PlotStatus'
        archived:
          type: boolean
        areaM2:
          type: number
          description: Area in square metres, at most two decimal places
        cadastralNumber:
          type: string
        hasBuilding:
          type: boolean
        owners:
          type: array
          description: |
            The current owners (name and share), ordered by name. Present only for callers with `PLOTS_VIEW`, and
            absent for common land and for a plot without owners.
          items:
            $ref: '#/components/schemas/PlotOwnerSummary'

    PlotOwnerSummary:
      type: object
      required: [memberId, name, share]
      properties:
        memberId:
          type: string
          format: uuid
        name:
          type: string
          description: Member name, "Last First" (no patronymic)
        share:
          $ref: '#/components/schemas/OwnershipShare'

    OwnershipShare:
      type: string
      pattern: '^[1-9][0-9]{0,3}/[1-9][0-9]{0,3}$'
      example: '1/2'
      description: |
        Share of a plot as a fraction "numerator/denominator" in lowest terms; the denominator is at most 1000 and
        the numerator is at most the denominator.

    Ownership:
      type: object
      description: One owner record of a plot, current (no `validTo`) or past.
      required: [id, memberId, memberName, memberArchived, share, validFrom]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        memberName:
          type: string
          description: Member name, "Last First" (no patronymic)
        memberArchived:
          type: boolean
        share:
          $ref: '#/components/schemas/OwnershipShare'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: Last day of ownership; absent for a current owner
        basis:
          type: string
          maxLength: 500
          description: Note on the basis of ownership (sale contract, inheritance, court decision)

    PlotOwnerships:
      type: object
      required: [plotId, current, history]
      properties:
        plotId:
          type: string
          format: uuid
        current:
          type: array
          description: Current owners, ordered by member name
          items:
            $ref: '#/components/schemas/Ownership'
        history:
          type: array
          description: Past owners, newest first (by start date)
          items:
            $ref: '#/components/schemas/Ownership'

    MemberOwnershipItem:
      type: object
      description: One ownership record of a member, with the plot it is about.
      required: [ownershipId, plotId, plotNumber, share, validFrom]
      properties:
        ownershipId:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
        street:
          type: string
        share:
          $ref: '#/components/schemas/OwnershipShare'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: Last day of ownership; absent for a plot the member owns now

    MemberOwnerships:
      type: object
      required: [current, past]
      properties:
        current:
          type: array
          description: Plots owned now, in natural order of the plot number
          items:
            $ref: '#/components/schemas/MemberOwnershipItem'
        past:
          type: array
          description: Plots owned in the past, the most recently ended first
          items:
            $ref: '#/components/schemas/MemberOwnershipItem'

    OwnershipChangeOwner:
      type: object
      description: One owner of a plot from the date of the change.
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid
          description: An active member of the cooperative
        share:
          type: string
          pattern: '^[1-9][0-9]{0,3}/[1-9][0-9]{0,3}$'
          default: '1/1'
          example: '1/2'
          description: |
            Share as a fraction "numerator/denominator" (the same form as `OwnershipShare`; written inline because the
            code generator does not quote a default next to a `$ref`). A missing share is "1/1". The denominator is at
            most 1000 and the numerator is at most the denominator, otherwise `SHARE_INVALID`; "2/4" is saved as "1/2".

    OwnershipChange:
      type: object
      description: A change of the owners of a plot, effective on a date.
      required: [effectiveFrom, owners]
      properties:
        effectiveFrom:
          type: string
          format: date
          description: |
            The day the new owners start; the previous owners end the day before. Not in the future, and later than
            every current owner's start date and every past owner's end date.
        owners:
          type: array
          minItems: 0
          maxItems: 20
          description: The owners from `effectiveFrom`, with shares adding up to one whole; empty means no owner.
          items:
            $ref: '#/components/schemas/OwnershipChangeOwner'
        basis:
          type: string
          maxLength: 500
          description: Note on the basis of the change (sale contract, inheritance, court decision)

    OwnershipCorrectionCoOwner:
      type: object
      description: The corrected share of another owner record of the same plot.
      required: [ownershipId, share]
      properties:
        ownershipId:
          type: string
          format: uuid
          description: A record of the same plot, other than the one being corrected
        share:
          type: string
          pattern: '^[1-9][0-9]{0,3}/[1-9][0-9]{0,3}$'
          example: '1/3'
          description: |
            Share as a fraction "numerator/denominator" (the same form as `OwnershipShare`, written inline like in
            `OwnershipChangeOwner`). The denominator is at most 1000 and the numerator is at most the denominator,
            otherwise `SHARE_INVALID`.

    OwnershipCorrection:
      type: object
      description: |
        A correction of one owner record: a full replacement of its fields, with a reason, and optionally the shares
        of other records of the same plot.
      required: [memberId, share, validFrom, reason]
      properties:
        memberId:
          type: string
          format: uuid
          description: The member of the record (an active member, or the record's own member)
        share:
          type: string
          pattern: '^[1-9][0-9]{0,3}/[1-9][0-9]{0,3}$'
          example: '2/3'
          description: |
            Share as a fraction "numerator/denominator" (the same form as `OwnershipShare`, written inline). The
            denominator is at most 1000 and the numerator is at most the denominator, otherwise `SHARE_INVALID`.
        validFrom:
          type: string
          format: date
          description: The first day of ownership; not in the future
        validTo:
          type: string
          format: date
          description: The last day of ownership; absent for a current owner. Not in the future, not before `validFrom`
        basis:
          type: string
          maxLength: 500
          description: Note on the basis of ownership; absent clears it
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the record is corrected; required, not blank
        coOwnerShares:
          type: array
          minItems: 0
          maxItems: 20
          description: Corrected shares of other records of the same plot, to correct them in the same step
          items:
            $ref: '#/components/schemas/OwnershipCorrectionCoOwner'

    PlotDetails:
      description: |
        The plot card: everything in `PlotSummary` plus `notes`, `archivedAt`, `createdAt` and `updatedAt`.
        `notes`, `createdAt` and `updatedAt` are board-only: present only for callers with `PLOTS_VIEW`, never for an
        owner of the plot; `archivedAt` is present for an archived plot.
      allOf:
        - $ref: '#/components/schemas/PlotSummary'
        - type: object
          properties:
            notes:
              type: string
            archivedAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PlotInput:
      type: object
      description: |
        Editable fields of a plot or common land (full replacement on update). The number is trimmed; blank optional
        text becomes empty. The area is never rounded: more than two decimal places is rejected (`AREA_INVALID`).
        The cadastral number format is checked by the server (`CADASTRAL_INVALID`), not by the schema.
      required: [number, kind, areaM2]
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 20
          description: Free text such as `12`, `12а` or `R-1`; unique among the active plots, ignoring case
        street:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/PlotKind'
        areaM2:
          type: number
          description: >-
            Area in square metres with at most two decimal places and at most eight integer digits; greater than
            zero for a plot, zero or more for common land
        cadastralNumber:
          type: string
          maxLength: 22
          description: Optional, of the form `1234567890:12:345:6789`; unique in the cooperative, archived plots included
        hasBuilding:
          type: boolean
          default: false
          description: Whether a building stands on the plot; reference information only
        notes:
          type: string
          maxLength: 2000

    PlotPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlotSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    PolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          description: Polygon rings, points as [longitude, latitude] in WGS84
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
                format: double

    PlotProperties:
      type: object
      description: |
        `areaM2` and `debt` are present for callers with `PLOTS_VIEW` and for the current owners of the plot. `status`
        is absent when the caller may not see it, under the same rule as `PlotSummary.status`.
      required: [number, kind]
      properties:
        number:
          type: string
        street:
          type: string
        kind:
          $ref: '#/components/schemas/PlotKind'
        areaM2:
          type: number
          format: double
          description: Absent for callers who may not see the details of the plot, like `debt`
        status:
          $ref: '#/components/schemas/PlotStatus'
        debt:
          $ref: '#/components/schemas/Money'

    PlotFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
          format: uuid
        geometry:
          $ref: '#/components/schemas/PolygonGeometry'
        properties:
          $ref: '#/components/schemas/PlotProperties'

    PlotFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/PlotFeature'

    ImportPreview:
      type: object
      description: >-
        What an uploaded file would do. Nothing is saved by the preview itself. The preview can be committed until
        `expiresAt` when `committable` is true.
      required: [id, fileName, expiresAt, counts, problems, problemCount, committable]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          description: Base name of the uploaded file, sanitised
        expiresAt:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/ImportCounts'
        problems:
          type: array
          description: At most 1,000 problems, in sheet and row order; `problemCount` is the total
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ImportProblem'
        problemCount:
          type: integer
          minimum: 0
        committable:
          type: boolean
          description: True when there are no problems and at least one record would be created or updated

    ImportPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ImportSummary:
      type: object
      description: One uploaded file in the import history. The stored rows of the file are never part of it.
      required: [id, fileName, uploadedBy, uploadedAt, status, counts, problemCount]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          description: Base name of the uploaded file, sanitised
        uploadedBy:
          type: string
          description: >-
            Name of the member who uploaded the file: the current name when the member still exists, the name at
            the time of the upload otherwise
        uploadedAt:
          type: string
          format: date-time
        committedAt:
          type: string
          format: date-time
          description: When the import was saved; present only when `status` is `COMMITTED`
        status:
          $ref: '#/components/schemas/ImportRunStatus'
        counts:
          $ref: '#/components/schemas/ImportCounts'
        problemCount:
          type: integer
          minimum: 0
          description: Number of problems found in the file; 0 for a file without problems

    ImportRunStatus:
      type: string
      description: >-
        State of an uploaded file. `EXPIRED` is a `PREVIEW` that was not committed within 30 minutes (derived, not
        stored).
      enum: [PREVIEW, HAS_ERRORS, COMMITTED, STALE, EXPIRED]

    ImportResult:
      type: object
      description: What a committed import saved. The counts are those of the preview.
      required: [id, counts]
      properties:
        id:
          type: string
          format: uuid
        counts:
          $ref: '#/components/schemas/ImportCounts'

    ImportCounts:
      type: object
      description: Records per sheet. Rows with a problem are not counted.
      required: [plots, members, ownerships, meters]
      properties:
        plots:
          $ref: '#/components/schemas/ImportEntityCounts'
        members:
          $ref: '#/components/schemas/ImportEntityCounts'
        ownerships:
          $ref: '#/components/schemas/ImportEntityCounts'
        meters:
          $ref: '#/components/schemas/ImportEntityCounts'

    ImportEntityCounts:
      type: object
      required: [created, updated, unchanged]
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0

    ImportProblem:
      type: object
      required: [sheet, row, code]
      properties:
        sheet:
          type: string
          enum: [FILE, PLOTS, MEMBERS, OWNERSHIP, METERS]
        row:
          type: integer
          minimum: 0
          description: Excel row number; 0 when the problem is about the file or the whole sheet
        column:
          type: string
          description: Canonical column key, for example `area_m2`; absent when the problem is about the whole row
        code:
          type: string
          description: Stable machine-readable code, see `uploadImport`
        params:
          type: object
          description: Values for the message, for example the name of a missing column
          additionalProperties:
            type: string

    Problem:
      type: object
      description: >-
        RFC 9457 Problem Details, served as `application/problem+json`. Error responses also declare
        `application/json` so that a client sending `Accept: application/json` (the web client does) is never
        answered with 406; the body is the same. `detail` is English and never contains personal data.
      required: [title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: >-
            Stable machine-readable error code, for example `VALIDATION_FAILED`, `NOT_FOUND` or `PLOT_NOT_FOUND`
        errors:
          type: array
          description: Field-level validation errors
          items:
            $ref: '#/components/schemas/ProblemFieldError'

    ProblemFieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          description: >-
            Field error code: `REQUIRED` (missing or blank), `TOO_LONG` (over the maximum length or item count),
            `INVALID` (wrong format, for example an email), `PHONE_INVALID` (not a valid phone number),
            `CHANNEL_CONTACT_MISSING` (the chosen delivery channel has no contact to deliver to),
            `CADASTRAL_INVALID` (not of the form `NNNNNNNNNN:NN:NNN:NNNN`), `AREA_INVALID` (more than two decimal
            places, too large, or not greater than zero for a plot), `SHARE_INVALID` (not a fraction `n/d` with
            1 <= n <= d <= 1000), `MEMBER_NOT_FOUND` (no such member in the cooperative), `OWNERSHIP_NOT_FOUND` (no
            such owner record in the same plot, or the record being corrected), `RATE_INVALID` (a tariff rate that is
            not a non-negative number with at most 10 integer and 4 decimal digits), `FREQUENCY_BASIS_MISMATCH`
            (`ONE_OFF` without `FIXED_ONE_TIME`, or `FIXED_ONE_TIME` without `ONE_OFF`), `TARIFF_COMMON_LAND` (common
            land cannot be in the scope of a tariff), `PLOT_ARCHIVED` (an archived plot), `UNKNOWN_PLOT` (no such plot
            in the cooperative), `DUPLICATE` (the same plot listed twice), `METER_VALUE_INVALID` (a meter reading that
            is not a non-negative number with at most 11 integer and 3 decimal digits); with `METER_TREE_INVALID`:
            `TREE_WATER` (a water meter has no tree), `TREE_QUARTER_UNDER_QUARTER` (a quarter meter under another
            quarter meter), `TREE_PARENT_KIND` (the kinds do not allow this parent), `TREE_PARENT_INACTIVE` (the parent
            is removed or not yet installed on the date), `TREE_DATE_BEFORE_LATEST` (a date before the meter's latest
            change in the tree), `READING_DATE_OUTSIDE_METER` (a date before the meter's installation),
            `AMOUNT_NOT_POSITIVE` (an amount that is zero or negative), `DATE_IN_FUTURE` (a date after today in
            Europe/Kyiv), `NOT_FOUND` (no such charge type in the cooperative)
        message:
          type: string

    ChargeTypeCode:
      type: string
      description: Code of one of the five charge types every cooperative starts with; custom types have no code
      enum: [MEMBERSHIP, ELECTRICITY, LAND_TAX, WATER, COMMON_CONSUMERS]

    ChargeType:
      type: object
      description: What the cooperative charges for
      required: [id, name, nameCustomized, active, position]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/ChargeTypeCode'
        name:
          type: string
          description: >-
            The stored name. While `nameCustomized` is false it is the English default of a starting type and clients
            show their own localised default name instead
        nameCustomized:
          type: boolean
          description: True for custom types and for starting types that were renamed
        description:
          type: string
        active:
          type: boolean
          description: An inactive type stays in the list but its tariffs give no expected amount
        position:
          type: integer
          format: int32
          description: Place in the list; ties are ordered by id

    ChargeTypeCreate:
      type: object
      description: A new custom charge type
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters; surrounding whitespace is trimmed; unique among non-archived types, ignoring case
        description:
          type: string
          maxLength: 500

    ChargeTypeUpdate:
      type: object
      description: Editable fields of a charge type (full replacement)
      required: [name, active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters; surrounding whitespace is trimmed; unique among non-archived types, ignoring case
        description:
          type: string
          maxLength: 500
          description: Blank text clears the description
        active:
          type: boolean

    ChargeTypeOrder:
      type: object
      description: The full new order of the non-archived charge types
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 500
          description: Every non-archived charge type id exactly once, in the new order
          items:
            type: string
            format: uuid

    Rate:
      type: string
      pattern: '^\d{1,10}(\.\d{1,4})?$'
      description: >-
        A tariff rate as a string: not negative, at most 10 integer digits and at most 4 digits after the decimal
        point. It is never rounded; the server returns it with exactly four decimals (`"4.3200"`). Not a money amount:
        a rate times a quantity becomes money only in the calculation.
      examples: ['4.3200']

    Basis:
      type: string
      description: What the rate applies to
      enum: [PER_PLOT, PER_AREA_SOTKA, PER_KWH, PER_M3, FIXED_ONE_TIME]

    Frequency:
      type: string
      description: How often the rate is meant. `ONE_OFF` goes only with `FIXED_ONE_TIME`.
      enum: [MONTHLY, QUARTERLY, YEARLY, ONE_OFF]

    TariffScopeKind:
      type: string
      description: Which plots a tariff applies to
      enum: [ALL_PLOTS, SELECTED_PLOTS]

    TariffExclusionUpdate:
      type: object
      description: A plot excluded from a tariff of all plots, with the reason
      required: [plotId, reason]
      properties:
        plotId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the plot is exempt; 1 to 500 characters after trimming, never blank

    TariffScopeUpdate:
      type: object
      description: The complete scope of a tariff; it replaces the stored one
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/TariffScopeKind'
        plotIds:
          type: array
          maxItems: 5000
          description: The selected plots; only with `SELECTED_PLOTS`; no plot twice, no common land
          items:
            type: string
            format: uuid
        exclusions:
          type: array
          maxItems: 5000
          description: The excluded plots with reasons; only with `ALL_PLOTS`; no plot twice, no common land
          items:
            $ref: '#/components/schemas/TariffExclusionUpdate'

    TariffScopePlot:
      type: object
      description: A plot named by the scope of a tariff
      required: [plotId, number, archived]
      properties:
        plotId:
          type: string
          format: uuid
        number:
          type: string
          description: The plot number as the cooperative writes it
        archived:
          type: boolean
          description: True when the plot was archived after it was added; it is not counted

    TariffExclusion:
      type: object
      description: A plot excluded from a tariff of all plots, with the reason
      required: [plotId, number, archived, reason]
      properties:
        plotId:
          type: string
          format: uuid
        number:
          type: string
        archived:
          type: boolean
          description: True when the plot was archived after it was excluded; it is not counted
        reason:
          type: string

    TariffVersionCreate:
      type: object
      description: The terms of a version of a tariff, new or corrected (same rules for both)
      required: [validFrom, basis, frequency, rate]
      properties:
        validFrom:
          type: string
          format: date
          description: The date the version applies from; unique among the versions of the tariff
        basis:
          $ref: '#/components/schemas/Basis'
        frequency:
          $ref: '#/components/schemas/Frequency'
        rate:
          $ref: '#/components/schemas/Rate'
        dueDate:
          type: string
          format: date
          description: Required for `FIXED_ONE_TIME` (and only for it)
        note:
          type: string
          maxLength: 500
          description: Optional free text, for example the decision of the general meeting; blank text is not stored

    TariffVersion:
      type: object
      description: One version of a tariff
      required: [id, validFrom, basis, frequency, rate, pastDated]
      properties:
        id:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: The day before the next version starts; absent for the last version
        basis:
          $ref: '#/components/schemas/Basis'
        frequency:
          $ref: '#/components/schemas/Frequency'
        rate:
          $ref: '#/components/schemas/Rate'
        dueDate:
          type: string
          format: date
        note:
          type: string
        pastDated:
          type: boolean
          description: True when `validFrom` is before today (Europe/Kyiv); charges of past periods will be recalculated

    TariffCreate:
      type: object
      description: A new tariff with its first version
      required: [chargeTypeId, name, firstVersion]
      properties:
        chargeTypeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters; surrounding whitespace is trimmed
        firstVersion:
          $ref: '#/components/schemas/TariffVersionCreate'

    TariffConflictPlot:
      type: object
      description: A plot on which two tariffs conflict
      required: [plotId, number]
      properties:
        plotId:
          type: string
          format: uuid
        number:
          type: string
          description: User content, as the cooperative writes it

    TariffConflict:
      type: object
      description: >-
        Another tariff of the same charge type that applies to some of the same plots from today on: on those plots
        neither tariff is charged (the case goes to the "not charged" queue) until a scope is changed. A warning only;
        both tariffs stay valid.
      required: [otherTariffId, otherTariffName, plotCount, plots]
      properties:
        otherTariffId:
          type: string
          format: uuid
        otherTariffName:
          type: string
          description: User content
        plotCount:
          type: integer
          format: int64
          description: The number of plots both tariffs apply to
        plots:
          type: array
          maxItems: 10
          description: The first of those plots in the natural order of the numbers (at most 10)
          items:
            $ref: '#/components/schemas/TariffConflictPlot'

    TariffSummary:
      type: object
      description: A tariff in the list, with the version that is shown
      required: [id, name, chargeTypeId, scopeKind, version, conflicts]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        chargeTypeId:
          type: string
          format: uuid
        scopeKind:
          $ref: '#/components/schemas/TariffScopeKind'
        version:
          $ref: '#/components/schemas/TariffVersion'
        plotCount:
          type: integer
          format: int64
          description: >-
            Number of plots the tariff applies to; for a meter-based version (`PER_KWH`, `PER_M3`) only the plots
            with an active meter of the resource
        conflicts:
          type: array
          description: >-
            The other tariffs of the same charge type that apply to some of the same active plots, ordered by name;
            empty when there is no conflict or the charge type is inactive
          items:
            $ref: '#/components/schemas/TariffConflict'

    Tariff:
      type: object
      description: A tariff with its charge type, all versions and its scope
      required: [id, name, chargeType, scopeKind, versions, selectedPlots, exclusions, conflicts]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        chargeType:
          $ref: '#/components/schemas/ChargeType'
        scopeKind:
          $ref: '#/components/schemas/TariffScopeKind'
        versions:
          type: array
          description: Newest first (by `validFrom`)
          items:
            $ref: '#/components/schemas/TariffVersion'
        selectedPlots:
          type: array
          description: With `SELECTED_PLOTS`, the selected plots in natural order of the number (archived ones marked); empty otherwise
          items:
            $ref: '#/components/schemas/TariffScopePlot'
        exclusions:
          type: array
          description: With `ALL_PLOTS`, the excluded plots in natural order of the number (archived ones marked); empty otherwise
          items:
            $ref: '#/components/schemas/TariffExclusion'
        plotCount:
          type: integer
          format: int64
          description: >-
            Number of plots the tariff applies to, as in the list (exclusions subtracted, archived plots and common
            land never counted); when the shown version (the one valid today, else the earliest future one) is
            meter-based, only the plots with an active meter of its resource
        conflicts:
          type: array
          description: As in the list
          items:
            $ref: '#/components/schemas/TariffConflict'

    ExpectedChargeStatus:
      type: string
      description: >-
        `AMOUNT` the plot is charged `amount`; `BY_READINGS` the amount depends on meter readings and is not known here;
        `NO_METER` the tariff is charged by meter and the plot has no meter of that resource in the month, so nothing
        is charged and it is not in `total`; `EXCLUDED` the tariff does not apply to the plot (see `reason`)
      enum: [AMOUNT, BY_READINGS, NO_METER, EXCLUDED]

    PlotTariffItem:
      type: object
      description: One tariff that applies to a plot in a month, with the expected amount
      required:
        [
          tariffId,
          tariffName,
          chargeTypeId,
          chargeTypeName,
          chargeTypeNameCustomized,
          basis,
          frequency,
          rate,
          status,
        ]
      properties:
        tariffId:
          type: string
          format: uuid
        tariffName:
          type: string
        chargeTypeId:
          type: string
          format: uuid
        chargeTypeCode:
          $ref: '#/components/schemas/ChargeTypeCode'
        chargeTypeName:
          type: string
          description: The stored name; clients show their own default name while `chargeTypeNameCustomized` is false
        chargeTypeNameCustomized:
          type: boolean
        basis:
          $ref: '#/components/schemas/Basis'
        frequency:
          $ref: '#/components/schemas/Frequency'
        rate:
          $ref: '#/components/schemas/Rate'
        status:
          $ref: '#/components/schemas/ExpectedChargeStatus'
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          description: Why the plot is excluded; only with status `EXCLUDED`

    PlotTariffs:
      type: object
      description: The tariffs that apply to a plot in a month and the expected amounts
      required: [month, items, total]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The month the amounts are for, `YYYY-MM`
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlotTariffItem'
        total:
          $ref: '#/components/schemas/Money'

    MeterKind:
      type: string
      description: >-
        `PLOT` belongs to one plot; `SUBSTATION`, `QUARTER` (feeds a group of plots) and `COMMON_CONSUMER` (a well
        pump, street lighting) are named meters of the electricity tree
      enum: [PLOT, SUBSTATION, QUARTER, COMMON_CONSUMER]

    MeterResource:
      type: string
      description: What a meter measures, `ELECTRICITY` in kWh or `WATER` in cubic metres
      enum: [ELECTRICITY, WATER]

    MeterValue:
      type: string
      pattern: '^\d{1,11}(\.\d{1,3})?$'
      description: >-
        A meter reading as a string: not negative, at most 11 integer digits and at most 3 digits after the decimal
        point. It is never rounded; the server returns it with exactly three decimals (`"8205.000"`). Not money.
        Field code `METER_VALUE_INVALID` when it does not match.
      examples: ['8205.000']

    MeterPoint:
      type: object
      description: A value of a meter on a date
      required: [takenOn, value]
      properties:
        takenOn:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/MeterValue'

    MeterPlot:
      type: object
      description: The plot of a plot meter
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        street:
          type: string

    Meter:
      type: object
      description: A meter of the register
      required: [id, kind, resource, serial, installedOn, initialReading, active, deletable, lastReading]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MeterKind'
        resource:
          $ref: '#/components/schemas/MeterResource'
        serial:
          type: string
        name:
          type: string
          description: The name of a meter that is not a plot meter; absent for a plot meter
        plot:
          $ref: '#/components/schemas/MeterPlot'
        installedOn:
          type: string
          format: date
        initialReading:
          $ref: '#/components/schemas/MeterValue'
        removedOn:
          type: string
          format: date
          description: Present once the meter is removed, together with `finalReading`
        finalReading:
          $ref: '#/components/schemas/MeterValue'
        note:
          type: string
          description: The board's note; absent for a member who sees the meter of their own plot
        replacesMeterId:
          type: string
          format: uuid
          description: The meter this one replaced; the same id as `replaces.id`, kept for older clients
        replaces:
          $ref: '#/components/schemas/MeterPredecessor'
          description: >-
            The meter this one replaced, with the day it was removed and its final reading; absent for a meter that
            replaced nothing. For a counter that wrapped around its serial is this meter's own
        replacedBy:
          $ref: '#/components/schemas/MeterSuccessor'
          description: >-
            The meter that replaced this one; the day and the final reading of the replacement are this meter's own
            `removedOn` and `finalReading`. Absent for a meter that was not replaced (active, or removed without a
            replacement)
        active:
          type: boolean
          description: True until the meter is removed
        deletable:
          type: boolean
          description: True when the meter may be deleted (active and without readings); otherwise it is removed instead
        lastReading:
          $ref: '#/components/schemas/MeterPoint'
          description: >-
            The latest point of the meter: its final reading once removed, otherwise its latest counted reading, or
            the initial reading when there is none

    MeterPredecessor:
      type: object
      description: >-
        The meter a meter replaced: the previous meter of the same chain, of the same plot (or the same named meter).
        A replacement removes it on the day the new meter is installed, so it always has a removal day and a final
        reading
      required: [id, serial, removedOn, finalReading]
      properties:
        id:
          type: string
          format: uuid
        serial:
          type: string
        removedOn:
          type: string
          format: date
          description: The day the predecessor was removed, the installation day of the meter that replaced it
        finalReading:
          $ref: '#/components/schemas/MeterValue'
          description: The final reading of the predecessor

    MeterSuccessor:
      type: object
      description: The meter that replaced a meter, the next meter of the same chain, of the same plot
      required: [id, serial]
      properties:
        id:
          type: string
          format: uuid
        serial:
          type: string

    MeterCreate:
      type: object
      description: A new meter
      required: [kind, resource, serial, installedOn, initialReading]
      properties:
        kind:
          $ref: '#/components/schemas/MeterKind'
        resource:
          $ref: '#/components/schemas/MeterResource'
        plotId:
          type: string
          format: uuid
          description: Required for a plot meter, absent for any other kind
        serial:
          type: string
          minLength: 1
          maxLength: 50
          description: 1 to 50 characters; surrounding whitespace is trimmed
        name:
          type: string
          maxLength: 100
          description: Required for a meter that is not a plot meter (1 to 100 characters, trimmed); absent for a plot meter
        installedOn:
          type: string
          format: date
          description: The installation date, the date of the initial reading; not after today
        initialReading:
          $ref: '#/components/schemas/MeterValue'
        note:
          type: string
          maxLength: 500
          description: Optional; blank text is not stored

    MeterUpdate:
      type: object
      description: The descriptive fields of a meter
      required: [serial]
      properties:
        serial:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          maxLength: 100
        note:
          type: string
          maxLength: 500

    MeterRemoval:
      type: object
      description: The end of a meter's working period
      required: [removedOn, finalReading]
      properties:
        removedOn:
          type: string
          format: date
        finalReading:
          $ref: '#/components/schemas/MeterValue'

    ReadingStatus:
      type: string
      description: >-
        `APPROVED` counts for consumption; `PENDING` waits for approval (a member's submission); `REJECTED` was not
        approved (with a reason); `SUPERSEDED` was replaced by a later reading of the same date or by a correction
      enum: [APPROVED, PENDING, REJECTED, SUPERSEDED]

    ReadingSource:
      type: string
      description: Who brought the reading in, the board or the electrician (`ENTERED`), the Excel import or a member
      enum: [ENTERED, IMPORTED, MEMBER]

    ReadingWarning:
      type: string
      description: >-
        `UNUSUAL_CONSUMPTION`: the daily consumption of the interval the reading closes is more than 3 times the
        meter's usual daily consumption over the last 180 days. The reading is saved
      enum: [UNUSUAL_CONSUMPTION]

    ReadingInterval:
      type: object
      description: >-
        The consumption between two neighbouring counted points of a meter (initial reading, approved readings, final
        reading), calculated by the server
      required: [from, to, days, consumption]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
          format: int32
          description: The number of days from `from` to `to`
        consumption:
          $ref: '#/components/schemas/MeterValue'

    MeterReading:
      type: object
      description: A reading of a meter
      required: [id, meterId, takenOn, value, status, source, changeable]
      properties:
        id:
          type: string
          format: uuid
        meterId:
          type: string
          format: uuid
        takenOn:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/MeterValue'
        status:
          $ref: '#/components/schemas/ReadingStatus'
        source:
          $ref: '#/components/schemas/ReadingSource'
        supersededById:
          type: string
          format: uuid
          description: The reading that replaced this one; absent when it was deleted since
        rejectReason:
          type: string
          description: Why a `REJECTED` reading was not approved (user content)
        interval:
          $ref: '#/components/schemas/ReadingInterval'
          description: The interval this approved reading closes; absent for other statuses and on the installation date
        changeable:
          type: boolean
          description: >-
            True when the caller may correct or delete the reading now: it is approved, the caller has
            `READINGS_ENTER` and no charge uses it

    MeterReadingHistory:
      type: object
      description: The readings of one meter and its intervals
      required: [meterId, readings, intervals]
      properties:
        meterId:
          type: string
          format: uuid
        readings:
          type: array
          items:
            $ref: '#/components/schemas/MeterReading'
        intervals:
          type: array
          description: Newest first
          items:
            $ref: '#/components/schemas/ReadingInterval'

    ReadingEntry:
      type: object
      description: One reading to enter
      required: [meterId, value]
      properties:
        meterId:
          type: string
          format: uuid
        takenOn:
          type: string
          format: date
          description: The day the meter was read; absent means today in Europe/Kyiv
        value:
          $ref: '#/components/schemas/MeterValue'

    ReadingBatch:
      type: object
      description: Readings to enter, each saved on its own
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReadingEntry'

    ReadingRowOutcome:
      type: string
      enum: [SAVED, REJECTED]

    ReadingRowError:
      type: object
      description: Why a row was not saved, as a code with parameters (never display text)
      required: [code]
      properties:
        code:
          type: string
          description: >-
            `NOT_FOUND`, `VALIDATION_FAILED`, `READING_DATE_IN_FUTURE`, `READING_DATE_OUTSIDE_METER`,
            `READING_OUT_OF_ORDER` or `READING_IN_USE`
        field:
          type: string
          description: The field of the row the error is about (`meterId`, `takenOn` or `value`)
        params:
          type: object
          description: >-
            Values for the message: ISO dates (`today`, `installedOn`, `removedOn`, `previousTakenOn`, `nextTakenOn`)
            and meter values with three decimals (`previousValue`, `nextValue`)
          additionalProperties:
            type: string

    ReadingRowResult:
      type: object
      description: The result of one row of a batch
      required: [index, meterId, outcome, supersededReadingIds, warnings]
      properties:
        index:
          type: integer
          format: int32
          description: The position of the row in the request, from 0
        meterId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/ReadingRowOutcome'
        reading:
          $ref: '#/components/schemas/MeterReading'
          description: The saved reading with the interval it closes; present when `SAVED`
        supersededReadingIds:
          type: array
          items:
            type: string
            format: uuid
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ReadingWarning'
        error:
          $ref: '#/components/schemas/ReadingRowError'
          description: Present when `REJECTED`

    ReadingBatchResult:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReadingRowResult'

    ReadingCorrection:
      type: object
      description: The corrected date and value of a reading
      required: [takenOn, value]
      properties:
        takenOn:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/MeterValue'

    ReadingSaved:
      type: object
      description: A saved reading, the readings it replaced and its warnings
      required: [reading, supersededReadingIds, warnings]
      properties:
        reading:
          $ref: '#/components/schemas/MeterReading'
        supersededReadingIds:
          type: array
          items:
            type: string
            format: uuid
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ReadingWarning'

    ReadingSubmission:
      type: object
      description: A reading a member submits for a meter of their own plot
      required: [meterId, value]
      properties:
        meterId:
          type: string
          format: uuid
        takenOn:
          type: string
          format: date
          description: The day the meter was read; absent means today in Europe/Kyiv
        value:
          $ref: '#/components/schemas/MeterValue'

    ReadingRejection:
      type: object
      description: Why a submitted reading is not approved
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Shown to the member as typed (user content); surrounding whitespace is trimmed

    PendingReading:
      type: object
      description: A reading waiting for approval, with its meter
      required: [reading, meter, warnings]
      properties:
        reading:
          $ref: '#/components/schemas/MeterReading'
        meter:
          $ref: '#/components/schemas/Meter'
        interval:
          $ref: '#/components/schemas/ReadingInterval'
          description: >-
            The interval the reading would close once approved, from the counted point before it; absent when the
            reading does not fit between the counted readings (approval would be refused) or is on the installation
            date
        warnings:
          type: array
          description: The warnings the reading would carry once approved
          items:
            $ref: '#/components/schemas/ReadingWarning'

    MeterReplacement:
      type: object
      description: The replacement of a meter by a new one on one day
      required: [replacedOn, finalReading, serial, initialReading]
      properties:
        replacedOn:
          type: string
          format: date
          description: The day the old meter is removed and the new one installed; not after today
        finalReading:
          $ref: '#/components/schemas/MeterValue'
          description: The final reading of the old meter
        serial:
          type: string
          minLength: 1
          maxLength: 50
          description: The serial number of the new meter (the same one for a counter that wrapped around); trimmed
        initialReading:
          $ref: '#/components/schemas/MeterValue'
          description: The initial reading of the new meter (0 for a counter that wrapped around)

    MeterConsumption:
      type: object
      description: The consumption of a meter's chain over a date range, calculated by the server
      required: [meterId, from, to, meterIds, known, calculated]
      properties:
        meterId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        meterIds:
          type: array
          description: The meters whose consumption is added up, oldest installation first
          items:
            type: string
            format: uuid
        known:
          type: boolean
          description: False when a meter of the chain has no counted point after the end of its part of the range
        consumption:
          $ref: '#/components/schemas/MeterValue'
          description: Present when `known`; rounded once to three decimals when `calculated`
        calculated:
          type: boolean
          description: True when a value at an end of the range was calculated between two readings
        lastReadingOn:
          type: string
          format: date
          description: When not `known`, the day after which there is no reading; absent when there is none before either

    MeterParentChange:
      type: object
      description: A move of an electricity meter in the tree
      required: [effectiveFrom]
      properties:
        parentMeterId:
          type: string
          format: uuid
          description: The new parent; absent to take the meter out of the tree from `effectiveFrom`
        effectiveFrom:
          type: string
          format: date
          description: The first day under the new parent; not after today, not before the meter's latest change

    MeterParentPeriod:
      type: object
      description: A period in which a meter had one parent; both dates are days of the period
      required: [parentMeterId, validFrom]
      properties:
        parentMeterId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: The last day under this parent; absent while the period lasts

    MeterPlacement:
      type: object
      description: The parent periods of a meter in the electricity tree, oldest first
      required: [meterId, periods]
      properties:
        meterId:
          type: string
          format: uuid
        periods:
          type: array
          items:
            $ref: '#/components/schemas/MeterParentPeriod'

    MeterValueAtKind:
      type: string
      description: >-
        `REAL` a counted reading or the initial or final reading on that day; `CALCULATED` interpolated by days between
        the nearest counted points (shown as calculated); `UNKNOWN` no counted point after the day (or none before it)
      enum: [REAL, CALCULATED, UNKNOWN]

    MeterValueAt:
      type: object
      description: The value of a node's meter on a day, calculated by the server
      required: [kind, meterId]
      properties:
        kind:
          $ref: '#/components/schemas/MeterValueAtKind'
        meterId:
          type: string
          format: uuid
          description: The meter of the node's chain the value belongs to (the old one at the end of a slice that ends on a replacement day)
        value:
          $ref: '#/components/schemas/MeterValue'
          description: Present unless `UNKNOWN`; a `CALCULATED` value is rounded once to three decimals
        lastReadingOn:
          type: string
          format: date
          description: For `UNKNOWN`, the day after which there is no reading; absent when there is none before either

    MeterRangeConsumption:
      type: object
      description: The consumption over a part of a date range, calculated by the server
      required: [known, calculated]
      properties:
        known:
          type: boolean
          description: False when a value at an end is not known
        consumption:
          $ref: '#/components/schemas/MeterValue'
          description: Present when `known`; rounded once to three decimals when `calculated`
        calculated:
          type: boolean
          description: True when a value at an end was calculated between two readings
        lastReadingOn:
          type: string
          format: date
          description: When not `known`, the day after which there is no reading; absent when there is none before either

    MeterTreeSlice:
      type: object
      description: >-
        A part of the range that a node spent under one parent, from `from` to `to` (the consumption is the value on
        `to` minus the value on `from`)
      required: [from, to, start, end, consumption]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        start:
          $ref: '#/components/schemas/MeterValueAt'
        end:
          $ref: '#/components/schemas/MeterValueAt'
        consumption:
          $ref: '#/components/schemas/MeterRangeConsumption'

    MeterTreeMeter:
      type: object
      description: The meter a node of the tree shows
      required: [id, kind, serial, installedOn, active]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MeterKind'
        serial:
          type: string
        name:
          type: string
          description: The name of a meter that is not a plot meter
        plot:
          $ref: '#/components/schemas/MeterPlot'
        installedOn:
          type: string
          format: date
        removedOn:
          type: string
          format: date
        active:
          type: boolean

    MeterTreeNode:
      type: object
      description: A node of the electricity tree under one parent (or among the roots) in a date range
      required: [meter, meterIds, slices, total, children]
      properties:
        meter:
          $ref: '#/components/schemas/MeterTreeMeter'
        meterIds:
          type: array
          description: The meters of the node's chain of replacements, oldest installation first
          items:
            type: string
            format: uuid
        slices:
          type: array
          description: The parts of the range the node spent here, in date order
          items:
            $ref: '#/components/schemas/MeterTreeSlice'
        total:
          $ref: '#/components/schemas/MeterRangeConsumption'
        children:
          type: array
          items:
            $ref: '#/components/schemas/MeterTreeNode'

    MeterTree:
      type: object
      description: The electricity meter tree as it was over a date range
      required: [from, to, roots]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        roots:
          type: array
          items:
            $ref: '#/components/schemas/MeterTreeNode'

    ChargeKind:
      type: string
      description: >-
        `REGULAR` an accrual; `REVERSAL` cancels one charge with the opposite amount (see `reverses`, `reason`);
        `OPENING` an opening balance
      enum: [REGULAR, REVERSAL, OPENING]

    ChargeSource:
      type: string
      description: >-
        What produced the charge: `TARIFF` the month run of a tariff, `CONSUMPTION` a meter reading, `LOSSES` losses
        in the network, `COMMON_CONSUMER` a common consumer run, `OPENING` an opening balance, `MANUAL_REVERSAL` a
        reversal made by hand
      enum: [TARIFF, CONSUMPTION, LOSSES, COMMON_CONSUMER, OPENING, MANUAL_REVERSAL]

    ChargeTypeRef:
      type: object
      description: The charge type of a charge
      required: [id, name, nameCustomized]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/ChargeTypeCode'
        name:
          type: string
          description: The stored name; clients show their own default name while `nameCustomized` is false
        nameCustomized:
          type: boolean

    CalculationUnit:
      type: string
      description: >-
        What the quantity of a calculation part counts: `PLOT` one plot, `SOTKA` sotkas (100 m2) of area, `KWH`
        kilowatt-hours, `M3` cubic metres
      enum: [PLOT, SOTKA, KWH, M3]

    ChargeCalculationPart:
      type: object
      description: >-
        One part of a calculation: a quantity priced at the rate of one tariff version for the days that version
        applied. Parts are added exactly and the sum is rounded once.
      required: [days, from, to]
      properties:
        tariffVersionId:
          type: string
          format: uuid
        basis:
          $ref: '#/components/schemas/Basis'
        frequency:
          $ref: '#/components/schemas/Frequency'
        quantity:
          type: string
          description: The quantity as a plain decimal string (for example kWh `93.300`, sotkas `6.00`); not money
        unit:
          $ref: '#/components/schemas/CalculationUnit'
        rate:
          $ref: '#/components/schemas/Rate'
        days:
          type: integer
          format: int32
          minimum: 0
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        calculated:
          type: boolean
          description: True when the quantity rests on a value calculated between readings ("розрахунковий")

    ChargeCalculationReading:
      type: object
      description: A meter value a charge was calculated from
      required: [meterId, takenOn, value]
      properties:
        meterId:
          type: string
          format: uuid
        takenOn:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/MeterValue'
        calculated:
          type: boolean
          description: True for a value calculated between readings ("розрахунковий")

    ChargeCalculation:
      type: object
      description: >-
        How a charge was calculated, as codes and numbers only (the client builds the text). An opening balance and a
        reversal have no parts and no readings.
      required: [amount, parts, readings]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ChargeCalculationPart'
        readings:
          type: array
          items:
            $ref: '#/components/schemas/ChargeCalculationReading'
        nodeMeterId:
          type: string
          format: uuid
          description: The node of the meter tree whose losses the charge carries
        consumerMeterId:
          type: string
          format: uuid
          description: The common consumer the charge is for

    Charge:
      type: object
      description: One row of the ledger of a plot. Never changed or deleted.
      required:
        [
          id,
          plotId,
          kind,
          source,
          chargeType,
          amount,
          billingMonth,
          billingMonthClosed,
          serviceFrom,
          serviceTo,
          accruedOn,
          reversible,
          calculation,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChargeKind'
        source:
          $ref: '#/components/schemas/ChargeSource'
        chargeType:
          $ref: '#/components/schemas/ChargeTypeRef'
        amount:
          $ref: '#/components/schemas/Money'
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month the charge is booked in, `YYYY-MM`
        billingMonthClosed:
          type: boolean
          description: True when the billing month is closed (a correction is then an adjustment, not a reversal)
        serviceFrom:
          type: string
          format: date
          description: The first day the charge pays for
        serviceTo:
          type: string
          format: date
          description: The last day the charge pays for
        accruedOn:
          type: string
          format: date
          description: The day the debt counts from (its age)
        reason:
          type: string
          description: >-
            The reason of a reversal (always present), or the optional reason or document reference of an opening
            balance (user content)
        reverses:
          type: string
          format: uuid
          description: The charge a reversal cancels
        reversedBy:
          type: string
          format: uuid
          description: The reversal that cancelled this charge
        reversible:
          type: boolean
          description: >-
            True when the caller may reverse the charge now: the caller has `CHARGES_REVERSE`, the charge is not a
            reversal, was not reversed and its billing month is open
        calculation:
          $ref: '#/components/schemas/ChargeCalculation'
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: >-
            The current name of the member who booked the charge; only for callers with `CHARGES_VIEW`, absent for
            charges booked by the system or by a member who no longer exists

    ChargeTypeDebt:
      type: object
      description: The debt of a plot for one charge type
      required: [chargeTypeId, name, nameCustomized, debt]
      properties:
        chargeTypeId:
          type: string
          format: uuid
        chargeTypeCode:
          $ref: '#/components/schemas/ChargeTypeCode'
        name:
          type: string
          description: The stored name; clients show their own default name while `nameCustomized` is false
        nameCustomized:
          type: boolean
        debt:
          $ref: '#/components/schemas/Money'

    PlotAccount:
      type: object
      description: The account of a plot
      required: [plotId, debts, total, charges]
      properties:
        plotId:
          type: string
          format: uuid
        debts:
          type: array
          items:
            $ref: '#/components/schemas/ChargeTypeDebt'
        total:
          $ref: '#/components/schemas/Money'
        charges:
          type: array
          description: Newest first, limited by `from` and `to`
          items:
            $ref: '#/components/schemas/Charge'

    ChargeReversal:
      type: object
      description: Why a charge is reversed
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: User content, stored as typed; surrounding whitespace is trimmed

    OpeningBalanceInput:
      type: object
      description: An opening debt of a plot for one charge type as of a date
      required: [chargeTypeId, amount, date]
      properties:
        chargeTypeId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        date:
          type: string
          format: date
          description: The day the debt counts from; not after today
        reason:
          type: string
          maxLength: 500
          description: >-
            A reason or a document reference (user content), stored on the charge and written to the audit log;
            surrounding whitespace is trimmed, a blank reason means none

    BillingMonthStatus:
      type: string
      description: '`OPEN` accepts new charges; `CLOSED` never changes again'
      enum: [OPEN, CLOSED]

    ChargeTypeTotal:
      type: object
      description: The sum of the charges of one charge type booked in a billing month (reversals count negative)
      required: [chargeTypeId, name, nameCustomized, amount]
      properties:
        chargeTypeId:
          type: string
          format: uuid
        chargeTypeCode:
          $ref: '#/components/schemas/ChargeTypeCode'
        name:
          type: string
          description: The stored name; clients show their own default name while `nameCustomized` is false
        nameCustomized:
          type: boolean
        amount:
          $ref: '#/components/schemas/Money'

    BillingMonthSummary:
      type: object
      description: A billing month with the totals of the charges booked in it
      required: [month, status, runDone, totals, total]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The month, `YYYY-MM`
        status:
          $ref: '#/components/schemas/BillingMonthStatus'
        runDone:
          type: boolean
          description: True when the month run of recurring tariffs was booked for the month
        closedAt:
          type: string
          format: date-time
          description: When the month was closed; absent while it is open
        totals:
          type: array
          description: Per charge type that has a charge in the month, in the order of the charge types
          items:
            $ref: '#/components/schemas/ChargeTypeTotal'
        total:
          $ref: '#/components/schemas/Money'

    StaleMeter:
      type: object
      description: >-
        An active plot meter without an approved reading (or its installation) for more than 60 days before the
        check date
      required: [meterId, plotId, plotNumber, resource, lastReadingOn]
      properties:
        meterId:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: User content, as the cooperative writes it
        resource:
          $ref: '#/components/schemas/MeterResource'
        lastReadingOn:
          type: string
          format: date
          description: The date of the last approved reading on or before the check date, or the installation date

    BillingMonthChecklist:
      type: object
      description: What the person closing the month sees first; nothing here blocks closing
      required: [runDone, notChargedCount, staleMeters]
      properties:
        runDone:
          type: boolean
        notChargedCount:
          type: integer
          format: int32
          minimum: 0
          description: The open "not charged" items of the month
        staleMeters:
          type: array
          description: In the natural order of the plot numbers, electricity before water
          items:
            $ref: '#/components/schemas/StaleMeter'

    BillingMonthDetails:
      type: object
      description: A billing month with its totals and the closing check list
      required: [month, status, runDone, totals, total, checklist]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The month, `YYYY-MM`
        status:
          $ref: '#/components/schemas/BillingMonthStatus'
        runDone:
          type: boolean
        closedAt:
          type: string
          format: date-time
        closedByName:
          type: string
          description: The current name of the member who closed the month; absent while open or when unknown
        totals:
          type: array
          items:
            $ref: '#/components/schemas/ChargeTypeTotal'
        total:
          $ref: '#/components/schemas/Money'
        checklist:
          $ref: '#/components/schemas/BillingMonthChecklist'

    MonthRunRequest:
      type: object
      description: The booking of a month run; `digest` is the one of the preview the user confirmed
      properties:
        digest:
          type: string
          maxLength: 128
          description: >-
            The `digest` of the preview; when present and the run would now create something else, the booking is
            refused with 409 `PREVIEW_OUTDATED`

    NotChargedKind:
      type: string
      description: >-
        What could not be charged: `TARIFF_MONTH` the tariffs of a charge type for a plot and a billing month,
        `INTERVAL` a meter reading interval, `LOSSES_NODE` the losses of a node of the meter tree, `COMMON_CONSUMER` a
        common consumer
      enum: [TARIFF_MONTH, INTERVAL, LOSSES_NODE, COMMON_CONSUMER]

    NotChargedReason:
      type: string
      description: >-
        Why: `NO_TARIFF_FOR_ALL_DAYS` no tariff covers every day, `CONFLICTING_TARIFFS` two tariffs of the charge type
        apply on the same day, `OUTSIDE_SCOPE` the plot is outside the scope of every tariff, `EXCLUDED` the plot is
        excluded, `UNKNOWN_NODE_VALUE` / `UNKNOWN_CONSUMER_VALUE` a meter value of the range is unknown
      enum:
        - NO_TARIFF_FOR_ALL_DAYS
        - CONFLICTING_TARIFFS
        - OUTSIDE_SCOPE
        - EXCLUDED
        - UNKNOWN_NODE_VALUE
        - UNKNOWN_CONSUMER_VALUE

    NotChargedTariff:
      type: object
      description: A tariff an item is about (the link to fix it)
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: User content

    NotChargedItem:
      type: object
      description: >-
        Something the app could not charge, with the reason and what to fix. Codes and ids only; the client builds the
        text.
      required: [kind, reason, tariffs]
      properties:
        id:
          type: string
          format: uuid
          description: Absent in a preview for an item that does not exist yet
        kind:
          $ref: '#/components/schemas/NotChargedKind'
        reason:
          $ref: '#/components/schemas/NotChargedReason'
        plotId:
          type: string
          format: uuid
        plotNumber:
          type: string
          description: User content, as the cooperative writes it
        chargeType:
          $ref: '#/components/schemas/ChargeTypeRef'
        meterId:
          type: string
          format: uuid
          description: The meter to fix (an interval, a node, a common consumer)
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The billing month of a `TARIFF_MONTH` item, `YYYY-MM`
        from:
          type: string
          format: date
          description: The first day of the days the item is about
        to:
          type: string
          format: date
          description: The last day of the days the item is about
        tariffs:
          type: array
          description: The tariffs involved, ordered by name (both tariffs for `CONFLICTING_TARIFFS`); may be empty
          items:
            $ref: '#/components/schemas/NotChargedTariff'
        createdAt:
          type: string
          format: date-time
          description: When the item was first opened; absent in a preview for a new item

    NotChargedRetryResult:
      type: object
      description: The outcome of a retry
      required: [resolved]
      properties:
        resolved:
          type: boolean
          description: True when the item is closed (charged now or before, or nothing left to charge)
        item:
          $ref: '#/components/schemas/NotChargedItem'

    MonthRunResult:
      type: object
      description: >-
        What a month run would create (preview) or created (booking): the new charges only, never those of an earlier
        run
      required: [month, preview, plots, totals, total, notCharged, created, digest]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The month, `YYYY-MM`
        preview:
          type: boolean
        plots:
          type: integer
          format: int32
          minimum: 0
          description: The number of plots that get at least one new charge
        totals:
          type: array
          description: The new charges per charge type, in the order of the charge types
          items:
            $ref: '#/components/schemas/ChargeTypeTotal'
        total:
          $ref: '#/components/schemas/Money'
        notCharged:
          type: array
          description: >-
            The items the run cannot charge (opened by a booking, or kept open when they exist), in the natural order
            of the plot numbers, then by charge type
          items:
            $ref: '#/components/schemas/NotChargedItem'
        created:
          type: integer
          format: int32
          minimum: 0
          description: The number of charges written; 0 in a preview
        digest:
          type: string
          description: Identifies what the run would create; send it with the booking to make sure nothing changed
