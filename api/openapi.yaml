  /certificates/{id}/pdf:
    get:
      tags: [certificates]
      operationId: getCertificatePdf
      summary: A debt certificate as a PDF file
      description: |
        The certificate (A4, Ukrainian) rendered from its stored snapshot: the requisites, «Довідка № Д-{YYYY}-{N}»,
        the day of issue and the as-of day, the plot, its area and owners, the debt per charge type and in total, the
        prepayment, «Заборгованість відсутня» or «Заборгованість становить {сума}», the issuer's name and role with a
        place for the signature and the stamp. An annulled certificate still opens, marked «АНУЛЬОВАНО» with the day
