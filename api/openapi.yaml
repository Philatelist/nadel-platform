openapi: 3.1.0
info:
  title: Nadel API
  version: 0.1.0
  description: |
    API of the payment accounting platform for dacha cooperatives.
    Every endpoint requires a Keycloak bearer token. The cooperative is taken from the `tenant_id` claim
    in the token and is never passed in a request.
    Money amounts are strings with two decimal places, for example "1250.50".
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: me
    description: Current user
  - name: members
    description: Cooperative members (people), their contacts and roles
  - name: plots
    description: Plots and map

paths:
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user, roles and cooperative
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: List members
      description: |
        Returns a page of members of the current cooperative. Requires the `MEMBERS_VIEW` permission.
        `q` is a case-insensitive substring match against the last, first and middle name and the email, or,
        when it contains digits, against the digits of the phone numbers. Archived members are excluded unless
        `includeArchived` is true. The result is sorted by last name, then first name.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [members]
      operationId: createMember
      summary: Create a member
      description: |
        Creates a member in the current cooperative. Requires the `MEMBERS_EDIT` permission.
        A caller without `MEMBERS_VIEW` cannot set `notes`; the field is ignored.
        A new member has no roles. The email must be unique within the cooperative (409 `EMAIL_TAKEN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created member
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /members/{id}:
    get:
      tags: [members]
      operationId: getMember
      summary: Member card
      description: |
        Returns one member of the current cooperative.
        A caller without the `MEMBERS_VIEW` permission can read only their own card; for any other id the
        answer is 404, exactly as for an id that does not exist. The `notes` field is present only when the
        caller has `MEMBERS_VIEW`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [members]
      operationId: updateMember
      summary: Update a member
      description: |
        Replaces all editable fields of the member (full replacement; fields absent from the body are cleared).
        Roles are not part of `MemberInput`; they change through the role assignment endpoint.
        Requires the `MEMBERS_EDIT` permission. A caller without `MEMBERS_VIEW` cannot change `notes`;
        the field is ignored and the stored value is kept.
        The email must be unique within the cooperative (409 `EMAIL_TAKEN`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /members/{id}/archive:
    post:
      tags: [members]
      operationId: archiveMember
      summary: Archive a member
      description: |
        Moves the member to the archive; the member keeps their history but is hidden from the default list and
        can no longer sign in. Archiving an already archived member is a no-op. Requires `MEMBERS_EDIT`.
        The last active chairman cannot be archived (409 `LAST_CHAIRMAN`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /members/{id}/restore:
    post:
      tags: [members]
      operationId: restoreMember
      summary: Restore a member from the archive
      description: |
        Returns an archived member to the active list. Restoring an active member is a no-op.
        Requires `MEMBERS_EDIT`. The member's email must still be unique among members (409 `EMAIL_TAKEN`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots:
    get:
      tags: [plots]
      operationId: getPlots
      summary: Cooperative plots as GeoJSON for the map
      description: |
        Returns all plots and common land of the current cooperative with polygons and debt status.
        Members see the number and status of every plot, but the debt amount only for their own plots (from phase 1).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlotFeatureCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Malformed request or failed validation (code `VALIDATION_FAILED` or `MALFORMED_REQUEST`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid token (code `UNAUTHENTICATED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The token is valid but not linked to a member (code `MEMBER_NOT_LINKED`) or the caller lacks the
        required permission (code `PERMISSION_DENIED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to the caller (code `NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The request conflicts with the current state: the email is already used by another member of the
        cooperative (code `EMAIL_TAKEN`, with `errors[{field: email}]`), or the action would leave the cooperative
        without an active chairman (code `LAST_CHAIRMAN`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Amount in UAH as a string with two decimal places
      examples: ['1250.50']

    Permission:
      type: string
      description: Fixed list of permissions a role can contain (ADR 0009). Authorities are `PERM_<value>`.
      enum:
        - MEMBERS_VIEW
        - MEMBERS_EDIT
        - ROLES_MANAGE
        - AUDIT_VIEW
        - PLOTS_VIEW
        - PLOTS_EDIT
        - OWNERSHIP_EDIT
        - IMPORT_RUN

    BaseRole:
      type: string
      description: Code of a base role that every cooperative gets; custom roles have no code
      enum: [CHAIRMAN, TREASURER, MEMBER]

    RoleRef:
      type: object
      description: Reference to a role of the cooperative
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseCode:
          $ref: '#/components/schemas/BaseRole'

    DeliveryChannel:
      type: string
      description: How a member prefers to receive invoices
      enum: [EMAIL, TELEGRAM, VIBER, PAPER]

    Member:
      type: object
      description: |
        A person of the cooperative. `notes` is present only when the caller has the `MEMBERS_VIEW` permission.
      required: [id, lastName, firstName, phones, deliveryChannel, roles, archived]
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        phones:
          type: array
          items:
            type: string
          description: Phone numbers in E.164 format
        email:
          type: string
        postalAddress:
          type: string
        deliveryChannel:
          $ref: '#/components/schemas/DeliveryChannel'
        telegramUsername:
          type: string
        viberPhone:
          type: string
        notes:
          type: string
          description: Internal notes; only for callers with `MEMBERS_VIEW`, the key is absent otherwise
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time

    MemberInput:
      type: object
      description: |
        Editable fields of a member. Names are required; everything else is optional.
        Phone numbers may be written in local form (for example `067 123 45 67`); the server validates and
        normalises them to E.164 (error code `PHONE_INVALID`). A caller without the `MEMBERS_VIEW` permission
        cannot change `notes`: the field is ignored.
      required: [lastName, firstName]
      properties:
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        phones:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
          description: Phone numbers; the format is checked by the server, not by the schema
        email:
          type: string
          format: email
          maxLength: 254
        postalAddress:
          type: string
          maxLength: 500
        deliveryChannel:
          allOf:
            - $ref: '#/components/schemas/DeliveryChannel'
          default: PAPER
          description: >-
            Preferred invoice channel, `PAPER` when omitted. `EMAIL` requires `email`, `TELEGRAM` requires
            `telegramUsername`, `VIBER` requires `viberPhone` (otherwise `CHANNEL_CONTACT_MISSING`).
        telegramUsername:
          type: string
          maxLength: 64
        viberPhone:
          type: string
          maxLength: 32
        notes:
          type: string
          maxLength: 2000
          description: Internal notes; ignored when the caller lacks `MEMBERS_VIEW`

    MemberSummary:
      type: object
      description: A member as shown in the list; contains no postal address, messenger contacts or notes
      required: [id, lastName, firstName, phones, deliveryChannel, roles, archived]
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        phones:
          type: array
          items:
            type: string
          description: Phone numbers in E.164 format
        email:
          type: string
        deliveryChannel:
          $ref: '#/components/schemas/DeliveryChannel'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        archived:
          type: boolean

    MemberPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page index
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    TenantSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Me:
      type: object
      required: [userId, email, fullName, platformOperator, roles, permissions]
      properties:
        userId:
          type: string
          description: Keycloak user id (sub)
        email:
          type: string
        fullName:
          type: string
        memberId:
          type: string
          format: uuid
          description: The member this user is linked to; absent for the platform operator
        platformOperator:
          type: boolean
          description: True for the platform operator, who has no roles, permissions or cooperative data
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Union of the permissions of all the member's roles
        tenant:
          $ref: '#/components/schemas/TenantSummary'

    PlotKind:
      type: string
      enum: [PLOT, COMMON]
      description: PLOT is a land plot, COMMON is common land (roads, shared areas)

    PlotStatus:
      type: string
      enum: [RED, YELLOW, GREEN, GREY]
      description: Map color, see docs/domain/money-rules.md, section 9

    PolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          description: Polygon rings, points as [longitude, latitude] in WGS84
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
                format: double

    PlotProperties:
      type: object
      required: [number, kind, areaM2, status]
      properties:
        number:
          type: string
        street:
          type: string
        kind:
          $ref: '#/components/schemas/PlotKind'
        areaM2:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/PlotStatus'
        debt:
          $ref: '#/components/schemas/Money'

    PlotFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
          format: uuid
        geometry:
          $ref: '#/components/schemas/PolygonGeometry'
        properties:
          $ref: '#/components/schemas/PlotProperties'

    PlotFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/PlotFeature'

    Problem:
      type: object
      description: >-
        RFC 9457 Problem Details, served as `application/problem+json`. `detail` is English and never contains
        personal data.
      required: [title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable machine-readable error code, for example `VALIDATION_FAILED` or `NOT_FOUND`
        errors:
          type: array
          description: Field-level validation errors
          items:
            $ref: '#/components/schemas/ProblemFieldError'

    ProblemFieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          description: >-
            Field error code: `REQUIRED` (missing or blank), `TOO_LONG` (over the maximum length or item count),
            `INVALID` (wrong format, for example an email), `PHONE_INVALID` (not a valid phone number),
            `CHANNEL_CONTACT_MISSING` (the chosen delivery channel has no contact to deliver to)
        message:
          type: string
