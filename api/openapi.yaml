        transaction (all or nothing), as `endPlotWaterConnection` would. `sourceId` as in `connectWaterSourcePlots`
        (here a removed meter is accepted, so its plots can be disconnected). Field codes of 400 `VALIDATION_FAILED`:
        `plotIds[i]` `UNKNOWN_PLOT` or `DUPLICATE`; `plotIds` `REQUIRED` or `TOO_LONG`; `until` `REQUIRED`, or
        `INVALID` when it is before the start of a plot's connection (`errors[{field: plotIds[i], code: INVALID}]`). A
        plot without a lasting connection to this source is 409 `WATER_NOT_CONNECTED` with
        `errors[{field: plotIds[i]}]`. The answer is the source as `listWaterSources` shows it. Requires
        `METERS_MANAGE`; one audit entry per plot (`WATER_DISCONNECTED`, entity type `PLOT`).
