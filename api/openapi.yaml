    post:
      tags: [water]
      operationId: connectPlotWater
      summary: Connect a plot to water
      description: |
        Connects the plot to a water source from `from` (a day of the connection): the common consumer meter
        `sourceMeterId` (a well pump), or without it the cooperative's water supply. Water tariffs of any basis charge
        the plot only for its connected days. A plot has at most one connection that lasts and its connections never
        share a day: 409 `WATER_ALREADY_CONNECTED` (`errors[{field: from}]`) when it is connected now or on a day from
        `from` on. A `sourceMeterId` that is not an active common consumer meter of the cooperative is 409
        `WATER_SOURCE_INVALID` (`errors[{field: sourceMeterId}]`). An archived plot is 409 `PLOT_ARCHIVED`, common land
        409 `PLOT_COMMON_LAND`; an unknown plot, or one of another cooperative, 404 `PLOT_NOT_FOUND`. 400
        `VALIDATION_FAILED` with `from` `REQUIRED`. The answer is the plot's connections as `GET` shows them. Requires
        `METERS_MANAGE`; written to the audit log (`WATER_CONNECTED`, entity type `PLOT` about the plot).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
