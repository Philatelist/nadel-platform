  /billing-months/{month}/invoices:
    post:
      tags: [documents]
      operationId: buildMonthInvoices
      summary: Preview or build the invoices of a billing month
      description: |
        Builds the invoices of every invoiceable plot for the billing month (feature 016 §2.5): the active plots that
        are not common land and have a current owner, in street and plot order. The whole build reads its figures
        from one database snapshot (a payment or a charge booked while it runs is in all of its invoices or in none)
        and runs in the request; the web shows a spinner. One build of a cooperative's month runs at a time: a build
        started while another build of the same month (or an on-request invoice of it) runs is 409
        `INVOICE_BUILD_RUNNING` and builds nothing; the user waits and refreshes the page. An on-request invoice of
        the month waits for a running build instead.

        Per plot: a plot that already has an invoice of the month is compared with its latest version and gets a new
        version only when its numbers, owners or requisites changed (`newVersions`), otherwise nothing (`unchanged`);
        a plot without an invoice of the month gets version 1 (`built`), unless nothing is due on it and
        `includeNothingDue` is not set (`skipped`). `built + newVersions + unchanged + skipped = invoiceable`. The
        build is written to the audit log as one `INVOICES_ISSUED` entry (entity type `BILLING_MONTH`, label
        `YYYY-MM`, fields `month`, `built`, `newVersions`, `unchanged`, `skipped`).

        With `preview=true` nothing is written: the answer has `invoiceable`, `toBuild` (the plots that would be built
        or compared), `nothingDue` (the plots without an invoice of the month that have nothing due: skipped unless
        `includeNothingDue`) and `existing` (the plots that already have an invoice of the month). With
        `preview=false` the answer has `invoiceable`, `built`, `newVersions`, `unchanged` and `skipped`.

        A month after the current one (Europe/Kyiv) is 409 `PERIOD_IN_FUTURE`; a month before the first month of the
        cooperative (or any month while it has none) is 404 `NOT_FOUND`; 409 `REQUISITES_MISSING` with `missing`
        when the IBAN or the ЄДРПОУ is not set; 422 `INVOICE_BUILD_TOO_LARGE` with `limit` when the month has more
        invoiceable plots than one build takes (2,000). These are checked in this order, for the preview too, and
        nothing is written; then a build (not the preview) may be 409 `INVOICE_BUILD_RUNNING`. Requires
        `INVOICES_ISSUE`.
      parameters:
        - name: month
          in: path
          required: true
          description: The billing month, `YYYY-MM`
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: preview
          in: query
          required: true
          description: '`true` counts what the build would do without writing anything; `false` builds'
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceBuildRequest'
      responses:
        '200':
          description: What the build would do (preview) or did (build)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceBuild'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvoiceBuildTooLarge'

  /billing-months/{month}/invoices/print.pdf:
    get:
      tags: [documents]
      operationId: getMonthInvoicesPrintPdf
      summary: The invoices of a billing month as one PDF for printing
      description: |
        One PDF (A4, Ukrainian) with the latest version of each invoice of the month, one invoice per page (an invoice
        that needs more than one page continues on the next, and the next invoice starts on a new page), in street and
        plot order (the Ukrainian alphabet of the street, plots without a street last, then the natural order of the
        plot number). `scope=PAPER` (the default) takes the plots that have at least one current owner who chose
        paper delivery; `scope=ALL` every latest invoice of the month. A month without such invoices gives one page
        saying so. The file is not stored; the same invoices give the same bytes. A month that is not listed (before
        the first month of the cooperative, after the current one) is 404 `NOT_FOUND`. Requires `INVOICES_ISSUE`.
      parameters:
        - name: month
          in: path
          required: true
          description: The billing month, `YYYY-MM`
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: scope
          in: query
          required: false
          description: Which invoices to print
          schema:
            $ref: '#/components/schemas/InvoicePrintScope'
      responses:
        '200':
          description: The print set, sent as an attachment
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/{id}/reverse:
    post:
      tags: [payments]
      operationId: reversePayment
      summary: Reverse a payment
      description: |
        Cancels a payment by a new payment row of kind `PAYMENT_REVERSAL` (feature 015 §2.5): the negated amount, the
        same plot, source, group and `receivedOn`, the reason, pointing at the payment. Every allocation of the payment
        still on a charge is taken back first (a release with the cause `PAYMENT_REVERSED`), so the charges it paid are
        owed again; the money is gone with the payment and does not become a prepayment. The reversal is booked in the
        billing month of `receivedOn` while that month is open, otherwise in the earliest open month. A cash payment
        keeps its receipt number and is shown reversed. A part of a split payment is reversed on its own; the other
        parts stay. A payment of an archived plot can still be reversed. Nothing is changed or deleted (the ledger is
        append-only). The answer (201) is the card of the reversed payment.

        400 `VALIDATION_FAILED` with `reason` `REQUIRED` (absent or blank) or `TOO_LONG` (over 500 characters). 409
        `PAYMENT_ALREADY_REVERSED` when the payment was reversed before (also when two reversals meet) or the id is
        the id of a reversal row. An unknown payment, or one of another cooperative, is 404 `NOT_FOUND`. Requires
        `PAYMENTS_REVERSE`; written to the audit log (`PAYMENT_REVERSED`, entity type `PAYMENT` about the plot, with
        the amount of the reversal, the receipt number of a cash payment, the billing month and the reason).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentReversal'
      responses:
        '201':
          description: The reversed payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /payments/{id}/reallocate:
    post:
      tags: [payments]
      operationId: reallocatePayment
      summary: Preview or save a new allocation of a saved payment
      description: |
        Moves the money of a payment between the plot's charges (feature 015 §2.6): every allocation of the payment
        still on a charge is taken back (a release with the cause `REALLOCATED`) and the new lines are written (origin
        `REALLOCATION`) in one transaction. The new lines are checked against the plot's open charges as if the
        payment's allocations were already taken back, and together may not exceed the payment's amount. Without
        `lines` the proposal is saved (the plot's open charges as if released, filled in the order of `enterPayment`);
        with `lines` the caller's choice is (an empty list places nothing). The remainder is placed automatically as at
        `enterPayment` while `autoAllocatePrepayment` is on (origin `PREPAYMENT_AUTO`, by the system); only what is left
        after that, or all of it while the setting is off, stays as prepayment.

        With `preview=true` nothing is written and no lock is taken (200): `current` lists what the payment places on
        charges now, and `proposal` every open charge of the plot as if released with `proposed` (`0.00` for a charge
        that receives nothing), the lines a save writes (`resultLines`), the total placed and what stays as
        prepayment, with a `digest`. Lines with a problem are still 200 in a preview, with `valid: false` and
        `problems`, as at `enterPayment`. With `preview=false` the releases and the new allocations are saved (201),
        with the same answer. The `digest` covers the payment, what is left of each of its allocations, the open
        charges as if released and the lines a save writes; sent with the `digest` of a preview that no longer
        matches, the save is 409 `PREVIEW_OUTDATED` and writes nothing.

        400 `VALIDATION_FAILED`: `lines[j].chargeId` not an open charge of the plot (`NOT_FOUND`) or named twice
        (`DUPLICATE`), `lines[j].amount` not above zero (`AMOUNT_NOT_POSITIVE`); 400 `ALLOCATION_EXCEEDS_PAYMENT` when
        the lines together exceed the payment (`errors[{field: lines}]`); 400 `ALLOCATION_EXCEEDS_CHARGE` when a line
        exceeds what is open on its charge (`errors[{field: lines[j].amount}]`); these are 400 for a save only, a
        preview answers them in `problems`. 409 `PAYMENT_ALREADY_REVERSED` for a
        reversed payment or the id of a reversal row. An unknown payment, or one of another cooperative, is 404
        `NOT_FOUND`. Requires `PAYMENTS_ENTER`; a save is written to the audit log (`PAYMENT_REALLOCATED`, entity type
        `PAYMENT` about the plot, with the payment's amount, `receivedOn`, receipt number of a cash payment, and
        `lines` old and new, each line as `<charge type code or name> <YYYY-MM of the service start> <amount>`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: preview
          in: query
          required: true
          description: '`true` shows the new allocation without writing anything; `false` saves it'
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationLinesRequest'
      responses:
        '200':
          description: The proposal (preview)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReallocationResult'
        '201':
          description: The saved allocation (save)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReallocationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /plots/{id}/prepayment/allocate:
    post:
      tags: [payments]
      operationId: allocatePrepayment
      summary: Preview or save an allocation of the plot's prepayment by hand
      description: |
        Places the plot's prepayment (its payments, reversals negative, minus what they place on charges) on its open
        charges (feature 015 §2.6, "Allocate prepayment"), whether or not automatic allocation is on. Without `lines`
        the proposal is saved (the open charges filled in the order of `enterPayment` up to the prepayment); with
        `lines` the caller's choice is. Each line's money is taken from the plot's payments that still have money left,
        the oldest first (`receivedOn`, then the time they were entered), so a line may become several allocations
        (origin `PREPAYMENT_MANUAL`). Nothing is placed automatically here. With `autoAllocatePrepayment` on, a plot
        with an open charge normally has no prepayment waiting; the action is offered where `prepaymentAllocatable`
        says so (the setting off).

        With `preview=true` nothing is written and no lock is taken (200): `proposal` lists every open charge of the
        plot with `proposed`, its `amount` is the prepayment, `allocatedTotal` the total placed and `prepayment` what
        stays, with a `digest` (the plot, its prepayment and its open charges). Lines with a problem are still 200 in a
        preview, with `valid: false` and `problems`, as at `enterPayment`. With `preview=false` the allocations are saved (201), with the
        same answer; a `digest` of a preview that no longer matches is 409 `PREVIEW_OUTDATED` and writes nothing.

        409 `NOTHING_TO_ALLOCATE` when the plot has no prepayment or no open charge. 400 `VALIDATION_FAILED`: an empty
        `lines` (`REQUIRED`), the lines as in `reallocatePayment`; 400 `ALLOCATION_EXCEEDS_PAYMENT` when the lines
        together exceed the prepayment (`errors[{field: lines}]`); 400 `ALLOCATION_EXCEEDS_CHARGE` as in
        `reallocatePayment`; the problems of the lines are 400 for a save only. An unknown plot, or one of another cooperative, is 404 `PLOT_NOT_FOUND`. Requires
        `PAYMENTS_ENTER`; a save is written to the audit log (`PREPAYMENT_ALLOCATED`, entity type `PAYMENT` about the
        plot, with `lines` as in `PAYMENT_REALLOCATED` and their `total`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: preview
          in: query
          required: true
          description: '`true` shows the proposal without writing anything; `false` saves it'
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationLinesRequest'
      responses:
        '200':
          description: The proposal (preview)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentAllocationResult'
        '201':
          description: The saved allocation (save)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentAllocationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /billing-months:
    get:
      tags: [billing]
      operationId: listBillingMonths
      summary: The billing months with their totals
      description: |
        Every billing month of the cooperative, newest first: from the month of its first billing month row (the
        first charge) to the current month in Europe/Kyiv, including months that have no row or no charge yet (they
        are listed `OPEN` with empty totals; a row is created when the month is closed or a charge is booked in it).
        `totals` holds the sum of the charges booked in the month per charge type (a reversal counts negative), in the
        order of the charge types; `total` is their sum. `received` is the sum of the payments booked in the month, a
        reversal of a payment negative (a payment received in a closed month is booked in the earliest open month and
        counts there). A cooperative without any month gets an empty list.
        Requires `CHARGES_VIEW`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillingMonthSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /billing-months/{month}:
    get:
      tags: [billing]
      operationId: getBillingMonth
      summary: One billing month with its totals and the closing check list
      description: |
        The month as in the list plus the check list shown before closing: whether the month run is done, the number
        of "not charged" items of the month and the plot meters without a reading for more than 60 days (active plot
        meters whose last approved reading, or installation, is more than 60 days before the month's last day or
        today, whichever is earlier). Nothing on the list blocks closing. A month that is not listed (before the
        first month, after the current one) is 404 `NOT_FOUND`. Requires `CHARGES_VIEW`.
      parameters:
        - name: month
          in: path
          required: true
          description: The billing month, `YYYY-MM`
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingMonthDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /billing-months/{month}/close:
    post:
      tags: [billing]
      operationId: closeBillingMonth
      summary: Close a billing month
      description: |
        Closes the month: nothing is booked in it any more, and a charge about its days is booked in the earliest open
        month after it. A closed month is never reopened. Conflicts (409): a month after the current one in
        Europe/Kyiv (`PERIOD_IN_FUTURE`), a closed month (`PERIOD_CLOSED`), an earlier month that is still open
        (`PERIOD_CLOSE_ORDER`; months close in order). A month before the first month of the cooperative (or any
        month while it has none) is 404 `NOT_FOUND`. A listed month without a row is created and closed. The check
        list does not block closing. Requires `PERIODS_CLOSE`; written to the audit log (`BILLING_MONTH_CLOSED`,
        entity type `BILLING_MONTH`, label `YYYY-MM`).
      parameters:
        - name: month
          in: path
          required: true
          description: The billing month, `YYYY-MM`
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: The closed month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingMonthDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /billing-months/{month}/run:
    post:
      tags: [billing]
      operationId: runBillingMonth
      summary: Preview or book the month run of recurring tariffs
      description: |
        Charges every active plot that is not common land every recurring or one-off tariff (`PER_PLOT`,
        `PER_AREA_SOTKA`, `FIXED_ONE_TIME`) of every active, non-archived charge type that applies to it in the month
        (scope, exclusions), with the amount of the tariff calculation (money rules section 4.1). Tariffs charged by
        meter readings (`PER_KWH`, `PER_M3`) are not part of the run. One charge per plot, tariff and month: a rerun
        creates only what is missing, never a duplicate, and never re-creates a reversed charge. An amount of `0.00`
        creates nothing. When two tariffs of the same charge type would charge a plot more than `0.00` in the month
        neither is charged and a "not charged" item (`TARIFF_MONTH`, `CONFLICTING_TARIFFS`) names them; a tariff that
        charges `0.00` that month (a one-time fee due in another month) takes no part, and a plot that already has the
        month's charge of one of them is not queued. The run also resolves the open `TARIFF_MONTH` items of the month
        that it can now charge, and retries the open `TARIFF_MONTH` items of every other month: a charge it can now book
        goes into that month, or the earliest open month after it when it is closed, with that month's service period;
        these charges count in `plots`, `totals`, `total`, `created` and the `digest`. With `preview=true` nothing is
        written: the answer shows what the run would create (`created` is 0) and a `digest` of it. With `preview=false` the run is booked:
        the charges are written in the month, the month is marked as run and the answer shows what was created;
        a `digest` from an earlier preview that no longer matches is refused with 409 `PREVIEW_OUTDATED` and nothing
        is written. Conflicts (409): a month after the current one in Europe/Kyiv (`PERIOD_IN_FUTURE`), a closed
        month (`PERIOD_CLOSED`). Requires `CHARGES_RUN`; a booking is written to the audit log
        (`BILLING_MONTH_RUN`, entity type `BILLING_MONTH`, label `YYYY-MM`, values `count` and `total`).
      parameters:
        - name: month
          in: path
          required: true
          description: The billing month, `YYYY-MM`
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: preview
          in: query
          required: true
          description: '`true` shows what the run would create without writing anything; `false` books it'
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthRunRequest'
      responses:
        '200':
          description: What the run would create (preview) or created (booking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /not-charged:
    get:
      tags: [not-charged]
      operationId: listNotCharged
      summary: The open "not charged" items
      description: |
        Everything the app could not charge and that is still open, each with its reason and what to fix: the plot,
        the charge type, the month (or the date range) and the tariffs involved (for `CONFLICTING_TARIFFS` both
        tariffs). Newest month first, then in the natural order of the plot numbers. An item disappears when a retry
        or a later run charges it or finds nothing left to charge. Requires `CHARGES_VIEW`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotChargedItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /not-charged/{id}/retry:
    post:
      tags: [not-charged]
      operationId: retryNotCharged
      summary: Retry one "not charged" item
      description: |
        Tries again to charge what the item is about (for `TARIFF_MONTH`: the tariffs of its charge type for its plot
        and month, as the month run does; for `INTERVAL`: the meter interval, as an approved reading does; for
        `LOSSES_NODE`: a losses run of that node alone over the item's range, as `runLosses` books it; for
        `COMMON_CONSUMER`: a common consumer run of that consumer alone over the item's range, as `runCommonConsumers`
        books it). When the charge is created, or exists already, or nothing is left to charge (the plot left the scope
        of the tariffs, the amount is `0.00`; for `LOSSES_NODE`: the node's losses are now known but negative, the node
        is no longer in the tree for the range, or the losses mode is no longer `PROPORTIONAL`; for `COMMON_CONSUMER`:
        the consumer is now `NOT_CHARGED` or `NO_PLOTS`, or no longer a consumer of the range; it stays open while there
        is no tariff), the item is closed and `resolved` is true;
        otherwise it stays open with its (possibly updated) reason and tariffs and is returned as `item`. A charge for a
        month that was closed in the meantime is booked in the earliest open month after it. An item that is no longer
        open answers `resolved: true` and changes nothing. An unknown item, or one of another cooperative, is 404
        `NOT_FOUND`. Requires `CHARGES_RUN`; written to the audit log (`NOT_CHARGED_RETRIED`, entity type `CHARGE` about
        the plot; for `LOSSES_NODE` and `COMMON_CONSUMER` entity type `METER` about the node or consumer meter, and a
        booked run also writes `LOSSES_RUN_BOOKED` or `COMMON_CONSUMER_RUN_BOOKED`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The outcome of the retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotChargedRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /losses-runs:
    get:
      tags: [losses-runs]
      operationId: listLossesRuns
      summary: The losses runs of the cooperative
      description: |
        Every proportional losses run, booked or reversed, newest first, with its range, author, totals and status.
        Requires `CHARGES_VIEW`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LossesRunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [losses-runs]
      operationId: runLosses
      summary: Preview or book a proportional losses run
      description: |
        Charges the losses of the electricity network over the days `from` to `to` (both included) per node of the
        meter tree (substation and quarter meters that had a meter under them on a day of the range), money rules
        section 6. The range consumption of a meter is its end-of-day value on `to` minus its end-of-day value on the
        day before `from` (`valueAt(to) - valueAt(from - 1)`), with the tree as it was on each day. For every node:
        losses = the node's consumption - the consumption of its children (plot meters, common consumers, quarter
        meters) over the days they were under it; the losses are shared among the plots under the node (directly or
        through child nodes) in proportion to each plot's consumption under it, a plot with zero consumption gets
        nothing. Each plot's kWh from every node are added and priced once with the plot's electricity tariff (`PER_KWH`,
        split by days when the rate changes) and rounded once: one `LOSSES` charge per plot per run, booked in the month
        of `to` (or the earliest open month after it when that month is closed), with the debt counting from `to`.
        Outcomes per node: `CHARGED`; `NEGATIVE` (the children used more than the node shows: nothing is charged);
        `UNKNOWN` (a value of the node or of a child is unknown, no reading after the range end: the node is skipped);
        `SKIPPED_ABOVE` (a node below is unknown: skipped too); `ALREADY_CHARGED` (a booked run charged the node for a
        day of the range). Values calculated between readings are allowed and marked `calculated`. `nodeIds` limits
        the run to those nodes (absent or empty: every node); the other nodes are still calculated where a selected node
        needs them but are not listed. With `preview=true` nothing is written and the answer has a `digest`. With
        `preview=false` the run is booked: the run and its nodes are stored, the charges written, each `UNKNOWN` or
        `SKIPPED_ABOVE` node gets a "not charged" item (`LOSSES_NODE`, `UNKNOWN_NODE_VALUE`), the open items of a node
        that is now charged are closed, and the meter values the charged nodes read can no longer be corrected while the
        run is booked. Field codes of 400 `VALIDATION_FAILED`: `to` `INVALID` (before `from`) or `DATE_IN_FUTURE` (after
        today in Europe/Kyiv); `nodeIds[i]` `NOT_FOUND` (not a node of the tree in the range). Conflicts (409): the
        losses mode of the cooperative is not `PROPORTIONAL` (`LOSSES_MODE_NOT_PROPORTIONAL`, preview too); a booking
        with a selected node that is `ALREADY_CHARGED` (`LOSSES_RANGE_OVERLAP`; book the other nodes with `nodeIds`);
        a booking with the `digest` of a preview that no longer matches (`PREVIEW_OUTDATED`; the digest covers the
        listed nodes that are not `ALREADY_CHARGED` and the charges, so a preview of every node matches a booking of
        those nodes). Requires `CHARGES_RUN`; a booking is written to the audit log (`LOSSES_RUN_BOOKED`, entity type
        `LOSSES_RUN`, label `from/to`, values `from`, `to`, `billingMonth`, `nodes`, `count`, `total`).
      parameters:
        - name: preview
          in: query
          required: true
          description: '`true` shows what the run would charge without writing anything; `false` books it'
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LossesRunRequest'
      responses:
        '200':
          description: What the run would charge (preview) or charged (booking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LossesRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /losses-runs/{id}:
    get:
      tags: [losses-runs]
      operationId: getLossesRun
      summary: One losses run with its nodes and charges
      description: |
        The run as stored when it was booked: its nodes with their numbers, outcomes, warnings and plot shares, and its
        charges (with whether each was reversed). An unknown run, or one of another cooperative, is 404 `NOT_FOUND`.
        Requires `CHARGES_VIEW`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LossesRunDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /losses-runs/{id}/reverse:
    post:
      tags: [losses-runs]
      operationId: reverseLossesRun
      summary: Reverse a whole losses run
      description: |
        Reverses every charge of the run that is not reversed yet with the run's reason (a `REVERSAL` row each, source
        `MANUAL_REVERSAL`, in the charge's billing month) and marks the run `REVERSED`: its nodes no longer block a later
        run over the same days and the meter values it read can be corrected again. Nothing is changed or deleted in the
        ledger. Conflicts (409): the run was reversed before (`RUN_ALREADY_REVERSED`), its charges are booked in a closed
        month (`RUN_IN_CLOSED_MONTH`; a correction is an adjustment). 400 `VALIDATION_FAILED` with `reason` `REQUIRED`
        (absent or blank) or `TOO_LONG`. An unknown run, or one of another cooperative, is 404 `NOT_FOUND`. Requires
        `CHARGES_REVERSE`; written to the audit log (`LOSSES_RUN_REVERSED`, entity type `LOSSES_RUN`, label
        `from/to`, values `from`, `to`, `count`, `total`, `reason`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunReversal'
      responses:
        '200':
          description: The reversed run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LossesRunDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /common-consumer-runs:
    get:
      tags: [common-consumer-runs]
      operationId: listCommonConsumerRuns
      summary: The common consumer runs of the cooperative
      description: |
        Every common consumer run, booked or reversed, newest first, with its range, author, totals and status.
        Requires `CHARGES_VIEW`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommonConsumerRunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [common-consumer-runs]
      operationId: runCommonConsumers
      summary: Preview or book a common consumer run
      description: |
        Charges the electricity of the common consumers (well pumps, street lighting) over the days `from` to `to`
        (both included) to plots, as the separate charge type `COMMON_CONSUMERS` (money rules section 6.3). Every
        common consumer meter that worked on a day of the range is a consumer of the run (a replacement keeps the
        consumer: `meterId` is the first meter of its chain). Its consumption is its end-of-day value on `to` minus its
        end-of-day value on the day before `from` (`valueAt(to) - valueAt(from - 1)`), shared as the consumer's split
        says (`common_consumer_billing`, else the cooperative's `commonConsumerDefaultSplit`): `CONNECTED_PLOTS`
        equally per plot-day among the plots connected to that well on each day of the range; `EQUAL_PER_PLOT` equally
        among the active plots (not common land), with or without meters; `SERVICE_USERS` equally among the active
        plots marked as its users; `NOT_CHARGED` nothing (listed with its consumption). Each plot's kWh are priced with
        the plot's `COMMON_CONSUMERS` tariff (`PER_KWH`, spread evenly over the plot's days of the split, split by days
        when the rate changes) and rounded once: one `COMMON_CONSUMER` charge per plot per consumer per run, booked in
        the month of `to` (or the earliest open month after it when that month is closed), with the debt counting from
        `to`. Outcomes per consumer: `CHARGED`; `NOT_CHARGED` (its split is `NOT_CHARGED`); `NO_PLOTS` (consumption
        above zero but no plot to share it among: nothing is charged and the days stay free); `UNKNOWN` (its value is
        unknown, no reading after the range end: skipped); `ALREADY_CHARGED` (a booked run charged the consumer for a
        day of the range). Values calculated between readings are allowed and marked `calculated`. `noTariff` is true
        when the `COMMON_CONSUMERS` charge type is inactive or archived or has no tariff with a `PER_KWH` version valid
        on a day of the range: the plots are listed without amounts and nothing can be booked. `consumerIds` limits the
        run to those consumers (absent or empty: every consumer). With `preview=true` nothing is written and the answer
        has a `digest`. With `preview=false` the run is booked: the run and one line per consumer are stored, the
        charges written, each `UNKNOWN` consumer gets a "not charged" item (`COMMON_CONSUMER`,
        `UNKNOWN_CONSUMER_VALUE`), the open items of a consumer that is now charged are closed, and the meter values a
        charged consumer read can no longer be corrected while the run is booked. Field codes of 400
        `VALIDATION_FAILED`: `to` `INVALID` (before `from`) or `DATE_IN_FUTURE` (after today in Europe/Kyiv);
        `consumerIds[i]` `NOT_FOUND` (not a common consumer of the range). Conflicts (409) of a booking:
        `NO_COMMON_CONSUMERS_TARIFF` (`noTariff`); `COMMON_CONSUMER_RANGE_OVERLAP` (a selected consumer is
        `ALREADY_CHARGED`; book the others with `consumerIds`); `PREVIEW_OUTDATED` (the `digest` of a preview that no
        longer matches; it covers the listed consumers that are not `ALREADY_CHARGED` and the charges). Requires
        `CHARGES_RUN`; a booking is written to the audit log (`COMMON_CONSUMER_RUN_BOOKED`, entity type
        `COMMON_CONSUMER_RUN`, label `from/to`, values `from`, `to`, `billingMonth`, `consumers`, `count`, `total`).
      parameters:
        - name: preview
          in: query
          required: true
          description: '`true` shows what the run would charge without writing anything; `false` books it'
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonConsumerRunRequest'
      responses:
        '200':
          description: What the run would charge (preview) or charged (booking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonConsumerRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /common-consumer-runs/{id}:
    get:
      tags: [common-consumer-runs]
      operationId: getCommonConsumerRun
      summary: One common consumer run with its consumers and charges
      description: |
        The run as stored when it was booked: its consumers with their numbers, splits, outcomes, warnings and plot
        shares, each plot share with its charge (and whether it was reversed). An unknown run, or one of another
        cooperative, is 404 `NOT_FOUND`. Requires `CHARGES_VIEW`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonConsumerRunDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /common-consumer-runs/{id}/reverse:
    post:
      tags: [common-consumer-runs]
      operationId: reverseCommonConsumerRun
      summary: Reverse a whole common consumer run
      description: |
        Reverses every charge of the run that is not reversed yet with the run's reason (a `REVERSAL` row each, source
        `MANUAL_REVERSAL`, in the charge's billing month) and marks the run `REVERSED`: its consumers no longer block a
        later run over the same days and the meter values it read can be corrected again. Nothing is changed or deleted
        in the ledger. Conflicts (409): the run was reversed before (`RUN_ALREADY_REVERSED`), its charges are booked in
        a closed month (`RUN_IN_CLOSED_MONTH`; a correction is an adjustment). 400 `VALIDATION_FAILED` with `reason`
        `REQUIRED` (absent or blank) or `TOO_LONG`. An unknown run, or one of another cooperative, is 404 `NOT_FOUND`.
        Requires `CHARGES_REVERSE`; written to the audit log (`COMMON_CONSUMER_RUN_REVERSED`, entity type
        `COMMON_CONSUMER_RUN`, label `from/to`, values `from`, `to`, `count`, `total`, `reason`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunReversal'
      responses:
        '200':
          description: The reversed run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonConsumerRunDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /common-consumers/{meterId}/billing:
    get:
      tags: [common-consumer-runs]
      operationId: getCommonConsumerBilling
      summary: How a common consumer is shared among plots
      description: |
        The split of the common consumer of the meter `meterId` (`split` absent: the cooperative's
        `commonConsumerDefaultSplit` applies, shown as `effectiveSplit`) and its service users (the plots marked as
        using it, in the natural order of the plot numbers; they count with `SERVICE_USERS`). The settings belong to
        the consumer, the whole chain of its meters through replacements: any meter of the chain shows what a run
        uses for the consumer (the split of the latest meter of the chain that has its own split, and the service
        users of the latest meter that has service users). A meter that is not a common consumer meter of the
        cooperative is 404 `NOT_FOUND`. Requires `SETTINGS_MANAGE`.
      parameters:
        - name: meterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonConsumerBilling'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [common-consumer-runs]
      operationId: updateCommonConsumerBilling
      summary: Change how a common consumer is shared among plots
      description: |
        Sets the split of the common consumer of the meter `meterId` (absent `split`: back to the cooperative's
        default) and replaces its service users with `servicePlotIds`. Through any meter of the consumer's chain of
        replacements: the settings are saved for the whole consumer (on its latest meter, replacing what its other
        meters had), so a read through any of its meters shows them. Runs booked before keep what they charged; the
        next run uses the new settings. Field codes of 400 `VALIDATION_FAILED`: `servicePlotIds[i]` `UNKNOWN_PLOT` (no such plot in the
        cooperative), `DUPLICATE` (listed twice), `PLOT_ARCHIVED`, `PLOT_COMMON_LAND`; `servicePlotIds` `TOO_LONG`
        (over 5000). A meter that is not a common consumer meter of the cooperative is 404 `NOT_FOUND`. Requires
        `SETTINGS_MANAGE`; a change is written to the audit log (`COMMON_CONSUMER_BILLING_CHANGED`, entity type
        `METER` about the consumer meter, label its name, values `split` (the consumer's own split, absent for the
        cooperative's default) and `servicePlots` (the plot numbers in natural order, joined by ", "), each only when
        it changed); saving the current values writes nothing.
      parameters:
        - name: meterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonConsumerBillingUpdate'
      responses:
        '200':
          description: The saved settings of the consumer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonConsumerBilling'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /recalculations:
    get:
      tags: [recalculations]
      operationId: listRecalculations
      summary: The booked recalculations of the cooperative
      description: |
        A page of the booked recalculations, newest first (by booking time), each with its cause, reason, author, the
        number of lines and plots and the total difference. A recalculation is never changed or undone; a mistake is
        corrected by another recalculation. Requires `CHARGES_VIEW`; the platform operator has no permissions: 403.
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalculationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [recalculations]
      operationId: runRecalculation
      summary: Preview or book a recalculation
      description: |
        Recalculates past charges (money rules section 5): the charges the app would make today with the current data
        (expected) are compared with the booked charges plus their adjustments (effective) per charge, and every
        difference becomes a line. A charge in an open month is reversed (source `RECALCULATION`) and charged again;
        a charge in a closed month gets an adjustment (kind `ADJUSTMENT`, source `RECALCULATION`) in the earliest open
        month with the original's service period and `accruedOn`; a charge that should no longer exist is reversed or
        cancelled by an adjustment; an expected charge without a booked one is a new charge. `cause.type` names what
        is recalculated: `MANUAL` the months, charge types and plots of `cause.manual`; `TARIFF_VERSION_*` a version of
        a tariff added, corrected or deleted together with the recalculation (`cause.tariffVersion`); `READING_*` a
        reading entered, corrected or deleted together with the recalculation (`cause.reading`). With `preview=true`
        nothing is written (a cause-driven change is applied and rolled back) and the answer has a `digest`; with
        `preview=false` the change and the recalculation are booked together, or nothing is. A preview that finds
        nothing to change answers with no lines ("No changes"). 400 `VALIDATION_FAILED`: `reason` `REQUIRED` or
        `TOO_LONG` (over 500 characters) for a booking, `cause.manual` `REQUIRED` for `MANUAL`, `cause.manual.to`
        `INVALID` (before `from`) or `DATE_IN_FUTURE` (after the current month), `cause.manual.chargeTypeIds[i]`
        `NOT_FOUND` (unknown) or `INVALID` (inactive or archived), `cause.manual.plotIds[i]` `UNKNOWN_PLOT`,
        `PLOT_ARCHIVED` or `PLOT_COMMON_LAND`. A tariff version cause needs `cause.tariffVersion` (`REQUIRED`), its
        `versionId` for an update or a delete and its `version` for an add or an update (`REQUIRED`); the version is
        checked as on the tariff endpoints, with the field codes under `cause.tariffVersion.version.` (for example
        `cause.tariffVersion.version.frequency` `FREQUENCY_BASIS_MISMATCH`), but a version that charges used may be
        changed here (a delete is soft); a version that is not one of `tariffId` is 404 `NOT_FOUND`. Its scope is the
        tariff's charge type and plots and the billing months the old and new validity of the version touch (from the
        first billing month of the cooperative to the current month at most), and the meter intervals and runs that
        close from the first of them on. When such a plan has no lines, a booking saves the change alone without a
        reason (`booked` false, `changeApplied` true, no record). A reading cause needs `cause.reading` (`REQUIRED`),
        its `meterId` for an entry, its `readingId` for a correction or a deletion and its `reading` for an entry or a
        correction (`REQUIRED`); the reading is checked as on the reading endpoints, with the field codes under
        `cause.reading.` (`meterId`) and `cause.reading.reading.` (`takenOn`, `value`), but a reading that charges
        used may be changed here. Its scope is the meter's intervals around the old and new date and the booked runs
        that read the meter on a day the change reaches; a plan without lines saves the change alone as above.
        Conflicts (409): the manual range
        spans more than 24 months (`RECALCULATION_RANGE_TOO_LONG`), a manual recalculation finds nothing to change when
        booked (`NOTHING_TO_RECALCULATE`), a booking is sent with the digest of a preview that no longer matches
        (`PREVIEW_OUTDATED`), the change of a tariff version is refused (`TARIFF_VERSION_DATE_TAKEN`,
        `TARIFF_LAST_VERSION`, `CHARGE_TYPE_ARCHIVED`). Requires `RECALCULATION_RUN`, and also `TARIFFS_MANAGE` for a
        tariff version cause and `READINGS_ENTER` for a reading cause (403 `PERMISSION_DENIED`); a booking is written
        to the audit log (`RECALCULATION_BOOKED`, entity type `RECALCULATION`, after the entry of the version or
        reading change, which then carries `recalculationId`).
      parameters:
        - name: preview
          in: query
          required: true
          description: '`true` shows what the recalculation would book without writing anything; `false` books it'
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalculationRequest'
      responses:
        '200':
          description: What the recalculation would book (preview) or booked (booking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recalculation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /recalculations/{id}:
    get:
      tags: [recalculations]
      operationId: getRecalculation
      summary: One booked recalculation with its lines
      description: |
        The recalculation as booked: its cause, scope, reason, author, totals per charge type and its lines in the
        order they were booked, each with the original charge, the booked, adjusted, effective and expected amounts,
        the difference, the action, the month it was booked in and the charges it created. An unknown recalculation,
        or one of another cooperative, is 404 `NOT_FOUND`. Requires `CHARGES_VIEW`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recalculation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /plots/{id}/water-connections:
    get:
      tags: [water]
      operationId: getPlotWaterConnections
      summary: The water connection of a plot and its history
      description: |
        Every connection the plot has had, newest first, and whether it is connected today (Europe/Kyiv). No
        permission annotation: a caller with `PLOTS_VIEW` may ask for any plot of the cooperative, anyone else only for
        a plot they currently own. Any other plot, an unknown id and a plot of another cooperative are the same 404
        `PLOT_NOT_FOUND`; the platform operator has no cooperative data: 403.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
