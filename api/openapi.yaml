        register and its PDF is marked «АНУЛЬОВАНО». Nothing else of it changes and its number is never reused.
        Written to the audit log as `CERTIFICATE_ANNULLED`. The reason is required (400 `VALIDATION_FAILED` with
        `errors[{field: reason, code: REQUIRED}]`, also for a blank one) and has at most 500 characters (`TOO_LONG`).
        A certificate is annulled once: 409 `CERTIFICATE_ALREADY_ANNULLED`. 404 `NOT_FOUND` for an unknown id or one
        of another cooperative. Requires `CERTIFICATES_ISSUE`.
      parameters:
        - name: id
          in: path
